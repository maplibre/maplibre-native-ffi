# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Not supported by Dependabot:
# - mise tool versions: https://github.com/dependabot/dependabot-core/issues/12320
# - Zig `build.zig.zon` dependencies
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      cargo:
        patterns: ["*"]
  # Tracks the tip of MapLibre Native's default branch, so the weekly run keeps
  # one rolling pull request rather than one per upstream commit.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      gitsubmodule:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      gradle:
        patterns: ["*"]
  # The root covers every pnpm workspace package: the TypeScript binding and
  # the docs site.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      npm:
        patterns: ["*"]
  # The root covers the solution and `Directory.Packages.props`. DocFX's
  # `.config/dotnet-tools.json` is only discovered from the directory that holds
  # it, so that directory needs its own entry.
  - package-ecosystem: nuget
    directories: ["/", "/bindings/dotnet/docfx"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /bindings/dart
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      pub:
        patterns: ["*"]
    # hooks 2.2 and code_assets 2 pull record_use 1.0, which
    # requires meta 1.19. Flutter 3.47 still pins meta 1.18, so the mobile
    # smoke host cannot resolve those versions.
    ignore:
      - dependency-name: hooks
        versions: [">=2.2.0"]
      - dependency-name: code_assets
        versions: [">=2.0.0"]
  - package-ecosystem: swift
    directories: ["/bindings/swift", "/examples/swift-map"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      swift:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      uv:
        patterns: ["*"]
