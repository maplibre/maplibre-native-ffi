# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Not supported by Dependabot:
# - mise tool versions: https://github.com/dependabot/dependabot-core/issues/12320
# - Zig `build.zig.zon` dependencies
version: 2
# One weekly pull request carries the updates of every ecosystem below except
# the submodule, so CI runs once a week instead of once per ecosystem.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    labels: [chore, "area:tooling", dependencies]
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
  # Tracks the tip of MapLibre Native's default branch, so the weekly run keeps
  # one rolling pull request rather than one per upstream commit. It stays
  # outside the group so that a native bump gets its own review and CI result.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [chore, "area:tooling", dependencies]
    groups:
      gitsubmodule:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /bindings/go
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
  - package-ecosystem: gradle
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
  # The root covers the solution and `Directory.Packages.props`. Every other
  # directory here holds a `.config/dotnet-tools.json`, which is only discovered
  # from the directory that holds it, so each manifest needs its own entry.
  - package-ecosystem: nuget
    directories: ["/", "/bindings/dotnet", "/bindings/dotnet/docfx"]
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
  - package-ecosystem: pub
    directory: /bindings/dart
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
    # hooks 2.2, code_assets 2, and ffigen 22 pull record_use 1.0, which
    # requires meta 1.19. Flutter 3.47 still pins meta 1.18, so the mobile
    # smoke host cannot resolve those versions.
    ignore:
      - dependency-name: hooks
        versions: [">=2.2.0"]
      - dependency-name: code_assets
        versions: [">=2.0.0"]
      - dependency-name: ffigen
        versions: [">=22.0.0"]
  - package-ecosystem: swift
    directories: ["/bindings/swift", "/examples/swift-map"]
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
