# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Not supported by Dependabot:
# - mise tool versions: https://github.com/dependabot/dependabot-core/issues/12320
# - Zig `build.zig.zon` dependencies
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, github_actions]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, rust]
    groups:
      cargo:
        patterns: ["*"]
  # Tracks the tip of MapLibre Native's default branch, so the weekly run keeps
  # one rolling pull request rather than one per upstream commit.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, infra]
    groups:
      gitsubmodule:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, go]
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, kotlin]
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, typescript]
    groups:
      npm:
        patterns: ["*"]
  # The root covers the solution and `Directory.Packages.props`. Every other
  # directory here holds a `.config/dotnet-tools.json`, which is only discovered
  # from the directory that holds it, so each manifest needs its own entry.
  - package-ecosystem: nuget
    directories: ["/", "/bindings/dotnet", "/bindings/dotnet/docfx"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, dotnet]
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /bindings/dart
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, dart]
    groups:
      pub:
        patterns: ["*"]
    # hooks 2.1.0+ pulls record_use ^1.0.0 (meta ^1.19.0). Flutter 3.44 still
    # pins meta 1.18.0, so a floor above 2.0.2 makes flutter pub get fail.
    ignore:
      - dependency-name: hooks
        versions: [">=2.1.0"]
  - package-ecosystem: swift
    directories: ["/bindings/swift", "/examples/swift-map"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, swift]
    groups:
      swift:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, python]
    groups:
      uv:
        patterns: ["*"]
