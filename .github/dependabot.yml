# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Not yet supported:
# - mise tool versions: https://github.com/dependabot/dependabot-core/issues/12320
# - the MapLibre Native submodule pin (manual bumps)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /bindings/dart
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      pub:
        patterns: ["*"]
