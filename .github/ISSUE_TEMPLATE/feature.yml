# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json
name: Feature request
description: Suggest an improvement or new feature
labels: [feature]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful? What problem does it solve?
    validations:
      required: false
  - type: checkboxes
    id: area
    attributes:
      label: Area
      description: Which part of the API does this affect?
      options:
        - label: Runtime
        - label: Map, camera, or style
        - label: Render session or render target
        - label: Query
        - label: Layer plugins
        - label: Language binding
        - label: Example app
        - label: Documentation
        - label: Build, CI, packaging, or release
    validations:
      required: false
