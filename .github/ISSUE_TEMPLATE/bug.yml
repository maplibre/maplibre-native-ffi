# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json
name: Bug report
description: Report a bug
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Area
      description: Which part of the API does this affect?
      options:
        - label: Runtime
        - label: Map, camera, or style
        - label: Render session or render target
        - label: Query
        - label: Layer plugins
        - label: Language binding
        - label: Example app
        - label: Documentation
        - label: Build, CI, packaging, or release
    validations:
      required: false
  - type: checkboxes
    id: platform
    attributes:
      label: Platform
      description: Where have you seen this?
      options:
        - label: Linux
        - label: macOS
        - label: Windows
        - label: Android
        - label: iOS
        - label: OpenHarmony
        - label: Browser
    validations:
      required: false
  - type: checkboxes
    id: renderer
    attributes:
      label: Render backend
      options:
        - label: OpenGL
        - label: Vulkan
        - label: Metal
        - label: WebGPU
    validations:
      required: false
  - type: input
    id: commit
    attributes:
      label: Commit
      description:
        Commit SHA or branch you tested against (e.g. `main` at abc1234)
    validations:
      required: false
