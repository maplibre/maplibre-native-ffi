name: Setup CI deps
description: Install the toolchain and target-specific CI prerequisites

inputs:
  target:
    description: Native target name
    required: false
    default: host
  sccache-access-key-id:
    description: R2 S3 access key ID with Object Read & Write (push jobs only)
    required: false
    default: ""
  sccache-secret-access-key:
    description: R2 S3 secret access key with Object Read & Write (push jobs only)
    required: false
    default: ""
  zig:
    description: Restore the Zig package cache and expose its key for a later save
    required: false
    default: "false"
  gradle:
    description: Set up Gradle and its user-home cache; jobs that run no Gradle build leave this off
    required: false
    default: "true"
  save-toolchains:
    description: >-
      Save the toolchain cache when this job misses it. One job per runner label
      claims this so a miss costs one archive of the toolchain tree per runner
      instead of one per job.
    required: false
    default: "false"

outputs:
  zig-cache-key:
    description: Key the job saves the Zig package cache under once its checks pass
    value: ${{ steps.zig-cache-key.outputs.key }}
  zig-cache-hit:
    description: Whether the Zig package cache was restored from an exact key match
    value: ${{ steps.zig-packages.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Enable Git long paths
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: git config --global core.longpaths true

    # A hard error, such as a DLL the loader cannot resolve, raises a modal
    # dialog. No one is here to dismiss it, so the process waits behind it until
    # the job times out. Make the call fail and report instead.
    - name: Fail Windows hard errors instead of waiting on a dialog
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Set-ItemProperty `
          -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Windows" `
          -Name ErrorMode -Value 2 -Type DWord
        $reporting = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting"
        New-Item -Path $reporting -Force | Out-Null
        Set-ItemProperty -Path $reporting -Name DontShowUI -Value 1 -Type DWord

    # The gitlink SHA is what decides the checkout, so key on it directly. A
    # tag file can be left behind by a pin bump; the recorded commit cannot.
    - name: Resolve the MapLibre Native pin
      id: mln-pin
      shell: bash
      run: >-
        echo "sha=$(git ls-tree HEAD third_party/maplibre-native | awk '{print $3}')"
        >> "$GITHUB_OUTPUT"

    - name: Cache MapLibre Native source
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          third_party/maplibre-native
          .git/modules/third_party/maplibre-native
        key: mln-src-v3-${{ hashFiles('.gitmodules') }}-${{ steps.mln-pin.outputs.sha }}
        # sync-submodules re-syncs whatever it restores, so an older checkout
        # turns a pin bump into an incremental fetch instead of a fresh clone.
        restore-keys: |
          mln-src-v3-${{ hashFiles('.gitmodules') }}-
          mln-src-v3-

    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: Use Linux software graphics drivers
      if: ${{ runner.os == 'Linux' && startsWith(inputs.target, 'linux-') }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes \
          libegl-mesa0 \
          libgl1-mesa-dri \
          libvulkan1 \
          mesa-utils \
          mesa-utils-extra \
          mesa-vulkan-drivers
        {
          echo "EGL_PLATFORM=surfaceless"
          echo "LIBGL_ALWAYS_SOFTWARE=true"
        } >> "$GITHUB_ENV"

    - name: Use Windows Vulkan software driver
      if: ${{ runner.os == 'Windows' && endsWith(inputs.target, '-vulkan') }}
      uses: ./.github/actions/setup-windows-vulkan-software

    - name: Use Windows OpenGL software driver
      if: ${{ runner.os == 'Windows' && endsWith(inputs.target, '-wgl') }}
      uses: ./.github/actions/setup-windows-opengl-software

    - name: Cache Cargo packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        # The workspace lock file alone. A `**` glob would also match
        # `third_party/maplibre-native/rustutils/Cargo.lock`, which the step
        # above restores from another cache, making this key depend on what
        # that cache happened to hold.
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v2-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v2-

    # uv, pnpm, and NuGet each default to a different per-OS cache location, and
    # some of those paths carry a tool-version suffix. Pinning them under one
    # directory keeps a single cache entry accurate on every runner. Windows
    # tools need a native path, so prefer USERPROFILE with forward slashes.
    #
    # Only download caches belong here. A lock file key is right for those: the
    # entry is complete the first time it is written and never needs replacing.
    # GOCACHE is a build cache, so it needs a key that moves with the sources;
    # under a lock file key it froze at whatever the first save held, because an
    # exact hit skips the save. bindings/go declares no module requirements, so
    # there is no Go download cache to keep either.
    - name: Pin package download caches
      shell: bash
      run: |
        if [[ -n "${USERPROFILE:-}" ]]; then
          home="${USERPROFILE//\\//}"
        else
          home="$HOME"
        fi
        cache_root="$home/.ci-package-cache"
        {
          echo "UV_CACHE_DIR=$cache_root/uv"
          echo "npm_config_store_dir=$cache_root/pnpm"
          echo "NUGET_PACKAGES=$cache_root/nuget"
        } >> "$GITHUB_ENV"

    - name: Cache package downloads
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.ci-package-cache
        key: ${{ runner.os }}-${{ runner.arch }}-pkg-v2-${{ hashFiles('pnpm-lock.yaml', 'uv.lock', 'Directory.Packages.props', 'dotnet-tools.json', 'bindings/dotnet/dotnet-tools.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pkg-v2-

    # Zig's global cache holds downloaded package tarballs, which keeps SDL's
    # source dependencies off the network. Windows resolves it under
    # LOCALAPPDATA; every other platform, including macOS, uses ~/.cache.
    #
    # Restore only. `actions/cache` saves in a post step even when the job
    # failed, so a fetch that died partway published an incomplete cache under
    # the exact key — and because a key is never overwritten, every later run
    # restored the same gaps and retried the same downloads, turning one
    # transient network error into a permanent one. The job saves this cache
    # itself, after the checks that populate it pass.
    - name: Compute Zig package cache key
      if: ${{ inputs.zig == 'true' }}
      id: zig-cache-key
      shell: bash
      run: >-
        echo "key=${{ runner.os }}-${{ runner.arch }}-zig-packages-v2-${{ hashFiles('**/build.zig.zon') }}"
        >> "$GITHUB_OUTPUT"

    # Only `p`, the downloaded package tarballs. The rest of the global cache
    # holds compilation artifacts keyed by this key's `build.zig.zon` hash, so
    # they go stale the moment a source file changes and never get replaced.
    - name: Restore Zig packages
      if: ${{ inputs.zig == 'true' }}
      id: zig-packages
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cache/zig/p
          ~/AppData/Local/zig/p
        key: ${{ steps.zig-cache-key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-zig-packages-v2-

    # Downloading and extracting the SDK takes about 40 seconds, which is not
    # worth the ~1 GB it occupied in a 10 GB repository cache shared with every
    # other target. The entry was evicted between runs anyway, so the two OHOS
    # jobs paid the download and the upload.
    - name: Setup OpenHarmony SDK
      if: ${{ startsWith(inputs.target, 'ohos-') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sdk_root="$HOME/setup-ohos-sdk"
        archive="ohos-sdk-windows_linux-public.tar.gz"

        mkdir -p "$sdk_root"
        cd "$sdk_root"
        if [[ ! -f "$sdk_root/linux/native/build/cmake/ohos.toolchain.cmake" ]]; then
          gh release download v6.1 \
            --repo openharmony-rs/ohos-sdk \
            --pattern "${archive}*"

          # Stream the parts through sha256sum and tar; holding the parts, a
          # joined copy, and the extracted tree at once overflows the disk,
          # which kills the runner agent rather than failing the step.
          expected_sha="b833b75a64ee46bbd7880921abbb49b733ec5c8171b6684c9b524d57f624cee0"
          actual_sha="$(cat "${archive}".a* | sha256sum | awk '{print $1}')"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "OHOS SDK archive hash mismatch: expected $expected_sha, got $actual_sha" >&2
            exit 1
          fi
          # tar cannot sniff compression from a pipe, so -z is required here.
          cat "${archive}".a* | tar -xzf -
          rm -f "${archive}".a*
          unzip -q linux/native-*.zip -d linux
          rm -f linux/native-*.zip
        fi

        echo "OHOS_SDK_NATIVE=$sdk_root/linux/native" >> "$GITHUB_ENV"

    # Caches Gradle User Home and stops the daemons in its post-action, before
    # the cache is saved. Daemons that outlive the job keep Windows file locks
    # on `caches/*/**/*.lock`, which a plain archive step cannot read. The
    # project uses the wrapper, so no `gradle-version` is requested and the
    # mise-managed JDK stays in charge.
    - name: Cache Gradle User Home
      if: ${{ inputs.gradle == 'true' }}
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      with:
        add-job-summary: on-failure

    - name: Trim Windows PATH before mise activation
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $workspaceDrive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
        # Git Bash maps /tmp to the checkout drive; create it before mise tasks run.
        New-Item -ItemType Directory -Force -Path (Join-Path $workspaceDrive "tmp") | Out-Null

        $paths = @(
          if ($env:SCCACHE_PATH) { Split-Path -Parent $env:SCCACHE_PATH }
          if ($env:Path) { $env:Path -split ';' }
          "C:\Program Files\LLVM\bin",
          "C:\Program Files\Git\bin",
          "C:\Program Files\Git\usr\bin",
          "$env:SystemRoot\System32",
          "$env:SystemRoot",
          "$env:SystemRoot\System32\Wbem",
          "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
          "C:\Program Files\PowerShell\7",
          "C:\Program Files\Git\cmd"
        ) | Where-Object { $_ -and (Test-Path $_) }

        "Path=$($paths -join ';')" >> $env:GITHUB_ENV
        if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        }

        $gradleTemp = $env:RUNNER_TEMP -replace '\\', '/'
        $gradleOptions = "-Djava.io.tmpdir=$gradleTemp"
        if ($env:GRADLE_OPTS) {
          $gradleOptions = "$gradleOptions $env:GRADLE_OPTS"
        }
        "GRADLE_OPTS=$gradleOptions" >> $env:GITHUB_ENV

    - name: Install Windows Vulkan SDK
      if: ${{ startsWith(inputs.target, 'windows-') && endsWith(inputs.target, '-vulkan') }}
      uses: jakoch/install-vulkan-sdk-action@b394a1abed9cb019d8e637eeadac93d73e0853da # v1.5.5
      with:
        # The action's cache key is the OS, architecture and this version, and a
        # hit returns before the runtime is installed, so the entry saved
        # without a runtime keeps every later run from getting one. The version
        # is the only part of that key this action exposes, so a patch bump is
        # what retires the entry.
        vulkan_version: 1.4.341.1
        cache: true
        stripdown: true
        # The SDK alone carries vulkan-1.lib but not the loader it imports, so
        # the tests linked against it fail in the loader at startup.
        install_runtime: true

    # A machine with a Vulkan driver has the loader in System32, where every
    # process finds it. A runner can have it only inside the SDK, so expose its
    # directory to both ordinary processes and runtimes with isolated DLL
    # search paths, such as Python 3.8+.
    - name: Expose the Vulkan loader
      if: ${{ startsWith(inputs.target, 'windows-') && endsWith(inputs.target, '-vulkan') }}
      shell: pwsh
      run: |
        # Where the loader sits differs by runner: the x64 SDK groups it under
        # runtime by architecture, while the ARM64 runner carries it in
        # System32 rather than anywhere inside the SDK. Neither location can
        # offer a loader built for another architecture. The SDK search
        # mirrors cmake/render/vulkan.cmake; the PATH fallback mirrors what
        # find_file there resolves on runners that already have the loader.
        $architecture = if ($env:RUNNER_ARCH -eq "ARM64") { "arm64" } else { "x64" }
        $candidates = @("runtime\$architecture", "Bin", "bin") |
          ForEach-Object { Join-Path $env:VULKAN_SDK $_ }
        $directory = $candidates |
          Where-Object { Test-Path (Join-Path $_ "vulkan-1.dll") } |
          Select-Object -First 1
        if ($directory) {
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append
          "MAPLIBRE_NATIVE_C_RUNTIME_LIBRARY_DIRS=$directory" >> $env:GITHUB_ENV
        } elseif (-not (Get-Command vulkan-1.dll -ErrorAction SilentlyContinue)) {
          throw "no vulkan-1.dll in $($candidates -join ', ') or on PATH"
        }

    # `mise-action` saves its cache inline, at the end of its own step, so
    # anything installed after it — the project toolchains below, and the rustup
    # tree that `core:rust` installs outside the mise data directory — was never
    # in the entry it wrote. Every job restored a hit and then re-downloaded the
    # .NET SDK, Swift, the JDK, Go and Zig anyway. Own the cache instead: hash
    # the same configs the action did, restore before it runs, and save once
    # every install has succeeded.
    #
    # The hashed set mirrors `[monorepo] config_roots` in mise.toml. Naming the
    # roots keeps a `**` glob from reaching into the submodule this action
    # restores from another cache a few steps up.
    - name: Compute toolchain cache key
      id: toolchain-key
      shell: bash
      run: |
        prefix="toolchains-v1-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-unknown}"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.linux.toml', 'mise.macos.toml', 'mise.windows.toml', '.devcontainer/mise.toml', 'bindings/*/mise.toml', 'examples/*/mise.toml', 'docs/mise.toml') }}" >> "$GITHUB_OUTPUT"

    - name: Restore toolchains
      id: toolchains
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        # mise keeps its data under LOCALAPPDATA on Windows and the XDG data
        # directory everywhere else. `core:rust` defers to rustup, which owns
        # ~/.rustup and the proxies in ~/.cargo/bin.
        path: |
          ~/.local/share/mise
          ~/AppData/Local/mise
          ~/.rustup
          ~/.cargo/bin
        key: ${{ steps.toolchain-key.outputs.key }}
        # A near-miss still saves most of the downloads: `mise install` adds
        # what changed and leaves the rest alone.
        restore-keys: |
          ${{ steps.toolchain-key.outputs.prefix }}-

    - name: Bootstrap repository
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        cache: false
        bootstrap: true

    # `core:rust` installs a symlink to ~/.cargo/bin and leaves the toolchain,
    # components and cross targets to rustup under ~/.rustup, which the cache
    # above now carries alongside the mise data directory.
    #
    # An exact key match means mise.toml — and so the component and cross-target
    # list — is the one that produced the entry, so a working `cargo` is enough
    # to trust it. Anything else reinstalls: a partial match can carry a Rust
    # install predating a target that was added since, which no version check
    # would catch.
    #
    # `--force` uninstalls the toolchain before it reinstalls one, so a single
    # transient failure leaves the runner with no Rust at all and fails the job.
    # ARM64 runners kill freshly spawned processes often enough to hit this:
    # rustup has died by signal milliseconds after exec, having written nothing.
    # Retry so the second attempt restores what the first one removed.
    - name: Repair cached Rust toolchain
      shell: bash
      env:
        TOOLCHAINS_CACHE_HIT: ${{ steps.toolchains.outputs.cache-hit }}
      run: |
        if [[ "${TOOLCHAINS_CACHE_HIT}" == "true" ]] &&
          cargo --version && rustc --version; then
          echo "Rust toolchain restored from cache"
          exit 0
        fi
        for attempt in 1 2 3; do
          if MISE_NO_HOOKS=1 mise install --force rust; then
            exit 0
          fi
          echo "::warning::mise install --force rust failed (attempt ${attempt}/3)"
          sleep $((attempt * 5))
        done
        exit 1

    # Project tools live in each project's config, so the root install covers
    # only the repository-wide set. The devcontainer aggregate is the same set
    # the published image bakes, and installing it here rather than lazily keeps
    # the saved cache identical no matter which job writes it.
    - name: Install project toolchains
      shell: bash
      run: MISE_NO_HOOKS=1 mise -C .devcontainer install

    # Every job restores; one job per runner label saves. A miss otherwise has
    # all ~22 jobs archive several GB of toolchains for one of them to win the
    # key, and the losers pay the archive cost before the conflict is reported.
    - name: Save toolchains
      if: ${{ inputs.save-toolchains == 'true' && steps.toolchains.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.local/share/mise
          ~/AppData/Local/mise
          ~/.rustup
          ~/.cargo/bin
        key: ${{ steps.toolchain-key.outputs.key }}

    # Public reads use the R2 custom domain (same defaults as mise.toml). Writes
    # use the account S3 endpoint + key prefix so object URLs match OpenDAL's
    # path-style public GETs: https://sccache.sargunv.dev/<bucket>/<key>
    - name: Wire sccache into CMake
      shell: bash
      env:
        SCCACHE_ACCESS_KEY_ID: ${{ inputs.sccache-access-key-id }}
        SCCACHE_SECRET_ACCESS_KEY: ${{ inputs.sccache-secret-access-key }}
      run: |
        bucket="maplibre-native-ffi-sccache"
        account_id="6cda5be3bf367f2885f3696d3c9b2653"
        public_endpoint="https://sccache.sargunv.dev"
        write_endpoint="https://${account_id}.r2.cloudflarestorage.com"

        {
          echo "SCCACHE_BUCKET=${bucket}"
          echo "SCCACHE_REGION=auto"
          echo "SCCACHE_S3_USE_SSL=true"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          echo "RUSTC_WRAPPER=sccache"
          # sccache declines to cache incrementally compiled crates, which is
          # the cargo default for the dev profile that `cargo test` uses.
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"

        if [[ "${GITHUB_EVENT_NAME}" != "pull_request" && -n "${SCCACHE_ACCESS_KEY_ID}" && -n "${SCCACHE_SECRET_ACCESS_KEY}" ]]; then
          {
            echo "SCCACHE_ENDPOINT=${write_endpoint}"
            echo "SCCACHE_S3_KEY_PREFIX=${bucket}/"
            # mise.toml exports SCCACHE_S3_NO_CREDENTIALS=1 for public reads;
            # clear it so authenticated writes are not rejected by sccache.
            echo "SCCACHE_S3_NO_CREDENTIALS=0"
            echo "AWS_ACCESS_KEY_ID=${SCCACHE_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${SCCACHE_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"
          echo "Configured sccache R2 backend (read-write)"
        else
          {
            echo "SCCACHE_ENDPOINT=${public_endpoint}"
            echo "SCCACHE_S3_NO_CREDENTIALS=1"
          } >> "$GITHUB_ENV"
          echo "Configured sccache R2 backend (public read-only)"
        fi
