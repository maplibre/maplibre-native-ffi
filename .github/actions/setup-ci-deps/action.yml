name: Setup CI deps
description: Install the toolchain and target-specific CI prerequisites

# A target job passes its matrix row's fields, which tools/ci/plan.py resolves
# from the preset's vendor block. Every other job runs on the host toolchain.
inputs:
  mise-env:
    description:
      The mise configuration environment that supplies the target's SDK, such as
      emscripten or ohos
    required: false
    default: ""
  device:
    description:
      The name of the device that the target's suites boot, such as Android
      emulator
    required: false
    default: ""
  software-gpu:
    description:
      The render backend, egl, vulkan, or wgl, whose software driver stands in
      for the GPU that the runners lack
    required: false
    default: ""
  sccache-access-key-id:
    description: R2 S3 access key ID with Object Read & Write (push jobs only)
    required: false
    default: ""
  sccache-api-token:
    description:
      Cloudflare API token with R2 Object Read & Write (push jobs only)
    required: false
    default: ""
  zig:
    description: >-
      How the job gets its Zig packages: cache restores the Zig package cache
      and exposes its key for a later save, fetch downloads them, and skip
      leaves out the Zig projects
    required: false
    default: fetch
  gradle:
    description:
      Set up Gradle and its user-home cache; jobs that run no Gradle build leave
      this off
    required: false
    default: "true"
  save-toolchains:
    description: >-
      Save the toolchain cache when this job misses it. One job per runner label
      claims this so a miss costs one archive of the toolchain tree per runner
      instead of one per job.
    required: false
    default: "false"

outputs:
  zig-cache-key:
    description:
      Key the job saves the Zig package cache under once its checks pass
    value: ${{ steps.zig-cache-key.outputs.key }}
  zig-cache-hit:
    description:
      Whether the Zig package cache was restored from an exact key match
    value: ${{ steps.zig-packages.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Enable Git long paths
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: git config --global core.longpaths true

    # A hard error, such as a DLL the loader cannot resolve, raises a modal
    # dialog. No one is here to dismiss it, so the process waits behind it until
    # the job times out. Make the call fail and report instead.
    - name: Fail Windows hard errors instead of waiting on a dialog
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Set-ItemProperty `
          -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Windows" `
          -Name ErrorMode -Value 2 -Type DWord
        $reporting = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting"
        New-Item -Path $reporting -Force | Out-Null
        Set-ItemProperty -Path $reporting -Name DontShowUI -Value 1 -Type DWord

    # macOS runners are virtual machines, and their paravirtual Metal driver
    # crashes when two threads size a heap texture at once. MoltenVK sizes one
    # in every vkCreateImage while it places images in heaps, so parallel tests
    # crash there; see aether-lang-dev/aether#2287. Without heaps, MoltenVK
    # never makes that call.
    - name: Keep MoltenVK off the paravirtual driver's heap sizing
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: echo "MVK_CONFIG_USE_MTLHEAP=0" >> "$GITHUB_ENV"

    # The arm64 runners run the macOS x64 suites under Rosetta, which a runner
    # image may not include.
    - name: Install Rosetta
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
          sudo softwareupdate --install-rosetta --agree-to-license
        fi

    - name: Install MSYS2 MinGW toolchain
      if: ${{ runner.os == 'Windows' }}
      id: msys2
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'MINGW64' }}
        path-type: inherit
        update: true
        pacboy: clang:p llvm:p pkgconf:p

    - name: Select MSYS2 prefix
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        MSYS2_PREFIX: ${{ runner.arch == 'ARM64' && 'clangarm64' || 'mingw64' }}
        MISE_CONFIGURATION: ${{ inputs.mise-env }}
      run: |
        $prefix = (Join-Path $env:MSYS2_LOCATION $env:MSYS2_PREFIX) -replace '\\', '/'
        "MLN_FFI_MSYS2_ROOT=$prefix" >> $env:GITHUB_ENV
        if ($env:MISE_CONFIGURATION -eq "msys2") {
          "MISE_ENV=msys2" >> $env:GITHUB_ENV
        }

    # Each job asks for the SDK its target builds with, and every other job installs
    # none. No Windows target cross-compiles. Android reuses the SDK the runner image
    # already points ANDROID_HOME at. Repository build tasks install missing Android
    # packages there, and the emulator task installs its system image when it boots.
    #
    # The Oniro emulator image ships with the OpenHarmony SDK, and only the suite
    # that boots it needs the image, so the other ohos jobs subtract it.
    - name: Select the cross-compilation SDK for the target
      if: runner.os != 'Windows'
      shell: bash
      env:
        SDK: ${{ inputs.mise-env }}
        DEVICE: ${{ inputs.device }}
      run: |
        if [[ -n "${SDK}" ]]; then
          echo "MISE_ENV=${SDK}" >> "$GITHUB_ENV"
        fi
        if [[ "${SDK}" == ohos && "${DEVICE}" != "OpenHarmony emulator" ]]; then
          echo "MISE_DISABLE_TOOLS=http:oniro-emulator" >> "$GITHUB_ENV"
        fi

    # The gitlink SHA is what decides the checkout, so key on it directly. A
    # tag file can be left behind by a pin bump; the recorded commit cannot.
    - name: Resolve the MapLibre Native pin
      id: mln-pin
      shell: bash
      run: >-
        echo "sha=$(git ls-tree HEAD third_party/maplibre-native | awk '{print
        $3}')" >> "$GITHUB_OUTPUT"

    - name: Cache MapLibre Native source
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          third_party/maplibre-native
          .git/modules/third_party/maplibre-native
        key:
          mln-src-v4-${{ hashFiles('.gitmodules', 'tools/deps/sync-submodules')
          }}-${{ steps.mln-pin.outputs.sha }}
        # Restore only caches created with the current selective-sync logic.
        # A stale submodule worktree can otherwise report the recorded commit
        # while retaining files from the previous checkout.
        restore-keys: |
          mln-src-v4-${{ hashFiles('.gitmodules', 'tools/deps/sync-submodules') }}-

    - name: Sync MapLibre Native source
      shell: bash
      run: tools/deps/sync-submodules

    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    # x64 runners, GitHub-hosted and Blacksmith alike, prefer
    # azure.archive.ubuntu.com. When that mirror crawls, apt keeps the
    # connection instead of failing over, and `mise bootstrap`'s libclang-dev
    # download sits in this action for tens of minutes. Demote Azure and bound idle fetches before any apt-get.
    # ARM runners use ports.ubuntu.com instead.
    - name: Bound apt downloads on Linux
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/bound-apt.sh"

    - name: Use Linux software graphics drivers
      if: ${{ runner.os == 'Linux' && inputs.software-gpu != '' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes \
          libegl-mesa0 \
          libgl1-mesa-dri \
          libvulkan1 \
          mesa-utils \
          mesa-utils-extra \
          mesa-vulkan-drivers
        # Software rendering is slower than hardware, so the native suites
        # stretch their waits and hang watchdog to match.
        {
          echo "EGL_PLATFORM=surfaceless"
          echo "LIBGL_ALWAYS_SOFTWARE=true"
          echo "MLN_TEST_TIMEOUT_SCALE=3"
        } >> "$GITHUB_ENV"

    # devices-cli runs one emulator per 8 GiB of RAM by default, which leaves a
    # 16 GiB runner, whose kernel keeps some, room for one. The EGL job's
    # suites run on API 26 and API 36 at once.
    - name: Let the Android emulators run side by side
      if: ${{ runner.os == 'Linux' && inputs.device == 'Android emulator' }}
      shell: bash
      run: |
        mkdir -p ~/.config/devices-cli
        echo 'max_instances = 2' > ~/.config/devices-cli/config.toml

    # The hosted runner image has Android build tools and KVM, but no system
    # QEMU. Keep the emulator dependency out of every other job and the dev
    # container.
    - name: Install the OpenHarmony emulator host
      if: ${{ runner.os == 'Linux' && inputs.device == 'OpenHarmony emulator' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes qemu-system-x86

    # The FreeBSD suites run in a virtual machine that anyvm boots from a UEFI
    # disk image.
    - name: Install the FreeBSD virtual machine host
      if:
        ${{ runner.os == 'Linux' && inputs.device == 'FreeBSD virtual machine'
        }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes \
          ovmf \
          qemu-system-x86 \
          qemu-utils

    # Register current emulators for the suites and the children they start.
    # Ubuntu 24.04's QEMU corrupts Node's base64 decoding on LoongArch64.
    - name: Install QEMU user mode
      if: ${{ runner.os == 'Linux' && inputs.device == 'QEMU user mode' }}
      shell: bash
      run: bash scripts/setup-qemu.sh

    # The hosted runner exposes /dev/kvm, and this rule grants the runner
    # process access to hardware acceleration. Without it the emulators and the
    # FreeBSD virtual machine, every other device a Linux job boots, fall back
    # to software emulation, which no job here has the time budget for.
    - name: Enable KVM for the emulator
      if:
        ${{ runner.os == 'Linux' && inputs.device != '' && inputs.device !=
        'QEMU user mode' }}
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo udevadm settle --timeout=10
        ls -l /dev/kvm
        test -r /dev/kvm
        test -w /dev/kvm

    - name: Use Windows Vulkan software driver
      if: ${{ runner.os == 'Windows' && inputs.software-gpu == 'vulkan' }}
      uses: ./.github/actions/setup-windows-vulkan-software

    - name: Use Windows OpenGL software driver
      if: ${{ runner.os == 'Windows' && inputs.software-gpu == 'wgl' }}
      uses: ./.github/actions/setup-windows-opengl-software

    - name: Cache Cargo packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        # The workspace lock file alone: a `**` glob also matches the
        # submodule's, which an earlier step restores from another cache, so the
        # key would depend on that cache's contents.
        key:
          ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v2-${{
          hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v2-

    # uv, pnpm, and NuGet each default to a different per-OS cache location, and
    # some of those paths carry a tool-version suffix. Pinning them under one
    # directory keeps a single cache entry accurate on every runner. Windows
    # tools need a native path, so prefer USERPROFILE with forward slashes.
    #
    # Only download caches belong here, because the key is a lock file hash: an
    # exact hit skips the save, which is right for an entry that is complete
    # when first written. A build cache needs a key that moves with the sources.
    - name: Pin package download caches
      shell: bash
      run: |
        if [[ -n "${USERPROFILE:-}" ]]; then
          home="${USERPROFILE//\\//}"
        else
          home="$HOME"
        fi
        cache_root="$home/.ci-package-cache"
        {
          echo "UV_CACHE_DIR=$cache_root/uv"
          echo "npm_config_store_dir=$cache_root/pnpm"
          echo "NUGET_PACKAGES=$cache_root/nuget"
        } >> "$GITHUB_ENV"

    - name: Cache package downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ci-package-cache
        key:
          ${{ runner.os }}-${{ runner.arch }}-pkg-v2-${{
          hashFiles('pnpm-lock.yaml', 'uv.lock', 'Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pkg-v2-

    # Zig's global cache holds downloaded package tarballs. Windows resolves it
    # under LOCALAPPDATA; every other platform, including macOS, uses ~/.cache.
    #
    # Restore only; the job saves this cache itself, after the checks that
    # populate it pass. A key is never overwritten, so a partial fetch that won
    # the key would make one transient network error permanent.
    - name: Compute Zig package cache key
      if: ${{ inputs.zig == 'cache' }}
      id: zig-cache-key
      shell: bash
      run: >-
        echo "key=${{ runner.os }}-${{ runner.arch }}-zig-packages-v2-${{
        hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"

    # Only `p`, the downloaded package tarballs. The rest of the global cache
    # holds compilation artifacts keyed by this key's `build.zig.zon` hash, so
    # they go stale the moment a source file changes and never get replaced.
    - name: Restore Zig packages
      if: ${{ inputs.zig == 'cache' }}
      id: zig-packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/zig/p
          ~/AppData/Local/zig/p
        key: ${{ steps.zig-cache-key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-zig-packages-v2-

    # Caches Gradle User Home and stops the daemons in its post-action, before
    # the cache is saved. Daemons that outlive the job keep Windows file locks
    # on `caches/*/**/*.lock`, which a plain archive step cannot read. The
    # project uses the wrapper, so no `gradle-version` is requested and the
    # mise-managed JDK stays in charge.
    - name: Cache Gradle User Home
      if: ${{ inputs.gradle == 'true' }}
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        add-job-summary: never

    # setup-gradle's build-result listener only supplies reporting metadata.
    # Keep its Gradle User Home caching without adding a listener to every build.
    - name: Disable Gradle build result capture
      if: ${{ inputs.gradle == 'true' }}
      shell: pwsh
      run: '"GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE=true" >> $env:GITHUB_ENV'

    # The Kotlin/Wasm suite's Gradle plugin downloads Node.js and Yarn into
    # Gradle User Home, outside the directories that setup-gradle saves, and
    # installs its Karma and webpack tooling under ~/.kotlin. The Kotlin version
    # in the version catalog fixes all three, so the key is that file's hash,
    # and an exact hit skips the save.
    - name: Cache Kotlin/Wasm tooling
      if: ${{ inputs.gradle == 'true' && inputs.mise-env == 'emscripten' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/nodejs
          ~/.gradle/yarn
          ~/.kotlin/kotlin-npm-tooling
        key:
          ${{ runner.os }}-${{ runner.arch }}-kotlin-wasm-tooling-v1-${{
          hashFiles('gradle/libs.versions.toml') }}

    - name: Trim Windows PATH before mise activation
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $workspaceDrive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
        # Git Bash maps /tmp to the checkout drive; create it before mise tasks run.
        New-Item -ItemType Directory -Force -Path (Join-Path $workspaceDrive "tmp") | Out-Null

        $paths = @(
          if ($env:SCCACHE_PATH) { Split-Path -Parent $env:SCCACHE_PATH }
          if ($env:Path) { $env:Path -split ';' }
          "C:\Program Files\LLVM\bin",
          "C:\Program Files\Git\bin",
          "C:\Program Files\Git\usr\bin",
          "$env:SystemRoot\System32",
          "$env:SystemRoot",
          "$env:SystemRoot\System32\Wbem",
          "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
          "C:\Program Files\PowerShell\7",
          "C:\Program Files\Git\cmd"
        ) | Where-Object { $_ -and (Test-Path $_) }

        "Path=$($paths -join ';')" >> $env:GITHUB_ENV
        if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        }

        $gradleTemp = $env:RUNNER_TEMP -replace '\\', '/'
        $gradleOptions = "-Djava.io.tmpdir=$gradleTemp"
        if ($env:GRADLE_OPTS) {
          $gradleOptions = "$gradleOptions $env:GRADLE_OPTS"
        }
        "GRADLE_OPTS=$gradleOptions" >> $env:GITHUB_ENV

    - name: Install Windows Vulkan SDK
      if: ${{ runner.os == 'Windows' && inputs.software-gpu == 'vulkan' }}
      uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
      with:
        # The action's cache key is the OS, architecture and this version, and a
        # hit returns before the runtime is installed, so the entry saved
        # without a runtime keeps every later run from getting one. The version
        # is the only part of that key this action exposes, so a patch bump is
        # what retires the entry.
        vulkan_version: 1.4.363.0
        cache: true
        stripdown: true
        # The SDK alone carries vulkan-1.lib but not the loader it imports, so
        # the tests linked against it fail in the loader at startup.
        install_runtime: true

    # A machine with a Vulkan driver has the loader in System32, where every
    # process finds it. A runner can have it only inside the SDK, so expose its
    # directory to both ordinary processes and runtimes with isolated DLL
    # search paths, such as Python 3.8+.
    - name: Expose the Vulkan loader
      if: ${{ runner.os == 'Windows' && inputs.software-gpu == 'vulkan' }}
      shell: pwsh
      run: |
        # Where the loader sits differs by runner: the x64 SDK groups it under
        # runtime by architecture, while the ARM64 runner carries it in
        # System32 rather than anywhere inside the SDK. Neither location can
        # offer a loader built for another architecture. The SDK search
        # mirrors cmake/render/vulkan.cmake; the PATH fallback mirrors what
        # find_file there resolves on runners that already have the loader.
        $architecture = if ($env:RUNNER_ARCH -eq "ARM64") { "arm64" } else { "x64" }
        $candidates = @("runtime\$architecture", "Bin", "bin") |
          ForEach-Object { Join-Path $env:VULKAN_SDK $_ }
        $directory = $candidates |
          Where-Object { Test-Path (Join-Path $_ "vulkan-1.dll") } |
          Select-Object -First 1
        if ($directory) {
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append
          "MAPLIBRE_NATIVE_C_RUNTIME_LIBRARY_DIRS=$directory" >> $env:GITHUB_ENV
        } elseif (-not (Get-Command vulkan-1.dll -ErrorAction SilentlyContinue)) {
          throw "no vulkan-1.dll in $($candidates -join ', ') or on PATH"
        }

    # `mise-action` writes its cache inside its own step and declares no post
    # step, so nothing installed after it reaches the entry — including the
    # rustup tree, which lives outside the mise data directory either way.
    # Restore before it runs and save once every install has succeeded.
    #
    # The key covers every mise configuration and lock file in the repository.
    # The globs leave out the submodule, which an earlier step restores from a
    # cache.
    - name: Compute toolchain cache key
      id: toolchain-key
      shell: bash
      run: |
        prefix="toolchains-v1-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-unknown}"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}-${{ hashFiles('**/mise*.toml', '**/mise*.lock', '!third_party/**') }}" >> "$GITHUB_OUTPUT"

    - name: Restore toolchains
      id: toolchains
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # mise keeps its data under LOCALAPPDATA on Windows and the XDG data
        # directory everywhere else. `core:rust` defers to rustup, which owns
        # ~/.rustup and the proxies in ~/.cargo/bin.
        #
        # The cross-compilation SDKs are excluded: one job installs each, and either
        # is large enough to compete with every other target for the shared
        # repository cache. Re-fetching one costs less than the eviction pressure an
        # entry that size adds.
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/installs/emsdk
          !~/.local/share/mise/installs/http-oniro-emulator
          !~/.local/share/mise/installs/ohos-sdk
          ~/AppData/Local/mise
          ~/.rustup
          ~/.cargo/bin
        key: ${{ steps.toolchain-key.outputs.key }}
        # A near-miss still saves most of the downloads: `mise install` adds
        # what changed and leaves the rest alone.
        restore-keys: |
          ${{ steps.toolchain-key.outputs.prefix }}-

    - name: Bootstrap repository
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        # Match `min_version` in .config/mise.toml.
        version: 2026.10.19
        cache: false
        bootstrap: true
        # The files phase installs Linux packages. Skip it on Windows so
        # bootstrap does not validate an empty Unix-only config.
        bootstrap_skip: ${{ runner.os == 'Windows' && 'files' || '' }}

    # `mise deps --monorepo` installs tools and fetches packages for every
    # `[monorepo].config_roots` entry. Download failures during setup qualify
    # for the infrastructure retry, and every job populates the same tool cache.
    # Run providers serially so Zig projects reuse the downloaded packages.
    # Retry failed installs in place to retain successful downloads on the runner.
    - name: Install project dependencies (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ZIG: ${{ inputs.zig }}
      run: |
        deps_args=(--monorepo --jobs 1)
        if [[ "$ZIG" == skip ]]; then
          deps_args+=(
            --skip //bindings/zig:zig
          )
        fi
        for attempt in 1 2 3; do
          if MISE_NO_HOOKS=1 mise deps "${deps_args[@]}"; then
            exit 0
          fi
          echo "::warning::mise deps --monorepo failed (attempt $attempt/3)"
          if (( attempt < 3 )); then
            sleep 5
          fi
        done
        exit 1

    # Git Bash/MSYS2 is x86_64 under Windows ARM64 emulation and can terminate
    # with a native exception while spawning processes. Keep the retry supervisor
    # in native PowerShell so it survives that failure:
    # https://github.com/actions/runner-images/issues/14052
    # https://github.com/git-for-windows/git/issues/6287
    - name: Install project dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ZIG: ${{ inputs.zig }}
      run: |
        $env:MISE_NO_HOOKS = "1"
        $depsArgs = @("--monorepo", "--jobs", "1")
        if ($env:ZIG -eq "skip") {
          $depsArgs += @(
            "--skip", "//bindings/zig:zig"
          )
        }
        foreach ($attempt in 1..3) {
          mise deps @depsArgs
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }
          Write-Output "::warning::mise deps --monorepo failed (attempt $attempt/3)"
          if ($attempt -lt 3) {
            Start-Sleep -Seconds 5
          }
        }
        exit 1

    # Every job restores; one job per runner label saves. Otherwise a miss has
    # every job archive the toolchain tree for one of them to win the key, and
    # the losers pay the archive before the conflict is reported.
    - name: Save toolchains
      if:
        ${{ inputs.save-toolchains == 'true' &&
        steps.toolchains.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Matches the restore above, exclusions included.
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/installs/emsdk
          !~/.local/share/mise/installs/http-oniro-emulator
          !~/.local/share/mise/installs/ohos-sdk
          ~/AppData/Local/mise
          ~/.rustup
          ~/.cargo/bin
        key: ${{ steps.toolchain-key.outputs.key }}

    - name: Derive the R2 S3 secret
      if:
        github.event_name != 'pull_request' && inputs.sccache-access-key-id !=
        '' && inputs.sccache-api-token != ''
      shell: python
      env:
        SCCACHE_API_TOKEN: ${{ inputs.sccache-api-token }}
      run: |
        import hashlib
        import os

        # R2's S3 secret is the hash of the original Cloudflare API token.
        secret = hashlib.sha256(os.environ["SCCACHE_API_TOKEN"].encode()).hexdigest()
        print(f"::add-mask::{secret}")
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
            output.write(f"AWS_SECRET_ACCESS_KEY={secret}\n")

    # The R2 backend lives here because its keys carry
    # the toolchain paths of the runner that produced them; a contributor
    # machine reads its own disk cache instead. Public reads use the R2 custom
    # domain. Writes use the account S3 endpoint + key prefix so object URLs
    # match OpenDAL's path-style public GETs:
    # https://sccache.sargunv.dev/<bucket>/<key>
    - name: Wire sccache into CMake (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SCCACHE_ACCESS_KEY_ID: ${{ inputs.sccache-access-key-id }}
      run: |
        bucket="maplibre-native-ffi-sccache"
        account_id="6cda5be3bf367f2885f3696d3c9b2653"
        public_endpoint="https://sccache.sargunv.dev"
        write_endpoint="https://${account_id}.r2.cloudflarestorage.com"

        {
          echo "SCCACHE_BUCKET=${bucket}"
          echo "SCCACHE_REGION=auto"
          echo "SCCACHE_S3_USE_SSL=true"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          echo "RUSTC_WRAPPER=sccache"
          # sccache declines to cache incrementally compiled crates, which is
          # the cargo default for the dev profile that `cargo test` uses.
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"

        if [[ "${GITHUB_EVENT_NAME}" != "pull_request" && -n "${SCCACHE_ACCESS_KEY_ID}" && -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
          {
            echo "SCCACHE_ENDPOINT=${write_endpoint}"
            echo "SCCACHE_S3_KEY_PREFIX=${bucket}/"
            echo "AWS_ACCESS_KEY_ID=${SCCACHE_ACCESS_KEY_ID}"
          } >> "$GITHUB_ENV"
          echo "Configured sccache R2 backend (read-write)"
        else
          {
            echo "SCCACHE_ENDPOINT=${public_endpoint}"
            echo "SCCACHE_S3_NO_CREDENTIALS=1"
          } >> "$GITHUB_ENV"
          echo "Configured sccache R2 backend (public read-only)"
        fi

    # This step is another Git Bash startup boundary exposed to the same
    # Windows ARM64 emulation failure as the toolchain install above. Keep the
    # orchestration native even though it only writes environment variables:
    # https://github.com/actions/runner-images/issues/14052
    # https://github.com/git-for-windows/git/issues/6287
    - name: Wire sccache into CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SCCACHE_ACCESS_KEY_ID: ${{ inputs.sccache-access-key-id }}
      run: |
        $bucket = "maplibre-native-ffi-sccache"
        $accountId = "6cda5be3bf367f2885f3696d3c9b2653"
        $publicEndpoint = "https://sccache.sargunv.dev"
        $writeEndpoint = "https://${accountId}.r2.cloudflarestorage.com"

        @(
          "SCCACHE_BUCKET=$bucket"
          "SCCACHE_REGION=auto"
          "SCCACHE_S3_USE_SSL=true"
          "SCCACHE_BASEDIRS=$env:GITHUB_WORKSPACE"
          "SCCACHE_IDLE_TIMEOUT=0"
          "CMAKE_C_COMPILER_LAUNCHER=sccache"
          "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          "RUSTC_WRAPPER=sccache"
          # sccache declines to cache incrementally compiled crates, which is
          # the cargo default for the dev profile that `cargo test` uses.
          "CARGO_INCREMENTAL=0"
        ) >> $env:GITHUB_ENV

        if (
          $env:GITHUB_EVENT_NAME -ne "pull_request" -and
          $env:SCCACHE_ACCESS_KEY_ID -and
          $env:AWS_SECRET_ACCESS_KEY
        ) {
          @(
            "SCCACHE_ENDPOINT=$writeEndpoint"
            "SCCACHE_S3_KEY_PREFIX=$bucket/"
            "AWS_ACCESS_KEY_ID=$env:SCCACHE_ACCESS_KEY_ID"
          ) >> $env:GITHUB_ENV
          Write-Output "Configured sccache R2 backend (read-write)"
        } else {
          @(
            "SCCACHE_ENDPOINT=$publicEndpoint"
            "SCCACHE_S3_NO_CREDENTIALS=1"
          ) >> $env:GITHUB_ENV
          Write-Output "Configured sccache R2 backend (public read-only)"
        }
