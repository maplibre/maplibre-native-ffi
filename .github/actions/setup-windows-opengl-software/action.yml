name: Setup Windows OpenGL software driver
description: Install software WGL drivers for Windows CI

inputs:
  scope:
    description: >-
      `system` registers Mesa's llvmpipe as the system WGL driver. `jvm` puts
      Mesa's d3d12 driver beside the pinned java.exe, so it needs the installed
      toolchains.
    required: false
    default: system

runs:
  using: composite
  steps:
    - name: Install WGL driver
      if: ${{ inputs.scope == 'system' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"

        if ($env:RUNNER_ARCH -eq "ARM64") {
          # mmozeiko's ARM64 Mesa build is packaged for per-app use, but its
          # opengl32.dll exports the Windows ICD entry points used by mesadrv.dll.
          $mesaVersion = "26.1.3"
          $mesaArchive = Join-Path $env:RUNNER_TEMP "mesa-llvmpipe-arm64-$mesaVersion.7z"
          $mesaRoot = Join-Path $env:RUNNER_TEMP "mesa-llvmpipe-arm64-$mesaVersion"
          $mesaUrl = "https://github.com/mmozeiko/build-mesa/releases/download/$mesaVersion/mesa-llvmpipe-arm64-$mesaVersion.7z"
          $expectedHash = "442F24756DDAF97C1C08B57C0A90661B22010390A35B2CEF69D3C6FD8B3EA32C"
          $driverFilter = "opengl32.dll"
          $driverPathPattern = "mesa-llvmpipe-arm64"
        } else {
          $mesaVersion = "26.0.8"
          $mesaArchive = Join-Path $env:RUNNER_TEMP "mesa3d-$mesaVersion-release-msvc.7z"
          $mesaRoot = Join-Path $env:RUNNER_TEMP "mesa3d-wgl-$mesaVersion"
          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/$mesaVersion/mesa3d-$mesaVersion-release-msvc.7z"
          $expectedHash = "A438C26C2752726916E455F9AD121F8A7E3CFECF8626251ABF8E5B3E129D8497"
          $driverFilter = "libgallium_wgl.dll"
          $driverPathPattern = "x64"
        }

        Invoke-WebRequest -Uri $mesaUrl -OutFile $mesaArchive
        $actualHash = (Get-FileHash $mesaArchive -Algorithm SHA256).Hash
        if ($actualHash -ne $expectedHash) {
          throw "Mesa archive hash mismatch: expected $expectedHash, got $actualHash"
        }
        7z x $mesaArchive "-o$mesaRoot" -y | Out-Null

        $mesaWglDriver = Get-ChildItem $mesaRoot -Recurse -Filter $driverFilter |
          Where-Object { $_.FullName -match $driverPathPattern } |
          Select-Object -First 1
        if (-not $mesaWglDriver) {
          throw "Missing Mesa WGL driver in $mesaArchive"
        }

        Copy-Item $mesaWglDriver.FullName (Join-Path $env:WINDIR "System32\mesadrv.dll") -Force

        $openglDriverKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL"
        New-Item -Path $openglDriverKey -Force | Out-Null
        New-ItemProperty -Path $openglDriverKey -Name DLL -PropertyType String -Value "mesadrv.dll" -Force | Out-Null
        New-ItemProperty -Path $openglDriverKey -Name DriverVersion -PropertyType DWord -Value 1 -Force | Out-Null
        New-ItemProperty -Path $openglDriverKey -Name Flags -PropertyType DWord -Value 1 -Force | Out-Null
        New-ItemProperty -Path $openglDriverKey -Name Version -PropertyType DWord -Value 2 -Force | Out-Null

        # The x64 driver also carries d3d12, which Mesa prefers when it is
        # present. Every process outside the JVM draws with llvmpipe, and the
        # JVM steps select d3d12 in their own environment.
        "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV
        # Software rendering is slower than hardware, so the native suites
        # stretch their waits and hang watchdog to match.
        "MLN_TEST_TIMEOUT_SCALE=3" >> $env:GITHUB_ENV
        "Path=$($mesaWglDriver.Directory.FullName);$env:Path" >> $env:GITHUB_ENV

    # Skiko shares its frames as Direct3D 12 textures, which of Mesa's drivers
    # only d3d12 can import into OpenGL. The JVM resolves opengl32.dll from its
    # application directory before System32, both for the libraries that import
    # it and for LWJGL, which loads it at run time. A d3d12 build there serves
    # every JVM, child JVMs included, while every other process keeps the system
    # driver.
    #
    # The JVM steps set GALLIUM_DRIVER=d3d12 and LIBGL_ALWAYS_SOFTWARE=true in
    # their own environment, overriding the job's llvmpipe, which this build
    # lacks. LIBGL_ALWAYS_SOFTWARE runs d3d12 on WARP, but Mesa's WGL front end
    # then drops d3d12 from its driver list, so GALLIUM_DRIVER names it.
    - name: Install WGL driver for the pinned JVM
      if: ${{ inputs.scope == 'jvm' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"

        $mesaVersion = "26.1.3"
        if ($env:RUNNER_ARCH -eq "ARM64") {
          $architecture = "arm64"
          $expectedHash = "C7B65C2CDF8774E19CEAB45FA7BBE18D2C7E735D9CE879BC071A25DFFAD46ECF"
        } else {
          $architecture = "x64"
          $expectedHash = "195EA10AE0E682E6B2A265C4C7E96D229F09A8A24C92D5A9BE2D210214D7B14E"
        }
        $archiveName = "mesa-d3d12-$architecture-$mesaVersion.7z"
        $mesaArchive = Join-Path $env:RUNNER_TEMP $archiveName
        $mesaRoot = Join-Path $env:RUNNER_TEMP "mesa-d3d12-$architecture-$mesaVersion"
        $mesaUrl = "https://github.com/mmozeiko/build-mesa/releases/download/$mesaVersion/$archiveName"

        Invoke-WebRequest -Uri $mesaUrl -OutFile $mesaArchive
        $actualHash = (Get-FileHash $mesaArchive -Algorithm SHA256).Hash
        if ($actualHash -ne $expectedHash) {
          throw "Mesa archive hash mismatch: expected $expectedHash, got $actualHash"
        }
        7z x $mesaArchive "-o$mesaRoot" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "Could not extract $archiveName" }

        $openGl = Join-Path $mesaRoot "opengl32.dll"
        if (-not (Test-Path $openGl)) { throw "Missing Mesa WGL driver in $archiveName" }

        # Java is pinned in the JVM projects' configuration, not the root's.
        $javaHome = & mise -C (Join-Path $env:GITHUB_WORKSPACE "bindings\kotlin") where java
        if ($LASTEXITCODE -ne 0 -or -not $javaHome) {
          throw "Could not locate the pinned JVM"
        }
        $javaBin = Join-Path $javaHome.Trim() "bin"
        if (-not (Test-Path (Join-Path $javaBin "java.exe"))) {
          throw "No java.exe in $javaBin"
        }
        Copy-Item $openGl (Join-Path $javaBin "opengl32.dll") -Force
