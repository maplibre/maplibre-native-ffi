# correctness is what actionlint checks. The default profile adds
# zizmor-style policy rules (timeouts, unpinned actions, cooldown ≥ 7).
# Blacksmith runner labels are not in the GitHub-hosted catalog.
profile: correctness
# Every third-party action is pinned to a commit, which Dependabot bumps.
rules:
  unpinned-uses: error
self-hosted-runner:
  labels:
    - blacksmith-2vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2404-arm
    - blacksmith-4vcpu-windows-2025
    - blacksmith-6vcpu-macos-26
