# Generated by `mise run ci:generate-workflow`. Do not edit directly.
name: CI baseline coverage
on:
  workflow_call:
    inputs:
      scope:
        type: string
        required: true
      jobs:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
          gradle: false
      - run: mise run ci:generate-workflow --check
      - run: mise run ci:generate-devcontainer-tools --check
      - run: mise run ci:test
      - run: mise run --force //bindings/dart:ffigen
      - run: mise run --force //bindings/dotnet:generate
      - run: mise run --force //bindings/kotlin:generate
      - run: dprint output-resolved-config > /dev/null
      - run: mise run fix
      - name: Check generated and formatted files
        run: |
          git update-index -q --refresh
          git diff --exit-code -- . ':(exclude)mise*.lock'
          git diff --cached --exit-code -- . ':(exclude)mise*.lock'
    if: contains(fromJSON(inputs.jobs), 'hygiene')
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36
      - run: mise run //docs:build
    if: contains(fromJSON(inputs.jobs), 'docs')
  target-linux-gnu-x64-egl:
    name: target / linux-gnu-x64-egl
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
          target: linux-gnu-x64-egl
          zig: true
          save-toolchains: true
      - run: mise run test linux-gnu-x64-egl
      - run: mise run check-glibc-floor linux-gnu-x64-egl
      - name: Archive native artifact
        run: mise run archive-native linux-gnu-x64-egl
      - name: Install packaged native artifact
        run: mise run install-native-package linux-gnu-x64-egl build/packages/native/dist/maplibre-native-c-linux-gnu-x64-egl.tar.gz
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/rust:test linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/rust-map:check linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/zig:test linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/zig-map:build linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/zig-readback:run linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/kotlin:test linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/compose-map:build linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/lwjgl-map:build linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/swift:test linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/dotnet:test linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/go:test linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/go-map:check linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/c-map:build linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/python:test linux-gnu-x64-egl
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/dart:test linux-gnu-x64-egl
      - name: Save Zig packages
        if: steps.setup.outputs.zig-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig/p
            ~/AppData/Local/zig/p
          key: ${{ steps.setup.outputs.zig-cache-key }}
      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-package-linux-gnu-x64-egl-${{ github.sha }}
          path: build/packages/native/dist/maplibre-native-c-linux-gnu-x64-egl.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
    if: contains(fromJSON(inputs.jobs), 'target-linux-gnu-x64-egl')
  target-linux-gnu-x64-vulkan:
    name: target / linux-gnu-x64-vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
          target: linux-gnu-x64-vulkan
          zig: true
      - run: mise run test linux-gnu-x64-vulkan
      - run: mise run check-glibc-floor linux-gnu-x64-vulkan
      - name: Archive native artifact
        run: mise run archive-native linux-gnu-x64-vulkan
      - name: Install packaged native artifact
        run: mise run install-native-package linux-gnu-x64-vulkan build/packages/native/dist/maplibre-native-c-linux-gnu-x64-vulkan.tar.gz
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/rust:test linux-gnu-x64-vulkan release
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/rust-map:check linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/rust:test:download linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/dart:test:download linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/zig:test linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/zig-map:build linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/zig-readback:run linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/kotlin:test linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/compose-map:build linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/lwjgl-map:build linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/swift:test linux-gnu-x64-vulkan release
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/dotnet:test linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/go:test linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/c-map:build linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/python:test linux-gnu-x64-vulkan
      - env:
          MISE_TASK_SKIP: //:build
        run: mise run //bindings/dart:test linux-gnu-x64-vulkan
      - name: Save Zig packages
        if: steps.setup.outputs.zig-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig/p
            ~/AppData/Local/zig/p
          key: ${{ steps.setup.outputs.zig-cache-key }}
      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-package-linux-gnu-x64-vulkan-${{ github.sha }}
          path: build/packages/native/dist/maplibre-native-c-linux-gnu-x64-vulkan.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
    if: contains(fromJSON(inputs.jobs), 'target-linux-gnu-x64-vulkan')
  verified:
    name: verified (${{ github.sha }} / ${{ inputs.scope }})
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: always()
    needs:
      - hygiene
      - docs
      - target-linux-gnu-x64-egl
      - target-linux-gnu-x64-vulkan
    steps:
      - name: Require every coverage job
        env:
          EXPECTED: '["docs", "hygiene", "target-linux-gnu-x64-egl", "target-linux-gnu-x64-vulkan"]'
          RESULTS: ${{ toJSON(needs) }}
          SELECTED: ${{ inputs.jobs }}
        run: |
          jq -e -n --argjson expected "$EXPECTED" --argjson results "$RESULTS" --argjson selected "$SELECTED"   '($expected == ($results | keys)) and ($selected | length > 0)
             and (($selected - $expected) | length == 0)
             and all($expected[]; . as $job | $results[$job].result ==
               (if $selected | index($job) then "success" else "skipped" end))'
