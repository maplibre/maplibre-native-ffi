name: "↳ Python wheels"

on:
  workflow_call:
    inputs:
      run_id:
        description: CI run that produced the native packages
        required: true
        type: string
      sha:
        description: Source commit and artifact suffix
        required: true
        type: string
      version:
        description: Wheel version
        required: true
        type: string

permissions:
  contents: read

jobs:
  api:
    name: Python wheel / API
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
          install_args: python aqua:astral-sh/uv
      - name: Version the package
        run: >-
          mise run --no-deps //bindings/python:prepare-release ${{
          inputs.version }}
      - run: mise run --no-deps //bindings/python:build-api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-api-${{ inputs.sha }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
          retention-days: 1

  runtime:
    name: Python wheel / ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    # Each preset is one whose native package the CI run builds and whose
    # Python suite it runs. Its backend picks the runtime that it builds.
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gnu-x64-vulkan
            runner: blacksmith-4vcpu-ubuntu-2404
          - preset: linux-gnu-x64-egl
            runner: blacksmith-4vcpu-ubuntu-2404
          - preset: linux-gnu-arm64-vulkan
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - preset: linux-gnu-arm64-egl
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - preset: macos-arm64-metal
            runner: blacksmith-6vcpu-macos-26
          - preset: macos-arm64-vulkan
            runner: blacksmith-6vcpu-macos-26
          - preset: macos-arm64-egl
            runner: blacksmith-6vcpu-macos-26
          - preset: windows-x64-vulkan
            runner: blacksmith-4vcpu-windows-2025
          - preset: windows-x64-wgl
            runner: blacksmith-4vcpu-windows-2025
          - preset: windows-arm64-vulkan
            runner: windows-11-arm
          - preset: windows-arm64-wgl
            runner: windows-11-arm
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.preset }}
          gradle: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: native-package-${{ matrix.preset }}-${{ inputs.sha }}
          path: build/packages/native/python-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package ${{ matrix.preset }}
          build/packages/native/python-input/maplibre-native-c-${{ matrix.preset
          }}.tar.gz
      - name: Version and license the packages
        run: >-
          mise run --no-deps //bindings/python:prepare-release ${{
          inputs.version }} ${{ matrix.preset }}
      # The native artifact is built for macOS 14.3, and maturin derives the
      # wheel's platform tag from this variable. Left unset, the tag would
      # promise older releases a dylib they cannot load. The stamped version no
      # longer matches uv.lock, so nothing after the stamp may run the uv
      # dependency provider.
      - run:
          mise run --no-deps //bindings/python:build-runtime ${{ matrix.preset
          }}
        env:
          MISE_TASK_SKIP: "//:build"
          MACOSX_DEPLOYMENT_TARGET: "14.3"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.preset }}-${{ inputs.sha }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
          retention-days: 1
