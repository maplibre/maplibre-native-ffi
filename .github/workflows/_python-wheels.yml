name: "↳ Python wheels"

on:
  workflow_call:
    inputs:
      run_id:
        description: CI run that built the runtime wheels
        required: true
        type: string
      sha:
        description: Source commit and artifact suffix
        required: true
        type: string
      version:
        description: Wheel version
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    name: pack
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      MISE_NO_HOOKS: "1"
      PACKAGE_SHA: ${{ inputs.sha }}
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.PACKAGE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python aqua:astral-sh/uv
      # Target jobs build the runtime extensions against the packaged native
      # library. Packing changes metadata alone, preserving their platform tags.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: python-runtime-*-${{ env.PACKAGE_SHA }}
          path: build/python-runtimes
      - name: Version the packages
        run: >-
          mise run --no-deps //bindings/python:prepare-release
          "$PACKAGE_VERSION" "$GITHUB_WORKSPACE/build/python-runtimes"
      # Stamping changes pyproject.toml, so nothing after it may sync uv.lock.
      - run: mise run --no-deps //bindings/python:build-api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-packages-${{ env.PACKAGE_SHA }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
