name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Each release checks that its tag is the newest before it publishes, so
# releases run one at a time across every tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source:
    name: Source
    permissions:
      actions: write
      checks: read
      contents: read
    uses: ./.github/workflows/_release-context.yml

  native:
    name: Native
    needs:
      - source
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/_native-package.yml
    with:
      ci_run_url: ${{ needs.source.outputs.ci_run_url }}
      previous_tag: ${{ needs.source.outputs.previous_tag }}
      release: true
      run_id: ${{ needs.source.outputs.run_id }}
      sha: ${{ needs.source.outputs.sha }}
      tag: ${{ github.ref_name }}
      version: ${{ needs.source.outputs.version }}

  # A package stages at the release version as CI stages it. It publishes after
  # the GitHub release, so every package of a version refers to native archives
  # that exist.
  kotlin-maven:
    name: package / maven
    needs:
      - source
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_kotlin-maven.yml
    with:
      run_id: ${{ needs.source.outputs.run_id }}
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}

  kotlin:
    name: Kotlin
    needs:
      - source
      - native
      - kotlin-maven
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    environment:
      name: maven-central
      url:
        https://central.sonatype.com/artifact/org.maplibre.nativeffi/maplibre-native-ffi/${{
        needs.source.outputs.version }}
    permissions:
      actions: read
      contents: read
    env:
      KOTLIN_VERSION: ${{ needs.source.outputs.version }}
      MISE_NO_HOOKS: "1"
      PUBLISH_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kotlin-maven-verified-${{ env.PUBLISH_SHA }}
          path: build/packages/kotlin/maven
      - name: Sign and bundle the release
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release bundle
          build/packages/kotlin/maven
          "build/packages/kotlin/maplibre-native-ffi-${KOTLIN_VERSION}.zip"
          "$KOTLIN_VERSION"
      - name: Upload and publish the Central deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          authorization="$(
            printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" \
              | base64 --wrap=0
          )"
          bundle="build/packages/kotlin/maplibre-native-ffi-${KOTLIN_VERSION}.zip"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            --form "bundle=@${bundle};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=kotlin-${KOTLIN_VERSION}&publishingType=AUTOMATIC")"
          if [[ ! "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Central returned an invalid deployment id: $deployment_id" >&2
            exit 1
          fi

          for attempt in {1..540}; do
            status_json="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer $authorization" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}")"
            deployment_state="$(jq -r '.deploymentState' <<<"$status_json")"
            echo "Central deployment $deployment_id is $deployment_state"
            case "$deployment_state" in
              PUBLISHED)
                {
                  echo "### Kotlin $KOTLIN_VERSION"
                  echo
                  echo "Published Maven Central deployment \`$deployment_id\`."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              FAILED)
                jq '.errors' <<<"$status_json" >&2
                exit 1
                ;;
              PENDING | VALIDATING | VALIDATED | PUBLISHING) ;;
              *)
                echo "Central returned unknown deployment state $deployment_state" >&2
                jq . <<<"$status_json" >&2
                exit 1
                ;;
            esac
            if (( attempt < 540 )); then
              sleep 10
            fi
          done
          echo "Central deployment $deployment_id did not finish within 90 minutes" >&2
          exit 1

  dart:
    name: Dart
    needs:
      - source
      - native
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_dart-pub.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      tag: ${{ github.ref_name }}
      version: ${{ needs.source.outputs.version }}

  rust:
    name: Rust
    needs:
      - source
      - native
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_rust-crates.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      tag: ${{ github.ref_name }}
      version: ${{ needs.source.outputs.version }}

  typescript-npm:
    name: package / npm
    needs:
      - source
      - native
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_typescript-npm.yml
    with:
      tag: ${{ github.ref_name }}
      run_id: ${{ needs.source.outputs.run_id }}
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}

  typescript:
    name: TypeScript
    needs:
      - source
      - native
      - typescript-npm
    # npm's trusted publishing and provenance accept only GitHub-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # npm accepts an OIDC token from this repository when each package's
    # trusted publisher names this environment and release.yml.
    environment:
      name: npm
      url:
        https://www.npmjs.com/package/@maplibre/native-ffi/v/${{
        needs.source.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      MISE_NO_HOOKS: "1"
      PUBLISH_SHA: ${{ needs.source.outputs.sha }}
      PUBLISH_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: core:node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages-${{ env.PUBLISH_VERSION }}
          path: build/npm
      # Addons, then backends, then the facade, so every package's pins resolve
      # once it publishes. A version that npm already has is skipped, so a rerun
      # after a partial publish resumes where it stopped. npm attests the
      # provenance of each package.
      - name: Publish
        run: |
          set -euo pipefail

          for kind in addon backend facade; do
            for tarball in build/npm/*.tgz; do
              manifest="$(tar -xOzf "$tarball" package/package.json)"
              if [[ "$(jq -r 'if .optionalDependencies then "backend" elif .exports then "facade" else "addon" end' <<<"$manifest")" != "$kind" ]]; then
                continue
              fi
              name="$(jq -r .name <<<"$manifest")"
              url="https://registry.npmjs.org/$name/$PUBLISH_VERSION"
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$url")"
              case "$status" in
                200) continue ;;
                404) ;;
                *)
                  echo "npm returned HTTP $status for $url" >&2
                  exit 1
                  ;;
              esac
              mise exec --no-deps core:node -- npm publish --provenance --access public "$tarball"
              echo "### $name $PUBLISH_VERSION" >> "$GITHUB_STEP_SUMMARY"
            done
          done

  arkts-ohpm:
    name: package / ohpm
    needs:
      - source
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_arkts-ohpm.yml
    with:
      run_id: ${{ needs.source.outputs.run_id }}
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}

  arkts:
    name: ArkTS
    needs:
      - source
      - native
      - arkts-ohpm
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    # OHPM has no trusted publishing. The environment holds the publish ID and
    # the encrypted private key whose public half the publishing account lists,
    # with its passphrase.
    environment:
      name: ohpm
      url: https://ohpm.openharmony.cn/#/en/detail/@maplibre%2Fnative-ffi-opengl
    permissions:
      contents: read
    env:
      MISE_NO_HOOKS: "1"
      PUBLISH_SHA: ${{ needs.source.outputs.sha }}
      PUBLISH_VERSION: ${{ needs.source.outputs.version }}
      # The official ohpm ships only in Huawei's command-line tools, which this
      # mirror serves without a login.
      OHPM_TOOLS_URL: https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip
      OHPM_TOOLS_SHA256: 1dcefa4741dc289277560b2802040e0c45b433898d8db453d711d5376e0478f1
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: core:node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ohpm-packages-${{ env.PUBLISH_VERSION }}
          path: build/ohpm
      - name: Install ohpm
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tools.zip" "$OHPM_TOOLS_URL"
          echo "$OHPM_TOOLS_SHA256  $RUNNER_TEMP/tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/tools.zip" 'command-line-tools/ohpm/*' -d "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/tools.zip"
          echo "$RUNNER_TEMP/command-line-tools/ohpm/bin" >> "$GITHUB_PATH"
      # ohpm checks each package as the registry will before any of them
      # publishes. A version that OHPM already lists is skipped, so a rerun
      # after a partial publish resumes where it stopped.
      - name: Publish
        env:
          OHPM_PUBLISH_ID: ${{ secrets.OHPM_PUBLISH_ID }}
          OHPM_PRIVATE_KEY: ${{ secrets.OHPM_PRIVATE_KEY }}
          OHPM_KEY_PASSPHRASE: ${{ secrets.OHPM_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          for har in build/ohpm/*.har; do
            mise exec --no-deps core:node -- ohpm prepublish "$har"
          done
          mise exec --no-deps core:node -- python3 tools/release/ohpm_publish.py ohpm build/ohpm/*.har
          for har in build/ohpm/*.har; do
            echo "### $(basename "$har" .har) awaits OHPM's review" >> "$GITHUB_STEP_SUMMARY"
          done

  # Go resolves a module in a subdirectory from tags prefixed with its path.
  # The module path carries no major version suffix, so an epoch of 2 or more
  # needs the path to end in /vN first.
  go:
    name: Go
    needs:
      - source
      - native
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.source.outputs.sha }}
          TAG: bindings/go/${{ github.ref_name }}
        # A rerun finds the tag that an earlier attempt created.
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)"
          if [[ "$existing" == "$SHA" ]]; then
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$SHA"

  # SwiftPM, vcpkg, Conan, and xmake consume the distribution repository. Each
  # release commits its packages and registry versions together, then tags the
  # commit.
  distribution:
    name: Distribution repository
    needs:
      - source
      - native
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment:
      name: distribution
      url:
        https://github.com/maplibre/maplibre-native-ffi-distribution/tree/${{
        github.ref_name }}
    permissions:
      contents: read
    env:
      MISE_NO_HOOKS: "1"
      PUBLISH_SHA: ${{ needs.source.outputs.sha }}
      PUBLISH_TAG: ${{ github.ref_name }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python
      - name: Download the distribution inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "$PUBLISH_TAG" --pattern SHA256SUMS --pattern
          'maplibre-native-c-linux-gnu-*.tar.gz' --pattern
          'maplibre-native-c-macos-*.tar.gz' --pattern
          'maplibre-native-c-windows-*.tar.gz' --pattern
          'maplibre-native-c-freebsd-*.tar.gz' --pattern
          'maplibre-native-c-android-*.tar.gz' --dir "$RUNNER_TEMP/assets"
      # GitHub publishes its host keys, so the job trusts only those.
      - name: Install the deploy key
        env:
          DISTRIBUTION_DEPLOY_KEY: ${{ secrets.DISTRIBUTION_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "$DISTRIBUTION_DEPLOY_KEY" ]]; then
            echo "the distribution environment has no DISTRIBUTION_DEPLOY_KEY secret" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/distribution
          printf '%s\n' "$DISTRIBUTION_DEPLOY_KEY" > ~/.ssh/distribution
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/distribution -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      - name: Publish
        run: |
          set -euo pipefail

          mise exec --no-deps python -- tools/release/publish-distribution.sh \
            git@github.com:maplibre/maplibre-native-ffi-distribution.git \
            "$PUBLISH_TAG" "$RUNNER_TEMP/assets"
          echo "### Distribution repository $PUBLISH_TAG" >> "$GITHUB_STEP_SUMMARY"

  dotnet-nuget:
    name: package / nuget
    needs:
      - source
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_dotnet-nuget.yml
    with:
      run_id: ${{ needs.source.outputs.run_id }}
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}

  dotnet:
    name: .NET
    needs:
      - source
      - native
      - dotnet-nuget
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    # NuGet.org accepts an OIDC token from this repository when a trusted
    # publishing policy names this environment and release.yml, the workflow
    # that defines this job.
    environment:
      name: nuget.org
      url:
        https://www.nuget.org/packages/Maplibre.NativeFfi/${{
        needs.source.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      MISE_NO_HOOKS: "1"
      PUBLISH_SHA: ${{ needs.source.outputs.sha }}
      PUBLISH_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: core:dotnet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-nupkgs-${{ env.PUBLISH_SHA }}
          path: build/packages/dotnet/nupkgs
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      # Skipping a version that NuGet.org already has lets a rerun after a
      # partial push resume where it stopped.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          mise exec --no-deps core:dotnet -- dotnet nuget push \
            'build/packages/dotnet/nupkgs/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "### .NET $PUBLISH_VERSION" >> "$GITHUB_STEP_SUMMARY"

  python-wheels:
    name: package / pypi
    needs:
      - source
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_python-wheels.yml
    with:
      run_id: ${{ needs.source.outputs.run_id }}
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}

  # PyPI's trusted publishing does not support reusable workflows, so the
  # upload runs here, in the workflow that each project's publisher names. PyPI
  # holds one pending publisher per workflow and environment, so each
  # distribution publishes from an environment of its own.
  python:
    name: Python / ${{ matrix.distribution }}
    needs:
      - source
      - native
      - python-wheels
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: maplibre-native-ffi
            environment: pypi
          - distribution: maplibre-native-ffi-runtime-opengl
            environment: pypi-runtime-opengl
          - distribution: maplibre-native-ffi-runtime-metal
            environment: pypi-runtime-metal
          - distribution: maplibre-native-ffi-runtime-vulkan
            environment: pypi-runtime-vulkan
    environment:
      name: ${{ matrix.environment }}
      url:
        https://pypi.org/project/${{ matrix.distribution }}/${{
        needs.source.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-wheel-*-${{ needs.source.outputs.sha }}
          path: wheels
          merge-multiple: true
      - name: Select the distribution's wheels
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          mkdir dist
          mv "wheels/${DISTRIBUTION//-/_}"-[0-9]*.whl dist/
      # Skipping what PyPI already has lets a rerun resume a partial upload.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # OHPM lists a version only after its review, so the docs do not wait for it.
  docs:
    name: Docs Pages
    needs:
      - source
      - dart
      - distribution
      - dotnet
      - go
      - kotlin
      - python
      - rust
      - typescript
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      DOCS_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Read the Android compile SDK
        id: android
        shell: bash
        run: |
          sdk="$(sed -n 's/^android-compileSdk = "\([0-9][0-9]*\)" *$/\1/p' gradle/libs.versions.toml)"
          test -n "$sdk" || { echo "android-compileSdk missing from gradle/libs.versions.toml" >&2; exit 1; }
          echo "compile-sdk=$sdk" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages:
            platform-tools platforms;android-${{
            steps.android.outputs.compile-sdk }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run_id }}
          name: native-package-linux-gnu-x64-vulkan-${{ env.RELEASE_SHA }}
          path: build/packages/native/docs-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package linux-gnu-x64-vulkan
          build/packages/native/docs-input/maplibre-native-c-linux-gnu-x64-vulkan.tar.gz
      - run: mise run //docs:build
        env:
          MISE_TASK_SKIP: "//:build"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy-docs:
    name: Deploy Docs Pages
    needs:
      - docs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
