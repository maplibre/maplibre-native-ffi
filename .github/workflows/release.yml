name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Each release checks that its tag is the newest before it publishes, so
# releases run one at a time across every tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source:
    name: Source
    permissions:
      actions: read
      checks: read
      contents: read
    uses: ./.github/workflows/_release-context.yml

  native:
    name: Native
    needs:
      - source
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/_native-package.yml
    with:
      ci_run_url: ${{ needs.source.outputs.ci_run_url }}
      previous_tag: ${{ needs.source.outputs.previous_tag }}
      release: true
      run_id: ${{ needs.source.outputs.run_id }}
      sha: ${{ needs.source.outputs.sha }}
      tag: ${{ github.ref_name }}
      version: ${{ needs.source.outputs.version }}

  # The GitHub release publishes first, so every package of a version refers
  # to native archives that exist.
  kotlin:
    name: Kotlin
    needs:
      - source
      - native
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_kotlin-maven.yml
    with:
      release: true
      run_id: ${{ needs.source.outputs.run_id }}
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}
    secrets: inherit

  dart:
    name: Dart
    needs:
      - source
      - native
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_dart-pub.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      tag: ${{ github.ref_name }}
      version: ${{ needs.source.outputs.version }}

  rust:
    name: Rust
    needs:
      - source
      - native
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_rust-crates.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      tag: ${{ github.ref_name }}
      version: ${{ needs.source.outputs.version }}

  typescript:
    name: TypeScript
    needs:
      - source
      - native
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/_typescript-npm.yml
    with:
      run_id: ${{ needs.source.outputs.run_id }}
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}

  # Go resolves a module in a subdirectory from tags prefixed with its path.
  # The module path carries no major version suffix, so an epoch of 2 or more
  # needs the path to end in /vN first.
  go:
    name: Go
    needs:
      - source
      - native
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.source.outputs.sha }}
          TAG: bindings/go/${{ github.ref_name }}
        # A rerun finds the tag that an earlier attempt created.
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)"
          if [[ "$existing" == "$SHA" ]]; then
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$SHA"

  # The docs quote the latest release, so republish them after it publishes.
  docs:
    name: Docs
    needs:
      - dart
      - go
      - kotlin
      - rust
      - typescript
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run publish-snapshots.yml --repo "$GITHUB_REPOSITORY"
          --ref main -f components=docs
