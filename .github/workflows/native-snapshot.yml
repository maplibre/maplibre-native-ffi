name: Native Snapshot

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: write
    concurrency:
      group: native-snapshot-release
      cancel-in-progress: false
    env:
      CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
      SNAPSHOT_TAG: unstable-native-snapshot
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-*-${{ github.event.workflow_run.head_sha }}
          path: build/packages/native/release
          merge-multiple: true
      - name: Compose release assets
        run: |
          set -euo pipefail

          release_dir="build/packages/native/release"

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          release_dir = Path("build/packages/native/release")
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repository = os.environ["GITHUB_REPOSITORY"]
          snapshot_sha = os.environ["SNAPSHOT_SHA"]

          assets = []
          for path in sorted(release_dir.glob("*.tar.gz")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({
                  "name": path.name,
                  "sha256": digest,
                  "size": path.stat().st_size,
              })

          manifest = {
              "tag": os.environ["SNAPSHOT_TAG"],
              "git_sha": snapshot_sha,
              "commit_url": f"{server_url}/{repository}/commit/{snapshot_sha}",
              "ci_workflow_run_url": os.environ["CI_RUN_URL"],
              "snapshot_workflow_run_url": f"{server_url}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "assets": assets,
          }

          with (release_dir / "maplibre-native-c-snapshot-manifest.json").open("w", encoding="utf-8") as file:
              json.dump(manifest, file, indent=2, sort_keys=True)
              file.write("\n")
          PY

          (
            cd "$release_dir"
            sha256sum -- ./*.tar.gz maplibre-native-c-snapshot-manifest.json > SHA256SUMS
          )
      - name: Publish floating release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_dir="build/packages/native/release"
          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          commit_url="${server_url}/${GITHUB_REPOSITORY}/commit/${SNAPSHOT_SHA}"
          snapshot_run_url="${server_url}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          notes_file="$(mktemp)"

          {
            echo "Unstable native snapshot."
            echo
            echo "Commit: ${commit_url}"
            echo "CI run: ${CI_RUN_URL}"
            echo "Snapshot run: ${snapshot_run_url}"
          } > "$notes_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$SNAPSHOT_SHA" ]]; then
            echo "Skipping snapshot publish because main is now $main_sha"
            exit 0
          fi

          git tag -f "$SNAPSHOT_TAG" "$SNAPSHOT_SHA"
          git push -f origin "refs/tags/$SNAPSHOT_TAG"

          if gh release view "$SNAPSHOT_TAG" >/dev/null 2>&1; then
            gh release edit "$SNAPSHOT_TAG" \
              --title "Native snapshot" \
              --notes-file "$notes_file" \
              --prerelease
          else
            gh release create "$SNAPSHOT_TAG" \
              --title "Native snapshot" \
              --notes-file "$notes_file" \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

          gh release upload "$SNAPSHOT_TAG" "$release_dir"/* --clobber
