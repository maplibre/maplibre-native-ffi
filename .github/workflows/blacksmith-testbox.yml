name: Blacksmith Testbox

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        description: Blacksmith Testbox session ID
        required: true
        type: string

# begin-testbox authenticates with the VM metadata service's sticky disk token.
permissions:
  contents: read

jobs:
  linux:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043 # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      # Matches the broad Linux target job, including source/submodule sync.
      # Covers x64 GNU and musl presets with EGL or Vulkan; ARM64 needs CI's
      # blacksmith-4vcpu-ubuntu-2404-arm runner. Android/OHOS emulators and
      # Emscripten need their target-specific setup-ci-deps inputs and SDKs.
      # FreeBSD presets build here too, and their suites need QEMU and KVM
      # access; see the FreeBSD steps in setup-ci-deps.
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: linux-gnu-x64-egl
          zig: true
          save-toolchains: true
      - name: Preserve the environment for Testbox SSH commands
        shell: bash
        run: |
          # SSH shells read .bashrc before Ubuntu's non-interactive early return.
          # Keep toolchain/setup exports, excluding credentials and step-local state.
          umask 077
          (
            temp_prefix=$RUNNER_TEMP
            path=()
            IFS=: read -ra entries <<< "$PATH"
            for entry in "${entries[@]}"; do
              [[ "$entry" == "$RUNNER_TEMP"* ]] || path+=("$entry")
            done
            PATH="$(IFS=:; echo "${path[*]}")"
            for name in $(compgen -e); do
              case "$name" in
                ACTIONS_*|INPUT_*|RUNNER_*|GITHUB_TOKEN|GITHUB_ENV|GITHUB_PATH|GITHUB_OUTPUT|GITHUB_STATE|GITHUB_STEP_SUMMARY|GITHUB_ACTION*|SSH_*|BASH_ENV|ENV|PWD|OLDPWD|SHLVL|*_TOKEN*|*_SECRET*|*_PASSWORD*|*_KEY*|*_CREDENTIAL*)
                  unset "$name" ;;
                *) [[ "${!name}" != *"${temp_prefix:?}"* ]] || unset "$name" ;;
              esac
            done
            export -p
          ) > ~/.testbox-env
          sed -i '1i [ -f ~/.testbox-env ] && . ~/.testbox-env' ~/.bashrc
      - uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc # v2
