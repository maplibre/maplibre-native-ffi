# Generated by `mise run ci:generate-workflow`. Do not edit directly.
name: CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  variant-linux-x64-vulkan:
    name: variant / linux-x64-vulkan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MISE_ENV: linux-x64-vulkan
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - run: mise run configure
      - run: mise run test
  required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - variant-linux-x64-vulkan
    steps:
      - name: Fail if required jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: 'true'
