name: CI

on:
  push:
    branches: [main, ci-test/opengl-surface-backend]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - run: mise run ci:lint common

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - run: mise run //docs:build

  prepare-matrices:
    name: prepare matrices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.matrix.outputs.native }}
      examples: ${{ steps.matrix.outputs.examples }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - id: matrix
        run: |
          echo "native=$(mise run -q ci:matrix native)" >> "$GITHUB_OUTPUT"
          echo "examples=$(mise run -q ci:matrix examples)" >> "$GITHUB_OUTPUT"

  native:
    name: native / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    needs: prepare-matrices
    timeout-minutes: 60
    env:
      MISE_ENV: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrices.outputs.native) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache MapLibre Native source
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            third_party/maplibre-native
            .git/modules/third_party/maplibre-native
          key: mln-src-v2-${{ hashFiles('.gitmodules', 'cmake/mln_version.cmake') }}
      - uses: ./.github/actions/setup-ci-deps
      - name: Install EGL/GLES2 dev libraries (Linux OpenGL only)
        if: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' }}
        # libegl-dev    — provides /usr/lib/.../libEGL.so (unversioned symlink)
        # libgles-dev   — Ubuntu 24.04 name (was libgles2-dev); depends on
        #                 libglvnd-dev which provides /usr/include/GLES3/*.h
        #                 without a libpng-dev dependency.
        # libgles2      — runtime library, provides libGLESv2.so.2.
        # libgles2-mesa-dev is intentionally omitted: it has a hard Depends:
        # libpng-dev which installs libpng headers newer than pixi's libpng.so,
        # causing a header/ABI mismatch. The cmake find_library call extends
        # CMAKE_FIND_LIBRARY_SUFFIXES to also match .so.2 so the versioned
        # runtime file is accepted for linking.
        # libegl-mesa0      — Mesa's EGL ICD: installs 50_mesa.json into
        #                     /usr/share/glvnd/egl_vendor.d/ and provides
        #                     libEGL_mesa.so.0 (compiled WITH X11 platform
        #                     support). The system GLVND dispatcher (libEGL.so.1)
        #                     loads this ICD when asked for EGL_DEFAULT_DISPLAY.
        # libegl1           — GLVND EGL dispatcher (libEGL.so.1). Already
        #                     present on Ubuntu 24.04 but listed for clarity.
        # xvfb              — Provides Xvfb/xvfb-run so the test process has a
        #                     virtual X11 display to give to eglGetDisplay().
        # libgl1-mesa-dri   — Mesa DRI drivers including swrast/llvmpipe CPU
        #                     rasterizer (often pre-installed; listed for clarity).
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libegl-dev libgles-dev libgles2 libegl-mesa0 libegl1 xvfb libgl1-mesa-dri
      - run: mise run configure
      - run: mise run ci:lint native
      - name: Use system GLVND libEGL for Linux OpenGL tests
        if: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' }}
        # pixi ships conda-forge Mesa's libEGL.so.1 compiled WITHOUT X11 EGL
        # platform support. The built .so has DT_RUNPATH pointing to
        # .pixi/envs/default/lib, so the dynamic linker finds pixi's libEGL.so.1
        # first — making any LD_LIBRARY_PATH workaround ineffective.
        #
        # Solution: replace pixi's libEGL files in-place with symlinks to the
        # system GLVND libEGL. GLVND is a thin dispatcher that:
        #   1. Does NOT require X11 itself.
        #   2. Loads /usr/share/glvnd/egl_vendor.d/50_mesa.json → libEGL_mesa.so.0
        #      which IS compiled with X11 platform support (from libegl-mesa0).
        #   3. With LIBGL_ALWAYS_SOFTWARE=1 + Xvfb, libEGL_mesa.so.0 initializes
        #      using llvmpipe (software renderer), giving a working EGL context.
        #
        # $(uname -m)-linux-gnu resolves to x86_64-linux-gnu or aarch64-linux-gnu.
        run: |
          MULTIARCH="$(uname -m)-linux-gnu"
          SYSTEM_EGL="/usr/lib/$MULTIARCH/libEGL.so.1"
          PIXI_LIB="${{ github.workspace }}/.pixi/envs/default/lib"
          sudo ln -sf "$SYSTEM_EGL" "$PIXI_LIB/libEGL.so.1"
          sudo ln -sf "$SYSTEM_EGL" "$PIXI_LIB/libEGL.so.1.1.0"
          echo "Replaced pixi libEGL with system GLVND: $SYSTEM_EGL"
          ls -la "$PIXI_LIB/libEGL.so.1" "$PIXI_LIB/libEGL.so.1.1.0"
      - name: Diagnose EGL initialization (Linux OpenGL)
        if: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' }}
        # Compile and run a minimal EGL program that mimics what
        # headless_backend_egl.cpp does, so we can see exactly what fails.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_LOG_LEVEL: debug
          MESA_DEBUG: "1"
          LIBGL_DEBUG: verbose
        run: |
          cat > /tmp/egl_probe.c <<'EOF'
          #include <EGL/egl.h>
          #include <stdio.h>
          #include <stdlib.h>
          int main(void) {
              EGLDisplay d = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              printf("eglGetDisplay -> %p (NO_DISPLAY=%p)\n", (void*)d, (void*)EGL_NO_DISPLAY);
              if (d == EGL_NO_DISPLAY) { printf("FAIL: no display, eglGetError=0x%x\n", eglGetError()); return 1; }
              EGLint major=0, minor=0;
              EGLBoolean ok = eglInitialize(d, &major, &minor);
              printf("eglInitialize -> %d (err=0x%x), version %d.%d\n", ok, eglGetError(), major, minor);
              if (!ok) return 2;
              const char* vendor = eglQueryString(d, EGL_VENDOR);
              const char* version = eglQueryString(d, EGL_VERSION);
              const char* exts = eglQueryString(d, EGL_EXTENSIONS);
              printf("vendor: %s\nversion: %s\nextensions: %s\n", vendor, version, exts);
              eglTerminate(d);
              return 0;
          }
          EOF
          MULTIARCH="$(uname -m)-linux-gnu"
          gcc /tmp/egl_probe.c -o /tmp/egl_probe -lEGL
          echo "=== Direct invocation (no xvfb) ==="
          /tmp/egl_probe || echo "exit=$?"
          echo "=== Under xvfb-run ==="
          xvfb-run /tmp/egl_probe || echo "exit=$?"
          echo "=== Under xvfb-run with PIXI_LIB in LD_LIBRARY_PATH ==="
          PIXI_LIB="${{ github.workspace }}/.pixi/envs/default/lib"
          LD_LIBRARY_PATH="$PIXI_LIB:$LD_LIBRARY_PATH" xvfb-run /tmp/egl_probe || echo "exit=$?"
      - name: Run tests (Linux OpenGL — xvfb + system GLVND EGL)
        if: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' }}
        # xvfb-run provides DISPLAY=:nn so eglGetDisplay(EGL_DEFAULT_DISPLAY)
        # connects to the virtual X11 display. LIBGL_ALWAYS_SOFTWARE=1 forces
        # llvmpipe so no real GPU is required. EGL_LOG_LEVEL=debug surfaces
        # any EGL initialization errors on stderr.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_LOG_LEVEL: debug
          MESA_DEBUG: "1"
          LIBGL_DEBUG: verbose
        run: xvfb-run mise run test
      - name: Run tests
        if: ${{ !(contains(matrix.variant, 'opengl') && runner.os == 'Linux') }}
        run: mise run test
      - run: mise run ci:prepare-native-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.variant }}
          path: ci-artifact
          if-no-files-found: error
          retention-days: 14

  native-windows:
    name: native / windows
    uses: ./.github/workflows/native-windows.yml

  examples:
    name: examples / ${{ matrix.example }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    needs:
      - native
      - prepare-matrices
    timeout-minutes: 60
    env:
      MISE_ENV: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrices.outputs.examples) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.variant }}
          path: .
      - run: mise run "${{ matrix.task }}"

  required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - hygiene
      - docs
      - prepare-matrices
      - native
      - native-windows
      - examples
    steps:
      - name: Fail if required jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1

      - run: true
