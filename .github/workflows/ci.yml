      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          project: ${{ matrix.platform-sdk == 'ohos' && 'openharmony' || matrix.platform-sdk == 'android' && 'android' || 'native' }}
          target: ${{ matrix.preset }}
          backend: ${{ matrix.backend }}
          graphics: ${{ matrix.graphics }}
          platform-sdk: ${{ matrix.platform-sdk }}
