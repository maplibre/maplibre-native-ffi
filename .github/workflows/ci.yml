# Generated by `mise run ci:generate-workflow`. Do not edit directly.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          project: hygiene
          target: linux-x64
          backend: vulkan
          graphics: none
          platform-sdk: none
      - run: mise run ci:generate-workflow --check
      - run: mise run format-deps
      - run: mise run //docs:install
      - run: dprint output-resolved-config > /dev/null
      - run: hk fix --all
      - name: Check generated and formatted files
        run: |
          git update-index -q --refresh
          git diff --exit-code -- . ':(exclude)mise.lock'
          git diff --cached --exit-code -- . ':(exclude)mise.lock'

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          project: docs
          target: linux-x64
          backend: vulkan
          graphics: none
          platform-sdk: none
      - run: mise run //docs:build

  native:
    name: native / ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-arm64-egl
            runner: ubuntu-24.04-arm
            backend: opengl
            graphics: software
            platform-sdk: none
            test: true
          - preset: linux-arm64-vulkan
            runner: ubuntu-24.04-arm
            backend: vulkan
            graphics: software
            platform-sdk: none
            test: true
          - preset: linux-x64-egl
            runner: ubuntu-latest
            backend: opengl
            graphics: software
            platform-sdk: none
            test: true
          - preset: linux-x64-vulkan
            runner: ubuntu-latest
            backend: vulkan
            graphics: software
            platform-sdk: none
            test: true
          - preset: macos-arm64-metal
            runner: macos-26
            backend: metal
            graphics: native
            platform-sdk: macos
            test: true
          - preset: macos-arm64-vulkan
            runner: macos-26
            backend: vulkan
            graphics: native
            platform-sdk: macos
            test: true
          - preset: macos-arm64-egl
            runner: macos-26
            backend: opengl
            graphics: angle
            platform-sdk: macos
            test: true
          - preset: ios-arm64-metal
            runner: macos-26
            backend: metal
            graphics: native
            platform-sdk: ios
            test: false
          - preset: ios-simulator-arm64-metal
            runner: macos-26
            backend: metal
            graphics: native
            platform-sdk: ios-simulator
            test: true
          - preset: android-arm64-egl
            runner: ubuntu-latest
            backend: opengl
            graphics: none
            platform-sdk: android
            test: false
          - preset: android-arm64-vulkan
            runner: ubuntu-latest
            backend: vulkan
            graphics: none
            platform-sdk: android
            test: false
          - preset: android-x64-egl
            runner: ubuntu-latest
            backend: opengl
            graphics: none
            platform-sdk: android
            test: false
          - preset: android-x64-vulkan
            runner: ubuntu-latest
            backend: vulkan
            graphics: none
            platform-sdk: android
            test: false
          - preset: ohos-arm64-egl
            runner: ubuntu-latest
            backend: opengl
            graphics: none
            platform-sdk: ohos
            test: false
          - preset: ohos-arm64-vulkan
            runner: ubuntu-latest
            backend: vulkan
            graphics: none
            platform-sdk: ohos
            test: false
          - preset: windows-x64-vulkan
            runner: windows-2022
            backend: vulkan
            graphics: software
            platform-sdk: windows
            test: true
          - preset: windows-x64-wgl
            runner: windows-2022
            backend: wgl
            graphics: software
            platform-sdk: windows
            test: true
          - preset: windows-arm64-vulkan
            runner: windows-11-arm
            backend: vulkan
            graphics: software
            platform-sdk: windows
            test: true
          - preset: windows-arm64-wgl
            runner: windows-11-arm
            backend: wgl
            graphics: software
            platform-sdk: windows
            test: true
