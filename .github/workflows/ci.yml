# Generated by `mise run ci:generate-workflow`. Do not edit directly.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          gradle: false
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - run: mise run ci:generate-workflow --check
      - run: mise run ci:generate-devcontainer-tools --check
      - run: mise run //bindings/kotlin:generate-check
      - run: dprint output-resolved-config > /dev/null
      - run: mise run fix
      - name: Check generated and formatted files
        run: |
          git update-index -q --refresh
          git diff --exit-code -- . ':(exclude)mise.lock'
          git diff --cached --exit-code -- . ':(exclude)mise.lock'

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36
      - run: mise run //docs:build

  target-linux-x64-egl:
    name: target / linux-x64-egl
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
