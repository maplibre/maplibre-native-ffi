name: Publishing

# Snapshots run daily and use the input scopes in `ci/snapshots.toml`. An
# immutable Kotlin source tag publishes that component as one stable release.
on:
  push:
    tags:
      - "bindings/kotlin/v*"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      components:
        description: What to publish
        type: choice
        default: all
        # One entry per `[components.*]` table in ci/snapshots.toml.
        options:
          - all
          - native
          - kotlin
          - python
          - dotnet
          - docs

permissions:
  contents: read

concurrency:
  group: >-
    publishing-${{ startsWith(github.ref, 'refs/tags/bindings/kotlin/v')
    && github.ref || 'snapshots' }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      checks: read
      contents: read
    env:
      # The repository's postinstall hook installs the Git hooks through `hk`,
      # which the jobs that only need Python never acquire.
      MISE_NO_HOOKS: "1"
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
      ci_run_url: ${{ steps.source.outputs.ci_run_url }}
      mode: ${{ steps.source.outputs.mode }}
      kotlin_version: ${{ steps.source.outputs.kotlin_version }}
      snapshot_version: ${{ steps.version.outputs.value }}
      dotnet_snapshot_version: ${{ steps.version.outputs.dotnet }}
      publish_native: ${{ steps.plan.outputs.publish_native }}
      publish_kotlin: ${{ steps.plan.outputs.publish_kotlin }}
      publish_python: ${{ steps.plan.outputs.publish_python }}
      publish_dotnet: ${{ steps.plan.outputs.publish_dotnet }}
      publish_docs: ${{ steps.plan.outputs.publish_docs }}
    steps:
      # The snapshot gate needs history and state tags. A release additionally
      # validates its source tag against the complete Kotlin tag history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: python
      # Publish the exact commit that passed main CI. A dispatch or tag push can
      # overlap CI, so wait for that run instead of selecting an older one.
      - name: Resolve the source CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --quiet --force origin main 'refs/tags/*:refs/tags/*'
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$GITHUB_REF" == refs/tags/bindings/kotlin/v* ]]; then
            mode=kotlin-release
            kotlin_version="$(
              mise run --no-deps //:kotlin:prepare-release validate-tag "$GITHUB_REF_NAME"
            )"
          else
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "snapshots publish only from main; dispatch this workflow on main" >&2
              exit 1
            fi
            mode=snapshot
            kotlin_version=0.1.0-SNAPSHOT
          fi

          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "$source_sha is not an ancestor of main; refusing to publish" >&2
            exit 1
          fi

          runs='[]'
          for attempt in {1..30}; do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow CI \
              --branch main \
              --commit "$source_sha" \
              --event push \
              --limit 1 \
              --json databaseId,url)"

            if jq -e 'length > 0' <<<"$runs" >/dev/null; then
              break
            fi

            if (( attempt < 30 )); then
              sleep 10
            fi
          done

          if [[ "$(jq 'length' <<<"$runs")" -eq 0 ]]; then
            echo "no main CI run appeared for $source_sha within five minutes" >&2
            exit 1
          fi

          run="$(jq '.[0]' <<<"$runs")"
          run_id="$(jq -r '.databaseId' <<<"$run")"
          echo "waiting for CI run $run_id to succeed"
          gh run watch \
            --repo "$GITHUB_REPOSITORY" \
            --compact \
            --exit-status \
            --interval 30 \
            "$run_id"

          {
            echo "sha=$source_sha"
            echo "mode=$mode"
            echo "kotlin_version=$kotlin_version"
            echo "run_id=$run_id"
            echo "ci_run_url=$(jq -r '.url' <<<"$run")"
          } >> "$GITHUB_OUTPUT"
      # `all`, and every scheduled run, applies the gate. Naming one component
      # publishes it whether or not its inputs changed, since republishing an
      # unchanged component is the only reason to name one by hand.
      - name: Plan the publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.source.outputs.mode }}" == kotlin-release ]]; then
            {
              echo "publish_native=false"
              echo "publish_kotlin=true"
              echo "publish_python=false"
              echo "publish_dotnet=false"
              echo "publish_docs=false"
            } >> "$GITHUB_OUTPUT"
          else
            mise run --no-deps ci:snapshot-state plan \
              --components "${{ inputs.components || 'all' }}" \
              --force "${{ inputs.components != '' && inputs.components != 'all' }}"
          fi
      # Minutes, not just the date: a scheduled run and a manual one on the same
      # day would otherwise publish different bytes under one version, and
      # neither pip nor NuGet would see the second as an upgrade. One stamp for
      # both, so a snapshot names the same moment in either ecosystem.
      - name: Date the snapshot version
        id: version
        if: ${{ steps.source.outputs.mode == 'snapshot' }}
        run: |
          stamp="$(date -u +%Y%m%d%H%M)"
          echo "value=0.1.0.dev$stamp" >> "$GITHUB_OUTPUT"
          echo "dotnet=0.1.0-preview.$stamp" >> "$GITHUB_OUTPUT"

  stage-dotnet:
    name: .NET packages
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.plan.outputs.publish_dotnet == 'true' }}
    permissions:
      actions: read
      contents: read
    env:
      # These jobs install dotnet and Python alone, so the root postinstall
      # hook has no hk to run.
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_VERSION: ${{ needs.plan.outputs.dotnet_snapshot_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: core:dotnet python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/dotnet-input
      - run: >-
          mise run --no-deps ci:prepare-dotnet-snapshot package
          build/packages/native/dotnet-input build/packages/dotnet/nupkgs
          "$SNAPSHOT_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-packages-${{ env.SNAPSHOT_SHA }}
          path: build/packages/dotnet/nupkgs/*.nupkg
          if-no-files-found: error
          retention-days: 1

  dotnet-feed:
    name: .NET NuGet feed
    needs:
      - plan
      - stage-dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: core:dotnet python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-packages-${{ env.SNAPSHOT_SHA }}
          path: build/packages/dotnet/nupkgs
      - run: >-
          mise run --no-deps ci:prepare-dotnet-snapshot feed
          build/packages/dotnet/nupkgs build/packages/dotnet/feed
          https://maplibre.github.io/maplibre-native-ffi/nuget/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-nuget-feed-${{ env.SNAPSHOT_SHA }}
          path: build/packages/dotnet/feed
          if-no-files-found: error
          retention-days: 1

  stage-python:
    name: Python wheel / ${{ matrix.backend }}
    needs:
      - plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    if: ${{ needs.plan.outputs.publish_python == 'true' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan
            preset: linux-x64-vulkan
            runner: ubuntu-latest
          - backend: opengl
            preset: linux-x64-egl
            runner: ubuntu-latest
          - backend: metal
            preset: macos-arm64-metal
            runner: macos-26
            macos_deployment_target: "14.3"
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_VERSION: ${{ needs.plan.outputs.snapshot_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.preset }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: native-package-${{ matrix.preset }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/python-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package
          ${{ matrix.preset }}
          build/packages/native/python-input/maplibre-native-c-${{ matrix.preset }}.tar.gz
      # The native artifact is built for macOS 14.3, and maturin derives the
      # wheel's platform tag from this variable. Left unset, the tag would
      # promise older releases a dylib they cannot load.
      - run: mise run //bindings/python:build ${{ matrix.preset }}
        env:
          MISE_TASK_SKIP: "//:build"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      - name: Prepare backend wheel
        shell: bash
        run: |
          set -euo pipefail
          wheels=(target/wheels/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "expected one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          mise run --no-deps ci:prepare-python-snapshot relabel \
            "${wheels[0]}" build/packages/python/wheels \
            "${{ matrix.backend }}" "$SNAPSHOT_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.backend }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/wheels/*.whl
          if-no-files-found: error
          retention-days: 1

  python-index:
    name: Python package index
    needs:
      - plan
      - stage-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-wheel-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/wheels
          merge-multiple: true
      - run: >-
          mise run --no-deps ci:prepare-python-snapshot index
          build/packages/python/wheels build/packages/python/simple
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-simple-index-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/simple
          if-no-files-found: error
          retention-days: 1

  docs-pages:
    name: Docs Pages
    needs:
      - plan
      - python-index
      - dotnet-feed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs whatever became of the staging jobs. Each step below takes its
    # staged output when there is one and mirrors the live one otherwise, so a
    # wheel or package failure degrades this to a publish of the rest instead
    # of blocking it.
    if: >-
      ${{
        always() && needs.plan.result == 'success' &&
        (needs.plan.outputs.publish_docs == 'true' ||
         needs.plan.outputs.publish_python == 'true' ||
         needs.plan.outputs.publish_dotnet == 'true')
      }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: native-package-linux-x64-vulkan-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/docs-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package
          linux-x64-vulkan
          build/packages/native/docs-input/maplibre-native-c-linux-x64-vulkan.tar.gz
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mise run //docs:build
        env:
          MISE_TASK_SKIP: "//:build"
      # Keyed on the index job rather than on the plan: a failed wheel build
      # skips it, and a docs publish should carry the live index forward rather
      # than fail reaching for an artifact that was never uploaded.
      - if: ${{ needs.python-index.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-simple-index-${{ env.SNAPSHOT_SHA }}
          path: docs/dist/simple
      # A docs-only deploy still replaces the whole Pages site, so carry the
      # current feed forward rather than erasing a separately gated component.
      - if: ${{ needs.python-index.result != 'success' }}
        run: >-
          mise run --no-deps ci:prepare-python-snapshot mirror
          https://maplibre.github.io/maplibre-native-ffi/simple/ docs/dist/simple
      # Keyed on the feed job rather than on the plan, for the reason the
      # Python index above is.
      - if: ${{ needs.dotnet-feed.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-nuget-feed-${{ env.SNAPSHOT_SHA }}
          path: docs/dist/nuget
      # Preserve the separately gated NuGet component across a docs-only deploy.
      - if: ${{ needs.dotnet-feed.result != 'success' }}
        run: >-
          mise run --no-deps ci:prepare-dotnet-snapshot mirror
          https://maplibre.github.io/maplibre-native-ffi/nuget/
          docs/dist/nuget
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy-docs:
    name: Deploy Docs Pages
    needs:
      - docs-pages
    # The Pages build preserves live feeds after a package staging failure.
    # This status check lets the resulting artifact deploy in that case.
    if: ${{ !cancelled() && needs.docs-pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  stage-kotlin:
    name: Kotlin Maven staging / ${{ matrix.partition }}
    needs:
      - plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    if: ${{ needs.plan.outputs.publish_kotlin == 'true' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
            native_pattern: native-package-android-*
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
            native_pattern: native-package-*
    env:
      KOTLIN_VERSION: ${{ needs.plan.outputs.kotlin_version }}
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: ${{ matrix.native_pattern }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      # The Linux partition also publishes the linuxX64 KLIBs, which embed the
      # Linux static archives rather than the Android ones.
      - if: ${{ matrix.partition == 'linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-linux-x64-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: >-
          mise run //:kotlin:publish-snapshot stage
          ${{ matrix.partition }} "$KOTLIN_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-maven-staging-${{ matrix.partition }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 1

  verify-kotlin:
    name: Kotlin Maven verification
    needs:
      - plan
      - stage-kotlin
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      KOTLIN_VERSION: ${{ needs.plan.outputs.kotlin_version }}
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kotlin-maven-staging-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging-parts
      - name: Merge Maven staging repositories
        run: >-
          mise run //:kotlin:prepare-release merge
          build/packages/kotlin/maven-staging
          build/packages/kotlin/maven-staging-parts/*
      - run: >-
          mise run //:kotlin:publish-snapshot verify
          build/packages/kotlin/maven-staging "$KOTLIN_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-maven-verified-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging
          if-no-files-found: error
          retention-days: 1

  publish-kotlin-snapshot:
    name: Kotlin Maven snapshot
    needs:
      - plan
      - verify-kotlin
    if: ${{ needs.plan.outputs.mode == 'snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: maven-central
      url: https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/
    permissions:
      actions: read
      contents: read
    env:
      KOTLIN_VERSION: ${{ needs.plan.outputs.kotlin_version }}
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kotlin-maven-verified-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-snapshot
      - name: Sign the verified snapshot repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release sign-snapshot
          build/packages/kotlin/maven-snapshot "$KOTLIN_VERSION"
      - name: Upload the verified snapshot repository
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release upload-snapshot
          build/packages/kotlin/maven-snapshot "$KOTLIN_VERSION"

  release-kotlin:
    name: Kotlin Maven Central release
    needs:
      - plan
      - verify-kotlin
    if: ${{ needs.plan.outputs.mode == 'kotlin-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/deployments
    permissions:
      actions: read
      contents: read
    env:
      KOTLIN_VERSION: ${{ needs.plan.outputs.kotlin_version }}
      MISE_NO_HOOKS: "1"
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kotlin-maven-verified-${{ env.RELEASE_SHA }}
          path: build/packages/kotlin/maven-release
      - name: Revalidate the release tag
        run: |
          set -euo pipefail

          git fetch --quiet --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_sha="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "$GITHUB_REF_NAME moved from $RELEASE_SHA to $tag_sha" >&2
            exit 1
          fi
          mise run --no-deps //:kotlin:prepare-release check-month "$KOTLIN_VERSION"
      - name: Check Maven Central immutability
        run: |
          set -euo pipefail

          artifact="maplibre-native-ffi-${KOTLIN_VERSION}.pom"
          url="https://repo1.maven.org/maven2/org/maplibre/nativeffi/maplibre-native-ffi/${KOTLIN_VERSION}/${artifact}"
          http_code="$(curl --location --silent --show-error --output /dev/null \
            --write-out '%{http_code}' "$url")"
          case "$http_code" in
            404) ;;
            200)
              echo "org.maplibre.nativeffi:maplibre-native-ffi:$KOTLIN_VERSION already exists" >&2
              exit 1
              ;;
            *)
              echo "Maven Central returned HTTP $http_code while checking $url" >&2
              exit 1
              ;;
          esac
      - name: Sign and bundle the release
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release bundle
          build/packages/kotlin/maven-release
          "build/packages/kotlin/maplibre-native-ffi-${KOTLIN_VERSION}.zip"
          "$KOTLIN_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-maven-central-${{ env.KOTLIN_VERSION }}
          path: build/packages/kotlin/maplibre-native-ffi-${{ env.KOTLIN_VERSION }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload and publish the Central deployment
        id: central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          authorization="$(
            printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" \
              | base64 --wrap=0
          )"
          bundle="build/packages/kotlin/maplibre-native-ffi-${KOTLIN_VERSION}.zip"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            --form "bundle=@${bundle};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=kotlin-${KOTLIN_VERSION}&publishingType=AUTOMATIC")"
          if [[ ! "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Central returned an invalid deployment id: $deployment_id" >&2
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

          for attempt in {1..540}; do
            status_json="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer $authorization" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}")"
            deployment_state="$(jq -r '.deploymentState' <<<"$status_json")"
            echo "Central deployment $deployment_id is $deployment_state"
            case "$deployment_state" in
              PUBLISHED)
                {
                  echo "### Kotlin $KOTLIN_VERSION"
                  echo
                  echo "Published Maven Central deployment \`$deployment_id\`."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              FAILED)
                jq '.errors' <<<"$status_json" >&2
                exit 1
                ;;
              PENDING | VALIDATING | VALIDATED | PUBLISHING) ;;
              *)
                echo "Central returned unknown deployment state $deployment_state" >&2
                jq . <<<"$status_json" >&2
                exit 1
                ;;
            esac
            if (( attempt < 540 )); then
              sleep 10
            fi
          done
          echo "Central deployment $deployment_id did not finish within 90 minutes" >&2
          exit 1

  publish:
    name: native package
    needs:
      - plan
    # Every component reads the same CI artifacts and none consumes another's
    # output, so each publishes on its own gate. One failing never holds
    # another back, and the gate already lets them sit at different commits
    # whenever their inputs diverge.
    if: ${{ needs.plan.outputs.publish_native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      CI_RUN_URL: ${{ needs.plan.outputs.ci_run_url }}
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_TAG: unstable-native-snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/release
          merge-multiple: true
      - name: Prepare release assets
        run: >-
          mise run --no-deps ci:prepare-native-package-snapshot
          build/packages/native/release
      - name: Move snapshot tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SNAPSHOT_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" >/dev/null
          fi
      - name: Publish floating release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          target_commitish: ${{ env.SNAPSHOT_SHA }}
          name: Native package snapshot
          body_path: build/packages/native/release/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/packages/native/release/*.tar.gz
            build/packages/native/release/SHA256SUMS

  record:
    name: record
    needs:
      - plan
      - deploy-docs
      - dotnet-feed
      - python-index
      - publish-kotlin-snapshot
      - publish
    # Only components that published get their state tag moved, so a failed or
    # skipped component is retried by the next run.
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: python
      - name: Record published components
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_RESULT: ${{ needs.deploy-docs.result }}
          KOTLIN_RESULT: ${{ needs.publish-kotlin-snapshot.result }}
          NATIVE_RESULT: ${{ needs.publish.result }}
          PUBLISH_DOCS: ${{ needs.plan.outputs.publish_docs }}
          PYTHON_RESULT: ${{ needs.python-index.result }}
          DOTNET_RESULT: ${{ needs.dotnet-feed.result }}
        run: |
          set -euo pipefail

          published=()
          if [[ "$NATIVE_RESULT" == success ]]; then
            published+=(native)
          fi
          if [[ "$KOTLIN_RESULT" == success ]]; then
            published+=(kotlin)
          fi
          if [[ "$PUBLISH_DOCS" == true && "$DOCS_RESULT" == success ]]; then
            published+=(docs)
          fi
          # The deploy alone does not say the wheels made it: docs-pages
          # succeeds by mirroring the live index when staging failed, and
          # recording python then would tell the next run there is nothing to
          # retry.
          if [[ "$PYTHON_RESULT" == success && "$DOCS_RESULT" == success ]]; then
            published+=(python)
          fi
          if [[ "$DOTNET_RESULT" == success && "$DOCS_RESULT" == success ]]; then
            published+=(dotnet)
          fi

          mise run --no-deps ci:snapshot-state record ${published[@]+"${published[@]}"}

  required:
    name: publishing-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A skipped job is the gate doing its work, so only real failures are red.
    if: ${{ always() }}
    needs:
      - plan
      - docs-pages
      - stage-python
      - python-index
      - stage-dotnet
      - dotnet-feed
      - deploy-docs
      - stage-kotlin
      - verify-kotlin
      - publish-kotlin-snapshot
      - release-kotlin
      - publish
      - record
    steps:
      - name: Fail if required jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: "true"
