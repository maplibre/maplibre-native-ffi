name: Blacksmith Testbox macOS

on:
  push:
    branches: [chore/testbox-session-env]
  workflow_dispatch:
    inputs:
      testbox_id:
        description: Blacksmith Testbox session ID
        required: true
        type: string

# begin-testbox authenticates with the VM metadata service's sticky disk token.
permissions:
  contents: read

jobs:
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 120
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      # Untagged main discovers the macOS agent through environment variables.
      - uses: useblacksmith/begin-testbox@cb1bda5e33f1eb981b92debdc126fb87b1cee19e # main
        with:
          testbox_id: ${{ inputs.testbox_id }}
      # Matches CI's macOS ARM64 Metal target setup.
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
          zig: true
          save-toolchains: true
      - name: Preserve the environment for Testbox SSH commands
        shell: bash
        run: |
          # zsh reads .zshenv for non-interactive SSH commands.
          # Keep toolchain/setup exports, excluding credentials and step-local state.
          umask 077
          (
            temp_prefix=$RUNNER_TEMP
            path=()
            IFS=: read -ra entries <<< "$PATH"
            for entry in "${entries[@]}"; do
              [[ "$entry" == "$RUNNER_TEMP"* ]] || path+=("$entry")
            done
            PATH="$(IFS=:; echo "${path[*]}")"
            for name in $(compgen -e); do
              case "$name" in
                ACTIONS_*|INPUT_*|RUNNER_*|GITHUB_TOKEN|GITHUB_ENV|GITHUB_PATH|GITHUB_OUTPUT|GITHUB_STATE|GITHUB_STEP_SUMMARY|GITHUB_ACTION*|SSH_*|BASH_ENV|ENV|PWD|OLDPWD|SHLVL|*_TOKEN*|*_SECRET*|*_PASSWORD*|*_KEY*|*_CREDENTIAL*)
                  unset "$name" ;;
                *) [[ "${!name}" != *"${temp_prefix:?}"* ]] || unset "$name" ;;
              esac
            done
            export -p
          ) > ~/.testbox-env
          for startup in ~/.zshenv ~/.bashrc; do
            touch "$startup"
            { echo '[ -f ~/.testbox-env ] && . ~/.testbox-env'; cat "$startup"; } > "$startup.new"
            mv "$startup.new" "$startup"
          done
      # Untagged main pairs with the macOS-aware begin-testbox handshake.
      - uses: useblacksmith/run-testbox@3f60ff9ceb2c10c3feefa87dc0c6490cffae059d # main
