name: Publish snapshots
# A scheduled run has no inputs, so it names the full gated set it publishes.
run-name: Snapshots · ${{ inputs.components || 'all' }}
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      components:
        description: What to publish
        type: choice
        default: all
        # One entry per `[components.*]` table in ci/snapshots.toml.
        options:
          - all
          - native
          - kotlin
          - python
          - dotnet
          - docs

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"

concurrency:
  group: publishing-snapshots
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
      ci_run_url: ${{ steps.source.outputs.ci_run_url }}
      kotlin_version: ${{ steps.version.outputs.kotlin }}
      native_snapshot_version: ${{ steps.version.outputs.native }}
      snapshot_version: ${{ steps.version.outputs.value }}
      dotnet_snapshot_version: ${{ steps.version.outputs.dotnet }}
      publish_native: ${{ steps.plan.outputs.publish_native }}
      publish_kotlin: ${{ steps.plan.outputs.publish_kotlin }}
      publish_python: ${{ steps.plan.outputs.publish_python }}
      publish_dotnet: ${{ steps.plan.outputs.publish_dotnet }}
      publish_docs: ${{ steps.plan.outputs.publish_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          install_args: python
      # Publish the exact commit that passed main CI. A dispatch can overlap CI,
      # so wait for that run instead of selecting an older one.
      - name: Resolve the snapshot CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "snapshots publish only from main; dispatch this workflow on main" >&2
            exit 1
          fi

          git fetch --quiet --force origin main 'refs/tags/*:refs/tags/*'
          source_sha="$(git rev-parse 'HEAD^{commit}')"

          run="$(mise run --no-deps ci:resolve-publish-run "$source_sha")"

          {
            echo "sha=$source_sha"
            echo "run_id=$(jq -r '.run_id' <<<"$run")"
            echo "ci_run_url=$(jq -r '.url' <<<"$run")"
          } >> "$GITHUB_OUTPUT"
      # Naming one component forces it; `all` publishes only changed scopes.
      - name: Plan the publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run --no-deps ci:snapshot-state plan
          --components "${{ inputs.components || 'all' }}"
          --force "${{ inputs.components != '' && inputs.components != 'all' }}"
      # Minutes distinguish repeated runs on one day for pip and NuGet.
      - name: Date the snapshot version
        id: version
        run: |
          stamp="$(date -u +%Y%m%d%H%M)"
          {
            echo "value=0.1.0.dev$stamp"
            echo "dotnet=0.1.0-preview.$stamp"
            echo "kotlin=0.1.0-SNAPSHOT"
            echo "native=0.0.0-dev.$stamp"
          } >> "$GITHUB_OUTPUT"

  stage-dotnet:
    name: .NET packages
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.plan.outputs.publish_dotnet == 'true' }}
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_VERSION: ${{ needs.plan.outputs.dotnet_snapshot_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          install_args: core:dotnet python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/dotnet-input
      - run: >-
          mise run --no-deps ci:prepare-dotnet-snapshot package
          build/packages/native/dotnet-input build/packages/dotnet/nupkgs
          "$SNAPSHOT_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-packages-${{ env.SNAPSHOT_SHA }}
          path: build/packages/dotnet/nupkgs/*.nupkg
          if-no-files-found: error
          retention-days: 1

  dotnet-feed:
    name: .NET NuGet feed
    needs:
      - plan
      - stage-dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          install_args: core:dotnet python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-packages-${{ env.SNAPSHOT_SHA }}
          path: build/packages/dotnet/nupkgs
      - run: >-
          mise run --no-deps ci:prepare-dotnet-snapshot feed
          build/packages/dotnet/nupkgs build/packages/dotnet/feed
          https://maplibre.github.io/maplibre-native-ffi/nuget/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-nuget-feed-${{ env.SNAPSHOT_SHA }}
          path: build/packages/dotnet/feed
          if-no-files-found: error
          retention-days: 1

  stage-python:
    name: Python wheel / ${{ matrix.backend }}
    needs:
      - plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    if: ${{ needs.plan.outputs.publish_python == 'true' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan
            preset: linux-gnu-x64-vulkan
            runner: ubuntu-latest
          - backend: opengl
            preset: linux-gnu-x64-egl
            runner: ubuntu-latest
          - backend: metal
            preset: macos-arm64-metal
            runner: macos-26
            macos_deployment_target: "14.3"
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_VERSION: ${{ needs.plan.outputs.snapshot_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.preset }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: native-package-${{ matrix.preset }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/python-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package
          ${{ matrix.preset }}
          build/packages/native/python-input/maplibre-native-c-${{ matrix.preset }}.tar.gz
      # The native artifact is built for macOS 14.3, and maturin derives the
      # wheel's platform tag from this variable. Left unset, the tag would
      # promise older releases a dylib they cannot load.
      - run: mise run //bindings/python:build ${{ matrix.preset }}
        env:
          MISE_TASK_SKIP: "//:build"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      - name: Prepare backend wheel
        shell: bash
        run: |
          set -euo pipefail
          wheels=(target/wheels/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "expected one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          mise run --no-deps ci:prepare-python-snapshot relabel \
            "${wheels[0]}" build/packages/python/wheels \
            "${{ matrix.backend }}" "$SNAPSHOT_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.backend }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/wheels/*.whl
          if-no-files-found: error
          retention-days: 1

  python-index:
    name: Python package index
    needs:
      - plan
      - stage-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-wheel-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/wheels
          merge-multiple: true
      - run: >-
          mise run --no-deps ci:prepare-python-snapshot index
          build/packages/python/wheels build/packages/python/simple
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-simple-index-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/simple
          if-no-files-found: error
          retention-days: 1

  docs-pages:
    name: Docs Pages
    needs:
      - plan
      - python-index
      - dotnet-feed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Preserve live feeds when either package staging job fails.
    if: >-
      ${{
        always() && needs.plan.result == 'success' &&
        (needs.plan.outputs.publish_docs == 'true' ||
         needs.plan.outputs.publish_python == 'true' ||
         needs.plan.outputs.publish_dotnet == 'true')
      }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: native-package-linux-gnu-x64-vulkan-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/docs-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package
          linux-gnu-x64-vulkan
          build/packages/native/docs-input/maplibre-native-c-linux-gnu-x64-vulkan.tar.gz
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mise run //docs:build
        env:
          MISE_TASK_SKIP: "//:build"
      - if: ${{ needs.python-index.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-simple-index-${{ env.SNAPSHOT_SHA }}
          path: docs/dist/simple
      - if: ${{ needs.python-index.result != 'success' }}
        run: >-
          mise run --no-deps ci:prepare-python-snapshot mirror
          https://maplibre.github.io/maplibre-native-ffi/simple/ docs/dist/simple
      - if: ${{ needs.dotnet-feed.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-nuget-feed-${{ env.SNAPSHOT_SHA }}
          path: docs/dist/nuget
      - if: ${{ needs.dotnet-feed.result != 'success' }}
        run: >-
          mise run --no-deps ci:prepare-dotnet-snapshot mirror
          https://maplibre.github.io/maplibre-native-ffi/nuget/
          docs/dist/nuget
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy-docs:
    name: Deploy Docs Pages
    needs:
      - docs-pages
    # Deploy a site that preserved a failed package feed.
    if: ${{ !cancelled() && needs.docs-pages.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  publish-kotlin:
    name: Kotlin snapshot
    needs:
      - plan
    if: ${{ needs.plan.outputs.publish_kotlin == 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_kotlin-maven.yml
    with:
      run_id: ${{ needs.plan.outputs.run_id }}
      sha: ${{ needs.plan.outputs.sha }}
      # The CI run already staged and verified this commit at the snapshot
      # version, so this publish reuses its verified repository.
      verified_run_id: ${{ needs.plan.outputs.run_id }}
      version: ${{ needs.plan.outputs.kotlin_version }}
    secrets: inherit

  publish-native:
    name: Native snapshot
    needs:
      - plan
    if: ${{ needs.plan.outputs.publish_native == 'true' }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/_native-package.yml
    with:
      ci_run_url: ${{ needs.plan.outputs.ci_run_url }}
      run_id: ${{ needs.plan.outputs.run_id }}
      sha: ${{ needs.plan.outputs.sha }}
      tag: unstable-native-snapshot
      version: ${{ needs.plan.outputs.native_snapshot_version }}

  record:
    name: record
    needs:
      - plan
      - deploy-docs
      - dotnet-feed
      - python-index
      - publish-kotlin
      - publish-native
    # Only components that published get their state tag moved, so a failed or
    # skipped component is retried by the next run.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          install_args: python
      - name: Record published components
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_RESULT: ${{ needs.deploy-docs.result }}
          KOTLIN_RESULT: ${{ needs.publish-kotlin.result }}
          NATIVE_RESULT: ${{ needs.publish-native.result }}
          PUBLISH_DOCS: ${{ needs.plan.outputs.publish_docs }}
          PYTHON_RESULT: ${{ needs.python-index.result }}
          DOTNET_RESULT: ${{ needs.dotnet-feed.result }}
        run: |
          set -euo pipefail

          published=()
          if [[ "$NATIVE_RESULT" == success ]]; then
            published+=(native)
          fi
          if [[ "$KOTLIN_RESULT" == success ]]; then
            published+=(kotlin)
          fi
          if [[ "$PUBLISH_DOCS" == true && "$DOCS_RESULT" == success ]]; then
            published+=(docs)
          fi
          # Record feeds only when both staging and Pages succeeded.
          if [[ "$PYTHON_RESULT" == success && "$DOCS_RESULT" == success ]]; then
            published+=(python)
          fi
          if [[ "$DOTNET_RESULT" == success && "$DOCS_RESULT" == success ]]; then
            published+=(dotnet)
          fi

          mise run --no-deps ci:snapshot-state record ${published[@]+"${published[@]}"}

  required:
    name: publishing-required
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # A skipped job is the gate doing its work, so only real failures are red.
    if: ${{ always() }}
    needs:
      - plan
      - docs-pages
      - stage-python
      - python-index
      - stage-dotnet
      - dotnet-feed
      - deploy-docs
      - publish-kotlin
      - publish-native
      - record
    steps:
      - name: Fail if required jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.record.result != 'success' }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: "true"
