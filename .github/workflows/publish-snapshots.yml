name: Publish snapshots
# The plan job finds the last full publish by this exact title, so a docs-only
# run never counts as one.
run-name: ${{ inputs.docs_only && 'Snapshots · docs' || 'Snapshots' }}
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      docs_only:
        description: Republish only the docs site
        type: boolean
        default: false

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"

concurrency:
  group: publishing-snapshots
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 240
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
      ci_run_url: ${{ steps.source.outputs.ci_run_url }}
      kotlin_version: ${{ steps.version.outputs.kotlin }}
      native_snapshot_version: ${{ steps.version.outputs.native }}
      snapshot_version: ${{ steps.version.outputs.value }}
      dotnet_snapshot_version: ${{ steps.version.outputs.dotnet }}
      publish_docs: ${{ steps.decide.outputs.docs }}
      publish_packages: ${{ steps.decide.outputs.packages }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
          install_args: python
      # A scheduled run skips a commit that a full publish already used, so it
      # publishes only when main moved. A dispatch always publishes.
      - name: Decide what to publish
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_ONLY: ${{ inputs.docs_only || false }}
        run: |
          set -euo pipefail

          docs=true
          packages=true
          if [[ "$DOCS_ONLY" == true ]]; then
            packages=false
          fi
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            published="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow publish-snapshots.yml \
              --branch main \
              --status success \
              --limit 50 \
              --json headSha,displayTitle \
              --jq '[.[] | select(.displayTitle == "Snapshots")][0].headSha // ""')"
            if [[ "$published" == "$GITHUB_SHA" ]]; then
              echo "a full publish already used $GITHUB_SHA; skipping"
              docs=false
              packages=false
            fi
          fi

          {
            echo "docs=$docs"
            echo "packages=$packages"
          } >> "$GITHUB_OUTPUT"
      # Publish the exact commit that passed main CI. A dispatch can overlap CI,
      # so wait for that run instead of selecting an older one.
      - name: Resolve the snapshot CI run
        id: source
        if: ${{ steps.decide.outputs.docs == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "snapshots publish only from main; dispatch this workflow on main" >&2
            exit 1
          fi

          git fetch --quiet --force origin main 'refs/tags/*:refs/tags/*'
          source_sha="$(git rev-parse 'HEAD^{commit}')"

          run="$(mise run --no-deps ci:resolve-publish-run "$source_sha")"

          {
            echo "sha=$source_sha"
            echo "run_id=$(jq -r '.run_id' <<<"$run")"
            echo "ci_run_url=$(jq -r '.url' <<<"$run")"
          } >> "$GITHUB_OUTPUT"
      # Minutes distinguish repeated runs on one day for pip and NuGet. The
      # base is the next release, so a version built on it sorts above every
      # release.
      - name: Date the snapshot version
        id: version
        if: ${{ steps.decide.outputs.docs == 'true' }}
        run: |
          set -euo pipefail
          base="$(mise run --no-deps ci:release-version --next)"
          stamp="$(date -u +%Y%m%d%H%M)"
          {
            echo "base=$base"
            echo "value=0.1.0.dev$stamp"
            echo "dotnet=$base-dev.$stamp"
            echo "kotlin=0.1.0-SNAPSHOT"
            echo "native=0.0.0-dev.$stamp"
          } >> "$GITHUB_OUTPUT"

  stage-python:
    name: Python wheel / ${{ matrix.backend }}
    needs:
      - plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    if: ${{ needs.plan.outputs.publish_packages == 'true' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan
            preset: linux-gnu-x64-vulkan
            runner: blacksmith-4vcpu-ubuntu-2404
          - backend: opengl
            preset: linux-gnu-x64-egl
            runner: blacksmith-4vcpu-ubuntu-2404
          - backend: metal
            preset: macos-arm64-metal
            runner: blacksmith-6vcpu-macos-26
            macos_deployment_target: "14.3"
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_VERSION: ${{ needs.plan.outputs.snapshot_version }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.preset }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: native-package-${{ matrix.preset }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/python-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package ${{ matrix.preset }}
          build/packages/native/python-input/maplibre-native-c-${{ matrix.preset
          }}.tar.gz
      # The native artifact is built for macOS 14.3, and maturin derives the
      # wheel's platform tag from this variable. Left unset, the tag would
      # promise older releases a dylib they cannot load.
      - run: mise run //bindings/python:build ${{ matrix.preset }}
        env:
          MISE_TASK_SKIP: "//:build"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      - name: Prepare backend wheel
        shell: bash
        run: |
          set -euo pipefail
          wheels=(target/wheels/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "expected one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          mise run --no-deps ci:prepare-python-snapshot relabel \
            "${wheels[0]}" build/packages/python/wheels \
            "${{ matrix.backend }}" "$SNAPSHOT_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.backend }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/wheels/*.whl
          if-no-files-found: error
          retention-days: 1

  python-index:
    name: Python package index
    needs:
      - plan
      - stage-python
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-wheel-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/wheels
          merge-multiple: true
      - run: >-
          mise run --no-deps ci:prepare-python-snapshot index
          build/packages/python/wheels build/packages/python/simple
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-simple-index-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/simple
          if-no-files-found: error
          retention-days: 1

  docs-pages:
    name: Docs Pages
    needs:
      - plan
      - python-index
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    # Preserve the live Python index when its staging fails.
    if: >-
      ${{
        always() && needs.plan.result == 'success' &&
        needs.plan.outputs.publish_docs == 'true'
      }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      # The pages quote the latest release version from the release tags. A
      # checkout of a commit SHA skips tags even with `fetch-tags`.
      - name: Fetch the release tags
        run: git fetch --quiet --depth=1 origin 'refs/tags/*:refs/tags/*'
      - uses: ./.github/actions/setup-ci-deps
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: native-package-linux-gnu-x64-vulkan-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/docs-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package linux-gnu-x64-vulkan
          build/packages/native/docs-input/maplibre-native-c-linux-gnu-x64-vulkan.tar.gz
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mise run //docs:build
        env:
          MISE_TASK_SKIP: "//:build"
      - if: ${{ needs.python-index.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-simple-index-${{ env.SNAPSHOT_SHA }}
          path: docs/dist/simple
      - if: ${{ needs.python-index.result != 'success' }}
        run: >-
          mise run --no-deps ci:prepare-python-snapshot mirror
          https://maplibre.github.io/maplibre-native-ffi/simple/
          docs/dist/simple
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy-docs:
    name: Deploy Docs Pages
    needs:
      - docs-pages
    # Deploy a site that preserved a failed Python index.
    if: ${{ !cancelled() && needs.docs-pages.result == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish-kotlin:
    name: Kotlin snapshot
    needs:
      - plan
    if: ${{ needs.plan.outputs.publish_packages == 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_kotlin-maven.yml
    with:
      run_id: ${{ needs.plan.outputs.run_id }}
      sha: ${{ needs.plan.outputs.sha }}
      # The CI run already staged and verified this commit at the snapshot
      # version, so this publish reuses its verified repository.
      verified_run_id: ${{ needs.plan.outputs.run_id }}
      version: ${{ needs.plan.outputs.kotlin_version }}
    secrets: inherit

  publish-native:
    name: Native snapshot
    needs:
      - plan
    if: ${{ needs.plan.outputs.publish_packages == 'true' }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/_native-package.yml
    with:
      ci_run_url: ${{ needs.plan.outputs.ci_run_url }}
      run_id: ${{ needs.plan.outputs.run_id }}
      sha: ${{ needs.plan.outputs.sha }}
      tag: unstable-native-snapshot
      version: ${{ needs.plan.outputs.native_snapshot_version }}

  publish-dotnet:
    name: .NET snapshot
    needs:
      - plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    if: ${{ needs.plan.outputs.publish_packages == 'true' }}
    permissions:
      actions: read
      contents: write
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_VERSION: ${{ needs.plan.outputs.dotnet_snapshot_version }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
          install_args: core:dotnet python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/dotnet-input
      - run: >-
          mise run --no-deps ci:pack-dotnet build/packages/native/dotnet-input
          build/packages/dotnet/nupkgs "$SNAPSHOT_VERSION"
      - name: Replace the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run --no-deps ci:replace-snapshot-packages '*.nupkg'
          build/packages/dotnet/nupkgs/*.nupkg

  required:
    name: publishing-required
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    # A skipped job is the gate doing its work, so only real failures are red.
    if: ${{ always() }}
    needs:
      - plan
      - docs-pages
      - stage-python
      - python-index
      - publish-dotnet
      - deploy-docs
      - publish-kotlin
      - publish-native
    steps:
      - name: Fail if required jobs failed
        if:
          ${{ contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: "true"
