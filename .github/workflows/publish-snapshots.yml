name: Publish snapshots
run-name: Snapshots
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"

concurrency:
  group: publishing-snapshots
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 240
    permissions:
      actions: write
      checks: read
      contents: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
      ci_run_url: ${{ steps.source.outputs.ci_run_url }}
      kotlin_version: ${{ steps.version.outputs.kotlin }}
      native_snapshot_version: ${{ steps.version.outputs.native }}
      python_snapshot_version: ${{ steps.version.outputs.python }}
      dotnet_snapshot_version: ${{ steps.version.outputs.dotnet }}
      publish_packages: ${{ steps.decide.outputs.packages }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python
      # A scheduled run skips a commit that a full publish already used, so it
      # publishes only when main moved. A dispatch always publishes.
      - name: Decide what to publish
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          packages=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            published="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow publish-snapshots.yml \
              --branch main \
              --status success \
              --limit 50 \
              --json headSha,displayTitle \
              --jq '[.[] | select(.displayTitle == "Snapshots")][0].headSha // ""')"
            if [[ "$published" == "$GITHUB_SHA" ]]; then
              echo "a full publish already used $GITHUB_SHA; skipping"
              packages=false
            fi
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      # Publish the exact commit that passed main CI. A dispatch can overlap CI,
      # so wait for that run instead of selecting an older one.
      - name: Resolve the snapshot CI run
        id: source
        if: ${{ steps.decide.outputs.packages == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "snapshots publish only from main; dispatch this workflow on main" >&2
            exit 1
          fi

          git fetch --quiet --force origin main 'refs/tags/*:refs/tags/*'
          source_sha="$(git rev-parse 'HEAD^{commit}')"

          run="$(mise run --no-deps ci:resolve-publish-run "$source_sha")"

          {
            echo "sha=$source_sha"
            echo "run_id=$(jq -r '.run_id' <<<"$run")"
            echo "ci_run_url=$(jq -r '.url' <<<"$run")"
          } >> "$GITHUB_OUTPUT"
      # Minutes distinguish repeated runs on one day for pip and NuGet. The
      # base is the next release, so a version built on it sorts above every
      # release.
      - name: Date the snapshot version
        id: version
        if: ${{ steps.decide.outputs.packages == 'true' }}
        run: |
          set -euo pipefail
          base="$(mise run --no-deps ci:release-version --next)"
          stamp="$(date -u +%Y%m%d%H%M)"
          {
            echo "base=$base"
            echo "python=$base.dev$stamp"
            echo "dotnet=$base-dev.$stamp"
            echo "kotlin=0.1.0-SNAPSHOT"
            echo "native=0.0.0-dev.$stamp"
          } >> "$GITHUB_OUTPUT"

  # The CI run already staged and verified this commit at the snapshot version,
  # so this publish reuses its verified repository.
  publish-kotlin:
    name: Kotlin snapshot
    needs:
      - plan
    if: ${{ needs.plan.outputs.publish_packages == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    environment:
      name: maven-central
      url: https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/
    permissions:
      actions: read
      contents: read
    env:
      KOTLIN_VERSION: ${{ needs.plan.outputs.kotlin_version }}
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: kotlin-maven-verified-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven
      - name: Sign the snapshot
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release sign-snapshot
          build/packages/kotlin/maven "$KOTLIN_VERSION"
      - name: Upload the snapshot
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release upload-snapshot
          build/packages/kotlin/maven "$KOTLIN_VERSION"

  publish-native:
    name: Native snapshot
    needs:
      - plan
    if: ${{ needs.plan.outputs.publish_packages == 'true' }}
    # The reusable workflow needs these permissions even when attestation skips.
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/_native-package.yml
    with:
      ci_run_url: ${{ needs.plan.outputs.ci_run_url }}
      run_id: ${{ needs.plan.outputs.run_id }}
      sha: ${{ needs.plan.outputs.sha }}
      tag: unstable-native-snapshot
      version: ${{ needs.plan.outputs.native_snapshot_version }}

  dotnet-nuget:
    name: package / nuget
    needs:
      - plan
    if: ${{ needs.plan.outputs.publish_packages == 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_dotnet-nuget.yml
    with:
      run_id: ${{ needs.plan.outputs.run_id }}
      sha: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.dotnet_snapshot_version }}

  publish-dotnet:
    name: .NET snapshot
    needs:
      - plan
      - dotnet-nuget
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-nupkgs-${{ env.SNAPSHOT_SHA }}
          path: build/packages/dotnet/nupkgs
      - name: Replace the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run --no-deps ci:replace-snapshot-packages '*.nupkg'
          build/packages/dotnet/nupkgs/*.nupkg

  python-wheels:
    name: package / pypi
    needs:
      - plan
    if: ${{ needs.plan.outputs.publish_packages == 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_python-wheels.yml
    with:
      run_id: ${{ needs.plan.outputs.run_id }}
      sha: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.python_snapshot_version }}

  publish-python:
    name: Python snapshot
    needs:
      - plan
      - python-wheels
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-wheel-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/wheels
          merge-multiple: true
      - name: Replace the wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run --no-deps ci:replace-snapshot-packages '*.whl'
          build/packages/python/wheels/*.whl

  required:
    name: publishing-required
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    # A skipped job is the gate doing its work, so only real failures are red.
    if: ${{ always() }}
    needs:
      - plan
      - python-wheels
      - publish-python
      - dotnet-nuget
      - publish-dotnet
      - publish-kotlin
      - publish-native
    steps:
      - name: Fail if required jobs failed
        if:
          ${{ contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: "true"
