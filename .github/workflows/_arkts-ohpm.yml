name: "↳ ArkTS OHPM"

on:
  workflow_call:
    inputs:
      run_id:
        description: CI run that built the addons
        required: true
        type: string
      sha:
        description: Source commit named by the release tag
        required: true
        type: string
      version:
        description: Package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: OHPM publish
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    # OHPM has no trusted publishing. The environment holds the publish ID and
    # the encrypted private key whose public half the publishing account lists,
    # with its passphrase.
    environment:
      name: ohpm
      url: https://ohpm.openharmony.cn/#/en/detail/@maplibre%2Fnative-ffi-opengl
    permissions:
      actions: read
      contents: read
    env:
      MISE_NO_HOOKS: "1"
      PUBLISH_SHA: ${{ inputs.sha }}
      PUBLISH_VERSION: ${{ inputs.version }}
      # The official ohpm ships only in Huawei's command-line tools, which this
      # mirror serves without a login.
      OHPM_TOOLS_URL: https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip
      OHPM_TOOLS_SHA256: 1dcefa4741dc289277560b2802040e0c45b433898d8db453d711d5376e0478f1
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: core:node aqua:pnpm/pnpm
      # Each OpenHarmony job of the tagged commit's CI run built its addon
      # against the native archive that the release publishes.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: arkts-addon-*-${{ inputs.sha }}
          path: build/arkts-addons
      - name: Pack the packages
        run: |
          set -euo pipefail

          shopt -s nullglob
          mise deps pnpm
          presets=()
          for artifact in build/arkts-addons/*; do
            preset="${artifact#build/arkts-addons/arkts-addon-}"
            preset="${preset%-"$PUBLISH_SHA"}"
            mkdir -p "bindings/typescript/native/build/$preset"
            mv "$artifact" "bindings/typescript/native/build/$preset/install"
            presets+=("$preset")
          done
          mise exec --no-deps core:node -- bindings/typescript/scripts/pack-ohpm.sh \
            --version "$PUBLISH_VERSION" build/ohpm "${presets[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ohpm-packages-${{ inputs.version }}
          path: build/ohpm/*.har
          if-no-files-found: error
          overwrite: true
      - name: Install ohpm
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tools.zip" "$OHPM_TOOLS_URL"
          echo "$OHPM_TOOLS_SHA256  $RUNNER_TEMP/tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/tools.zip" 'command-line-tools/ohpm/*' -d "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/tools.zip"
          echo "$RUNNER_TEMP/command-line-tools/ohpm/bin" >> "$GITHUB_PATH"
      # ohpm checks each package as the registry will before any of them
      # publishes. A version that OHPM already lists is skipped, so a rerun
      # after a partial publish resumes where it stopped.
      - name: Publish
        env:
          OHPM_PUBLISH_ID: ${{ secrets.OHPM_PUBLISH_ID }}
          OHPM_PRIVATE_KEY: ${{ secrets.OHPM_PRIVATE_KEY }}
          OHPM_KEY_PASSPHRASE: ${{ secrets.OHPM_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          for har in build/ohpm/*.har; do
            mise exec --no-deps core:node -- ohpm prepublish "$har"
          done
          mise exec --no-deps core:node -- python3 ci/ohpm_publish.py ohpm build/ohpm/*.har
          for har in build/ohpm/*.har; do
            echo "### $(basename "$har" .har) awaits OHPM's review" >> "$GITHUB_STEP_SUMMARY"
          done
