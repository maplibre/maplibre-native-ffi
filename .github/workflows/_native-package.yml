name: "↳ Native package"

on:
  workflow_call:
    inputs:
      ci_run_url:
        description: URL of the successful main CI run
        required: true
        type: string
      previous_tag:
        description: Previous release tag, linked from the release notes
        default: ""
        required: false
        type: string
      run_id:
        description: CI run that produced the native packages
        required: true
        type: string
      sha:
        description: Source commit and artifact suffix
        required: true
        type: string
      tag:
        description: GitHub release tag
        required: true
        type: string
      version:
        description: Version written into the native packages
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Native package
    runs-on: blacksmith-6vcpu-macos-26
    environment: apple-sdk
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      CI_RUN_URL: ${{ inputs.ci_run_url }}
      MISE_NO_HOOKS: "1"
      PUBLISH_SHA: ${{ inputs.sha }}
      PUBLISH_TAG: ${{ inputs.tag }}
      PUBLISH_VERSION: ${{ inputs.version }}
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2
        with:
          ref: ${{ env.PUBLISH_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          # Zig hashes each archive for the Zig package's manifest.
          install_args: core:zig python
      - name: Refuse an existing published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          status=0
          output="$(
            gh release view "$PUBLISH_TAG" --json isDraft --jq .isDraft 2>&1
          )" || status=$?
          if [[ "$status" -eq 0 ]]; then
            if [[ "$output" == false ]]; then
              echo "GitHub release $PUBLISH_TAG is already published" >&2
              exit 1
            fi
          elif [[ "$output" != "release not found" ]]; then
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: native-package-*-${{ env.PUBLISH_SHA }}
          path: build/packages/native/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: native-xcframework-${{ env.PUBLISH_SHA }}
          path: build/packages/native/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: gobject-package-*-${{ env.PUBLISH_SHA }}
          path: build/packages/native/release
          merge-multiple: true
      # The release notes are the tag's message, so the tag object must be
      # local, not only the commit it names.
      - name: Fetch the release tag
        run: >-
          git fetch --quiet --force origin
          "refs/tags/${PUBLISH_TAG}:refs/tags/${PUBLISH_TAG}"
      - name: Prepare assets
        env:
          APPLE_SDK_TEAM_ID: ${{ vars.APPLE_SDK_TEAM_ID }}
          APPLE_SDK_CERTIFICATE_BASE64:
            ${{ secrets.APPLE_SDK_CERTIFICATE_BASE64 }}
          APPLE_SDK_CERTIFICATE_PASSWORD:
            ${{ secrets.APPLE_SDK_CERTIFICATE_PASSWORD }}
          PUBLISH_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: >-
          mise run --no-deps ci:prepare-native-package
          build/packages/native/release "$PUBLISH_VERSION" --sign-apple-sdk
      # The Go module proxy redirects to these files, so they join the release
      # before it publishes and becomes immutable.
      - name: Prepare the Go preset modules
        run: >-
          mise run --no-deps go-native:release build/packages/native/release
          "$PUBLISH_TAG" "$PUBLISH_SHA"
      - name: Attest the release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/packages/native/release/*.tar.gz
            build/packages/native/release/*.cdx.json
            build/packages/native/release/MaplibreNativeC.xcframework.zip
            build/packages/native/release/*.artifactbundle.zip
            build/packages/native/release/maplibre-native-c-artifacts.json
            build/packages/native/release/go-native-*
            build/packages/native/release/SHA256SUMS
      # A tagged release remains a draft until every uploaded asset is verified.
      - name: Upload the release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.sha }}
          name: ${{ inputs.tag }}
          body_path: build/packages/native/release/RELEASE_NOTES.md
          draft: true
          prerelease: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            build/packages/native/release/*.tar.gz
            build/packages/native/release/*.cdx.json
            build/packages/native/release/MaplibreNativeC.xcframework.zip
            build/packages/native/release/*.artifactbundle.zip
            build/packages/native/release/maplibre-native-c-artifacts.json
            build/packages/native/release/go-native-*
      - name: Upload the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$PUBLISH_TAG"
          build/packages/native/release/SHA256SUMS --clobber
      - name: Verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(
            gh release view "$PUBLISH_TAG" \
              --json assets,isDraft,isPrerelease,tagName
          )"
          jq -e --arg tag "$PUBLISH_TAG" \
            '.isDraft and (.isPrerelease | not) and .tagName == $tag' \
            <<<"$release" >/dev/null

          assets=(build/packages/native/release/*.tar.gz build/packages/native/release/*.cdx.json)
          assets+=(build/packages/native/release/MaplibreNativeC.xcframework.zip)
          assets+=(build/packages/native/release/*.artifactbundle.zip)
          assets+=(build/packages/native/release/maplibre-native-c-artifacts.json)
          assets+=(build/packages/native/release/go-native-*)
          assets+=(build/packages/native/release/SHA256SUMS)

          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            local_digest="sha256:$(shasum -a 256 "$asset" | cut -d ' ' -f 1)"
            remote_digest="$(
              jq -r --arg name "$name" \
                '.assets[] | select(.name == $name) | .digest' <<<"$release"
            )"
            if [[ "$local_digest" != "$remote_digest" ]]; then
              echo "$name has remote digest $remote_digest; expected $local_digest" >&2
              exit 1
            fi
          done
      - name: Verify the tag
        run: |
          set -euo pipefail

          git fetch --quiet --force origin \
            "refs/tags/$PUBLISH_TAG:refs/tags/$PUBLISH_TAG"
          tag_sha="$(git rev-parse "refs/tags/$PUBLISH_TAG^{commit}")"
          if [[ "$tag_sha" != "$PUBLISH_SHA" ]]; then
            echo "$PUBLISH_TAG points to $tag_sha; expected $PUBLISH_SHA" >&2
            exit 1
          fi
      - name: Publish the verified tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release edit "$PUBLISH_TAG" --draft=false --latest=false
          release="$(gh release view "$PUBLISH_TAG" --json isDraft,isPrerelease,url)"
          jq -e '(.isDraft | not) and (.isPrerelease | not)' <<<"$release" >/dev/null
          {
            echo "### $PUBLISH_TAG"
            echo
            echo "Published $(jq -r '.url' <<<"$release")."
          } >> "$GITHUB_STEP_SUMMARY"
