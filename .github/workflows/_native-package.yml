name: "↳ Native package"

on:
  workflow_call:
    inputs:
      ci_run_url:
        description: URL of the successful main CI run
        required: true
        type: string
      previous_tag:
        description: Previous release tag, linked from the release notes
        default: ""
        required: false
        type: string
      release:
        description: Publish an immutable tagged release
        default: false
        required: false
        type: boolean
      run_id:
        description: CI run that produced the native packages
        required: true
        type: string
      sha:
        description: Source commit and artifact suffix
        required: true
        type: string
      tag:
        description: GitHub release tag
        required: true
        type: string
      version:
        description: Version written into the native packages
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Native package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      CI_RUN_URL: ${{ inputs.ci_run_url }}
      MISE_NO_HOOKS: "1"
      PUBLISH_CHANNEL: ${{ inputs.release && 'release' || 'snapshot' }}
      PUBLISH_SHA: ${{ inputs.sha }}
      PUBLISH_TAG: ${{ inputs.tag }}
      PUBLISH_VERSION: ${{ inputs.version }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
          # Zig hashes each archive for the Zig package's manifest.
          install_args: core:zig python
      - name: Refuse an existing published release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          status=0
          output="$(
            gh release view "$PUBLISH_TAG" --json isDraft --jq .isDraft 2>&1
          )" || status=$?
          if [[ "$status" -eq 0 ]]; then
            if [[ "$output" == false ]]; then
              echo "GitHub release $PUBLISH_TAG is already published" >&2
              exit 1
            fi
          elif [[ "$output" != "release not found" ]]; then
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: native-package-*-${{ env.PUBLISH_SHA }}
          path: build/packages/native/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: native-xcframework-${{ env.PUBLISH_SHA }}
          path: build/packages/native/release
      - name: Record the publish time
        id: publish
        run:
          echo "timestamp=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
      - name: Prepare assets
        env:
          PUBLISH_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PUBLISH_TIMESTAMP: ${{ steps.publish.outputs.timestamp }}
        run: >-
          mise run --no-deps ci:prepare-native-package "$PUBLISH_CHANNEL"
          build/packages/native/release "$PUBLISH_VERSION"
      - name: Move the snapshot tag
        if: ${{ !inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${PUBLISH_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${PUBLISH_TAG}" \
              -f sha="$PUBLISH_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${PUBLISH_TAG}" \
              -f sha="$PUBLISH_SHA" >/dev/null
          fi
      # The snapshot release also holds the binding packages, which their own
      # jobs replace. SHA256SUMS lists every other native asset, so the one on
      # the release names the native assets that this publish replaces. It
      # uploads last, so a publish that fails before then leaves that list for
      # its rerun.
      - name: Record the replaced snapshot assets
        if: ${{ !inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          replaced=build/packages/native/replaced-assets
          echo SHA256SUMS >"$replaced"
          # The first snapshot finds no release, and a publish that failed while
          # replacing SHA256SUMS leaves none; either way no earlier list exists.
          assets="$(gh release view "$PUBLISH_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -qxF SHA256SUMS <<<"$assets"; then
            gh release download "$PUBLISH_TAG" --pattern SHA256SUMS --output - |
              cut -d ' ' -f 3- >>"$replaced"
          fi
      # A tagged release remains a draft until every uploaded asset is verified.
      - name: Upload the release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.sha }}
          name:
            ${{ inputs.release && format('MapLibre Native FFI {0}',
            inputs.version) || format('Native package snapshot {0}',
            steps.publish.outputs.timestamp) }}
          body_path: build/packages/native/release/RELEASE_NOTES.md
          draft: ${{ inputs.release }}
          prerelease: ${{ !inputs.release }}
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            build/packages/native/release/*.tar.gz
            build/packages/native/release/MaplibreNativeC.xcframework.zip
            build/packages/native/release/maplibre-native-c-artifacts.json
      - name: Remove stale snapshot assets
        if: ${{ !inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(gh release view "$PUBLISH_TAG" --json assets)"
          while IFS= read -r name; do
            if [[ ! -f "build/packages/native/release/$name" ]] &&
              grep -qxF "$name" build/packages/native/replaced-assets; then
              gh release delete-asset "$PUBLISH_TAG" "$name" --yes
            fi
          done < <(jq -r '.assets[].name' <<<"$release")
      - name: Upload the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$PUBLISH_TAG"
          build/packages/native/release/SHA256SUMS --clobber
      - name: Verify the release assets
        env:
          EXPECTED_DRAFT: ${{ inputs.release }}
          EXPECTED_PRERELEASE: ${{ !inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(
            gh release view "$PUBLISH_TAG" \
              --json assets,isDraft,isPrerelease,tagName
          )"
          jq -e \
            --arg tag "$PUBLISH_TAG" \
            --argjson draft "$EXPECTED_DRAFT" \
            --argjson prerelease "$EXPECTED_PRERELEASE" \
            '.isDraft == $draft and .isPrerelease == $prerelease and
             .tagName == $tag' \
            <<<"$release" >/dev/null

          assets=(build/packages/native/release/*.tar.gz)
          assets+=(build/packages/native/release/MaplibreNativeC.xcframework.zip)
          assets+=(build/packages/native/release/maplibre-native-c-artifacts.json)
          assets+=(build/packages/native/release/SHA256SUMS)
          # The binding jobs own the snapshot release's other assets.
          if [[ "$PUBLISH_CHANNEL" == release ]]; then
            expected="$(printf '%s\n' "${assets[@]##*/}" | sort | jq -R . | jq -c -s .)"
            actual="$(jq -c '[.assets[].name] | sort' <<<"$release")"
            if [[ "$actual" != "$expected" ]]; then
              echo "release assets do not match the prepared native package set" >&2
              jq -n --argjson expected "$expected" --argjson actual "$actual" \
                '{expected: $expected, actual: $actual}' >&2
              exit 1
            fi
          fi

          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            remote_digest="$(
              jq -r --arg name "$name" \
                '.assets[] | select(.name == $name) | .digest' <<<"$release"
            )"
            if [[ "$local_digest" != "$remote_digest" ]]; then
              echo "$name has remote digest $remote_digest; expected $local_digest" >&2
              exit 1
            fi
          done
      - name: Verify the tag
        run: |
          set -euo pipefail

          git fetch --quiet --force origin \
            "refs/tags/$PUBLISH_TAG:refs/tags/$PUBLISH_TAG"
          tag_sha="$(git rev-parse "refs/tags/$PUBLISH_TAG^{commit}")"
          if [[ "$tag_sha" != "$PUBLISH_SHA" ]]; then
            echo "$PUBLISH_TAG points to $tag_sha; expected $PUBLISH_SHA" >&2
            exit 1
          fi
      - name: Publish the verified tagged release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release edit "$PUBLISH_TAG" --draft=false --latest=false
          release="$(gh release view "$PUBLISH_TAG" --json isDraft,isPrerelease,url)"
          jq -e '(.isDraft | not) and (.isPrerelease | not)' <<<"$release" >/dev/null
          {
            echo "### MapLibre Native FFI $PUBLISH_VERSION"
            echo
            echo "Published $(jq -r '.url' <<<"$release")."
          } >> "$GITHUB_STEP_SUMMARY"
