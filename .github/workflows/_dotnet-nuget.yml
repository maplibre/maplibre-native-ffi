name: "↳ .NET NuGet"

on:
  workflow_call:
    inputs:
      run_id:
        description: CI run that produced the native packages
        required: true
        type: string
      sha:
        description: Source commit and artifact suffix
        required: true
        type: string
      version:
        description: Package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    name: pack
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      MISE_NO_HOOKS: "1"
      PACKAGE_SHA: ${{ inputs.sha }}
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          ref: ${{ env.PACKAGE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: core:dotnet python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: native-package-*-${{ env.PACKAGE_SHA }}
          path: build/packages/native/dotnet-input
      - run: >-
          mise run --no-deps ci:pack-dotnet build/packages/native/dotnet-input
          build/packages/dotnet/nupkgs "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-nupkgs-${{ env.PACKAGE_SHA }}
          path: build/packages/dotnet/nupkgs/*.nupkg
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
