name: Mirror to Codeberg

on:
  push:
    branches: [main]
    tags: ["**"]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: codeberg
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Push mirror
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          {
            printf 'machine codeberg.org\nlogin %s\npassword %s\n' \
              "$CODEBERG_USERNAME" "$CODEBERG_TOKEN"
          } > ~/.netrc
          chmod 600 ~/.netrc

          git remote add mirror https://codeberg.org/maplibre/maplibre-native-ffi.git
          git fetch origin --tags
          git push mirror main
          # Floating tags (e.g. unstable-native-snapshot) are force-moved on origin.
          git push mirror --tags --force
