name: Mirror to Codeberg

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Push mirror
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git remote add mirror "https://${CODEBERG_USERNAME}:${CODEBERG_TOKEN}@codeberg.org/maplibre/maplibre-native-ffi.git"
          git push mirror --all
          git push mirror --tags
