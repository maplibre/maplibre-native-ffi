# Generated by `mise run ci:generate-workflow`. Do not edit directly.
name: CI retry
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
permissions:
  contents: read
  actions: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  retry:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Retry failed jobs and their dependents
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -m ci.retry
