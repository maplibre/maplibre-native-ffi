name: CI retry
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
permissions:
  contents: read
  actions: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  retry:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    steps:
      # workflow_run gets a write token. Its checkout must stay on the trusted
      # default-branch commit, never the PR that triggered the failed run.
      - name: Check out repository
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Retry failed jobs and their dependents
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -m ci.retry
