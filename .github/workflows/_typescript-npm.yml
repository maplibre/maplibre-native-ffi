name: "↳ TypeScript npm"

on:
  workflow_call:
    inputs:
      tag:
        description: Published native release tag; empty to package CI artifacts
        default: ""
        required: false
        type: string
      run_id:
        description: CI run that built and tested the addons
        required: true
        type: string
      sha:
        description: Source commit and artifact suffix
        required: true
        type: string
      version:
        description: Package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    name: pack
    # A release signs the Apple SDK, which needs macOS.
    runs-on:
      ${{ inputs.tag != '' && 'blacksmith-6vcpu-macos-26' ||
      'blacksmith-2vcpu-ubuntu-2404' }}
    environment: ${{ inputs.tag != '' && 'apple-sdk' || '' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      MISE_NO_HOOKS: "1"
      PACKAGE_SHA: ${{ inputs.sha }}
      PACKAGE_TAG: ${{ inputs.tag }}
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2
        with:
          ref: ${{ env.PACKAGE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
          install_args: core:node aqua:pnpm/pnpm python
      # Each target job of the CI run built its addon against the native
      # archive that the release publishes, and tested it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: typescript-addon-*-${{ env.PACKAGE_SHA }}
          path: build/typescript-addons
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.tag == '' }}
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: native-xcframework-${{ env.PACKAGE_SHA }}
          path: build/typescript-xcframework
      # The React Native package carries the Android EGL libraries.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.tag == '' }}
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: native-package-android-*-egl-${{ env.PACKAGE_SHA }}
          path: build/typescript-android
      - name: Download the published XCFramework and Android archives
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          destination=build/typescript-xcframework
          gh release download "$PACKAGE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern MaplibreNativeC.xcframework.zip --pattern SHA256SUMS \
            --dir "$destination"
          (cd "$destination" && grep '  MaplibreNativeC.xcframework.zip$' SHA256SUMS | shasum -a 256 --check --strict)
          android=build/typescript-android
          gh release download "$PACKAGE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'maplibre-native-c-android-*-egl.tar.gz' --dir "$android"
          cp "$destination/SHA256SUMS" "$android/SHA256SUMS"
          (cd "$android" && shasum -a 256 --check --ignore-missing --strict SHA256SUMS)
      - name: Pack the packages
        env:
          APPLE_SDK_TEAM_ID: ${{ vars.APPLE_SDK_TEAM_ID }}
          APPLE_SDK_CERTIFICATE_BASE64:
            ${{ secrets.APPLE_SDK_CERTIFICATE_BASE64 }}
          APPLE_SDK_CERTIFICATE_PASSWORD:
            ${{ secrets.APPLE_SDK_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          mise deps submodules
          mise deps pnpm
          unzip -q build/typescript-xcframework/MaplibreNativeC.xcframework.zip -d build/typescript-xcframework
          presets=()
          for artifact in build/typescript-addons/*; do
            preset="${artifact#build/typescript-addons/typescript-addon-}"
            preset="${preset%-"$PACKAGE_SHA"}"
            mkdir -p "bindings/typescript/native/build/$preset"
            mv "$artifact" "bindings/typescript/native/build/$preset/install"
            presets+=("$preset")
          done
          signing=()
          if [[ -n "$PACKAGE_TAG" ]]; then
            signing=(--sign-apple-sdk)
          fi
          mise exec --no-deps core:node -- node bindings/typescript/scripts/pack.ts \
            --version "$PACKAGE_VERSION" "${signing[@]}" \
            --xcframework build/typescript-xcframework/MaplibreNativeC.xcframework \
            --android build/typescript-android \
            build/npm "${presets[@]}"
      # npm accepts a trusted publisher only for a package that exists, so the
      # first release of a package publishes these tarballs by hand. A rerun
      # replaces the previous attempt's tarballs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages-${{ env.PACKAGE_VERSION }}
          path: build/npm/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
