name: "↳ TypeScript npm"

on:
  workflow_call:
    inputs:
      run_id:
        description: CI run that built and tested the addons
        required: true
        type: string
      sha:
        description: Source commit named by the release tag
        required: true
        type: string
      version:
        description: Package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    # npm's trusted publishing and provenance accept only GitHub-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # npm accepts an OIDC token from this repository when each package's
    # trusted publisher names this environment and release.yml, the workflow
    # that calls this one: npm matches the run's top-level workflow.
    environment:
      name: npm
      url:
        https://www.npmjs.com/package/@maplibre/native-ffi/v/${{ inputs.version
        }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      MISE_NO_HOOKS: "1"
      PUBLISH_SHA: ${{ inputs.sha }}
      PUBLISH_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
          install_args: core:node aqua:pnpm/pnpm
      # Each target job of the tagged commit's CI run built its addon against
      # the native archive that the release publishes, and tested it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: typescript-addon-*-${{ inputs.sha }}
          path: build/typescript-addons
      - name: Pack the packages
        run: |
          set -euo pipefail

          shopt -s nullglob
          mise deps pnpm
          presets=()
          for artifact in build/typescript-addons/*; do
            preset="${artifact#build/typescript-addons/typescript-addon-}"
            preset="${preset%-"$PUBLISH_SHA"}"
            mkdir -p "bindings/typescript/native/build/$preset"
            mv "$artifact" "bindings/typescript/native/build/$preset/install"
            presets+=("$preset")
          done
          mise exec --no-deps core:node -- node bindings/typescript/scripts/pack.ts \
            --version "$PUBLISH_VERSION" build/npm "${presets[@]}"
      # npm accepts a trusted publisher only for a package that exists, so the
      # first release of a package publishes these tarballs by hand. A rerun
      # replaces the previous attempt's tarballs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages-${{ inputs.version }}
          path: build/npm/*.tgz
          if-no-files-found: error
          overwrite: true
      # Addons, then backends, then the facade, so every package's pins resolve
      # once it publishes. A version that npm already has is skipped, so a rerun
      # after a partial publish resumes where it stopped. npm attests the
      # provenance of each package.
      - name: Publish
        run: |
          set -euo pipefail

          for kind in addon backend facade; do
            for tarball in build/npm/*.tgz; do
              manifest="$(tar -xOzf "$tarball" package/package.json)"
              if [[ "$(jq -r 'if .os then "addon" elif .optionalDependencies then "backend" else "facade" end' <<<"$manifest")" != "$kind" ]]; then
                continue
              fi
              name="$(jq -r .name <<<"$manifest")"
              url="https://registry.npmjs.org/$name/$PUBLISH_VERSION"
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$url")"
              case "$status" in
                200) continue ;;
                404) ;;
                *)
                  echo "npm returned HTTP $status for $url" >&2
                  exit 1
                  ;;
              esac
              mise exec --no-deps core:node -- npm publish --provenance --access public "$tarball"
              echo "### $name $PUBLISH_VERSION" >> "$GITHUB_STEP_SUMMARY"
            done
          done
