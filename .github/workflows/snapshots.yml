name: Snapshots

# Publishing runs on its own daily schedule rather than after every CI run, and
# each component publishes only when the inputs it consumes changed since its
# last publish. `ci/snapshots.toml` declares those input scopes.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      components:
        description: What to publish
        type: choice
        default: all
        # One entry per `[components.*]` table in ci/snapshots.toml.
        options:
          - all
          - native
          - kotlin
          - python
          - docs

permissions:
  contents: read

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      # The repository's postinstall hook installs the Git hooks through `hk`,
      # which the jobs that only need Python never acquire.
      MISE_NO_HOOKS: "1"
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
      ci_run_url: ${{ steps.source.outputs.ci_run_url }}
      snapshot_version: ${{ steps.version.outputs.value }}
      publish_native: ${{ steps.plan.outputs.publish_native }}
      publish_kotlin: ${{ steps.plan.outputs.publish_kotlin }}
      publish_python: ${{ steps.plan.outputs.publish_python }}
      publish_docs: ${{ steps.plan.outputs.publish_docs }}
    steps:
      # The artifacts every publish job downloads come from one CI run, so that
      # run's commit is what this workflow publishes and hashes.
      #
      # CI also runs on pull requests, where the run's head branch is the pull
      # request's own branch. A branch filter alone would therefore match a run
      # from an unmerged branch named `main`, and the jobs below would check
      # that code out holding the publishing credentials. Only pushes reach
      # `main`, so the event filter is what keeps this to merged commits.
      - name: Resolve the source CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --branch main \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId,headSha,url)"

          if [[ "$(jq 'length' <<<"$run")" -eq 0 ]]; then
            echo "no successful CI run on main to publish from" >&2
            exit 1
          fi

          {
            echo "run_id=$(jq -r '.[0].databaseId' <<<"$run")"
            echo "sha=$(jq -r '.[0].headSha' <<<"$run")"
            echo "ci_run_url=$(jq -r '.[0].url' <<<"$run")"
          } >> "$GITHUB_OUTPUT"
      # The gate digests each component at this commit and at the one its state
      # tag names, so it needs the history and tags behind both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Assert the property the event filter above is chosen for, rather than
      # trusting the filter. Every later job checks this commit out with
      # publishing credentials in scope, so it has to be one that reached main.
      - name: Verify the source commit reached main
        env:
          SNAPSHOT_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SNAPSHOT_SHA" origin/main; then
            echo "$SNAPSHOT_SHA is not an ancestor of main; refusing to publish" >&2
            exit 1
          fi
      # The gate reads Git history and the scope config, so it needs Python
      # rather than the native toolchain the publish jobs use. `--no-deps` on
      # the task keeps mise from preparing the submodule and package
      # dependencies that only a build needs.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: python
      # `all`, and every scheduled run, applies the gate. Naming one component
      # publishes it whether or not its inputs changed, since republishing an
      # unchanged component is the only reason to name one by hand.
      - name: Plan the publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run --no-deps ci:snapshot-state plan
          --components "${{ inputs.components || 'all' }}"
          --force "${{ inputs.components != '' && inputs.components != 'all' }}"
      # Minutes, not just the date: a scheduled run and a manual one on the same
      # day would otherwise publish different bytes under one version, and pip
      # would never see the second as an upgrade.
      - name: Date the snapshot version
        id: version
        run: echo "value=0.1.0.dev$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  stage-python:
    name: Python wheel / ${{ matrix.backend }}
    needs:
      - plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    if: ${{ needs.plan.outputs.publish_python == 'true' }}
    environment: sccache
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan
            preset: linux-x64-vulkan
            runner: ubuntu-latest
          - backend: opengl
            preset: linux-x64-egl
            runner: ubuntu-latest
          - backend: metal
            preset: macos-arm64-metal
            runner: macos-26
            macos_deployment_target: "14.3"
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_VERSION: ${{ needs.plan.outputs.snapshot_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.preset }}
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: native-package-${{ matrix.preset }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/python-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package
          ${{ matrix.preset }}
          build/packages/native/python-input/maplibre-native-c-${{ matrix.preset }}.tar.gz
      # The native artifact is built for macOS 14.3, and maturin derives the
      # wheel's platform tag from this variable. Left unset, the tag would
      # promise older releases a dylib they cannot load.
      - run: mise run //bindings/python:build ${{ matrix.preset }}
        env:
          MISE_TASK_SKIP: "//:build"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      - name: Prepare backend wheel
        shell: bash
        run: |
          set -euo pipefail
          wheels=(target/wheels/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "expected one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          mise run --no-deps ci:prepare-python-snapshot relabel \
            "${wheels[0]}" build/packages/python/wheels \
            "${{ matrix.backend }}" "$SNAPSHOT_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.backend }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/wheels/*.whl
          if-no-files-found: error
          retention-days: 1

  python-index:
    name: Python package index
    needs:
      - plan
      - stage-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-wheel-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/wheels
          merge-multiple: true
      - run: >-
          mise run --no-deps ci:prepare-python-snapshot index
          build/packages/python/wheels build/packages/python/simple
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-simple-index-${{ env.SNAPSHOT_SHA }}
          path: build/packages/python/simple
          if-no-files-found: error
          retention-days: 1

  docs-pages:
    name: Docs Pages
    needs:
      - plan
      - python-index
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs whatever became of the Python jobs. The steps below take the staged
    # index when there is one and mirror the live one otherwise, so a wheel
    # failure degrades this to a docs-only publish instead of blocking it.
    if: >-
      ${{
        always() && needs.plan.result == 'success' &&
        (needs.plan.outputs.publish_docs == 'true' || needs.plan.outputs.publish_python == 'true')
      }}
    environment: sccache
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: native-package-linux-x64-vulkan-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/docs-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package
          linux-x64-vulkan
          build/packages/native/docs-input/maplibre-native-c-linux-x64-vulkan.tar.gz
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mise run //docs:build
        env:
          MISE_TASK_SKIP: "//:build"
      # Keyed on the index job rather than on the plan: a failed wheel build
      # skips it, and a docs publish should carry the live index forward rather
      # than fail reaching for an artifact that was never uploaded.
      - if: ${{ needs.python-index.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-simple-index-${{ env.SNAPSHOT_SHA }}
          path: docs/dist/simple
      # A docs-only deploy still replaces the whole Pages site, so carry the
      # current feed forward rather than erasing a separately gated component.
      - if: ${{ needs.python-index.result != 'success' }}
        run: >-
          mise run --no-deps ci:prepare-python-snapshot mirror
          https://maplibre.github.io/maplibre-native-ffi/simple/ docs/dist/simple
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy-docs:
    name: Deploy Docs Pages
    needs:
      - docs-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  stage-kotlin:
    name: Kotlin Maven staging / ${{ matrix.partition }}
    needs:
      - plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    if: ${{ needs.plan.outputs.publish_kotlin == 'true' }}
    environment: sccache
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
            native_pattern: native-package-android-*
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
            native_pattern: native-package-*
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: ${{ matrix.native_pattern }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      # The Linux partition also publishes the linuxX64 KLIBs, which embed the
      # Linux static archives rather than the Android ones.
      - if: ${{ matrix.partition == 'linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-linux-x64-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot stage ${{ matrix.partition }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-maven-staging-${{ matrix.partition }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 1

  verify-kotlin:
    name: Kotlin Maven verification
    needs:
      - plan
      - stage-kotlin
    runs-on: macos-26
    timeout-minutes: 60
    environment: sccache
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kotlin-maven-staging-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging
          merge-multiple: true
      - run: mise run //:kotlin:publish-snapshot verify build/packages/kotlin/maven-staging

  publish-kotlin-leaves:
    name: Kotlin Maven leaf snapshots / ${{ matrix.partition }}
    needs:
      - plan
      - verify-kotlin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment:
      name: maven-central
      url: https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
            native_pattern: native-package-android-*
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
            native_pattern: native-package-*
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signAllPublications: "true"
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: ${{ matrix.native_pattern }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      # The Linux partition also publishes the linuxX64 KLIBs, which embed the
      # Linux static archives rather than the Android ones.
      - if: ${{ matrix.partition == 'linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-linux-x64-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot publish-leaves ${{ matrix.partition }}

  publish-kotlin-roots:
    name: Kotlin Maven root snapshots
    needs:
      - plan
      - publish-kotlin-leaves
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: maven-central
      url: https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signAllPublications: "true"
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-*-metal-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot publish-roots apple

  publish:
    name: native package
    needs:
      - plan
    # Every component reads the same CI artifacts and none consumes another's
    # output, so each publishes on its own gate. One failing never holds
    # another back, and the gate already lets them sit at different commits
    # whenever their inputs diverge.
    if: ${{ needs.plan.outputs.publish_native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      CI_RUN_URL: ${{ needs.plan.outputs.ci_run_url }}
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_TAG: unstable-native-snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/release
          merge-multiple: true
      - name: Prepare release assets
        run: >-
          mise run --no-deps ci:prepare-native-package-snapshot
          build/packages/native/release
      - name: Move snapshot tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SNAPSHOT_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" >/dev/null
          fi
      - name: Publish floating release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          target_commitish: ${{ env.SNAPSHOT_SHA }}
          name: Native package snapshot
          body_path: build/packages/native/release/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/packages/native/release/*.tar.gz
            build/packages/native/release/SHA256SUMS

  record:
    name: record
    needs:
      - plan
      - deploy-docs
      - python-index
      - publish-kotlin-roots
      - publish
    # Only components that published get their state tag moved, so a failed or
    # skipped component is retried by the next run.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: python
      - name: Record published components
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_RESULT: ${{ needs.deploy-docs.result }}
          KOTLIN_RESULT: ${{ needs.publish-kotlin-roots.result }}
          NATIVE_RESULT: ${{ needs.publish.result }}
          PUBLISH_DOCS: ${{ needs.plan.outputs.publish_docs }}
          PYTHON_RESULT: ${{ needs.python-index.result }}
        run: |
          set -euo pipefail

          published=()
          if [[ "$NATIVE_RESULT" == success ]]; then
            published+=(native)
          fi
          if [[ "$KOTLIN_RESULT" == success ]]; then
            published+=(kotlin)
          fi
          if [[ "$PUBLISH_DOCS" == true && "$DOCS_RESULT" == success ]]; then
            published+=(docs)
          fi
          # The deploy alone does not say the wheels made it: docs-pages
          # succeeds by mirroring the live index when staging failed, and
          # recording python then would tell the next run there is nothing to
          # retry.
          if [[ "$PYTHON_RESULT" == success && "$DOCS_RESULT" == success ]]; then
            published+=(python)
          fi

          mise run --no-deps ci:snapshot-state record ${published[@]+"${published[@]}"}

  required:
    name: snapshots-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A skipped job is the gate doing its work, so only real failures are red.
    if: ${{ always() }}
    needs:
      - plan
      - docs-pages
      - stage-python
      - python-index
      - deploy-docs
      - stage-kotlin
      - verify-kotlin
      - publish-kotlin-leaves
      - publish-kotlin-roots
      - publish
      - record
    steps:
      - name: Fail if required jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: "true"
