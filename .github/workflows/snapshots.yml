name: Snapshots

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kotlin-snapshots
  cancel-in-progress: false

jobs:
  stage-kotlin:
    name: Kotlin Maven staging / ${{ matrix.partition }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
    env:
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot stage ${{ matrix.partition }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-maven-staging-${{ matrix.partition }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 1

  verify-kotlin:
    name: Kotlin Maven verification
    needs:
      - stage-kotlin
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
    outputs:
      publish: ${{ steps.current.outputs.publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kotlin-maven-staging-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging
          merge-multiple: true
      - name: Check snapshot is current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$SNAPSHOT_SHA" ]]; then
            echo "Skipping Kotlin snapshot because main advanced to $main_sha"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.current.outputs.publish == 'true' }}
        run: mise run //:kotlin:publish-snapshot verify build/packages/kotlin/maven-staging

  publish-kotlin-leaves:
    name: Kotlin Maven leaf snapshots / ${{ matrix.partition }}
    needs:
      - verify-kotlin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    if: ${{ needs.verify-kotlin.outputs.publish == 'true' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
    env:
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - name: Check snapshot is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$SNAPSHOT_SHA" ]]; then
            echo "Skipping Kotlin snapshot because main advanced to $main_sha"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.current.outputs.publish == 'true' }}
        run: mise run //:kotlin:publish-snapshot publish-leaves ${{ matrix.partition }}

  publish-kotlin-roots:
    name: Kotlin Maven root snapshots
    needs:
      - publish-kotlin-leaves
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-*-metal-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - name: Check snapshot is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$SNAPSHOT_SHA" ]]; then
            echo "Skipping Kotlin snapshot roots because main advanced to $main_sha"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.current.outputs.publish == 'true' }}
        run: mise run //:kotlin:publish-snapshot publish-roots apple

  publish:
    name: native package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: write
    concurrency:
      group: snapshot-releases
      cancel-in-progress: false
    env:
      CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
      SNAPSHOT_TAG: unstable-native-snapshot
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-*-${{ github.event.workflow_run.head_sha }}
          path: build/packages/native/release
          merge-multiple: true
      - name: Prepare release assets
        run: |
          python3 - build/packages/native/release <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          release_dir = pathlib.Path(sys.argv[1])
          tarballs = sorted(release_dir.glob("*.tar.gz"))
          if not tarballs:
              raise SystemExit(f"no native package tarballs found in {release_dir}")

          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repository = os.environ["GITHUB_REPOSITORY"]
          snapshot_sha = os.environ["SNAPSHOT_SHA"]
          notes = "\n".join(
              [
                  "Unstable native package snapshot.",
                  "",
                  f"Commit: {server_url}/{repository}/commit/{snapshot_sha}",
                  f"CI run: {os.environ['CI_RUN_URL']}",
                  f"Snapshot run: {server_url}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  "",
              ]
          )
          (release_dir / "RELEASE_NOTES.md").write_text(notes, encoding="utf-8")

          checksums = []
          for path in tarballs:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksums.append(f"{digest}  {path.name}")
          (release_dir / "SHA256SUMS").write_text(
              "\n".join(checksums) + "\n", encoding="utf-8"
          )
          PY
      - name: Move snapshot tag
        id: move_snapshot_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$SNAPSHOT_SHA" ]]; then
            echo "Skipping snapshot publish because main advanced to $main_sha"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SNAPSHOT_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" >/dev/null
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish floating release
        if: ${{ steps.move_snapshot_tag.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          target_commitish: ${{ env.SNAPSHOT_SHA }}
          name: Native package snapshot
          body_path: build/packages/native/release/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/packages/native/release/*.tar.gz
            build/packages/native/release/SHA256SUMS
