name: Snapshots

# Publishing runs on its own daily schedule rather than after every CI run, and
# each component publishes only when the inputs it consumes changed since its
# last publish. `ci/snapshots.toml` declares those input scopes.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      components:
        description: What to publish
        type: choice
        default: all
        # One entry per `[components.*]` table in ci/snapshots.toml.
        options:
          - all
          - native
          - kotlin
          - docs

permissions:
  contents: read

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      # The repository's postinstall hook installs the Git hooks through `hk`,
      # which the jobs that only need Python never acquire.
      MISE_NO_HOOKS: "1"
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
      ci_run_url: ${{ steps.source.outputs.ci_run_url }}
      publish_native: ${{ steps.plan.outputs.publish_native }}
      publish_kotlin: ${{ steps.plan.outputs.publish_kotlin }}
      publish_docs: ${{ steps.plan.outputs.publish_docs }}
      hash_native: ${{ steps.plan.outputs.hash_native }}
      hash_kotlin: ${{ steps.plan.outputs.hash_kotlin }}
      hash_docs: ${{ steps.plan.outputs.hash_docs }}
    steps:
      # The artifacts every publish job downloads come from one CI run, so that
      # run's commit is what this workflow publishes and hashes.
      - name: Resolve the source CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId,headSha,url)"

          if [[ "$(jq 'length' <<<"$run")" -eq 0 ]]; then
            echo "no successful CI run on main to publish from" >&2
            exit 1
          fi

          {
            echo "run_id=$(jq -r '.[0].databaseId' <<<"$run")"
            echo "sha=$(jq -r '.[0].headSha' <<<"$run")"
            echo "ci_run_url=$(jq -r '.[0].url' <<<"$run")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      # The gate reads Git history and the scope config, so it needs Python
      # rather than the native toolchain the publish jobs use. `--no-deps` on
      # the task keeps mise from preparing the submodule and package
      # dependencies that only a build needs.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: python
      # `all`, and every scheduled run, applies the gate. Naming one component
      # publishes it whether or not its inputs changed, since republishing an
      # unchanged component is the only reason to name one by hand.
      - name: Plan the publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run --no-deps ci:snapshot-state plan
          --components "${{ inputs.components || 'all' }}"
          --force "${{ inputs.components != '' && inputs.components != 'all' }}"

  docs-pages:
    name: Docs Pages
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ needs.plan.outputs.publish_docs == 'true' }}
    environment: sccache
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          name: native-package-linux-x64-vulkan-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/docs-input
      - name: Install packaged native artifact
        run: >-
          mise run install-native-package
          linux-x64-vulkan
          build/packages/native/docs-input/maplibre-native-c-linux-x64-vulkan.tar.gz
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mise run //docs:build
        env:
          MISE_TASK_SKIP: "//:build"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy-docs:
    name: Deploy Docs Pages
    needs:
      - docs-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  stage-kotlin:
    name: Kotlin Maven staging / ${{ matrix.partition }}
    needs:
      - plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    if: ${{ needs.plan.outputs.publish_kotlin == 'true' }}
    environment: sccache
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
            native_pattern: native-package-android-*
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
            native_pattern: native-package-*
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: ${{ matrix.native_pattern }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      # The Linux partition also publishes the linuxX64 KLIBs, which embed the
      # Linux static archives rather than the Android ones.
      - if: ${{ matrix.partition == 'linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-linux-x64-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot stage ${{ matrix.partition }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-maven-staging-${{ matrix.partition }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 1

  verify-kotlin:
    name: Kotlin Maven verification
    needs:
      - plan
      - stage-kotlin
    runs-on: macos-26
    timeout-minutes: 60
    environment: sccache
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kotlin-maven-staging-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging
          merge-multiple: true
      - run: mise run //:kotlin:publish-snapshot verify build/packages/kotlin/maven-staging

  publish-kotlin-leaves:
    name: Kotlin Maven leaf snapshots / ${{ matrix.partition }}
    needs:
      - plan
      - verify-kotlin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment:
      name: maven-central
      url: https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
            native_pattern: native-package-android-*
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
            native_pattern: native-package-*
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signAllPublications: "true"
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: ${{ matrix.native_pattern }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      # The Linux partition also publishes the linuxX64 KLIBs, which embed the
      # Linux static archives rather than the Android ones.
      - if: ${{ matrix.partition == 'linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-linux-x64-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot publish-leaves ${{ matrix.partition }}

  publish-kotlin-roots:
    name: Kotlin Maven root snapshots
    needs:
      - plan
      - publish-kotlin-leaves
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: maven-central
      url: https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signAllPublications: "true"
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-*-metal-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot publish-roots apple

  publish:
    name: native package
    needs:
      - plan
      - publish-kotlin-roots
    # Ordered after the Kotlin uploads, but a Kotlin gate that skipped is not a
    # reason to hold the native release back.
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.publish_native == 'true'
      && needs.publish-kotlin-roots.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      CI_RUN_URL: ${{ needs.plan.outputs.ci_run_url }}
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
      SNAPSHOT_TAG: unstable-native-snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.run_id }}
          pattern: native-package-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/release
          merge-multiple: true
      - name: Prepare release assets
        run: >-
          mise run --no-deps ci:prepare-native-package-snapshot
          build/packages/native/release
      - name: Move snapshot tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SNAPSHOT_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" >/dev/null
          fi
      - name: Publish floating release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          target_commitish: ${{ env.SNAPSHOT_SHA }}
          name: Native package snapshot
          body_path: build/packages/native/release/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/packages/native/release/*.tar.gz
            build/packages/native/release/SHA256SUMS

  record:
    name: record
    needs:
      - plan
      - deploy-docs
      - publish-kotlin-roots
      - publish
    # Only components that published get their input hash recorded, so a failed
    # or skipped component is retried by the next run.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MISE_NO_HOOKS: "1"
      SNAPSHOT_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: false
          install_args: python
      - name: Record published inputs
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_RESULT: ${{ needs.deploy-docs.result }}
          KOTLIN_RESULT: ${{ needs.publish-kotlin-roots.result }}
          NATIVE_RESULT: ${{ needs.publish.result }}
          DOCS_HASH: ${{ needs.plan.outputs.hash_docs }}
          KOTLIN_HASH: ${{ needs.plan.outputs.hash_kotlin }}
          NATIVE_HASH: ${{ needs.plan.outputs.hash_native }}
        run: |
          set -euo pipefail

          published=()
          if [[ "$NATIVE_RESULT" == success ]]; then
            published+=("native=$NATIVE_HASH")
          fi
          if [[ "$KOTLIN_RESULT" == success ]]; then
            published+=("kotlin=$KOTLIN_HASH")
          fi
          if [[ "$DOCS_RESULT" == success ]]; then
            published+=("docs=$DOCS_HASH")
          fi

          mise run --no-deps ci:snapshot-state record ${published[@]+"${published[@]}"}

  required:
    name: snapshots-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A skipped job is the gate doing its work, so only real failures are red.
    if: ${{ always() }}
    needs:
      - plan
      - docs-pages
      - deploy-docs
      - stage-kotlin
      - verify-kotlin
      - publish-kotlin-leaves
      - publish-kotlin-roots
      - publish
      - record
    steps:
      - name: Fail if required jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: "true"
