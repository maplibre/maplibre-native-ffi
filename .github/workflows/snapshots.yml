name: Snapshots

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  stage-kotlin:
    name: Kotlin Maven staging / ${{ matrix.partition }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: sccache
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
            native_pattern: native-package-android-*
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
            native_pattern: native-package-*
    env:
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: ${{ matrix.native_pattern }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      # The Linux partition also publishes the linuxX64 KLIBs, which embed the
      # Linux static archives rather than the Android ones.
      - if: ${{ matrix.partition == 'linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-linux-x64-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot stage ${{ matrix.partition }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-maven-staging-${{ matrix.partition }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 1

  verify-kotlin:
    name: Kotlin Maven verification
    needs:
      - stage-kotlin
    runs-on: macos-26
    timeout-minutes: 60
    environment: sccache
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kotlin-maven-staging-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/kotlin/maven-staging
          merge-multiple: true
      - run: mise run //:kotlin:publish-snapshot verify build/packages/kotlin/maven-staging

  publish-kotlin-leaves:
    name: Kotlin Maven leaf snapshots / ${{ matrix.partition }}
    needs:
      - verify-kotlin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment:
      name: maven-central
      url: https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
            native_pattern: native-package-android-*
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
            native_pattern: native-package-*
    env:
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signAllPublications: "true"
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: ${{ matrix.native_pattern }}-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      # The Linux partition also publishes the linuxX64 KLIBs, which embed the
      # Linux static archives rather than the Android ones.
      - if: ${{ matrix.partition == 'linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-linux-x64-*-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot publish-leaves ${{ matrix.partition }}

  publish-kotlin-roots:
    name: Kotlin Maven root snapshots
    needs:
      - publish-kotlin-leaves
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: maven-central
      url: https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signAllPublications: "true"
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-*-metal-${{ env.SNAPSHOT_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish-snapshot publish-roots apple

  publish:
    name: native package
    needs:
      - publish-kotlin-roots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
      SNAPSHOT_TAG: unstable-native-snapshot
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-*-${{ github.event.workflow_run.head_sha }}
          path: build/packages/native/release
          merge-multiple: true
      - name: Prepare release assets
        run: |
          python3 - build/packages/native/release <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          release_dir = pathlib.Path(sys.argv[1])
          tarballs = sorted(release_dir.glob("*.tar.gz"))
          if not tarballs:
              raise SystemExit(f"no native package tarballs found in {release_dir}")

          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repository = os.environ["GITHUB_REPOSITORY"]
          snapshot_sha = os.environ["SNAPSHOT_SHA"]
          notes = "\n".join(
              [
                  "Unstable native package snapshot.",
                  "",
                  f"Commit: {server_url}/{repository}/commit/{snapshot_sha}",
                  f"CI run: {os.environ['CI_RUN_URL']}",
                  f"Snapshot run: {server_url}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  "",
              ]
          )
          (release_dir / "RELEASE_NOTES.md").write_text(notes, encoding="utf-8")

          checksums = []
          for path in tarballs:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksums.append(f"{digest}  {path.name}")
          (release_dir / "SHA256SUMS").write_text(
              "\n".join(checksums) + "\n", encoding="utf-8"
          )
          PY
      - name: Move snapshot tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SNAPSHOT_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$SNAPSHOT_SHA" >/dev/null
          fi
      - name: Publish floating release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          target_commitish: ${{ env.SNAPSHOT_SHA }}
          name: Native package snapshot
          body_path: build/packages/native/release/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/packages/native/release/*.tar.gz
            build/packages/native/release/SHA256SUMS
