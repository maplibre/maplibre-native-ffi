name: Snapshots

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: native package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: write
    concurrency:
      group: snapshot-releases
      cancel-in-progress: false
    env:
      CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SNAPSHOT_SHA: ${{ github.event.workflow_run.head_sha }}
      SNAPSHOT_TAG: unstable-native-snapshot
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true
          cache_key_prefix: mise-v2
          install_args: python
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: native-package-*-${{ github.event.workflow_run.head_sha }}
          path: build/packages/native/release
          merge-multiple: true
      - name: Prepare release assets
        run: mise run ci:prepare-native-package-snapshot -- build/packages/native/release
      - name: Move snapshot tag
        id: move_snapshot_tag
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$SNAPSHOT_SHA" ]]; then
            echo "Skipping snapshot publish because main advanced to $main_sha"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -f "$SNAPSHOT_TAG" "$SNAPSHOT_SHA"
          git push -f origin "refs/tags/$SNAPSHOT_TAG"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish floating release
        if: ${{ steps.move_snapshot_tag.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          target_commitish: ${{ env.SNAPSHOT_SHA }}
          name: Native package snapshot
          body_path: build/packages/native/release/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/packages/native/release/*.tar.gz
            build/packages/native/release/SHA256SUMS
