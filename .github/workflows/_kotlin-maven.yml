name: "↳ Kotlin Maven"

on:
  workflow_call:
    inputs:
      publish:
        description: Deploy the verified repository to Maven Central
        default: true
        required: false
        type: boolean
      release:
        description: Publish an immutable tagged release
        default: false
        required: false
        type: boolean
      run_id:
        description: CI run that produced the native packages
        required: true
        type: string
      sha:
        description: Source commit and artifact suffix
        required: true
        type: string
      verified_run_id:
        description: >-
          Run that already staged and verified this commit at this version.
          When set, staging and verification are skipped and the publish job
          reuses that run's verified repository.
        default: ""
        required: false
        type: string
      version:
        description: Kotlin package version
        required: true
        type: string

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"

jobs:
  stage:
    name: Kotlin Maven staging / ${{ matrix.partition }}
    if: ${{ inputs.verified_run_id == '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: linux
            runner: ubuntu-latest
            target: linux-x64-vulkan
            native_pattern: native-package-android-*
          - partition: apple
            runner: macos-26
            target: macos-arm64-metal
            native_pattern: native-package-*
    env:
      KOTLIN_VERSION: ${{ inputs.version }}
      PACKAGE_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PACKAGE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: ${{ matrix.native_pattern }}-${{ env.PACKAGE_SHA }}
          path: build/packages/native/maven-input
      # The Linux partition also publishes the Linux KLIBs, which embed the
      # Linux static archives rather than the Android ones.
      - if: ${{ matrix.partition == 'linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: native-package-linux-*-*-${{ env.PACKAGE_SHA }}
          path: build/packages/native/maven-input
      - run: >-
          mise run //:kotlin:publish stage
          ${{ matrix.partition }} "$KOTLIN_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-maven-staging-${{ matrix.partition }}-${{ env.PACKAGE_SHA }}
          path: build/packages/kotlin/maven-staging-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Kotlin Maven verification
    if: ${{ inputs.verified_run_id == '' }}
    needs:
      - stage
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      KOTLIN_VERSION: ${{ inputs.version }}
      PACKAGE_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PACKAGE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kotlin-maven-staging-*-${{ env.PACKAGE_SHA }}
          path: build/packages/kotlin/maven-staging-parts
      - name: Merge Maven staging repositories
        run: >-
          mise run //:kotlin:prepare-release merge
          build/packages/kotlin/maven-staging
          build/packages/kotlin/maven-staging-parts/*
      - run: >-
          mise run //:kotlin:publish verify
          build/packages/kotlin/maven-staging "$KOTLIN_VERSION"
      # Publishing runs reuse this artifact through `verified_run_id`, so it
      # outlives the run long enough for a delayed or retried publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-maven-verified-${{ env.PACKAGE_SHA }}
          path: build/packages/kotlin/maven-staging
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Kotlin Maven publish
    # A publish that reuses a verified repository runs with `verify` skipped.
    if: >-
      !cancelled() && inputs.publish
      && (inputs.verified_run_id != '' || needs.verify.result == 'success')
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: maven-central
      url: ${{ inputs.release && format('https://central.sonatype.com/artifact/org.maplibre.nativeffi/maplibre-native-ffi/{0}', inputs.version) || 'https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/' }}
    permissions:
      actions: read
      contents: read
    env:
      KOTLIN_VERSION: ${{ inputs.version }}
      PUBLISH_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id || github.run_id }}
          name: kotlin-maven-verified-${{ env.PUBLISH_SHA }}
          path: build/packages/kotlin/maven
      - name: Sign the snapshot
        if: ${{ !inputs.release }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release sign-snapshot
          build/packages/kotlin/maven "$KOTLIN_VERSION"
      - name: Upload the snapshot
        if: ${{ !inputs.release }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release upload-snapshot
          build/packages/kotlin/maven "$KOTLIN_VERSION"
      - name: Revalidate the release tag
        if: ${{ inputs.release }}
        run: |
          set -euo pipefail

          git fetch --quiet --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_sha="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          if [[ "$tag_sha" != "$PUBLISH_SHA" ]]; then
            echo "$GITHUB_REF_NAME moved from $PUBLISH_SHA to $tag_sha" >&2
            exit 1
          fi
          context="$(mise run --no-deps ci:release-version "$GITHUB_REF_NAME")"
          if [[ "$(jq -r '.version' <<<"$context")" != "$KOTLIN_VERSION" ]]; then
            echo "$GITHUB_REF_NAME no longer names version $KOTLIN_VERSION" >&2
            exit 1
          fi
      - name: Check Maven Central immutability
        if: ${{ inputs.release }}
        run: |
          set -euo pipefail

          artifact="maplibre-native-ffi-${KOTLIN_VERSION}.pom"
          url="https://repo1.maven.org/maven2/org/maplibre/nativeffi/maplibre-native-ffi/${KOTLIN_VERSION}/${artifact}"
          http_code="$(curl --location --silent --show-error --output /dev/null \
            --write-out '%{http_code}' "$url")"
          case "$http_code" in
            404) ;;
            200)
              echo "org.maplibre.nativeffi:maplibre-native-ffi:$KOTLIN_VERSION already exists" >&2
              exit 1
              ;;
            *)
              echo "Maven Central returned HTTP $http_code while checking $url" >&2
              exit 1
              ;;
          esac
      - name: Sign and bundle the release
        if: ${{ inputs.release }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release bundle
          build/packages/kotlin/maven
          "build/packages/kotlin/maplibre-native-ffi-${KOTLIN_VERSION}.zip"
          "$KOTLIN_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.release }}
        with:
          name: kotlin-maven-central-${{ env.KOTLIN_VERSION }}
          path: build/packages/kotlin/maplibre-native-ffi-${{ env.KOTLIN_VERSION }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload and publish the Central deployment
        if: ${{ inputs.release }}
        id: central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          authorization="$(
            printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" \
              | base64 --wrap=0
          )"
          bundle="build/packages/kotlin/maplibre-native-ffi-${KOTLIN_VERSION}.zip"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            --form "bundle=@${bundle};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=kotlin-${KOTLIN_VERSION}&publishingType=AUTOMATIC")"
          if [[ ! "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Central returned an invalid deployment id: $deployment_id" >&2
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

          for attempt in {1..540}; do
            status_json="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer $authorization" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}")"
            deployment_state="$(jq -r '.deploymentState' <<<"$status_json")"
            echo "Central deployment $deployment_id is $deployment_state"
            case "$deployment_state" in
              PUBLISHED)
                {
                  echo "### Kotlin $KOTLIN_VERSION"
                  echo
                  echo "Published Maven Central deployment \`$deployment_id\`."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              FAILED)
                jq '.errors' <<<"$status_json" >&2
                exit 1
                ;;
              PENDING | VALIDATING | VALIDATED | PUBLISHING) ;;
              *)
                echo "Central returned unknown deployment state $deployment_state" >&2
                jq . <<<"$status_json" >&2
                exit 1
                ;;
            esac
            if (( attempt < 540 )); then
              sleep 10
            fi
          done
          echo "Central deployment $deployment_id did not finish within 90 minutes" >&2
          exit 1
