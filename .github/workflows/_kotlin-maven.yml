name: "↳ Kotlin Maven"

on:
  workflow_call:
    inputs:
      publish:
        description: Deploy the verified repository to Maven Central
        default: true
        required: false
        type: boolean
      release:
        description: Publish an immutable tagged release
        default: false
        required: false
        type: boolean
      run_id:
        description: CI run that produced the native packages
        required: true
        type: string
      sha:
        description: Source commit and artifact suffix
        required: true
        type: string
      verified_run_id:
        description: >-
          Run that already staged and verified this commit at this version. When
          set, staging and verification are skipped and the publish job reuses
          that run's verified repository.
        default: ""
        required: false
        type: string
      version:
        description: Kotlin package version
        required: true
        type: string

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"

jobs:
  stage:
    name: Kotlin Maven staging
    if: ${{ inputs.verified_run_id == '' }}
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      KOTLIN_VERSION: ${{ inputs.version }}
      PACKAGE_SHA: ${{ inputs.sha }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.PACKAGE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          target: macos-arm64-metal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: native-package-*-${{ env.PACKAGE_SHA }}
          path: build/packages/native/maven-input
      - run: mise run //:kotlin:publish stage "$KOTLIN_VERSION"
      - run: >-
          mise run //:kotlin:publish verify build/packages/kotlin/maven-staging
          "$KOTLIN_VERSION"
      # Snapshot publishing reuses the repository of a run on main, so only a
      # pull request keeps it briefly.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-maven-verified-${{ env.PACKAGE_SHA }}
          path: build/packages/kotlin/maven-staging
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}

  publish:
    name: Kotlin Maven publish
    # A publish that reuses a verified repository runs with `stage` skipped.
    if: >-
      !cancelled() && inputs.publish && (inputs.verified_run_id != '' ||
      needs.stage.result == 'success')
    needs:
      - stage
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    environment:
      name: maven-central
      url:
        ${{ inputs.release &&
        format('https://central.sonatype.com/artifact/org.maplibre.nativeffi/maplibre-native-ffi/{0}',
        inputs.version) ||
        'https://central.sonatype.com/repository/maven-snapshots/org/maplibre/nativeffi/'
        }}
    permissions:
      actions: read
      contents: read
    env:
      KOTLIN_VERSION: ${{ inputs.version }}
      PUBLISH_SHA: ${{ inputs.sha }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
          install_args: python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id || github.run_id }}
          name: kotlin-maven-verified-${{ env.PUBLISH_SHA }}
          path: build/packages/kotlin/maven
      - name: Sign the snapshot
        if: ${{ !inputs.release }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release sign-snapshot
          build/packages/kotlin/maven "$KOTLIN_VERSION"
      - name: Upload the snapshot
        if: ${{ !inputs.release }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release upload-snapshot
          build/packages/kotlin/maven "$KOTLIN_VERSION"
      - name: Sign and bundle the release
        if: ${{ inputs.release }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mise run --no-deps //:kotlin:prepare-release bundle
          build/packages/kotlin/maven
          "build/packages/kotlin/maplibre-native-ffi-${KOTLIN_VERSION}.zip"
          "$KOTLIN_VERSION"
      - name: Upload and publish the Central deployment
        if: ${{ inputs.release }}
        id: central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          authorization="$(
            printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" \
              | base64 --wrap=0
          )"
          bundle="build/packages/kotlin/maplibre-native-ffi-${KOTLIN_VERSION}.zip"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            --form "bundle=@${bundle};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=kotlin-${KOTLIN_VERSION}&publishingType=AUTOMATIC")"
          if [[ ! "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Central returned an invalid deployment id: $deployment_id" >&2
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

          for attempt in {1..540}; do
            status_json="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer $authorization" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}")"
            deployment_state="$(jq -r '.deploymentState' <<<"$status_json")"
            echo "Central deployment $deployment_id is $deployment_state"
            case "$deployment_state" in
              PUBLISHED)
                {
                  echo "### Kotlin $KOTLIN_VERSION"
                  echo
                  echo "Published Maven Central deployment \`$deployment_id\`."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              FAILED)
                jq '.errors' <<<"$status_json" >&2
                exit 1
                ;;
              PENDING | VALIDATING | VALIDATED | PUBLISHING) ;;
              *)
                echo "Central returned unknown deployment state $deployment_state" >&2
                jq . <<<"$status_json" >&2
                exit 1
                ;;
            esac
            if (( attempt < 540 )); then
              sleep 10
            fi
          done
          echo "Central deployment $deployment_id did not finish within 90 minutes" >&2
          exit 1
