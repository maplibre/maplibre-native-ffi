name: Label
on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened
permissions: {}
jobs:
  label:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Label with Jev
        env:
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 -m ci.label
