name: Label
on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened
permissions: {}
jobs:
  label:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Label with Jev
        env:
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 -m ci.label
