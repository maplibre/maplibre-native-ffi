# Generated by `mise run ci:generate-workflow`. Do not edit directly.
name: CI baseline
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}
jobs:
  plan:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      result: ${{ steps.plan.outputs.result }}
      scope: ${{ steps.plan.outputs.scope }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          CI_GROUP: baseline
          GH_TOKEN: ${{ github.token }}
        run: bash .mise/tasks/ci/plan
  coverage:
    name: coverage
    needs: plan
    if: needs.plan.outputs.mode == 'run'
    uses: ./.github/workflows/_ci-baseline.yml
    with:
      scope: ${{ needs.plan.outputs.scope }}
      jobs: ${{ needs.plan.outputs.jobs }}
    secrets: inherit
  required:
    name: ci-required (baseline)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: always()
    needs:
      - plan
      - coverage
    steps:
      - name: Check coverage result
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          PREVIOUS: ${{ needs.plan.outputs.result }}
          RESULT: ${{ needs.coverage.result }}
        run: |
          test "$PLAN" = success
          case "$MODE" in
            run) test "$RESULT" = success ;;
            reuse) test "$RESULT" = skipped && test "$PREVIOUS" = success ;;
            omit) test "$RESULT" = skipped ;;
            *) exit 1 ;;
          esac
