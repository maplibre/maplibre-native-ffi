name: Native Windows

on:
  workflow_call:

# ARM runners require Node 24 for JavaScript actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: native / windows-${{ matrix.arch }}-opengl
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            runs-on: windows-latest
            vcpkg-triplet: x64-windows
            msvc-arch: x64
            vs-arch: x64
          - arch: arm64
            runs-on: windows-11-arm
            vcpkg-triplet: arm64-windows
            msvc-arch: arm64
            vs-arch: ARM64

    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Mirror the cache key used by the Linux/macOS native jobs so the
      # MapLibre Native source tree is shared across platforms when possible.
      - name: Cache MapLibre Native source
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            third_party/maplibre-native
            .git/modules/third_party/maplibre-native
          key: mln-src-v2-${{ hashFiles('.gitmodules', 'cmake/mln_version.cmake') }}

      # Initialize maplibre-native and all its vendor submodules (including
      # the bundled vcpkg used for Windows dependency management).
      - name: Init submodules
        shell: pwsh
        run: |
          git submodule update --init --depth 1 third_party/maplibre-native
          git -C third_party/maplibre-native submodule update --init --recursive --depth 1

      - name: Set up MSVC developer tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Get vcpkg commit ID
        id: vcpkg-id
        shell: pwsh
        run: |
          $id = git -C third_party/maplibre-native/platform/windows/vendor/vcpkg rev-parse HEAD
          Add-Content -Path $env:GITHUB_OUTPUT -Value "commit_id=$id"

      - name: Cache vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: third_party/maplibre-native/platform/windows/vendor/vcpkg/archives
          key: vcpkg-${{ matrix.vcpkg-triplet }}-opengl-${{ steps.vcpkg-id.outputs.commit_id }}

      - name: Bootstrap vcpkg
        shell: cmd
        run: third_party\maplibre-native\platform\windows\vendor\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install vcpkg packages
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\third_party\\maplibre-native\\platform\\windows\\vendor\\vcpkg\\archives,readwrite"
        run: |
          powershell -ExecutionPolicy Bypass `
            -File third_party/maplibre-native/platform/windows/Get-VendorPackages.ps1 `
            -Triplet ${{ matrix.vcpkg-triplet }} `
            -Renderer OpenGL

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Install CMake 4.x
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: "4.3.2"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10

      - name: Configure CMake
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\third_party\\maplibre-native\\platform\\windows\\vendor\\vcpkg\\archives,readwrite"
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "CMake configure attempt $attempt of $maxAttempts"
            cmake -B build `
              -G "Visual Studio 17 2022" -A ${{ matrix.vs-arch }} `
              -DCMAKE_TOOLCHAIN_FILE="third_party/maplibre-native/platform/windows/custom-toolchain.cmake" `
              -DMLN_FFI_RENDER_BACKEND=opengl `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache `
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt $maxAttempts) {
              Write-Host "Attempt $attempt failed (exit $LASTEXITCODE), cleaning and retrying..."
              Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
            } else { exit $LASTEXITCODE }
          }

      - name: Build
        run: cmake --build build --target maplibre_native_c --config Release --parallel

      # GitHub Actions Windows runners have no GPU and ship only Microsoft's
      # legacy OpenGL 1.1 software renderer (opengl32.dll), which is far below
      # what MapLibre Native needs. Download Mesa3D's Windows DLLs (built with
      # the LLVM-pipe software rasterizer) and place them next to the test
      # binaries so they're loaded ahead of the system OpenGL.
      #
      # Mirrors the approach used by maplibre-native's node-ci.yml:
      #   x64   — pal1000/mesa-dist-win release archives (mesa3d-*.7z)
      #   arm64 — mmozeiko/build-mesa releases (mesa-llvmpipe-arm64-*.7z)
      - name: Download Mesa3D (Windows x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $headers = @{ Authorization = ('Bearer {0}' -f '${{ secrets.GITHUB_TOKEN }}') }
          $asset = (Invoke-WebRequest https://api.github.com/repos/pal1000/mesa-dist-win/releases -Headers $headers | ConvertFrom-Json)[0].assets `
            | Where-Object name -match 'mesa3d-.+-release-msvc\.7z' | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa3d.7z
          & 'C:\Program Files\7-Zip\7z.exe' e -obuild\Release .\mesa3d.7z x64\opengl32.dll x64\libgallium_wgl.dll x64\libGLESv2.dll
          Get-ChildItem build\Release\opengl32.dll, build\Release\libgallium_wgl.dll, build\Release\libGLESv2.dll
      - name: Download Mesa3D (Windows arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $headers = @{ Authorization = ('Bearer {0}' -f '${{ secrets.GITHUB_TOKEN }}') }
          $asset = (Invoke-WebRequest https://api.github.com/repos/mmozeiko/build-mesa/releases -Headers $headers | ConvertFrom-Json)[0].assets `
            | Where-Object name -match 'mesa-llvmpipe-arm64-.+\.7z' | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa3d.7z
          & 'C:\Program Files\7-Zip\7z.exe' e -obuild\Release .\mesa3d.7z opengl32.dll libGLESv2.dll
          Get-ChildItem build\Release\opengl32.dll, build\Release\libGLESv2.dll

      # The DLL must be on PATH so that the zig test runner can load it at
      # runtime. addRPath in build.zig has no effect on Windows.
      - name: Run tests
        shell: pwsh
        env:
          # LIBGL_ALWAYS_SOFTWARE forces Mesa to use the software rasterizer
          # rather than trying to detect a (non-existent) hardware GPU on the
          # CI runner. GALLIUM_DRIVER=llvmpipe selects the LLVM-pipe driver
          # inside Mesa for software rendering.
          LIBGL_ALWAYS_SOFTWARE: "true"
          GALLIUM_DRIVER: llvmpipe
        run: |
          $env:PATH = "${{ github.workspace }}\build\Release;$env:PATH"
          zig build test --summary all `
            -Dcmake-artifact-dir="${{ github.workspace }}\build\Release" `
            -Drender-backend=opengl

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-artifact\build\windows-${{ matrix.arch }}-opengl
          Copy-Item build\Release\maplibre_native_c.dll ci-artifact\build\windows-${{ matrix.arch }}-opengl\
          # Import library (.lib) needed for linking by downstream consumers.
          $lib = Get-ChildItem build -Recurse -Filter maplibre_native_c.lib | Select-Object -First 1
          if ($lib) { Copy-Item $lib.FullName ci-artifact\build\windows-${{ matrix.arch }}-opengl\ }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-${{ matrix.arch }}-opengl
          path: ci-artifact
          if-no-files-found: error
          retention-days: 14
