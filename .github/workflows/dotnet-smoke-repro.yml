# Throwaway: repeats the .NET example smoke on Windows arm64 to reproduce #899.
# This branch deletes ci-coverage.yml so that no other CI job runs.
name: dotnet smoke repro
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  repro:
    name: repro / ${{ matrix.preset }}
    runs-on: windows-11-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-arm64-wgl]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
          target: ${{ matrix.preset }}
      - name: Keep crash dumps
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP "dumps"
          New-Item -ItemType Directory -Path $dumps -Force | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $dumps -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpType -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name DumpCount -Value 10 -Type DWord
      - run: mise run build ${{ matrix.preset }}
      - run: mise run archive-native ${{ matrix.preset }}
      - run: mise run install-native-package ${{ matrix.preset }} build/packages/native/dist/maplibre-native-c-${{ matrix.preset }}.tar.gz
      - name: Build the .NET example
        shell: bash
        env:
          MISE_TASK_SKIP: //:build
        run: mise run //examples/dotnet-map:smoke ${{ matrix.preset }} || true
      - name: Get ProcDump
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile procdump.zip
          Expand-Archive procdump.zip -DestinationPath "$env:RUNNER_TEMP\procdump"
          Get-ChildItem "$env:RUNNER_TEMP\procdump"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object FullName
      - name: Run the .NET example under ProcDump, per variant
        shell: bash
        env:
          MLN_EXAMPLE_SMOKE: "1"
        run: |
          exe=$(find build/dotnet/${{ matrix.preset }} -name 'Maplibre.NativeFfi.Examples.DotnetMap.exe' | head -1)
          dir=$(dirname "$exe")
          procdump="$RUNNER_TEMP/procdump/procdump64a.exe"
          d3d12=$(ls "$RUNNER_TEMP"/mesa-d3d12-*/opengl32.dll | head -1)
          echo "example: $exe; d3d12 opengl32: $d3d12"
          run_variant() {
            local variant=$1
            local dumps="$RUNNER_TEMP/dumps/$variant"
            mkdir -p "$dumps"
            for i in $(seq 1 25); do
              for mode in owned-texture borrowed-texture; do
                echo "::group::$variant $i $mode"
                "$procdump" -accepteula -e -x "$(cygpath -w "$dumps")" "$(cygpath -w "$exe")" "$mode" > /dev/null 2>&1 || true
                echo "dumps so far: $(ls "$dumps" | grep -c '\.dmp$' || true)"
                echo "::endgroup::"
              done
            done
            echo "$variant crashes: $(ls "$dumps" | grep -c '\.dmp$' || true) of 50 runs"
          }
          # llvmpipe rasterizes on the calling thread, so a crash shows the GL call.
          LP_NUM_THREADS=0 run_variant llvmpipe-single-thread
          # Mesa's d3d12 driver on WARP replaces llvmpipe.
          cp "$d3d12" "$dir/opengl32.dll"
          GALLIUM_DRIVER=d3d12 LIBGL_ALWAYS_SOFTWARE=true run_variant d3d12
          rm "$dir/opengl32.dll"
      - name: Analyze dumps with cdb
        if: ${{ always() }}
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64" -Filter cdb.exe | Select-Object -First 1
          $pdb = (Get-ChildItem build -Recurse -Filter maplibre-native-c.pdb | Select-Object -First 1).DirectoryName
          Write-Output "pdb dir: $pdb"
          $sym = "$pdb;srv*$env:RUNNER_TEMP\symbols*https://msdl.microsoft.com/download/symbols"
          Get-ChildItem "$env:RUNNER_TEMP\dumps" -Directory | ForEach-Object {
            Get-ChildItem $_.FullName -Filter *.dmp | Select-Object -First 2 | ForEach-Object {
              Write-Output "=== $($_.FullName)"
              & $cdb.FullName -z $_.FullName -y $sym -lines -c ".ecxr; kn 40; ~*kn 30; q"
            }
          }
      - name: Upload crash dumps and symbols
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-smoke-${{ matrix.preset }}
          path: |
            ${{ runner.temp }}/dumps
            build/${{ matrix.preset }}/**/maplibre-native-c.pdb
            build/${{ matrix.preset }}/**/maplibre-native-c.dll
          if-no-files-found: ignore
          retention-days: 3
