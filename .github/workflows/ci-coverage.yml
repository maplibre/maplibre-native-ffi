          target: linux-gnu-x64-egl
          zig: true
          save-toolchains: true
      - name: Resolve Swift packages
        id: resolve
        run: mise run //bindings/swift:resolve
      - id: build
        run: mise run build linux-gnu-x64-egl
      - name: Run suites
        run: mise run ci:target linux-gnu-x64-egl
      - name: Save Zig packages
        if: steps.setup.outputs.zig-cache-hit != 'true'
