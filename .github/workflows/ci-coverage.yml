    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    needs:
      - plan
      - target-macos-arm64-metal
      - target-ios-arm64-metal
      - target-ios-simulator-arm64-metal
      - target-ios-maccatalyst-arm64-metal
      - target-tvos-arm64-metal
      - target-visionos-arm64-metal
      - target-tvos-simulator-arm64-metal
      - target-visionos-simulator-arm64-metal
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
          target: apple-xcframework
          gradle: false
      - name: Download Apple Metal native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-package-*-metal-${{ github.sha }}
          path: build/packages/native/xcframework-input
      - run: mise run package-xcframework build/packages/native/xcframework-input
      - name: Upload XCFramework
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-xcframework-${{ github.sha }}
          path: build/packages/native/dist/MaplibreNativeC.xcframework.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
    if: fromJSON(needs.plan.outputs.all) || contains(fromJSON(needs.plan.outputs.units), 'apple-mobile')
  kotlin-maven:
    name: Kotlin Maven
    permissions:
      actions: read
      contents: read
    needs:
      - plan
      - target-linux-gnu-x64-egl
      - target-linux-gnu-x64-vulkan
      - target-linux-gnu-arm64-egl
      - target-linux-gnu-arm64-vulkan
      - target-macos-arm64-metal
      - target-macos-arm64-vulkan
      - target-macos-arm64-egl
      - target-ios-arm64-metal
      - target-ios-simulator-arm64-metal
      - target-tvos-arm64-metal
      - target-tvos-simulator-arm64-metal
      - target-android-arm-egl
      - target-android-arm-vulkan
      - target-android-arm64-egl
      - target-android-arm64-vulkan
      - target-android-x64-egl
      - target-android-x64-vulkan
      - target-windows-x64-wgl
      - target-windows-x64-vulkan
      - target-windows-arm64-wgl
      - target-windows-arm64-vulkan
    uses: ./.github/workflows/_kotlin-maven.yml
    with:
      publish: false
      run_id: ${{ github.run_id }}
      sha: ${{ github.sha }}
      version: 0.1.0-SNAPSHOT
    if: fromJSON(needs.plan.outputs.all) || contains(fromJSON(needs.plan.outputs.units), 'maven')
  required:
    name: ci-required
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    if: always() && github.event.pull_request.state != 'closed'
    needs:
      - plan
      - hygiene
      - docs
      - target-linux-gnu-x64-egl
      - target-linux-gnu-x64-vulkan
      - target-linux-gnu-arm64-egl
      - target-linux-gnu-arm64-vulkan
      - target-linux-musl-x64-egl
      - target-linux-musl-x64-vulkan
      - target-linux-musl-arm64-egl
      - target-linux-musl-arm64-vulkan
      - target-freebsd-x64-egl
      - target-freebsd-x64-vulkan
      - target-emscripten-wasm32-webgl
      - target-emscripten-wasm32-webgpu
      - target-macos-arm64-metal
      - target-macos-arm64-vulkan
      - target-macos-arm64-egl
      - target-ios-arm64-metal
      - target-ios-simulator-arm64-metal
      - target-ios-maccatalyst-arm64-metal
      - target-tvos-arm64-metal
      - target-visionos-arm64-metal
      - target-tvos-simulator-arm64-metal
      - target-visionos-simulator-arm64-metal
      - target-android-arm-egl
      - target-android-arm-vulkan
      - target-android-arm64-egl
      - target-android-arm64-vulkan
      - target-android-x64-egl
      - target-android-x64-vulkan
      - target-ohos-arm64-egl
      - target-ohos-arm64-vulkan
      - target-ohos-x64-egl
      - target-ohos-x64-vulkan
      - target-windows-x64-wgl
      - target-windows-x64-vulkan
      - target-windows-arm64-wgl
      - target-windows-arm64-vulkan
      - android-multi
      - apple-xcframework
      - kotlin-maven
    steps:
      - name: Require every planned job
        env:
          PLAN: ${{ needs.plan.result }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          test "$PLAN" = success &&
          jq -e -n --argjson results "$RESULTS" 'all($results[]; .result == "success" or .result == "skipped")'
  support-issue:
    name: support issue
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    concurrency:
      group: support-issue
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
          install_args: python
      - name: Rewrite the support issue body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mise exec -- python docs/scripts/generate-support-matrix.py
          mise exec -- python docs/scripts/render-support-issue.py > "$RUNNER_TEMP/support-issue.md"
          issue="$(jq -r '.issue' docs/src/generated/support-matrix.json)"
          gh issue edit "$issue" --body-file "$RUNNER_TEMP/support-issue.md"
