# Rubberstamp counts passing units only from this file, and the ruleset
# requires its `ci-required` check, so CI keeps this path and the name `CI`.
# A closed pull request runs the workflow file in its frozen merge ref, so the
# old ci.yml path stays disabled in the repository settings.
name: CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      units:
        description: 'CI units as a JSON array, e.g. ["mingw"]. Leave blank for all units.'
        required: false
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
# A newer push to main cancels the run it supersedes. A re-run, such as the one
# a release starts for its cancelled commit, gets a group of its own so that
# neither run cancels the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.run_attempt == '1' && github.ref) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' || github.event_name == 'push' }}
# A closed pull request run uses the PR's frozen last merge commit, so an old
# workflow can still start. Every job skips rather than plan on stale code.
# Current triggers fire only on open PRs. Keep the guard anyway.
jobs:
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The Rubberstamp action reports every unit on anything but a ready plan,
    # and it never fails the job. The timeout leaves room for its own 600
    # second wait.
    timeout-minutes: 15
    if: github.event.pull_request.state != 'closed'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      jobs: ${{ steps.matrix.outputs.jobs }}
    steps:
      - name: Plan coverage
        if: github.event_name != 'workflow_dispatch' || inputs.units == ''
        id: plan
        uses: sargunv/rubberstamp/actions/plan@971af366b2649956a949eb48f2670cc66ba43988 # main
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          # The plan reads CMakePresets.json and docs/support-gaps.toml.
          sparse-checkout: |
            tools/ci
            docs
      - name: Plan the jobs that the units run
        id: matrix
        shell: bash
        env:
          ALL: ${{ inputs.units != '' && 'false' || steps.plan.outputs.all }}
          UNITS: ${{ inputs.units || steps.plan.outputs.units }}
        run: |
          python3 -m tools.ci.plan --all "$ALL" --units "$UNITS" |
            jq -r '"matrix=\(.matrix | tojson)", "jobs=\(.jobs | tojson)"' >> "$GITHUB_OUTPUT"
  hygiene:
    name: hygiene
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    # Hygiene always runs, without waiting for the plan.
    if: github.event.pull_request.state != 'closed'
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gradle: false
      - run: mise run ci:test
      # A generator probe whose toolchain is missing fails here instead of
      # skipping.
      - env:
          MLN_BINDGEN_REQUIRE_TOOLCHAINS: "1"
        run: mise run bindings:test-generator
      - run: mise run bindings:generate
      - run: dprint output-resolved-config > /dev/null
      - run: mise run fix
      - name: Check generated and formatted files
        run: |
          git update-index -q --refresh
          git diff --exit-code -- . ':(exclude).config/mise*.lock'
          git diff --cached --exit-code -- . ':(exclude).config/mise*.lock'
          untracked="$(git ls-files --others --exclude-standard)"
          test -z "$untracked" || { echo "$untracked"; exit 1; }
  docs:
    name: docs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'docs')
    steps:
      # The pages quote the latest release versions from the release tags.
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          fetch-tags: true
      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Dokka configures the Android target and requires its SDK platform.
      - name: Read the Android compile SDK
        id: android
        shell: bash
        run: |
          sdk="$(sed -n 's/^android-compileSdk = "\([0-9][0-9]*\)" *$/\1/p' gradle/libs.versions.toml)"
          test -n "$sdk" || { echo "android-compileSdk missing from gradle/libs.versions.toml" >&2; exit 1; }
          echo "compile-sdk=$sdk" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-${{ steps.android.outputs.compile-sdk }}
      - run: mise run //docs:build
        env:
          DOCS_BANNER: >-
            ${{ github.event_name == 'pull_request' && format(
              'This site is a preview of <a href="{0}">pull request #{1}</a>.',
              github.event.pull_request.html_url,
              github.event.number)
            || 'This site is a preview of the main branch. The published
            documentation is at <a
            href="https://maplibre.org/maplibre-native-ffi/">maplibre.org</a>.' }}
      - run: mise run //docs:package-cloudflare
      # Swift DocC filenames contain colons, which artifact uploads reject.
      - run: tar -cf build/cloudflare-pages.tar -C build/cloudflare-pages .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: error
          name: docs-cloudflare-${{ github.sha }}
          path: build/cloudflare-pages.tar
  docs-preview:
    name: docs preview
    needs: docs
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.url }}
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: node aqua:jqlang/jq
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-cloudflare-${{ github.sha }}
          path: build
      - run: |
          mkdir -p build/cloudflare-pages
          tar -xf build/cloudflare-pages.tar -C build/cloudflare-pages
      - name: Deploy the Cloudflare Pages preview
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BRANCH: >-
            ${{ github.event_name == 'pull_request' && format('pr-{0}',
            github.event.number) || 'main' }}
        run: mise run --no-deps //docs:deploy-cloudflare "$CLOUDFLARE_BRANCH"
  target:
    name: target / ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Blacksmith's checkout clones from a mirror next to its runners.
      - name: Check out repository
        if: startsWith(matrix.runner, 'blacksmith-')
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - name: Check out repository
        if: ${{ !startsWith(matrix.runner, 'blacksmith-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          mise-env: ${{ matrix.mise_env }}
          device: ${{ matrix.device }}
          software-gpu: ${{ matrix.software_gpu }}
          zig: ${{ matrix.zig }}
          gradle: ${{ matrix.gradle }}
          save-toolchains: ${{ matrix.save_toolchains }}
      # Steps that fetch dependencies or boot a device carry the names that
      # ci/retry.py treats as infrastructure.
      - name: Resolve Swift packages
        id: resolve
        if: matrix.swift
        run: |
          mise run //bindings/swift:resolve
          case '${{ matrix.preset }}' in
            android-*) mise run //bindings/swift:android-sdk ;;
          esac
      - id: build
        run: mise run build ${{ matrix.preset }}
      - name: Boot ${{ matrix.device }}
        id: boot
        if: matrix.device != ''
        run: mise exec -- ${{ matrix.device_command }}
      # The task runs every suite even after one failed, and fails at the end.
      # It runs only when the build and device are ready, like every step that
      # follows it, so the package uploads only from a job whose suites passed.
      - name: Run suites
        run: mise run ci:target ${{ matrix.preset }}
      # A failed job must not claim the immutable shared Zig cache with a
      # partial set of packages. Only rows covering every Zig project save it.
      - name: Save Zig packages
        if: matrix.zig == 'cache' && steps.setup.outputs.zig-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig/p
            ~/AppData/Local/zig/p
          key: ${{ steps.setup.outputs.zig-cache-key }}
      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-package-${{ matrix.preset }}-${{ github.sha }}
          path: build/packages/native/dist/maplibre-native-c-${{ matrix.preset }}.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
      - name: Upload TypeScript addon
        if: matrix.addon == 'typescript'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-addon-${{ matrix.preset }}-${{ github.sha }}
          path: bindings/typescript/native/build/${{ matrix.preset }}/install
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
      - name: Upload Python runtime wheel
        if: matrix.python_wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-runtime-${{ matrix.preset }}-${{ github.sha }}
          path: bindings/python/dist/maplibre_native_ffi_runtime_*.whl
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
      - name: Upload ArkTS addon
        if: matrix.addon == 'arkts'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arkts-addon-${{ matrix.preset }}-${{ github.sha }}
          path: bindings/typescript/native/build/${{ matrix.preset }}/install
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
      - name: Upload Android emulator logs
        if: always() && matrix.emulator_logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-logs-${{ matrix.preset }}-${{ github.run_attempt }}
          path: ~/.local/state/devices-cli/logs
          if-no-files-found: ignore
          retention-days: 30
  # Each packaging job waits for the whole target matrix, so any failed target
  # skips it. The run fails on that target either way.
  android-multi:
    name: package / android-multi-abi
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    needs:
      - plan
      - target
    if: contains(fromJSON(needs.plan.outputs.jobs), 'android-multi')
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Download Android native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-package-android-*-${{ github.sha }}
          path: build/packages/native/android-multi-input
      - run: mise run //:kotlin:verify-android-multi-abi build/packages/native/android-multi-input
  # The artifact is what the native package publish uploads.
  apple-xcframework:
    name: package / xcframework
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    needs:
      - plan
      - target
    if: contains(fromJSON(needs.plan.outputs.jobs), 'apple-xcframework')
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gradle: false
      - name: Download Apple Metal native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-package-*-metal-${{ github.sha }}
          path: build/packages/native/xcframework-input
      - run: mise run package-xcframework build/packages/native/xcframework-input
      - name: Upload XCFramework
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-xcframework-${{ github.sha }}
          path: build/packages/native/dist/MaplibreNativeC.xcframework.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
  # The package that a release writes into the distribution repository, with
  # this run's XCFramework in place of the release's.
  swift-package:
    name: package / swiftpm
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 30
    needs:
      - plan
      - target
      - apple-xcframework
    if: contains(fromJSON(needs.plan.outputs.jobs), 'swift-package')
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python
      - name: Download XCFramework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-xcframework-${{ github.sha }}
          path: build/packages/native/swift-input
      - run: mise run --no-deps //bindings/swift:test:package build/packages/native/swift-input
  vcpkg-registry:
    name: package / vcpkg
    env:
      MISE_NO_HOOKS: "1"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs:
      - plan
      - target
    if: contains(fromJSON(needs.plan.outputs.jobs), 'vcpkg-registry')
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python aqua:Kitware/CMake ninja sccache
      - name: Download native archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-package-linux-gnu-x64-egl-${{ github.sha }}
          path: build/packages/native/vcpkg-input
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout 5363acb796e576328288fae60c25304e227e9839
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Build registry consumer
        run: >-
          mise exec --no-deps -- python3 tools/release/test_vcpkg.py
          build/packages/native/vcpkg-input "$RUNNER_TEMP/vcpkg"
          --triplet x64-linux --backend opengl
  conan-recipes:
    name: package / conan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs:
      - plan
      - target
    if: contains(fromJSON(needs.plan.outputs.jobs), 'conan-recipes')
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python aqua:astral-sh/uv aqua:Kitware/CMake
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-package-linux-gnu-x64-vulkan-${{ github.sha }}
          path: build/packages/native/conan-input
      - name: Resolve the recipe and build a CMakeDeps consumer
        run: >-
          mise exec --no-deps -- uv tool run --from conan==2.33.0
          python tools/release/check_conan.py
          build/packages/native/conan-input/maplibre-native-c-linux-gnu-x64-vulkan.tar.gz
  xmake-package:
    name: package / xmake
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs:
      - plan
      - target
    if: contains(fromJSON(needs.plan.outputs.jobs), 'xmake-package')
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python
      - name: Install xmake
        run: |
          curl --fail --location --output "$RUNNER_TEMP/xmake" \
            https://github.com/xmake-io/xmake/releases/download/v3.1.2/xmake-bundle-v3.1.2.linux.x86_64
          echo "ac216aa71f4954cc1129aabf1099571d618211c1ef8db8fba871377ec5fb47cd  $RUNNER_TEMP/xmake" | sha256sum --check
          chmod +x "$RUNNER_TEMP/xmake"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Download native archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-package-linux-gnu-x64-egl-${{ github.sha }}
          path: build/packages/native/xmake-input
      - name: Build and run the xmake consumer
        run: >-
          mise exec --no-deps python -- python tools/release/test_xmake_package.py
          build/packages/native/xmake-input/maplibre-native-c-linux-gnu-x64-egl.tar.gz
  # Every run stages at the snapshot version, because snapshot publication
  # reuses the verified repository of a run on main.
  kotlin-maven:
    name: package / maven
    permissions:
      actions: read
      contents: read
    needs:
      - plan
      - target
    if: contains(fromJSON(needs.plan.outputs.jobs), 'kotlin-maven')
    uses: ./.github/workflows/_kotlin-maven.yml
    with:
      run_id: ${{ github.run_id }}
      sha: ${{ github.sha }}
      version: 0.1.0-SNAPSHOT
  dotnet-nuget:
    name: package / nuget
    permissions:
      actions: read
      contents: read
    needs:
      - plan
      - target
    if: contains(fromJSON(needs.plan.outputs.jobs), 'dotnet-nuget')
    uses: ./.github/workflows/_dotnet-nuget.yml
    with:
      run_id: ${{ github.run_id }}
      sha: ${{ github.sha }}
      version: 0.202601.0-dev.0
  python-wheels:
    name: package / pypi
    permissions:
      actions: read
      contents: read
    needs:
      - plan
      - target
    if: contains(fromJSON(needs.plan.outputs.jobs), 'python-wheels')
    uses: ./.github/workflows/_python-wheels.yml
    with:
      run_id: ${{ github.run_id }}
      sha: ${{ github.sha }}
      version: 0.202601.0.dev0
  typescript-npm:
    name: package / npm
    permissions:
      actions: read
      contents: read
    needs:
      - plan
      - target
      - apple-xcframework
    if: contains(fromJSON(needs.plan.outputs.jobs), 'typescript-npm')
    uses: ./.github/workflows/_typescript-npm.yml
    with:
      run_id: ${{ github.run_id }}
      sha: ${{ github.sha }}
      version: 0.202601.0-dev.0
  arkts-ohpm:
    name: package / ohpm
    permissions:
      actions: read
      contents: read
    needs:
      - plan
      - target
    if: contains(fromJSON(needs.plan.outputs.jobs), 'arkts-ohpm')
    uses: ./.github/workflows/_arkts-ohpm.yml
    with:
      run_id: ${{ github.run_id }}
      sha: ${{ github.sha }}
      version: 0.202601.0-dev.0
  # A skipped job passes a required check, so a failed plan must fail this one.
  required:
    name: ci-required
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    if: always() && github.event.pull_request.state != 'closed'
    needs:
      - plan
      - hygiene
      - docs
      - docs-preview
      - target
      - android-multi
      - apple-xcframework
      - swift-package
      - vcpkg-registry
      - conan-recipes
      - xmake-package
      - kotlin-maven
      - dotnet-nuget
      - python-wheels
      - typescript-npm
      - arkts-ohpm
      - support-matrix
    steps:
      - name: Require every planned job
        env:
          PLAN: ${{ needs.plan.result }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          test "$PLAN" = success &&
          jq -e -n --argjson results "$RESULTS" 'all($results[]; .result == "success" or .result == "skipped")'
  # Renders the tracking issue's body, which checks the support data, and shows
  # it in the run summary.
  support-matrix:
    name: support matrix
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'support-matrix')
    outputs:
      issue: ${{ steps.render.outputs.issue }}
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install_args: python
      - name: Render the support issue body
        id: render
        run: |
          set -euo pipefail

          mise exec -- python docs/scripts/generate-support-matrix.py
          mise exec -- python docs/scripts/render-support-issue.py > "$RUNNER_TEMP/support-issue.md"
          cat "$RUNNER_TEMP/support-issue.md" >> "$GITHUB_STEP_SUMMARY"
          echo "issue=$(jq -r '.issue' docs/src/generated/support-matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Upload the support issue body
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-issue-${{ github.sha }}
          path: ${{ runner.temp }}/support-issue.md
          if-no-files-found: error
          retention-days: 1
  # The tracking issue follows main, while the site it summarizes follows
  # snapshot deploys. Only a push to main may write the issue, from a job that
  # runs none of the repository's code.
  support-issue:
    name: support issue
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: support-matrix
    if: github.event_name == 'push'
    permissions:
      issues: write
    concurrency:
      group: support-issue
      cancel-in-progress: false
    steps:
      - name: Download the support issue body
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: support-issue-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Rewrite the support issue body
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.support-matrix.outputs.issue }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/support-issue.md"
