# Generated by `mise run ci:generate-workflow`. Do not edit directly.
name: CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.run_attempt == '1' && github.ref) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' || github.event_name == 'push' }}
jobs:
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    if: github.event.pull_request.state != 'closed'
    outputs:
      all: ${{ steps.plan.outputs.all }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - name: Plan coverage
        id: plan
        uses: sargunv/rubberstamp/actions/plan@971af366b2649956a949eb48f2670cc66ba43988 # main
  hygiene:
    name: hygiene
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
          gradle: false
      - run: mise run ci:generate-workflow --check
      - run: mise run ci:test
      - env:
          MLN_BINDGEN_REQUIRE_TOOLCHAINS: '1'
        run: mise run bindings:test-generator
      - run: mise run bindings:generate
      - run: dprint output-resolved-config > /dev/null
      - run: mise run fix
      - name: Check generated and formatted files
        run: |
          git update-index -q --refresh
          git diff --exit-code -- . ':(exclude)mise*.lock'
          git diff --cached --exit-code -- . ':(exclude)mise*.lock'
          untracked="$(git ls-files --others --exclude-standard)"
          test -z "$untracked" || { echo "$untracked"; exit 1; }
    if: github.event.pull_request.state != 'closed'
  docs:
    name: docs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          fetch-tags: true
      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci-deps
        id: setup
        with:
          sccache-access-key-id: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          sccache-secret-access-key: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36
      - run: mise run //docs:build
    needs:
      - plan
    if: fromJSON(needs.plan.outputs.all) || contains(fromJSON(needs.plan.outputs.units), 'docs')
  target-linux-gnu-x64-egl:
    name: target / linux-gnu-x64-egl
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    environment: ${{ github.event_name == 'push' && 'sccache' || '' }}
    steps:
