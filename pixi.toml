# https://pixi.prefix.dev/
# Pixi supplies native packages from conda-forge so C/C++ dependencies are
# declared in the repository. Platform SDKs such as Xcode still come from the OS.

[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[system-requirements]
macos = "14.0"

[dependencies]
# Core build/package tools — available on all conda-forge platforms incl. win-arm64
cmake = ">=4,<5"
icu = "*"
libcurl = "*"
libjpeg-turbo = "*"
libpng = "*"
libuv = "*"
libwebp = "*"
ninja = "*"
pkg-config = "*"
zlib = "*"

# clang-tools, glslang, libvulkan-loader, and sdl3 are NOT yet packaged for
# win-arm64 on conda-forge, so they are listed per platform below.

[target.linux-64.dependencies]
clang = ">=22,<23"
clangdev = ">=22,<23"
clang-tools = ">=22,<23"
glslang = "*"
libvulkan-loader = "*"
mesalib = ">=26.0.3,<27"
sdl3 = ">=3.4,<4"
sysroot_linux-64 = "*"
vulkan-tools = ">=1.4.341.0,<2"

[target.linux-aarch64.dependencies]
clang = ">=22,<23"
clangdev = ">=22,<23"
clang-tools = ">=22,<23"
glslang = "*"
libvulkan-loader = "*"
mesalib = ">=26.0.3,<27"
sdl3 = ">=3.4,<4"
sysroot_linux-aarch64 = "*"
vulkan-tools = ">=1.4.341.0,<2"

[target.osx-64.dependencies]
clang-tools = ">=22,<23"
glslang = "*"
libvulkan-loader = "*"
sdl3 = ">=3.4,<4"

[target.osx-arm64.dependencies]
clang-tools = ">=22,<23"
glslang = "*"
libvulkan-loader = "*"
moltenvk = ">=1.4.1,<2"
sdl3 = ">=3.4,<4"

[target.win-64.dependencies]
clang-tools = ">=22,<23"
cxx-compiler = "*"
dlfcn-win32 = "*"
glslang = "*"
libvulkan-loader = "*"
sdl3 = ">=3.4,<4"
