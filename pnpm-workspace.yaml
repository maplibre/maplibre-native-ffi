packages:
  - bindings/typescript
  - docs

allowBuilds:
  esbuild: true
  sharp: true
  # Evaluation pin of birkskyum's unreleased TypeDoc TS 7.1 port. The package
  # is not on npm and its prepare/prepack scripts build dist/.
  # https://github.com/TypeStrong/typedoc/issues/3098
  "typedoc@git+https://github.com/birkskyum/typedoc.git": true
