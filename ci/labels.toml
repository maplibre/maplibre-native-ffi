# Labels that Jev applies to a new issue or pull request. Jev answers one Choice
# for a `choice` group and one Noul per label in any other group, reading the
# label's meaning and its group's `rule`. A group gets labels only when it has
# none when the item opens, so a label that a template, a bot, or a person set
# always wins. A label is applied at or above its group's `threshold`, and a
# `required` group also gets its most likely label when none reaches it. Run
# `uv run python -m ci.label_eval` before changing this file.

overview = """
This repository is a C API for MapLibre Native, the C++ map renderer vendored as
a git submodule with carried patches. Language bindings (Rust, Zig, Kotlin,
Swift, .NET, Go, Python, Dart) wrap the C API in idiomatic interfaces, and
small example apps use them. Mise defines tools and tasks, CMake presets define
native targets, and Gradle builds the Android and Kotlin packages.

Maintainers label every issue and pull request so that they can find related
work later. Labels describe the subject of the work: what it changes, fixes,
or asks for. A file that a change touches only in passing, such as a docs page
or a test updated alongside the real change, does not make its area or binding
the subject. A label that names one binding, platform, or render backend
applies only when the work is specific to it, not when it applies to every
binding, platform, or backend alike.
"""

[groups.kind]
choice = true
required = true
threshold = 0.5

[groups.kind.labels]
bug = """
Fixes or reports broken behavior: a crash, a wrong result, a failing build or CI
job, a violated API contract, or a regression.
"""
feature = """
Adds or changes a capability that users of the C API, a binding, an example, or
the tooling can use, including new API surface, new targets, and new packaging.
"""
perf = """
Improves runtime speed, memory or resource use, binary size, or build and CI
time, without changing what the software does.
"""
chore = """
Maintenance that adds no capability and fixes nothing broken: refactoring,
cleanup, tests, documentation, formatting, routine dependency updates, and
process changes.
"""
research = """
Investigates a question, evaluates a design, or builds a deliberate prototype,
where the outcome is knowledge or a decision rather than shipped code.
"""

[groups.area]
required = true
threshold = 0.8

[groups.area.labels]
"area:runtime" = """
The runtime: the owner thread, the run loop pump, wake sources, the scheduler,
runtime lifetime, thread-affinity rules, event delivery, logging, and the
runtime-wide resource loading: resource providers and transforms, HTTP and
network settings, the cache database, and offline operations.
"""
"area:map" = """
Maps and their content: map lifecycle and options, the camera and its
animations, styles and style expressions, sources, layers, images, text and
glyphs, feature state, and map events and observers.
"""
"area:render" = """
Rendering: render sessions, render targets, surfaces, textures, readback, frame
pacing, and the OpenGL, Vulkan, Metal, and WebGPU backend adapters.
"""
"area:query" = """
Queries: rendered feature queries, source feature queries, and geometry or
projection queries.
"""
"area:plugins" = """
Layer plugins and custom render hooks that host code supplies.
"""
"area:bindings" = """
The language bindings themselves: a binding's API shape, memory and thread
safety, code generation, native interop, or its tests. Exposing a new C API
capability through the bindings is about that capability's area, and also about
the bindings only when the binding layer needs its own design or fixes.
"""
"area:examples" = """
The demo apps in `examples/` (android-map, c-map, compose-map, dotnet-map,
go-map, lwjgl-map, rust-map, swift-map, zig-map, zig-readback) and the hosts
they run in.
"""
"area:docs" = """
The documentation as the subject: the documentation site, the specifications,
public header comments, API reference generation, snippets, and repository
guidance such as AGENTS.md.
"""
"area:tooling" = """
Build and development infrastructure: CMake, mise tasks and tools, Gradle
builds, CI workflows and planning, packaging, releases, formatters and linters,
and dependency management.
"""
"area:upstream" = """
A patch to MapLibre Native that this repository carries ahead of upstream under
`patches/maplibre-native/`, or a change to the pinned
`third_party/maplibre-native` submodule commit. Work that only calls into
MapLibre Native, such as the C++ in `src/` that wraps it, does not qualify.
"""

[groups.binding]
threshold = 0.8
rule = """
Applies only when the work is specific to this binding: it concerns this binding
and not the others, or this binding differently from the rest. A change that
every binding, or several bindings alike, picks up does not qualify.
"""

[groups.binding.labels]
"binding:kotlin" = """
The Kotlin binding, or an example built with it: android-map, compose-map, or
lwjgl-map.
"""
"binding:swift" = """
The Swift binding, or an example built with it such as swift-map.
"""
"binding:rust" = """
The Rust binding, or an example built with it such as rust-map.
"""
"binding:dotnet" = """
The .NET (C#) binding, or an example built with it such as dotnet-map.
"""
"binding:python" = "The Python binding, or an example built with it."
"binding:go" = "The Go binding, or an example built with it such as go-map."
"binding:dart" = "The Dart or Flutter binding, or an example built with it."
"binding:zig" = """
The Zig binding, or an example built with it such as zig-map or zig-readback.
"""
"binding:typescript" = "A TypeScript binding, or an example built with it."
"binding:vala" = "A Vala binding, or an example built with it."
"binding:arkts" = """
An ArkTS binding for OpenHarmony, or an example built with it.
"""

[groups.platform]
threshold = 0.8
rule = """
Applies only when the work is specific to this platform: it concerns behavior,
code, builds, or packaging that differ on this platform. Work that applies to
every platform alike does not qualify.
"""

[groups.platform.labels]
"platform:linux" = """
Linux-specific behavior, builds, packaging, or reproduction.
"""
"platform:macos" = """
macOS-specific behavior, builds, packaging, or reproduction.
"""
"platform:windows" = """
Windows-specific behavior, builds, packaging, or reproduction.
"""
"platform:android" = """
Android-specific behavior, builds, packaging, or reproduction.
"""
"platform:ios" = """
iOS-specific behavior, builds, packaging, or reproduction, including the other
Apple mobile platforms such as iPadOS, tvOS, and visionOS.
"""
"platform:ohos" = """
OpenHarmony-specific behavior, builds, packaging, or reproduction.
"""
"platform:browser" = """
Browser-specific behavior, builds, packaging, or reproduction, such as the
Emscripten and WebAssembly targets.
"""

[groups.renderer]
threshold = 0.8
rule = """
Applies only when the work is specific to this render backend. Work that applies
to every backend alike does not qualify.
"""

[groups.renderer.labels]
"renderer:opengl" = """
The OpenGL or OpenGL ES render backend, with its EGL, WGL, or WebGL context.
"""
"renderer:vulkan" = "The Vulkan render backend."
"renderer:metal" = "The Metal render backend."
"renderer:webgpu" = "The WebGPU render backend."

[groups.upstream]
threshold = 0.8

[groups.upstream.labels]
upstream = """
The cause of the bug, or the missing capability, is in MapLibre Native's own
code rather than in this repository's C API, bindings, or tooling.
"""

[groups.dependencies]
threshold = 0.8

[groups.dependencies.labels]
dependencies = """
Upgrading, adding, removing, or managing a dependency is the substantive
subject, such as a package, toolchain, or submodule version change.
"""
