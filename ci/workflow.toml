[[suites]]
id = "rust"
project = "rust"
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/rust:test" },
  { task = "//examples/rust-map:check", exclude = ["macos-arm64-egl"] },
]

[[suites]]
id = "zig"
project = "zig"
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/zig:test" },
  { task = "//examples/zig-map:build" },
  { task = "//examples/zig-readback:run" },
]

[[suites]]
id = "kotlin"
project = "kotlin"
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/kotlin:jvmTest" },
  { task = "//bindings/kotlin:nativeTest", platforms = ["linux", "macos"] },
  { task = "//examples/compose-map:build" },
  { task = "//examples/lwjgl-map:build" },
]

[[suites]]
id = "swift"
project = "swift"
platforms = ["linux", "macos"]
commands = [
  { task = "//bindings/swift:test" },
  { task = "//examples/swift-map:build", include = ["macos-arm64-metal"] },
]

[[suites]]
id = "dotnet"
project = "dotnet"
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/dotnet:test" },
  { task = "//examples/dotnet-map:build" },
]

[[suites]]
id = "go"
