# Desktop suites run in the matching native target job and reuse its build tree.
[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/rust:test", exclude = ["linux-x64-vulkan"] },
  { task = "//bindings/rust:test", args = ["release"], include = ["linux-x64-vulkan"] },
  { task = "//examples/rust-map:check", exclude = ["macos-arm64-egl"] },
]

# Every other binding step is handed a local install prefix, so this is the only
# coverage of acquiring the native library from the snapshot release. The
# download path differs only in which preset it resolves, so one platform is
# enough.
[[suites]]
platforms = ["linux"]
commands = [
  { task = "//bindings/rust:test:download", include = ["linux-x64-vulkan"], preset = false },
  { task = "//bindings/dart:test:download", include = ["linux-x64-vulkan"], preset = false },
]

# Zig is unavailable on Windows ARM64; see the `core:zig` note in bindings/zig/mise.toml.
[[suites]]
platforms = ["linux", "macos", "windows"]
exclude = ["windows-arm64-wgl", "windows-arm64-vulkan"]
commands = [
  { task = "//bindings/zig:test" },
  { task = "//examples/zig-map:build" },
  { task = "//examples/zig-readback:run" },
]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/kotlin:test" },
  { task = "//examples/compose-map:build" },
  { task = "//examples/lwjgl-map:build" },
]

[[suites]]
platforms = ["linux", "macos"]
commands = [
  { task = "//bindings/swift:test", exclude = ["linux-x64-vulkan"] },
  { task = "//bindings/swift:test", args = ["release"], include = ["linux-x64-vulkan"] },
  { task = "//examples/swift-map:build", include = ["macos-arm64-metal"] },
]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [{ task = "//bindings/dotnet:test" }]

[[suites]]
platforms = ["linux", "macos"]
commands = [{ task = "//bindings/go:test" }]

[[suites]]
platforms = ["linux"]
commands = [
  { task = "//examples/go-map:check", include = ["linux-x64-egl", "linux-arm64-egl"] },
]

[[suites]]
platforms = ["linux"]
commands = [{ task = "//examples/c-map:build" }]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [{ task = "//bindings/python:test" }]

# TODO(#412): Re-enable //bindings/dart:test once thread-affine ownership is
# safe across isolate migration; test processes otherwise wedge until timeout.
[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [{ task = "//bindings/dart:build" }]

# Run Rust browser tests against the Emscripten build.
[[suites]]
platforms = ["emscripten"]
commands = [{ task = "//bindings/rust:test" }]
