# Desktop suites run in the matching native target job and reuse its build tree.
[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [
  { task = "//bindings/rust:test", exclude = ["linux-gnu-x64-vulkan"] },
  { task = "//bindings/rust:test", args = ["release"], include = ["linux-gnu-x64-vulkan"] },
  { task = "//examples/rust-map:check", exclude = ["macos-arm64-egl"] },
]

# A glibc runner builds the consumers, which execute against their packaged
# musl libraries in Alpine.
[[suites]]
platforms = ["linux-musl"]
commands = [
  { task = "//bindings/rust:test" },
  { task = "//bindings/dotnet:test" },
]

# Every other binding step is handed a local install prefix. These commands
# serve the package that this job built through the snapshot acquisition path.
# The path differs only in which preset it resolves, so one platform is enough.
[[suites]]
platforms = ["linux-gnu"]
commands = [
  { task = "//bindings/rust:test:download", include = ["linux-gnu-x64-vulkan"] },
  { task = "//bindings/dart:test:download", include = ["linux-gnu-x64-vulkan"] },
]

# Zig is unavailable on Windows ARM64; see the `core:zig` note in bindings/zig/mise.toml.
[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
exclude = ["windows-arm64-wgl", "windows-arm64-vulkan"]
commands = [
  { task = "//bindings/zig:test" },
  { task = "//examples/zig-map:build" },
  { task = "//examples/zig-readback:run" },
]

[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [
  { task = "//bindings/kotlin:test" },
  { task = "//examples/compose-map:build" },
  { task = "//examples/lwjgl-map:build" },
]

[[suites]]
platforms = ["linux-gnu", "macos"]
commands = [
  { task = "//bindings/swift:test", exclude = ["linux-gnu-x64-vulkan"] },
  { task = "//bindings/swift:test", args = ["release"], include = ["linux-gnu-x64-vulkan"] },
  { task = "//examples/swift-map:build", include = ["macos-arm64-metal"] },
]

[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [{ task = "//bindings/dotnet:test" }]

[[suites]]
platforms = ["linux-gnu", "macos"]
commands = [{ task = "//bindings/go:test" }]

[[suites]]
platforms = ["linux-gnu"]
commands = [
  { task = "//examples/go-map:check", include = ["linux-gnu-x64-egl", "linux-gnu-arm64-egl"] },
]

[[suites]]
platforms = ["linux-gnu"]
commands = [{ task = "//examples/c-map:build" }]

[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [{ task = "//bindings/python:test" }]

[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [{ task = "//bindings/dart:test" }]

# Run Rust browser tests against the Emscripten build.
[[suites]]
platforms = ["emscripten"]
commands = [{ task = "//bindings/rust:test" }]
