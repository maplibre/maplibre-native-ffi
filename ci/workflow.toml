# These remain Gradle builds because the multi-ABI row has no CMake preset.
android = [
  { target = "android-arm64-egl", abi = "arm64-v8a", backend = "opengl", build_map = true },
  { target = "android-arm64-vulkan", abi = "arm64-v8a", backend = "vulkan", build_map = false },
  { target = "android-x64-egl", abi = "x86_64", backend = "opengl", build_map = true },
  { target = "android-x64-vulkan", abi = "x86_64", backend = "vulkan", build_map = false },
  { target = "android-multi-vulkan", abi = "arm64-v8a,x86_64", backend = "vulkan", build_map = true },
]

# Target metadata drives the native, package, and desktop ecosystem matrices.
[[targets]]
preset = "linux-arm64-egl"
runner = "ubuntu-24.04-arm"
backend = "opengl"
graphics = "software"
platform_sdk = "none"
test = true
package = true

