# The jobs that each coverage unit in `.config/rubberstamp.yml` owns. Rubberstamp
# plans which units a pull request runs. `targets` matches native target
# presets, and `jobs` names the other jobs. Every job except hygiene belongs to
# exactly one unit, and a packaging job also runs the target jobs it consumes.
[units]
docs = { jobs = ["docs"] }
linux-x64 = { targets = ["linux-gnu-x64-*"] }
linux-arm64 = { targets = ["linux-gnu-arm64-*"] }
linux-musl = { targets = ["linux-musl-*"] }
freebsd = { targets = ["freebsd-*"] }
macos = { targets = ["macos-*"] }
apple-mobile = { targets = [
  "ios-*",
  "tvos-*",
  "visionos-*",
], jobs = [
  "apple-xcframework",
] }
windows-x64 = { targets = ["windows-x64-*"] }
windows-arm64 = { targets = ["windows-arm64-*"] }
android = { targets = ["android-*"], jobs = ["android-multi"] }
ohos = { targets = ["ohos-*"] }
web = { targets = ["emscripten-*"] }
maven = { jobs = ["kotlin-maven"] }
