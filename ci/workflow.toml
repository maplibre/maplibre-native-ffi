# This Gradle build has no corresponding single-ABI CMake preset.
android_multi = { preset = "android-multi-vulkan", abis = "arm64-v8a,x86_64" }

# Desktop suites run in the matching native target job and reuse its build tree.
[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/rust:test" },
  { task = "//examples/rust-map:check", exclude = ["macos-arm64-egl"] },
]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/zig:test" },
  { task = "//examples/zig-map:build" },
  { task = "//examples/zig-readback:run" },
]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/kotlin:jvmTest" },
  { task = "//bindings/kotlin:nativeTest", platforms = ["linux", "macos"], exclude = ["linux-arm64-egl", "linux-arm64-vulkan"] },
  { task = "//examples/compose-map:build" },
  { task = "//examples/lwjgl-map:build" },
]

[[suites]]
platforms = ["linux", "macos"]
commands = [
  { task = "//bindings/swift:test" },
  { task = "//examples/swift-map:build", include = ["macos-arm64-metal"] },
]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [{ task = "//bindings/dotnet:test" }]

[[suites]]
platforms = ["linux", "macos"]
commands = [{ task = "//bindings/go:test" }]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [{ task = "//bindings/python:test" }]
