[coverage]
baseline = ["linux-gnu-x64-egl", "linux-gnu-x64-vulkan"]
# These targets add coverage when a pull request leaves draft status.
ready = [
  "macos-arm64-metal",
  "windows-x64-wgl",
  "windows-x64-vulkan",
  "android-x64-egl",
  "android-x64-vulkan",
  "emscripten-wasm32-webgl",
  "emscripten-wasm32-webgpu",
]

# Desktop suites run in the matching native target job and reuse its build tree.
#
# Every example's `smoke` task renders one frame and exits. A command marked
# `display` opens a window, so on Linux, whose runners have no display server,
# it runs under Xvfb and draws with Mesa's software drivers. A suite's
# `environments` set variables on the steps of its commands in the listed
# targets.
[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [
  { task = "//bindings/rust:test", exclude = ["linux-gnu-x64-vulkan"] },
  { task = "//bindings/rust:test", args = ["release"], include = ["linux-gnu-x64-vulkan"] },
  { task = "//examples/rust-map:check", exclude = ["macos-arm64-egl"] },
  { task = "//examples/rust-map:smoke", exclude = ["macos-arm64-egl"], display = true },
]

# A glibc runner builds the consumers, which execute against their packaged
# musl libraries in Alpine.
[[suites]]
platforms = ["linux-musl"]
commands = [
  { task = "//bindings/rust:test" },
  { task = "//bindings/dotnet:test" },
]

# Every other binding step is handed a local install prefix. These commands
# serve the package that this job built through the snapshot acquisition path.
# The path differs only in which preset it resolves, so one platform is enough.
[[suites]]
platforms = ["linux-gnu"]
commands = [
  { task = "//bindings/rust:test:download", include = ["linux-gnu-x64-vulkan"] },
  { task = "//bindings/dart:test:download", include = ["linux-gnu-x64-vulkan"] },
]

# Zig is unavailable on Windows ARM64; see the `core:zig` note in bindings/zig/mise.toml.
[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
exclude = ["windows-arm64-wgl", "windows-arm64-vulkan"]
commands = [
  { task = "//bindings/zig:test" },
  { task = "//examples/zig-map:smoke", display = true },
  { task = "//examples/zig-readback:smoke" },
]

# compose-map on Windows Vulkan shares its frames with Skiko's Direct3D 12
# through VK_KHR_external_memory_win32, which Lavapipe, the runners' only Vulkan
# driver, does not offer, so no driver there can render it and it only builds.
#
# On Windows WGL it imports Skiko's Direct3D 12 texture into OpenGL, which of
# Mesa's drivers only d3d12 can open. The OpenGL setup action puts a Mesa build
# that carries only d3d12 beside the pinned java.exe, so every JVM step selects
# that driver, running on WARP, while the job's other processes keep the system
# llvmpipe driver.
[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [
  { task = "//bindings/kotlin:test" },
  { task = "//examples/compose-map:smoke", exclude = ["windows-x64-vulkan", "windows-arm64-vulkan"], display = true },
  { task = "//examples/compose-map:build", include = ["windows-x64-vulkan", "windows-arm64-vulkan"] },
  { task = "//examples/lwjgl-map:smoke", display = true },
]
environments = [
  { include = ["windows-x64-wgl", "windows-arm64-wgl"], env = { GALLIUM_DRIVER = "d3d12", LIBGL_ALWAYS_SOFTWARE = "true" } },
]

[[suites]]
platforms = ["linux-gnu", "macos"]
commands = [
  { task = "//bindings/swift:test", exclude = ["linux-gnu-x64-vulkan"] },
  { task = "//bindings/swift:test", args = ["release"], include = ["linux-gnu-x64-vulkan"] },
  { task = "//examples/swift-map:smoke", include = ["macos-arm64-metal"] },
]

[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [
  { task = "//bindings/dotnet:test" },
  { task = "//examples/dotnet-map:smoke", display = true },
]

[[suites]]
platforms = ["linux-gnu", "macos"]
commands = [{ task = "//bindings/go:test" }]

# go-map drives OpenGL through EGL, on Linux only.
[[suites]]
platforms = ["linux-gnu"]
commands = [
  { task = "//examples/go-map:check", include = ["linux-gnu-x64-egl", "linux-gnu-arm64-egl"] },
  { task = "//examples/go-map:smoke", include = ["linux-gnu-x64-egl", "linux-gnu-arm64-egl"], display = true },
]

[[suites]]
platforms = ["linux-gnu", "macos"]
commands = [{ task = "//examples/c-map:smoke", display = true }]

[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [{ task = "//bindings/python:test" }]

[[suites]]
platforms = ["linux-gnu", "macos", "windows"]
commands = [{ task = "//bindings/dart:test" }]

# Run Rust browser tests against the Emscripten build.
[[suites]]
platforms = ["emscripten"]
commands = [{ task = "//bindings/rust:test" }]
