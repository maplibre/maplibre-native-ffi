# The TypeScript binding publishes one runtime payload per target: a payload
# carries a compiled addon, and a host can only load the one built for it. These
# are the targets a payload is packed and uploaded for, which is also the set the
# snapshot registry serves. OpenHarmony packs through its own cross-build.
typescript_payloads = [
  "linux-x64-egl",
  "linux-x64-vulkan",
  "linux-arm64-egl",
  "linux-arm64-vulkan",
  "macos-arm64-metal",
  "macos-arm64-vulkan",
  "macos-arm64-egl",
  "windows-x64-wgl",
  "windows-x64-vulkan",
  "windows-arm64-wgl",
  "windows-arm64-vulkan",
]
typescript_arkts_payloads = ["ohos-arm64-egl", "ohos-arm64-vulkan"]

# Desktop suites run in the matching native target job and reuse its build tree.
[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/rust:test" },
  { task = "//examples/rust-map:check", exclude = ["macos-arm64-egl"] },
]

# Acquiring the native library from the snapshot release is not exercised
# anywhere else: every other binding step is handed a local install prefix. One
# platform is enough, since the download path differs only in which preset it
# resolves.
[[suites]]
platforms = ["linux"]
commands = [
  { task = "//bindings/rust:test:download", include = ["linux-x64-vulkan"], preset = false },
  { task = "//bindings/dart:test:download", include = ["linux-x64-vulkan"], preset = false },
]

# Zig is unavailable on Windows ARM64; see the `core:zig` note in bindings/zig/mise.toml.
[[suites]]
platforms = ["linux", "macos", "windows"]
exclude = ["windows-arm64-wgl", "windows-arm64-vulkan"]
commands = [
  { task = "//bindings/zig:test" },
  { task = "//examples/zig-map:build" },
  { task = "//examples/zig-readback:run" },
]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [
  { task = "//bindings/kotlin:jvmTest" },
  { task = "//bindings/kotlin:nativeTest", platforms = ["linux", "macos"], exclude = ["linux-arm64-egl", "linux-arm64-vulkan"] },
  { task = "//examples/compose-map:build" },
  { task = "//examples/lwjgl-map:build" },
]

[[suites]]
platforms = ["linux", "macos"]
commands = [
  { task = "//bindings/swift:test" },
  { task = "//examples/swift-map:build", include = ["macos-arm64-metal"] },
]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [{ task = "//bindings/dotnet:test" }]

[[suites]]
platforms = ["linux", "macos"]
commands = [{ task = "//bindings/go:test" }]

# The TypeScript suite runs where its Node-API addon is built, and runs its
# conformance cases under Node, Bun, and Deno against that one addon. One
# desktop target covers the transport and the public API; the payload matrix is
# a packaging concern rather than a behavioral one.
[[suites]]
platforms = ["linux"]
commands = [
  { task = "//bindings/typescript:test", include = ["linux-x64-vulkan"] },
]

# The WebAssembly payload needs the Emscripten SDK, and the suite it runs is the
# same one the Node-API transport runs, so it goes with the browser target
# rather than with a desktop one.
[[suites]]
platforms = ["emscripten"]
commands = [
  { task = "//bindings/typescript:test:wasm", include = ["emscripten-wasm32-webgl"] },
]

[[suites]]
platforms = ["linux"]
commands = [
  { task = "//examples/go-map:check", include = ["linux-x64-egl", "linux-arm64-egl"] },
]

[[suites]]
platforms = ["linux"]
commands = [{ task = "//examples/c-map:build" }]

[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [{ task = "//bindings/python:test" }]

# TODO(#412): Re-enable //bindings/dart:test after thread-affine ownership is
# safe across isolate migration; affected test processes can otherwise wedge
# until timeout. Keep analyze/build in CI so the binding still appears in the
# generated support matrix as build-only.
[[suites]]
platforms = ["linux", "macos", "windows"]
commands = [{ task = "//bindings/dart:build" }]
