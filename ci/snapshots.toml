# Input scopes for the components published by .github/workflows/snapshots.yml.
# The workflow hashes each component's inputs at the commit it would publish and
# skips the component when that hash matches the commit it last published from,
# so publishing follows input changes rather than commit frequency.
#
# Rules are gitignore-style and ordered, `!` marks a path as not an input, and
# the last matching rule wins. A component's effective list is `shared`, then
# the `paths` of everything it depends on, then its own `paths`.
#
# `shared` carries only what every component answers the same way: the native
# library and the toolchain that builds it are inputs everywhere, and everything
# no published artifact consumes is excluded everywhere. Anything one component
# consumes and another does not — binding sources, docs sources, and the
# language ecosystem roots their builds run through — is claimed by the
# components that consume it.
#
# There is deliberately no catch-all: `ci:check-snapshot-scopes` fails when a
# component's resolved list leaves a tracked path neither an input nor excluded,
# so a new top-level entry has to be classified rather than inheriting a
# default. It also fails on a rule that matches nothing, so stale patterns
# surface after a refactor.

shared = [
  # The native library, and the sources and build that produce it. Every
  # component ships it, embeds it, or documents it.
  "CMakeLists.txt",
  "CMakePresets.json",
  "cmake/**",
  "include/**",
  "src/**",
  "third_party/**",
  ".gitmodules",
  "patches/**",
  "scripts/**",
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE",
  # The toolchain and task definitions every job builds through.
  "mise.toml",
  "mise.lock",
  "mise.linux.toml",
  "mise.macos.toml",
  "mise.windows.toml",
  ".miserc.toml",
  ".mise/**",
  ".config/**",
  # The CI definitions that shape every published artifact, and the checkout
  # behaviour that decides the bytes they are built from.
  ".github/workflows/**",
  ".github/actions/**",
  "ci/**",
  ".gitattributes",

  # Binding sources, docs sources, and the ecosystem roots their builds run
  # through. Each is an input to the components that consume it and to no
  # others, so the components claim them rather than `shared`.
  "!bindings/**",
  "!docs/**",
  "!*.md",
  "!buildSrc/**",
  "!gradle/**",
  "!build.gradle.kts",
  "!settings.gradle.kts",
  "!gradle.properties",
  "!gradlew",
  "!gradlew.bat",
  "!package.json",
  "!pnpm-lock.yaml",
  "!pnpm-workspace.yaml",
  "!.npmrc",
  "!pyproject.toml",
  "!uv.lock",
  "!Directory.Packages.props",
  "!Maplibre.NativeFfi.slnx",
  "!.config/dotnet-tools.json",
  "!Package.swift",
  "!Package.resolved",
  "!build.zig",
  "!build.zig.zon",

  # Not inputs to any published artifact. The example apps, development
  # tooling, editor and service configuration.
  "!examples/**",
  "!dprint.jsonc",
  "!hk.pkl",
  "!vite.config.ts",
  "!.clang-tidy",
  "!.clangd",
  "!.gitignore",
  "!.devcontainer/**",
  "!.github/ISSUE_TEMPLATE/**",
  "!.github/dependabot.yml",
  "!.github/FUNDING.yml",
  "!.coderabbit.yaml",
  "!.agents/**",
  "!.claude/**",
  "!.idea/**",
  "!.ona/**",
  "!.vscode/**",
  "!.zed/**",
]

# CPack packages the CMake install tree directly, so the native tarballs are
# exactly what `shared` describes and this component claims nothing further.
[components.native]
description = "Native CPack tarballs on the floating GitHub prerelease."

[components.kotlin]
description = "Kotlin Multiplatform modules on Maven Central snapshots."
depends = ["native"]
paths = [
  "bindings/kotlin/**",
  "bindings/kotlin-runtime-*/**",
  "bindings/rustls-platform-verifier-android/**",
  # Gradle compiles the binding, embeds the native artifacts, and assembles
  # every publication.
  "buildSrc/**",
  "gradle/**",
  "build.gradle.kts",
  "settings.gradle.kts",
  "gradle.properties",
  "gradlew",
  "gradlew.bat",
]

[components.python]
description = "Backend-specific Python wheels on the GitHub Pages package index."
depends = ["native"]
paths = [
  "bindings/python/**",
  # The extension reuses the Rust binding's low-level ownership and FFI layers.
  "bindings/rust/**",
  "pyproject.toml",
  "uv.lock",
]

[components.dotnet]
description = "Backend-specific .NET packages on the GitHub Pages NuGet feed."
depends = ["native"]
paths = [
  "bindings/dotnet/**",
  "Directory.Packages.props",
  "Maplibre.NativeFfi.slnx",
  ".config/dotnet-tools.json",
]

[components.docs]
description = "Docs site on GitHub Pages."
depends = ["kotlin", "python", "dotnet"]
# The site embeds an API reference generated from every binding, so it takes the
# binding sources along with the ecosystem roots each doc tool builds through.
# As the remaining bindings gain components of their own, `depends` should name
# them and these entries should move to the component that owns them.
paths = [
  "bindings/dart/**",
  "bindings/go/**",
  "bindings/swift/**",
  "bindings/typescript/**",
  "bindings/zig/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  ".npmrc",
  "Directory.Packages.props",
  "Maplibre.NativeFfi.slnx",
  ".config/dotnet-tools.json",
  "Package.swift",
  "Package.resolved",
  "build.zig",
  "build.zig.zon",
  "docs/**",
  "*.md",
]
