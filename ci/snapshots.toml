# Input scopes for the components published by
# .github/workflows/publish-snapshots.yml.
# The workflow hashes each component's inputs and skips the component when that
# hash matches the commit it last published from.
#
# Rules are gitignore-style and ordered, `!` marks a path as not an input, and
# the last matching rule wins. A component's effective list is `shared`, then
# the `paths` of everything it depends on, then its own `paths`.
#
# There is no catch-all. `ci:check-snapshot-scopes` fails on a tracked path that
# a component leaves neither an input nor excluded, and on a rule that matches
# nothing.

shared = [
  # The native library, and the sources and build that produce it.
  "CMakeLists.txt",
  "CMakePresets.json",
  "cmake/**",
  "include/**",
  "src/**",
  "third_party/**",
  ".gitmodules",
  "patches/**",
  "scripts/**",
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE",
  # The toolchain and task definitions every job builds through.
  "mise.toml",
  "mise.lock",
  "mise.linux.toml",
  "mise.macos.toml",
  "mise.windows.toml",
  "mise.android.toml",
  "mise.android.lock",
  "mise.emscripten.toml",
  "mise.emscripten.lock",
  "mise.ohos.toml",
  "mise.ohos.lock",
  ".miserc.toml",
  ".mise/**",
  ".config/**",
  # The CI definitions that shape every snapshot artifact.
  ".github/workflows/**",
  "!.github/workflows/*-release.yml",
  "!.github/workflows/_*.yml",
  ".github/actions/**",
  "ci/**",
  "!ci/*release.py",
  "!ci/tests/**",
  ".gitattributes",

  # Binding sources, docs sources, and the ecosystem roots their builds run
  # through. The components that consume them claim them instead.
  "!bindings/**",
  "!docs/**",
  "!*.md",
  "!buildSrc/**",
  "!gradle/**",
  "!build.gradle.kts",
  "!settings.gradle.kts",
  "!gradle.properties",
  "!gradlew",
  "!gradlew.bat",
  "!package.json",
  "!pnpm-lock.yaml",
  "!pnpm-workspace.yaml",
  "!.npmrc",
  "!pyproject.toml",
  "!uv.lock",
  "!Directory.Packages.props",
  "!Maplibre.NativeFfi.slnx",
  "!.config/dotnet-tools.json",
  "!Package.swift",
  "!Package.resolved",
  "!build.zig",
  "!build.zig.zon",

  # Not inputs to any published artifact.
  "!examples/**",
  "!dprint.jsonc",
  "!hk.pkl",
  "!vite.config.ts",
  "!.clang-tidy",
  "!.clangd",
  "!.gitignore",
  "!.devcontainer/**",
  "!.github/ISSUE_TEMPLATE/**",
  "!.github/dependabot.yml",
  "!.github/FUNDING.yml",
  "!.coderabbit.yaml",
  "!.agents/**",
  "!.claude/**",
  "!.idea/**",
  "!.ona/**",
  "!.vscode/**",
  "!.zed/**",
]

# CPack packages the CMake install tree directly, so `shared` already describes
# every input.
[components.native]
description = "Native CPack tarballs on the floating GitHub prerelease."
paths = [
  ".github/workflows/_native-package.yml",
  "ci/native_package_release.py",
]

[components.kotlin]
description = "Kotlin Multiplatform modules on Maven Central snapshots."
depends = ["native"]
paths = [
  "bindings/kotlin/**",
  "bindings/kotlin-runtime-*/**",
  "bindings/rustls-platform-verifier-android/**",
  "!.github/workflows/_native-package.yml",
  "!ci/native_package_release.py",
  ".github/workflows/_kotlin-maven.yml",
  "ci/kotlin_release.py",
  # Gradle assembles every publication.
  "buildSrc/**",
  "gradle/**",
  "build.gradle.kts",
  "settings.gradle.kts",
  "gradle.properties",
  "gradlew",
  "gradlew.bat",
]

[components.python]
description = "Backend-specific Python wheels on the GitHub Pages package index."
depends = ["native"]
paths = [
  "bindings/python/**",
  "!.github/workflows/_native-package.yml",
  "!ci/native_package_release.py",
  # The extension reuses the Rust binding's low-level ownership and FFI layers.
  "bindings/rust/**",
  "pyproject.toml",
  "uv.lock",
]

[components.dotnet]
description = "Backend-specific .NET packages on the GitHub Pages NuGet feed."
depends = ["native"]
paths = [
  "bindings/dotnet/**",
  "!.github/workflows/_native-package.yml",
  "!ci/native_package_release.py",
  "Directory.Packages.props",
  "Maplibre.NativeFfi.slnx",
  ".config/dotnet-tools.json",
]

[components.docs]
description = "Docs site on GitHub Pages."
depends = ["kotlin", "python", "dotnet"]
# The site embeds an API reference generated from every binding, so it takes the
# binding sources along with the ecosystem roots each doc tool builds through.
paths = [
  "!.github/workflows/_kotlin-maven.yml",
  "!ci/kotlin_release.py",
  "bindings/dart/**",
  "bindings/go/**",
  "bindings/swift/**",
  "bindings/zig/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  ".npmrc",
  "Directory.Packages.props",
  "Maplibre.NativeFfi.slnx",
  ".config/dotnet-tools.json",
  "Package.swift",
  "Package.resolved",
  "build.zig",
  "build.zig.zon",
  "docs/**",
  "*.md",
]
