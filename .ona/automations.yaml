tasks:
  install-dependencies:
    name: Install dependencies
    description: Install the pinned repository tools and dependencies.
    command: |
      mise trust -y
      mise install
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    description: Configure, build, and install the host native library.
    command: mise run build
    triggeredBy:
      - manual
    dependsOn:
      - install-dependencies
