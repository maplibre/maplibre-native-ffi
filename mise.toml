# https://mise.jdx.dev
# Mise is the contributor entrypoint: it pins tools, installs hooks, and runs
# repository tasks.

monorepo_root = true
min_version = "2026.7.15"

[settings]
lockfile = true
# The large platform tools install when asked for, through `mise bootstrap` or
# `mise install`, and never on the way to something else. Otherwise a lint task or a
# Git hook pulls in gigabytes, and a machine that cannot install one of them cannot
# run any task at all.
auto_install_disable_tools = [
  "android-sdk",
  "emsdk",
  "ohos-sdk",
  "http:oniro-emulator",
]
# The submodules provider checks Git state directly and intentionally runs on
# every dependency pass, so suppress its perpetual shell stale warning.
status.show_deps_stale = false
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]
pin = true
experimental = true
# On Windows, the Microsoft Store Python alias in WindowsApps can appear before
# mise-managed Python. Keep mise tool paths first so file tasks run pinned tools.
activate_aggressive = true
# The repository pins one SDK. Isolated mode keeps project-scoped .NET installs
# under MISE_DATA_DIR instead of a user-home-specific shared DOTNET_ROOT.
dotnet.isolated = true

[monorepo]
config_roots = [".devcontainer", "bindings/*", "examples/*", "docs"]
lockfile = true

# Inline task scripts across the workspace are Bash. Cascading the shell gives
# every monorepo config root the same contract without repeating it, and keeps
# the choice scoped to tasks: hooks, tool installs, and dependency providers
# still use the platform shell.
#
# This default reaches file tasks too, and on Windows mise applies it in place
# of the shebang, so each file task names its own interpreter with
# `#MISE shell=`.
[task_config]
cascade = true
shell = "bash -e -c"

[vars]
actionlint_version = "1.7.8"
# The Android SDK tool installs the command-line tools and nothing else, so this is
# their version; the packages below are what .mise/bin/sync-android-packages adds.
# Gradle reads the package versions from the environment, which `[env]` sets from
# these.
android_cmdline_tools_version = "22.0"
android_cmake_version = "4.1.2"
android_ndk_version = "28.2.13676358"
cargo_about_version = "0.9.1"
cmake_version = "4.3.3"
dart_version = "3.12.2"
dotnet_version = "10.0.203"
doxygen_version = "1.13.2"
dprint_version = "0.53.2"
emsdk_version = "4.0.10"
go_version = "1.26.3"
doc2go_version = "0.12.2"
gofumpt_version = "0.10.0"
google_java_format_version = "1.35.0"
flutter_version = "3.44.8"
hk_version = "1.45.0"
java_version = "zulu-25.34.17.0"
jvl_version = "2026.05.03"
ktfmt_version = "0.62"
libxml2_version = "2.13.9"
node_version = "24.11.0"
ninja_version = "1.13.2"
ohos_sdk_version = "6.1"
pkl_version = "0.31.0"
pnpm_version = "10.33.2"
python_version = "3.14.4"
rust_version = "1.95.0"
sccache_version = "0.16.0"
shellcheck_version = "0.11.0"
swift_version = "6.3.1"
swiftformat_version = "0.61.1"
uv_version = "0.11.11"
xtool_version = "1.17.0"
zig_version = "0.16.0"

[tools]
# Repository and native tooling
"aqua:jdx/hk" = "{{vars.hk_version}}" # Linter orchestration
"aqua:apple/pkl" = "{{vars.pkl_version}}" # hk config dependency
"aqua:dprint/dprint" = "{{vars.dprint_version}}" # Formatter orchestration
"github:sargunv/jvl" = "{{vars.jvl_version}}" # JSON validator
"aqua:rhysd/actionlint" = "{{vars.actionlint_version}}" # GH Actions linter
"aqua:koalaman/shellcheck" = "{{vars.shellcheck_version}}" # Shell script linter (used by actionlint)
"aqua:Kitware/CMake" = "{{vars.cmake_version}}"
ninja = "{{vars.ninja_version}}"
"github:EmbarkStudios/cargo-about" = "{{vars.cargo_about_version}}" # Rust dependency notices
sccache = "{{vars.sccache_version}}"

# Node.js ecosystem
"core:node" = "{{vars.node_version}}"
"aqua:pnpm/pnpm" = "{{vars.pnpm_version}}"

# Python ecosystem
"core:python" = "{{vars.python_version}}"
"aqua:astral-sh/uv" = "{{vars.uv_version}}"

# SwiftFormat is a standalone repository formatter and does not require the
# Swift compiler.
swiftformat = { version = "{{vars.swiftformat_version}}", backend = "github:nicklockwood/SwiftFormat", no_app = true, rename_exe = "swiftformat" }

# The native CMake build compiles the Rust platform support library, so Rust is
# part of the repository-wide native toolchain. `rust-src` is for the Emscripten
# target alone: rustup ships no `std` for `wasm32-unknown-emscripten` built with
# atomics, so that target rebuilds `std` from source. See cmake/mln_ffi_rust.cmake.
"core:rust" = { version = "{{vars.rust_version}}", profile = "minimal", components = "rustfmt,clippy,rust-src", targets = "aarch64-linux-android,x86_64-linux-android,aarch64-unknown-linux-ohos,x86_64-unknown-linux-ohos,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,wasm32-unknown-emscripten" }

# The native CMake build compiles the Linux targets with `zig cc`, so Zig joins
# the native toolchain there. See cmake/toolchains/zig-linux.cmake. The Zig
# binding declares its own wider platform set in bindings/zig/mise.toml.
"core:zig" = { version = "{{vars.zig_version}}", os = ["linux"] }

# Cross-compilation SDKs for the non-host targets. The CMake presets and the Rust
# cross builds read what these export -- ANDROID_HOME, EMSDK, OHOS_SDK_NATIVE --
# so declaring them here is what lets one `build <preset>` serve every target.
#
# Each is a multi-gigabyte download, and `disable_tools` is how an environment that
# builds fewer targets keeps them out: .github/actions/setup-ci-deps narrows the set
# to each job's target, the devcontainer image drops all three, and a contributor
# does the same in mise.local.toml. See the development overview.
#
# The Android SDK tool installs the command-line tools alone, so the packages the
# builds need are installed once the SDK is in place.
android-sdk = { version = "{{vars.android_cmdline_tools_version}}", postinstall = ".mise/bin/sync-android-packages {{vars.java_version}} {{vars.android_ndk_version}} {{vars.android_cmake_version}}" }
# The vfox plugin runs the current emsdk launcher before emsdk installs its bundled
# Python. Use the project Python because Apple's version can be older than the
# launcher's minimum; `depends` installs it before the environment below resolves it.
emsdk = { version = "{{vars.emsdk_version}}", depends = ["python"] }
# mise has no registry entry for the OpenHarmony SDK, so this resolves through the
# plugin the hook below registers. Its unpacking step needs a POSIX shell, which is
# why Windows is left out.
ohos-sdk = { version = "{{vars.ohos_sdk_version}}", os = ["linux", "macos"] }
# Oniro publishes its emulator image against the corresponding OpenHarmony
# release. Keep both tools on the same version so their system ABI stays aligned.
"http:oniro-emulator" = { version = "{{vars.ohos_sdk_version}}", url = "https://github.com/eclipse-oniro4openharmony/device_board_oniro/releases/download/v{{ version }}/oniro_emulator.zip", checksum = "sha256:a30e01f1b161e0fdcd91263f30f29cc92bfa49c1776d5ee2c46caefef055b2da", size = "1449068188", bin_path = ".", os = ["linux", "macos"] }

[env]
EMSDK_PYTHON = { value = "{{ tools.python.path }}/{% if os() == 'windows' %}python.exe{% else %}bin/python3{% endif %}", tools = true }

# The Android SDK packages the CMake presets and the Gradle builds resolve. They are
# environment variables because Gradle reads them, and they come from `[vars]`
# because the tool's post-install step takes them as arguments.
MLN_FFI_ANDROID_CMAKE_VERSION = "{{vars.android_cmake_version}}"
MLN_FFI_ANDROID_NDK_VERSION = "{{vars.android_ndk_version}}"

# sccache keeps compiled objects in its own disk cache, which every checkout on
# the machine shares; .mise/bin/with-sccache-basedirs lines the cache keys up
# across Git worktrees. The R2 backend belongs to CI, which configures it in
# .github/actions/setup-ci-deps: those keys carry the toolchain paths of the
# runner that produced them, so a contributor machine reads its own disk cache
# instead. CI wraps rustc there as well, where it turns incremental compilation
# off to suit sccache; cargo runs unwrapped here so the dev profile keeps it.
CMAKE_C_COMPILER_LAUNCHER = "sccache"
CMAKE_CXX_COMPILER_LAUNCHER = "sccache"

[deps.uv]
auto = true
run = "uv sync --locked --all-packages --all-groups --no-install-workspace"

[deps.pnpm]
# The built-in provider runs pnpm directly. A `run` script would put a shell
# between mise and pnpm, and on Windows ARM64 the lifecycle scripts pnpm spawns
# through cmd then fail to resolve mise's node, so the workspace-wide install
# stays.
auto = true

[deps.submodules]
auto = true
run = ".mise/bin/sync-submodules"

[deps.rustls-platform-verifier]
auto = true
description = "Acquire and patch the Android platform certificate verifier"
sources = [
  ".mise/bin/sync-rustls-platform-verifier",
  "patches/rustls-platform-verifier/*.patch",
]
outputs = [
  "build/dependencies/rustls-platform-verifier/rustls-platform-verifier/Cargo.toml",
  "build/dependencies/rustls-platform-verifier/android/rustls-platform-verifier/src/main/java/org/rustls/platformverifier/CertificateVerifier.kt",
]
run = ".mise/bin/sync-rustls-platform-verifier"
timeout = "2m"

[hooks]
# The OpenHarmony SDK plugin lives in the repository, and mise resolves a plugin
# from its own directory, so registering the link is what makes `ohos-sdk` install.
# Linking is a symlink, and re-linking is how a checkout that moves stops being
# stale. Moving the plugin to its own repository later replaces this with a
# `[plugins]` entry naming its URL.
preinstall = [
  "mise plugins link --force ohos-sdk .mise/plugins/ohos-sdk",
]
postinstall = [
  "hk install --mise --quiet",
]

[tasks.configure]
description = "Configure a native CMake preset."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = '.mise/bin/with-sccache-basedirs cmake --preset "$usage_preset"'

[tasks.build]
description = "Configure, build, and install a native CMake preset."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
sources = [
  ".mise/bin/sync-rustls-platform-verifier",
  "CMakeLists.txt",
  "CMakePresets.json",
  "Cargo.lock",
  "Cargo.toml",
  "LICENSE",
  "build/dependencies/rustls-platform-verifier/android-release-support/Cargo.toml",
  "build/dependencies/rustls-platform-verifier/android-release-support/src/**/*.rs",
  "build/dependencies/rustls-platform-verifier/rustls-platform-verifier/Cargo.toml",
  "build/dependencies/rustls-platform-verifier/rustls-platform-verifier/src/**/*.rs",
  "build/*/.native-package-install",
  "cmake/**/*",
  "include/**/*",
  "patches/**/*",
  "src/**/*",
  "third_party/**/*",
]
outputs = { auto = true }
run = '.mise/bin/with-sccache-basedirs cmake --workflow --preset "$usage_preset"'

[tasks.clean]
description = "Remove one native preset build tree."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = 'rm -rf "$MISE_MONOREPO_ROOT/build/$usage_preset"'

[tasks.package-native]
description = "Build and archive a native CMake preset."
usage = 'arg "<preset>"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = [{ task = "//:archive-native", args = ["{{usage.preset}}"] }]

[tasks.archive-native]
description = "Archive an already-built native CMake preset."
usage = 'arg "<preset>"'
run = [
  'cpack --preset "$usage_preset"',
  { task = "//:verify-native-package", args = ["{{usage.preset}}"] },
]

[tasks.test]
description = "Build and run C API tests for a CMake preset."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
# The Emscripten suite runs as a page in headless Chromium; see
# scripts/run-browser-test.mjs for how a browser is located.
run = '''
if [[ "$usage_preset" == ios-simulator-* ]]; then
  mise run //:ios-simulator:boot
elif [[ "$usage_preset" == ohos-x64-egl ]]; then
  mise run //:ohos-emulator:boot
  fixture_source="$MISE_MONOREPO_ROOT/third_party/maplibre-native/test/fixtures"
  fixture_dir="$MISE_MONOREPO_ROOT/build/ohos-emulator/c-api-fixtures"
  while IFS= read -r -d '' fixture; do
    relative_path=${fixture#"$fixture_source"/}
    destination="$fixture_dir/$relative_path"
    mkdir -p "$(dirname "$destination")"
    install -m 644 "$fixture" "$destination"
  done < <(find "$fixture_source" -type f -name '*.mlt' -print0)
  MLN_FFI_TEST_FIXTURE_DIR="$fixture_dir" \
    bash "$MISE_MONOREPO_ROOT/scripts/run-ohos-emulator-test.sh" \
      "$MISE_MONOREPO_ROOT/build/$usage_preset/mln_ffi_c_api_tests" \
      "$MISE_MONOREPO_ROOT/build/$usage_preset/install/lib/libmaplibre-native-c.so" \
      "$OHOS_SDK_NATIVE/llvm/lib/x86_64-linux-ohos/libc++_shared.so" \
      300
  exit
fi
ctest --preset "$usage_preset"
'''

[tasks."ohos-emulator:boot"]
description = "Boot the OpenHarmony emulator and wait until it is ready."
run = '''
connect_key=127.0.0.1:55555
state_dir="$MISE_MONOREPO_ROOT/build/ohos-emulator"
pid_file="$state_dir/qemu.pid"
log_file="$state_dir/qemu.log"

if hdc tconn "$connect_key" >/dev/null 2>&1 &&
  hdc -t "$connect_key" shell echo ready 2>/dev/null | tr -d '\r' | grep -qx ready; then
  echo "OpenHarmony emulator is ready at $connect_key."
  exit 0
fi

mkdir -p "$state_dir"
if [[ -f "$pid_file" ]]; then
  pid=$(<"$pid_file")
  if [[ "$pid" =~ ^[0-9]+$ ]] &&
    kill -0 "$pid" 2>/dev/null &&
    ps -p "$pid" -o args= | grep -q qemu-system-x86_64; then
    echo "Waiting for OpenHarmony emulator process $pid."
  else
    rm -f "$pid_file"
  fi
fi

if [[ ! -f "$pid_file" ]]; then
  emulator_dir="$(mise where 'http:oniro-emulator@{{vars.ohos_sdk_version}}')/images"
  launcher=("$MISE_MONOREPO_ROOT/scripts/run-ohos-emulator.sh" "$emulator_dir")
  if command -v setsid >/dev/null 2>&1; then
    nohup setsid "${launcher[@]}" </dev/null >"$log_file" 2>&1 &
  else
    nohup "${launcher[@]}" </dev/null >"$log_file" 2>&1 &
  fi
  pid=$!
  printf '%s\n' "$pid" >"$pid_file"
  echo "Started OpenHarmony emulator process $pid."
fi

pid=$(<"$pid_file")
for ((attempt = 0; attempt < 300; attempt++)); do
  if ! kill -0 "$pid" 2>/dev/null; then
    echo "OpenHarmony emulator exited before it became ready." >&2
    tail -100 "$log_file" >&2
    rm -f "$pid_file"
    exit 1
  fi
  if hdc tconn "$connect_key" >/dev/null 2>&1 &&
    hdc -t "$connect_key" shell echo ready 2>/dev/null | tr -d '\r' | grep -qx ready; then
    echo "OpenHarmony emulator is ready at $connect_key."
    exit 0
  fi
  sleep 1
done

echo "OpenHarmony emulator did not become ready within 300 seconds." >&2
tail -100 "$log_file" >&2
exit 1
'''

[tasks."ohos-emulator:stop"]
description = "Stop the OpenHarmony emulator started by mise."
run = '''
pid_file="$MISE_MONOREPO_ROOT/build/ohos-emulator/qemu.pid"
if [[ ! -f "$pid_file" ]]; then
  echo "No mise-managed OpenHarmony emulator is running."
  exit 0
fi

pid=$(<"$pid_file")
if [[ "$pid" =~ ^[0-9]+$ ]] &&
  kill -0 "$pid" 2>/dev/null &&
  ps -p "$pid" -o args= | grep -q qemu-system-x86_64; then
  kill "$pid"
  for ((attempt = 0; attempt < 30; attempt++)); do
    kill -0 "$pid" 2>/dev/null || break
    sleep 1
  done
  if kill -0 "$pid" 2>/dev/null; then
    kill -KILL "$pid"
  fi
fi
rm -f "$pid_file"
hdc tconn 127.0.0.1:55555 -remove >/dev/null 2>&1 || true
'''

[tasks.check]
tools = { "core:java" = "{{vars.java_version}}", "aqua:facebook/ktfmt" = "{{vars.ktfmt_version}}", "aqua:google/google-java-format" = "{{vars.google_java_format_version}}", "core:dart" = "{{vars.dart_version}}", "core:dotnet" = "{{vars.dotnet_version}}", "core:go" = "{{vars.go_version}}", "core:zig" = { version = "{{vars.zig_version}}", os = ["linux", "macos", "windows/x64"] } }
env = { MLN_FFI_DPRINT_SCOPED_TOOLS = "1" }
run = '''
mise -C bindings/dotnet deps install dotnet-tools
mise run //docs:install
hk check --all
'''

[tasks.fix]
tools = { "core:java" = "{{vars.java_version}}", "aqua:facebook/ktfmt" = "{{vars.ktfmt_version}}", "aqua:google/google-java-format" = "{{vars.google_java_format_version}}", "core:dart" = "{{vars.dart_version}}", "core:dotnet" = "{{vars.dotnet_version}}", "core:go" = "{{vars.go_version}}", "core:zig" = { version = "{{vars.zig_version}}", os = ["linux", "macos", "windows/x64"] } }
env = { MLN_FFI_DPRINT_SCOPED_TOOLS = "1" }
run = '''
mise -C bindings/dotnet deps install dotnet-tools
mise run //docs:install
hk fix --all
'''

[tasks.actions-up]
description = "Update and pin GitHub Actions steps."
run = "pnpm dlx actions-up"
