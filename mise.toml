experimental_monorepo_root = true

[settings]
pin = true
experimental = true
env_shell_expand = true

[monorepo]
config_roots = ["examples/*", "docs"]

[hooks]
postinstall = [
  "hk install --mise",
  "pixi install --locked",
  "cd docs && pnpm install",
]

[tools]
hk = "1.40.0"
pkl = "0.31.0"
dprint = "0.53.2"
jq = "1.8.1"
"github:sargunv/jvl" = "2026.04.29"
pixi = "0.67.2"
"github:cmakefmt/cmakefmt" = "1.3.0"
zig = "0.16.0"
"conda:doxygen" = "1.13.2"
actionlint = "1.7.8"
pnpm = "10.33.2"
node = "24.11.0"
usage = "3.3.0"

[env]
PKG_CONFIG = "{{ config_root }}/.pixi/envs/default/bin/pkg-config"
XDG_DATA_DIRS = "{{config_root}}/.pixi/envs/default/share"

# Overridden by the profile (e.g, `MISE_ENV=linux-x64-vulkan`)
MLN_TARGET_OS = "{{ os() }}"
MLN_TARGET_ARCH = "{{ arch() }}"
MLN_RENDER_BACKEND = "{% if os() == 'macos' %}metal{% else %}vulkan{% endif %}"

# The following are lazy loaded to allow the profile to set values before expansion
MLN_BUILD_FLAVOR = { value = "$MLN_TARGET_OS-$MLN_TARGET_ARCH-$MLN_RENDER_BACKEND", tools = true }
MLN_BUILD_DIR = { value = "{{ config_root }}/build/$MLN_BUILD_FLAVOR", tools = true }
DYLD_LIBRARY_PATH = { value = "{{ config_root }}/build/$MLN_BUILD_FLAVOR", tools = true }
LD_LIBRARY_PATH = { value = "{{ config_root }}/build/$MLN_BUILD_FLAVOR", tools = true }
PKG_CONFIG_PATH = { value = "{{ config_root }}/build/$MLN_BUILD_FLAVOR/pkgconfig", tools = true }

[tasks.build]
depends = ["//:configure"]
run = '''
pixi run --locked cmake --build "${MLN_BUILD_DIR}" --parallel
'''

[tasks.clean]
run = "rm -rf build"

[tasks.test]
depends = ["//:build"]
run = '''
zig build test --summary all -Drender-backend="${MLN_RENDER_BACKEND}"
'''

[tasks.check]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"
