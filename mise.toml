# https://mise.jdx.dev
# Mise is the contributor entrypoint: it pins tools, installs hooks, and runs
# repository tasks.

monorepo_root = true
min_version = "2026.10.19"

[settings]
lockfile = true
# An install adds only its own entries to the lockfile. The default rebuilds
# every entry for every platform, and fails on tools that a platform lacks, such
# as conda packages with no Windows ARM64 build.
lockfile_mode = "merge"
# The cross-compilation SDKs install when asked for and never on the way to
# something else. Otherwise a lint task or a Git hook pulls in gigabytes, and a
# machine that cannot install one of them cannot run any task at all.
auto_install_disable_tools = [
  "android-sdk",
  "emsdk",
  "github:Jake-Shadle/xwin",
  "ohos-sdk",
  "http:oniro-emulator",
]
# The submodules provider checks Git state directly and intentionally runs on
# every dependency pass, so suppress its perpetual shell stale warning.
status.show_deps_stale = false
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]
pin = true
experimental = true
# On Windows, the Microsoft Store Python alias in WindowsApps can appear before
# mise-managed Python. Keep mise tool paths first so file tasks run pinned tools.
activate_aggressive = true
# The repository pins one SDK. Isolated mode keeps project-scoped .NET installs
# under MISE_DATA_DIR instead of a user-home-specific shared DOTNET_ROOT.
dotnet.isolated = true

[monorepo]
config_roots = ["bindings/*", "examples/*", "docs"]
lockfile = true

# Inline task scripts across the workspace are Bash. Cascading the shell gives
# every monorepo config root the same contract without repeating it, and keeps
# the choice scoped to tasks: hooks, tool installs, and dependency providers
# still use the platform shell.
#
# This default reaches file tasks too, and on Windows mise applies it in place
# of the shebang, so each file task names its own interpreter with
# `#MISE shell=`.
[task_config]
cascade = true
shell = "bash -e -c"

[vars]
# The Android SDK packages that .mise/bin/sync-android-packages adds to the
# command-line tools. Gradle reads the package versions from the environment,
# which `[env]` sets from these.
android_build_tools_version = "36.0.0"
android_cmake_version = "4.1.2"
# NDK r30 is the 2026 LTS. Update this pin through validated toolchain upgrades.
android_ndk_version = "30.0.16248370"
# devices-cli installs one architecture of this image on demand. The AOSP image
# carries no Google APIs and is the smallest image with a full graphics stack.
android_system_image_api = "36"
dart_version = "3.13.7"
dotnet_version = "10.0.402"
go_version = "1.27.3"
java_version = "zulu-25.36.205.0"
ohos_sdk_version = "6.1"
python_version = "3.15.1"
sdl3_version = "3.4"

[tools]
# Repository and native tooling
# hk.pkl names hk's Pkl package by version, so hk installs the version it names.
"aqua:jdx/hk" = "{{ read_file(path='hk.pkl') | split(pat='/hk@') | nth(n=1) | split(pat='#') | first }}" # Linter orchestration
"aqua:dprint/dprint" = "0.64.3" # Formatter orchestration
"github:sargunv/jvl" = "2026.05.03" # JSON validator
"github:jdx/jactionlint" = "2.3.0" # GH Actions linter
"aqua:koalaman/shellcheck" = "0.11.0" # Shell script linter (used by jactionlint)
"aqua:Kitware/CMake" = "4.4.4"
ninja = "1.13.2"
"github:EmbarkStudios/cargo-about" = "0.9.2" # Rust dependency notices
# Each worktree's Android emulator or Apple simulator, built from a commit with
# Go, which the Go binding and example use too. devices-cli runs on Linux and
# macOS only.
"core:go" = "{{vars.go_version}}"
"go:github.com/sargunv/devices-cli" = { version = "v0.0.0-20261027012014-caddba712662", os = [
  "linux",
  "macos",
] }
sccache = "0.18.0"
# The FreeBSD suites run in a FreeBSD virtual machine that this QEMU launcher
# boots on a Linux host. See tools/devices/freebsd-host.
"http:anyvm" = { version = "0.7.5", url = "https://github.com/anyvm-org/anyvm/releases/download/v{{ version }}/anyvm.py", checksum = "sha256:c192b299b9bf1b9f07b1d5e5b3977b518f8f24a9af9c20da259cdca22271d9f5", os = [
  "linux",
] }

# Node.js ecosystem
"core:node" = "26.12.1"
"aqua:pnpm/pnpm" = "12.15.0"

# dprint formats Dart with the SDK's `dart format`, and the Dart binding builds
# and tests with this same install.
"core:dart" = "{{vars.dart_version}}"

# Python ecosystem
"core:python" = "{{vars.python_version}}"
"aqua:astral-sh/uv" = "0.13.5"

# SwiftFormat is a standalone repository formatter and does not require the
# Swift compiler.
"github:nicklockwood/SwiftFormat" = { version = "0.64.1", no_app = true, rename_exe = "swiftformat" }

# The native CMake build compiles the Rust platform support library, so Rust is
# part of the repository-wide native toolchain. `rust-src` is for the Emscripten
# target alone: rustup ships no `std` for `wasm32-unknown-emscripten` built with
# atomics, so that target rebuilds `std` from source. See cmake/mln_ffi_rust.cmake.
"core:rust" = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy,rust-src", targets = "aarch64-apple-visionos,aarch64-apple-visionos-sim,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-ios-macabi,armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,x86_64-unknown-freebsd,aarch64-unknown-linux-ohos,x86_64-unknown-linux-ohos,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,wasm32-unknown-emscripten" }

# The native CMake build compiles the Linux and FreeBSD targets with `zig cc`,
# so Zig joins the native toolchain there. See cmake/toolchains/zig.cmake. The
# Zig binding, its examples, and the docs use this same install. Zig 0.17.0 is
# unusable on Windows ARM64: the native aarch64 build exits non-zero with no
# diagnostic while loading build.zig, and the x64 build under emulation hangs
# until the job timeout.
"core:zig" = { version = "0.17.0", os = ["linux", "macos", "windows/x64"] }

# The cross-compilation SDKs are multi-gigabyte downloads, and a build reads one out
# of the environment, so each is opt-in through a configuration environment of its
# own: mise.android.toml, mise.emscripten.toml, and mise.ohos.toml.

[env]
# The Android SDK packages the CMake presets and the Gradle builds resolve. They are
# environment variables because Gradle reads them, and they come from `[vars]`
# because the tool's post-install step takes them as arguments.
MLN_FFI_ANDROID_CMAKE_VERSION = "{{vars.android_cmake_version}}"
MLN_FFI_ANDROID_NDK_VERSION = "{{vars.android_ndk_version}}"
# The API level that Android device tasks ask for when they name none.
MLN_FFI_ANDROID_EMULATOR_API = "{{vars.android_system_image_api}}"
# Kotlin Gradle installs the wasm target's npm packages with its own Yarn 1,
# which refuses to run under this repository's package.json because that names
# pnpm as the package manager.
SKIP_YARN_COREPACK_CHECK = "1"

# sccache keeps compiled objects in its own disk cache, which every checkout on
# the machine shares; .mise/bin/with-sccache-basedirs lines the cache keys up
# across Git worktrees and turns preprocessor cache mode off, because that
# mode's hits restore depfiles that name another worktree's headers. The R2
# backend belongs to CI, which configures it in
# .github/actions/setup-ci-deps: those keys carry the toolchain paths of the
# runner that produced them, so a contributor machine reads its own disk cache
# instead. CI wraps rustc there as well, where it turns incremental compilation
# off to suit sccache; cargo runs unwrapped here so the dev profile keeps it.
CMAKE_C_COMPILER_LAUNCHER = "sccache"
CMAKE_CXX_COMPILER_LAUNCHER = "sccache"

[deps.uv]
auto = true
run = "uv sync --locked --all-packages --all-groups --no-install-workspace"

[deps.pnpm]
# The built-in provider runs pnpm directly. A `run` script would put a shell
# between mise and pnpm, and on Windows ARM64 the lifecycle scripts pnpm spawns
# through cmd then fail to resolve mise's node, so the workspace-wide install
# stays.
auto = true

[deps.submodules]
auto = true
run = ".mise/bin/sync-submodules"

[hooks]
# The OpenHarmony SDK plugin lives in the repository, and mise resolves a plugin
# from its own directory. Refresh its checkout-dependent symlink before mise
# inspects installed tool environments. The SDK remains opt-in through mise.ohos.toml.
postinstall = [
  "mise plugins link --force ohos-sdk .mise/plugins/ohos-sdk",
  "hk install --mise --quiet",
]

# The standard task preambles. A binding or example task that builds or tests
# against a native preset extends ffi:preset, which gives it the optional
# preset argument and builds that preset first; the desktop examples' run tasks
# extend ffi:example-run, which adds the render-target argument on top of the
# example's own build. Shell dispatch stays in each task: `run` overrides a
# template completely, and the shared parts of that dispatch live in scripts/.
[task_templates."ffi:preset"]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]

# A desktop example takes its render target as its one positional argument.
# With MLN_EXAMPLE_SMOKE=1 it loads an inline style, exits 0 after the first
# frame that it shows, and exits nonzero on a failure or after 60 seconds, so
# its smoke task needs no network. The examples share their style, initial
# camera, window size, and controls; keep them in step when one changes.
[task_templates."ffi:example-run"]
usage = '''
arg "[render-target]" default="owned-texture" {
  choices "owned-texture" "borrowed-texture" "native-surface"
}
flag "--preset <preset>" default="{{vars.host_native_preset}}"
'''
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]

[tasks.build]
description = "Configure, build, and install a native CMake preset."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = [
  'case "$usage_preset" in android-*) mise run //:android-sdk-packages --native-only ;; esac',
  { task = "//:build-preset", args = [
    "{{usage.preset}}",
  ] },
  { task = "//:check-exports", args = [
    "{{usage.preset}}",
  ] },
  { task = "//:select-clangd-preset", args = [
    "{{usage.preset}}",
  ] },
]

[tasks.build-preset]
hide = true
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
# The loader component holds the graphics implementation a host supplies for
# itself, which the package deliberately leaves out. Installing it here is what
# lets the fixtures and examples drive the API the way a host does; presets
# whose loader comes from the platform or an SDK install nothing. The
# test-graphics component, also left out of the package, holds the GPU fixtures
# that binding suites load.
run = [
  { task = "//:check-cross-sdk", args = [
    "{{usage.preset}}",
  ] },
  '.mise/bin/with-sccache-basedirs cmake --preset "$usage_preset"',
  '.mise/bin/with-sccache-basedirs cmake --build "$MISE_MONOREPO_ROOT/build/$usage_preset" --target install --config Release --parallel',
  'cmake --install "$MISE_MONOREPO_ROOT/build/$usage_preset" --component loader',
  'cmake --install "$MISE_MONOREPO_ROOT/build/$usage_preset" --component test-graphics',
]

[tasks.select-clangd-preset]
hide = true
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = '''
compile_commands_dir="$MISE_MONOREPO_ROOT/build/clangd"
compile_commands="$compile_commands_dir/compile_commands.json"
cmake -E make_directory "$compile_commands_dir"
compile_commands_tmp="$(mktemp "$compile_commands.XXXXXX")"
trap 'rm -f "$compile_commands_tmp"' EXIT
cmake -E copy "$MISE_MONOREPO_ROOT/build/$usage_preset/compile_commands.json" "$compile_commands_tmp"
mv -f "$compile_commands_tmp" "$compile_commands"
'''

[tasks.check-cross-sdk]
description = "Verify the SDK a cross-compilation preset builds against is available."
hide = true
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
# A preset whose SDK is missing says how to get one rather than failing inside CMake
# on a toolchain path that is empty or that names an NDK the SDK does not carry.
run = '''
case "$usage_preset" in
  android-*) variable=ANDROID_HOME environment=android ;;
  emscripten-*) variable=EMSDK environment=emscripten ;;
  ohos-*) variable=OHOS_SDK_NATIVE environment=ohos ;;
  windows-*)
    # A Windows host builds against Visual Studio instead.
    case "$(uname -s)" in MINGW* | MSYS* | CYGWIN*) exit 0 ;; esac
    variable=MLN_FFI_WINSYSROOT environment=msvc
    ;;
  *) exit 0 ;;
esac

if [[ -z "${!variable:-}" ]]; then
  echo "error: $usage_preset builds against \$$variable, which is unset" >&2
  echo "Point $variable at an SDK of your own, or install the pinned one with:" >&2
  echo "  mise -E $environment install" >&2
  exit 1
fi

if [[ "$environment" == android ]]; then
  toolchain="$ANDROID_HOME/ndk/${MLN_FFI_ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"
  if [[ ! -f "$toolchain" ]]; then
    echo "error: $usage_preset needs NDK $MLN_FFI_ANDROID_NDK_VERSION under $ANDROID_HOME" >&2
    echo "Install the pinned packages with:" >&2
    echo "  mise run android-sdk-packages" >&2
    exit 1
  fi
fi
'''

[tasks.clean]
description = "Remove one native preset build tree."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = 'rm -rf "$MISE_MONOREPO_ROOT/build/$usage_preset"'

[tasks.package-native]
description = "Build and archive a native CMake preset."
usage = 'arg "<preset>"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = [{ task = "//:archive-native", args = ["{{usage.preset}}"] }]

[tasks.archive-native]
description = "Archive an already-built native CMake preset."
usage = 'arg "<preset>"'
run = [
  { task = "//:check-exports", args = [
    "{{usage.preset}}",
  ] },
  'cpack --config "$MISE_MONOREPO_ROOT/build/$usage_preset/CPackConfig.cmake" -G TGZ -C Release',
  { task = "//:verify-native-package", args = [
    "{{usage.preset}}",
  ] },
]

[tasks.test]
description = "Build and run the native C tests for a CMake preset."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
# ctest runs the suites: on the host, one entry per test file and one per
# program in tests/native/exit; off the host, one entry per suite and exit
# program through tools/devices/run. The Emscripten suites run as pages in
# headless Chromium; see scripts/run-browser-test.mjs for how a browser is
# located. A target that registers no tests fails rather than passes.
run = '''
build_dir="$MISE_MONOREPO_ROOT/build/$usage_preset"
# A device build that no emulator or simulator runs registers no tests, so it
# fails before a device boots for nothing.
if ctest --test-dir "$build_dir" -C Release --show-only | grep -q '^Total Tests: 0[[:space:]]*$'; then
  echo "error: $usage_preset registers no native tests to run" >&2
  exit 2
fi
# The device boots here rather than inside the first test's timeout.
MLN_FFI_DEVICE_INSTALL="$build_dir/install" "$MISE_MONOREPO_ROOT/tools/devices/run" --boot
# The Rust platform crate's pure helpers, such as redirect resolution, have
# unit tests that run on the host.
cargo test --locked -p maplibre-native-ffi-platform --lib
ctest --test-dir "$build_dir" -C Release --output-on-failure --no-tests=error --timeout 300 --parallel
'''

[tasks.check-exports]
description = "Check that an installed native library exports exactly the public C API."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = 'python3 tools/lint/check-exports.py "$usage_preset"'

[tasks.check-export-calls]
description = "Check that the C tests call every exported function by name."
run = 'python3 tools/lint/check-export-calls.py "$@"'

[tasks."android-sdk-packages"]
description = "Install the pinned packages into the selected Android SDK."
usage = '''
flag "--sdk-root <path>" default="{{env.ANDROID_HOME | default(value='')}}" help="Android SDK directory; defaults to ANDROID_HOME"
flag "--native-only" help="Install only the packages for native compilation"
'''
run = '''
args=()
if [[ "$usage_native_only" == true ]]; then
  args+=(--native-only)
fi
if [[ -z "$usage_sdk_root" ]]; then
  echo "Set ANDROID_HOME or pass --sdk-root; install the repository SDK with mise -E android install." >&2
  exit 1
fi
bash .mise/bin/sync-android-packages "$usage_sdk_root" "{{vars.java_version}}" "{{vars.android_ndk_version}}" "{{vars.android_build_tools_version}}" "{{vars.android_cmake_version}}" "${args[@]}"
'''

[tasks.check]
run = '''
mise run //docs:install
hk check --all
'''

[tasks.fix]
run = '''
mise run //docs:install
hk fix --all
'''

[tasks.actions-up]
description = "Update and pin GitHub Actions steps."
run = "pnpm dlx actions-up"

[tasks."ci:prepare-native-package"]
description = "Prepare native package snapshot or tagged release assets."
run = 'python3 tools/release/native_package_release.py "$@"'

[tasks."ci:release-version"]
description = "Validate a release tag, or print the next release version."
run = 'python3 tools/release/release_version.py "$@"'

[tasks."ci:test"]
description = "Test CI planning and release tooling."
run = [
  'uv run --no-sync python -m unittest discover -s ci/tests -p "test_*.py"',
  'PYTHONPATH="$MISE_MONOREPO_ROOT/tools/release${PYTHONPATH:+:$PYTHONPATH}" uv run --no-sync python -m unittest discover -s tests/release -p "test_*.py"',
]

[tasks."kotlin:prepare-release"]
description = "Sign and publish a verified Kotlin Maven repository."
run = 'python3 tools/release/kotlin_release.py "$@"'

[tasks."bindings:generate"]
description = "Regenerate native declarations and public binding APIs from C headers."
run = "uv run --no-sync python -m tools.bindgen generate"

[tasks."bindings:test-generator"]
description = "Test compiler extraction, contract diagnostics, and language lowering."
run = "uv run --no-sync python -m unittest discover -s tests/bindgen"
