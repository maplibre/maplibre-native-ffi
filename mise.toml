# https://mise.jdx.dev
# Mise is the contributor entrypoint: it pins tools, installs hooks, and runs
# repository tasks.

experimental_monorepo_root = true
min_version = "2026.6.12"

[settings]
lockfile = true
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]
pin = true
experimental = true
windows_default_file_shell_args = '"C:/Program Files/Git/bin/bash.exe"'
windows_default_inline_shell_args = '"C:/Program Files/Git/bin/bash.exe" -e -lc'
unix_default_file_shell_args = "bash"
unix_default_inline_shell_args = "bash -e -lc"
# On Windows, the Microsoft Store Python alias in WindowsApps can appear before
# mise-managed Python. Keep mise tool paths first so file tasks run pinned tools.
activate_aggressive = true

[monorepo]
config_roots = [".devcontainer", "bindings/*", "examples/*", "docs"]

[tools]
# General tooling
"aqua:jdx/hk" = "1.45.0" # Linter orchestration
"aqua:apple/pkl" = "0.31.0" # hk config dependency
"aqua:dprint/dprint" = "0.53.2" # Formatter orchestration
"github:sargunv/jvl" = "2026.05.03" # JSON validator
"aqua:rhysd/actionlint" = "1.7.8" # GH Actions linter
"aqua:koalaman/shellcheck" = "0.11.0" # Shell script linter (used by actionlint)

# Node.js ecosystem
"core:node" = "24.11.0"
"aqua:pnpm/pnpm" = "10.33.2"

# Java/Kotlin ecosystem
"core:java" = "zulu-25.34.17.0"
"aqua:facebook/ktfmt" = "0.62"
"aqua:google/google-java-format" = "1.35.0"

# Python ecosystem
"core:python" = "3.14.4"
"aqua:astral-sh/uv" = "0.11.11"

# Swift ecosystem
"core:swift" = { version = "6.3.1", os = ["linux"] }
swiftformat = { version = "0.61.1", backend = "github:nicklockwood/SwiftFormat", no_app = true, rename_exe = "swiftformat" }

# Other ecosystems
"core:rust" = { version = "1.95.0", profile = "minimal", components = "rustfmt,clippy", targets = "aarch64-linux-android,x86_64-linux-android,aarch64-unknown-linux-ohos,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc" }
"core:zig" = { version = "0.16.0", os = ["linux", "macos", "windows/x64"] }
# Zig's native Windows ARM64 0.16.0 build crashes while loading build.zig, so
# Windows ARM64 uses the x64 host compiler under emulation to cross-build ARM64.
"http:zig" = { version = "0.16.0", os = ["windows/arm64"], url = "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip", checksum = "sha256:68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e", bin_path = "zig-x86_64-windows-0.16.0" }
"core:go" = "1.26.3"
"aqua:mvdan/gofumpt" = "0.10.0"
"core:dotnet" = "10.0.203"

[env]
MLN_FFI_ANDROID_CMAKE_VERSION = "4.1.2"
MLN_FFI_ANDROID_NDK_VERSION = "28.2.13676358"

[deps.uv]
auto = true
run = "uv sync --locked --all-packages --all-groups --no-install-workspace"

[deps.pnpm]
auto = true
run = "pnpm install --frozen-lockfile --loglevel warn"

[deps.dotnet-tools]
auto = true
sources = ["dotnet-tools.json"]
run = "dotnet tool restore --tool-manifest dotnet-tools.json --verbosity quiet"

[deps.dotnet-binding-tools]
auto = true
sources = ["bindings/dotnet/dotnet-tools.json"]
run = "dotnet tool restore --tool-manifest bindings/dotnet/dotnet-tools.json --verbosity quiet"

[hooks]
postinstall = [
  { task = "sync-submodules" },
  "hk install --mise --quiet",
  # Generated docs data is imported by Astro components and checked by vp.
  { task = "docs:generate-support-matrix" },
]

[tasks.configure]
description = "Configure a native CMake preset."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = 'cmake --preset "$usage_preset"'

[tasks.build]
description = "Configure, build, and install a native CMake preset."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = 'cmake --workflow --preset "$usage_preset"'

[tasks.clean]
description = "Remove one native preset build tree."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = 'rm -rf "$MISE_MONOREPO_ROOT/build/$usage_preset"'

[tasks.package-native]
description = "Build and archive a desktop native CMake preset."
usage = 'arg "<preset>"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = 'cpack --preset "$usage_preset"'

[tasks.test]
description = "Build and run C API tests for a CMake preset."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = 'ctest --preset "$usage_preset"'

[tasks.check]
depends = ["//docs:install"]
run = "hk check --all"

[tasks.fix]
depends = ["//docs:install"]
run = "hk fix --all"

[tasks.actions-up]
description = "Update and pin GitHub Actions steps."
run = "pnpm dlx actions-up"

[tasks._ktfmt]
description = "Called by dprint.jsonc"
hide = true
run = 'java -jar {{ tools["aqua:facebook/ktfmt"].path }}/ktfmt'
# ktfmt on windows doesn't work in git bash for some reason
run_windows = 'cmd /c java -jar {{ tools["aqua:facebook/ktfmt"].path }}/ktfmt'
