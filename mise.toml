# https://mise.jdx.dev
# Mise is the contributor entrypoint: it pins tools, installs hooks, and runs
# repository tasks.

experimental_monorepo_root = true

[settings]
lockfile = true
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]
pin = true
experimental = true
python.uv_venv_auto = "create|source"
windows_default_file_shell_args = '"C:/Program Files/Git/bin/bash.exe" -e -c "source ""$MLN_FFI_REPO_ROOT/.mise/bin/windows-msvc-path.sh""; exec ""C:/Program Files/Git/bin/bash.exe"" ""$@""" _'
windows_default_inline_shell_args = '"C:/Program Files/Git/bin/bash.exe" -e -c "source ""$MLN_FFI_REPO_ROOT/.mise/bin/windows-msvc-path.sh""; eval ""$1""" _'
unix_default_file_shell_args = "bash"
unix_default_inline_shell_args = "bash -e -c"
# On Windows, the Microsoft Store Python alias in WindowsApps can appear before
# mise-managed Python. Keep mise tool paths first so file tasks run pinned tools.
activate_aggressive = true

[monorepo]
config_roots = [".devcontainer", "bindings/*", "examples/*", "docs"]

[tools]
# General tooling
"aqua:jdx/usage" = "3.3.0" # CLI completion for mise tasks
"aqua:jdx/hk" = "1.45.0" # Linter orchestration
"aqua:apple/pkl" = "0.31.0" # hk config dependency
"aqua:dprint/dprint" = "0.53.2" # Formatter orchestration
"github:sargunv/jvl" = "2026.05.03" # JSON validator
"aqua:rhysd/actionlint" = "1.7.8" # GH Actions linter
"aqua:koalaman/shellcheck" = "0.11.0" # Shell script linter (used by actionlint)

# C/C++ ecosystem
"aqua:Kitware/CMake" = "4.3.3"
"aqua:ninja-build/ninja" = "1.13.2"
"conda:clang-format" = { version = "22.1.7", os = ["linux", "macos", "windows/x64"] }
"conda:clang-tools" = { version = "22.1.7", os = ["linux", "macos", "windows/x64"] }
"conda:libclang" = { version = "22.1.8", os = ["windows/x64"] }
"conda:doxygen" = { version = "1.13.2", os = ["linux", "macos", "windows/x64"] }
"conda:glslang" = { version = "16.3.0", os = ["linux", "macos", "windows/x64"] }
"conda:pkg-config" = { version = "0.29.2", os = ["linux", "macos", "windows/x64"] }
"github:cmakefmt/cmakefmt" = { version = "1.3.0", os = ["linux", "macos", "windows/x64"] }
"aqua:XcodesOrg/xcodes" = { version = "1.6.2", os = ["macos"] }

# Node.js ecosystem
"core:node" = "24.11.0"
"npm:pnpm" = "10.33.2"

# Java/Kotlin ecosystem
"core:java" = "zulu-25.34.17.0"
"aqua:facebook/ktfmt" = "0.62"
"github:google/google-java-format" = "1.35.0"

# Python ecosystem
"core:python" = "3.14.4"
"aqua:astral-sh/uv" = "0.11.11"

# Swift ecosystem
"core:swift" = { version = "6.3.1", os = ["macos"] }
"github:nicklockwood/SwiftFormat" = "0.61.1"

# Other ecosystems
"core:rust" = { version = "1.95.0", profile = "minimal", components = "rustfmt,clippy" }
"core:zig" = "0.16.0"
"core:go" = "1.26.3"
"core:dotnet" = "10.0.203"

[env]
HK_LIBGIT2 = "0"
_.path = [
  "{% if env.MISE_DATA_DIR is defined and env.MISE_DATA_DIR != \"\" %}{{ env.MISE_DATA_DIR }}{% elif os() == \"windows\" %}{{ env.LOCALAPPDATA }}/mise{% else %}{{ env.HOME }}/.local/share/mise{% endif %}/installs/conda-clang-tools/22.1.7/bin",
  "{% if env.MISE_DATA_DIR is defined and env.MISE_DATA_DIR != \"\" %}{{ env.MISE_DATA_DIR }}{% elif os() == \"windows\" %}{{ env.LOCALAPPDATA }}/mise{% else %}{{ env.HOME }}/.local/share/mise{% endif %}/installs/conda-clang-tools/22.1.7/Library/bin",
]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
LIBCLANG_PATH = "{{config_root}}/build/libclang"
MLN_FFI_CLANG_TOOLS_ROOT = "{% if env.MISE_DATA_DIR is defined and env.MISE_DATA_DIR != \"\" %}{{ env.MISE_DATA_DIR }}{% elif os() == \"windows\" %}{{ env.LOCALAPPDATA }}/mise{% else %}{{ env.HOME }}/.local/share/mise{% endif %}/installs/conda-clang-tools/22.1.7"
MLN_FFI_LIBCLANG_ROOT = "{% if os() == \"windows\" %}{% if env.MISE_DATA_DIR is defined and env.MISE_DATA_DIR != \"\" %}{{ env.MISE_DATA_DIR }}{% else %}{{ env.LOCALAPPDATA }}/mise{% endif %}/installs/conda-libclang/22.1.8{% else %}{{env.MLN_FFI_CLANG_TOOLS_ROOT}}{% endif %}"
LD_LIBRARY_PATH = "{% if env.MISE_DATA_DIR is defined and env.MISE_DATA_DIR != \"\" %}{{ env.MISE_DATA_DIR }}{% elif os() == \"windows\" %}{{ env.LOCALAPPDATA }}/mise{% else %}{{ env.HOME }}/.local/share/mise{% endif %}/installs/conda-clang-tools/22.1.7/lib:{{ env.LD_LIBRARY_PATH | default(value=\"\") }}"
MLN_FFI_REPO_ROOT = "{{config_root}}"
MLN_FFI_VARIANT = { required = true }
MLN_FFI_TARGET_TRIPLE = { required = true }
MLN_FFI_RENDER_BACKEND = { required = true }
MLN_FFI_BUILD_DIR = { required = true }
MLN_FFI_CMAKE_BUILD_TYPE = "{{env.MLN_FFI_CMAKE_BUILD_TYPE | default(value=\"RelWithDebInfo\")}}"
MLN_FFI_VCPKG_ROOT = "{{config_root}}/third_party/vcpkg"
MLN_FFI_VCPKG_OVERLAY_TRIPLETS = "{{config_root}}/cmake/vcpkg/triplets"
MLN_FFI_VCPKG_OVERLAY_PORTS = "{{config_root}}/cmake/vcpkg/ports"
MLN_FFI_VCPKG_TARGET_TRIPLET = { required = true }
MLN_FFI_VCPKG_HOST_TRIPLET = "{% if os() == \"macos\" and arch() == \"arm64\" %}arm64-osx{% elif os() == \"linux\" and arch() == \"arm64\" %}arm64-linux{% elif os() == \"linux\" %}x64-linux{% elif os() == \"windows\" and arch() == \"arm64\" %}arm64-windows{% elif os() == \"windows\" %}x64-windows{% else %}{{ os() }}-{{ arch() }}{% endif %}"
MLN_FFI_VCPKG_INSTALLED_DIR = { required = true }
MLN_FFI_INCLUDE_DIR = "{{config_root}}/include"
MLN_FFI_VULKAN_INCLUDE_DIR = "{{config_root}}/third_party/maplibre-native/vendor/Vulkan-Headers/include"
MLN_FFI_ZIG_TARGET = { required = true }
MLN_FFI_ZIG_BUILD_ARGS = { required = true }
MLN_FFI_TEST_TIMEOUT = "{{env.MLN_FFI_TEST_TIMEOUT | default(value=\"30s\")}}"
PKG_CONFIG_PATH = "{{ env.PKG_CONFIG_PATH | default(value=\"\") }}"
VCPKG_ROOT = "{{env.MLN_FFI_VCPKG_ROOT}}"
VCPKG_DOWNLOADS = "{{config_root}}/build/vcpkg/downloads"
VCPKG_DEFAULT_BINARY_CACHE = "{{config_root}}/build/vcpkg/bincache"
VCPKG_DISABLE_METRICS = "1"

[hooks]
postinstall = [
  { task = "sync-submodules" },
  "hk install --mise --quiet",
  "mise run deps",
  "uv sync --locked --quiet",
  "pnpm install --frozen-lockfile --loglevel warn",
  "dotnet tool restore --tool-manifest dotnet-tools.json --verbosity quiet",
  "dotnet tool restore --tool-manifest bindings/dotnet/dotnet-tools.json --verbosity quiet",
  # Astro type stubs for vp typeCheck on docs sources (.astro/ is gitignored).
  "pnpm --filter docs exec astro sync",
]

[tasks.configure]
run = [
  '''
  vcpkg_toolchain="$MLN_FFI_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
  cmake_cache="$MLN_FFI_BUILD_DIR/CMakeCache.txt"
  if [[ -f "$cmake_cache" ]] && ! grep -Eq 'scripts[/\\]buildsystems[/\\]vcpkg\.cmake' "$cmake_cache"; then
    echo "Removing stale CMake build directory with a non-vcpkg toolchain: $MLN_FFI_BUILD_DIR"
    rm -rf "$MLN_FFI_BUILD_DIR"
  fi
  if [[ -f "$cmake_cache" ]] && grep -Eq '^VCPKG_MANIFEST_INSTALL:INTERNAL=ON$' "$cmake_cache"; then
    echo "Removing stale CMake build directory with vcpkg manifest install enabled: $MLN_FFI_BUILD_DIR"
    rm -rf "$MLN_FFI_BUILD_DIR"
  fi

  cmake_args=(
    -S .
    -B "$MLN_FFI_BUILD_DIR"
    -G Ninja
    -DCMAKE_BUILD_TYPE="$MLN_FFI_CMAKE_BUILD_TYPE"
    -DCMAKE_MAP_IMPORTED_CONFIG_RELWITHDEBINFO=Release
    -DCMAKE_TOOLCHAIN_FILE="$vcpkg_toolchain"
    -DVCPKG_MANIFEST_MODE=OFF
    -DVCPKG_MANIFEST_DIR="$MLN_FFI_REPO_ROOT"
    -DVCPKG_TARGET_TRIPLET="$MLN_FFI_VCPKG_TARGET_TRIPLET"
    -DVCPKG_HOST_TRIPLET="$MLN_FFI_VCPKG_HOST_TRIPLET"
    -DVCPKG_INSTALLED_DIR="$MLN_FFI_VCPKG_INSTALLED_DIR"
    -DVCPKG_OVERLAY_TRIPLETS="$MLN_FFI_VCPKG_OVERLAY_TRIPLETS"
    -DVCPKG_OVERLAY_PORTS="$MLN_FFI_VCPKG_OVERLAY_PORTS"
    -DMLN_FFI_RENDER_BACKEND="$MLN_FFI_RENDER_BACKEND"
    -DMLN_FFI_OPENGL_CONTEXT_PROVIDER="$MLN_FFI_OPENGL_CONTEXT_PROVIDER"
  )

  if [[ -n "${MLN_FFI_MACOSX_DEPLOYMENT_TARGET:-}" ]]; then
    cmake_args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET="$MLN_FFI_MACOSX_DEPLOYMENT_TARGET")
  fi

  if [[ -n "${MLN_FFI_EGL_ROOT:-}" ]]; then
    cmake_args+=(-DMLN_FFI_EGL_ROOT="$MLN_FFI_EGL_ROOT")
  fi

  cmake "${cmake_args[@]}"
  ''',
  '''
  if [[ -f "$MLN_FFI_BUILD_DIR/compile_commands.json" ]]; then
    mkdir -p build/clangd
    compile_commands_link="build/clangd/compile_commands.json"
    compile_commands_tmp="${compile_commands_link}.tmp"
    rm -f "$compile_commands_tmp"
    ln -s "$MLN_FFI_BUILD_DIR/compile_commands.json" "$compile_commands_tmp"
    mv -f "$compile_commands_tmp" "$compile_commands_link"
  fi
  ''',
]

[tasks.build]
depends = ["//:configure"]
run = '''
build_args=(
  --build "$MLN_FFI_BUILD_DIR"
)

if [[ -n "${MLN_FFI_BUILD_PARALLEL:-}" ]]; then
  build_args+=(--parallel "$MLN_FFI_BUILD_PARALLEL")
else
  build_args+=(--parallel)
fi

cmake "${build_args[@]}"'''

[tasks.clean]
run = "rm -rf \"$MLN_FFI_BUILD_DIR\""

[tasks.deps]
description = "Install variant-specific managed dependencies."
depends = ["//:deps:vcpkg"]
run = '''
if [[ "$MLN_FFI_TARGET_TRIPLE" == "macos-arm64" && "${MLN_FFI_OPENGL_CONTEXT_PROVIDER:-}" == "egl" ]]; then
  mise run deps:angle
fi
'''

[tasks."deps:vcpkg:bootstrap"]
description = "Bootstrap the pinned vcpkg submodule."
hide = true
depends = ["//:sync-submodules"]
run = '''
mkdir -p "$VCPKG_DOWNLOADS" "$VCPKG_DEFAULT_BINARY_CACHE"

case "$(uname -s 2>/dev/null || printf Windows)" in
  MINGW* | MSYS* | CYGWIN* | Windows*)
    vcpkg_bin="$MLN_FFI_VCPKG_ROOT/vcpkg.exe"
    if [[ ! -x "$vcpkg_bin" ]] || ! "$vcpkg_bin" version >/dev/null 2>&1; then
      rm -f "$vcpkg_bin"
      (cd "$MLN_FFI_VCPKG_ROOT" && cmd.exe //c bootstrap-vcpkg.bat -disableMetrics)
    fi
    ;;
  *)
    vcpkg_bin="$MLN_FFI_VCPKG_ROOT/vcpkg"
    if [[ ! -x "$vcpkg_bin" ]] || ! "$vcpkg_bin" version >/dev/null 2>&1; then
      rm -f "$vcpkg_bin"
      (cd "$MLN_FFI_VCPKG_ROOT" && ./bootstrap-vcpkg.sh -disableMetrics)
    fi
    ;;
esac
'''

[tasks."deps:vcpkg"]
description = "Install vcpkg native dependencies for the active variant."
depends = [":deps:vcpkg:bootstrap"]
run = '''
mkdir -p "$VCPKG_DOWNLOADS" "$VCPKG_DEFAULT_BINARY_CACHE" "$MLN_FFI_VCPKG_INSTALLED_DIR"
case "$(uname -s 2>/dev/null || printf Windows)" in
  MINGW* | MSYS* | CYGWIN* | Windows*) vcpkg_bin="$MLN_FFI_VCPKG_ROOT/vcpkg.exe" ;;
  *) vcpkg_bin="$MLN_FFI_VCPKG_ROOT/vcpkg" ;;
esac

"$vcpkg_bin" install \
  --vcpkg-root "$MLN_FFI_VCPKG_ROOT" \
  --x-manifest-root="$MLN_FFI_REPO_ROOT" \
  --triplet "$MLN_FFI_VCPKG_TARGET_TRIPLET" \
  --host-triplet "$MLN_FFI_VCPKG_HOST_TRIPLET" \
  --overlay-triplets="$MLN_FFI_VCPKG_OVERLAY_TRIPLETS" \
  --overlay-ports="$MLN_FFI_VCPKG_OVERLAY_PORTS" \
  --x-install-root="$MLN_FFI_VCPKG_INSTALLED_DIR" \
  --clean-after-build
'''

[tasks."deps:libclang"]
hide = true
run = '''
mkdir -p "$LIBCLANG_PATH"
# clang-sys searches for unversioned libclang names, while conda packages may
# only ship versioned files. Keep the workaround local to bindgen users.
# https://github.com/KyleMayes/clang-sys/issues/213
# https://github.com/conda-forge/clangdev-feedstock/issues/458
find_libclang() {
  local pattern
  for pattern in "$@"; do
    compgen -G "$pattern" | sort | tail -n 1
  done | tail -n 1
}

case "$(uname -s 2>/dev/null || printf Windows)" in
  Darwin)
    libclang_source="$(find_libclang "$MLN_FFI_CLANG_TOOLS_ROOT/lib/libclang*.dylib")"
    [[ -n "$libclang_source" ]] || { echo "could not find libclang in $MLN_FFI_CLANG_TOOLS_ROOT/lib" >&2; exit 1; }
    ln -sf "$libclang_source" "$LIBCLANG_PATH/libclang.dylib"
    ;;
  Linux)
    libclang_source="$(find_libclang "$MLN_FFI_CLANG_TOOLS_ROOT/lib/libclang.so*")"
    [[ -n "$libclang_source" ]] || { echo "could not find libclang in $MLN_FFI_CLANG_TOOLS_ROOT/lib" >&2; exit 1; }
    ln -sf "$libclang_source" "$LIBCLANG_PATH/libclang.so"
    ;;
  MINGW* | MSYS* | CYGWIN* | Windows*)
    libclang_root="$(cygpath -u "$MLN_FFI_LIBCLANG_ROOT")"
    libclang_path="$(cygpath -u "$LIBCLANG_PATH")"
    libclang_source="$(find_libclang "$libclang_root/Library/bin/libclang.dll")"
    [[ -n "$libclang_source" ]] || { echo "could not find libclang in $libclang_root/Library/bin" >&2; exit 1; }
    mkdir -p "$libclang_path"
    cp -f "$libclang_source" "$libclang_path/libclang.dll"
    ;;
  *) echo "unsupported libclang host" >&2; exit 1 ;;
esac
'''

[tasks.test]
depends = ["//:build"]
run = '''
(
  cd src/c_api/tests/zig
  zig build test {{ env.MLN_FFI_ZIG_BUILD_ARGS }} --test-timeout "$MLN_FFI_TEST_TIMEOUT" --summary all --verbose
)
(
  cd bindings/zig
  zig build test {{ env.MLN_FFI_ZIG_BUILD_ARGS }} --test-timeout "$MLN_FFI_TEST_TIMEOUT" --summary all --verbose
)
'''

[tasks.check]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"

[tasks.actions-up]
description = "Update and pin GitHub Actions steps."
run = "pnpm dlx actions-up"

[tasks._clang_format]
description = "Called by dprint.jsonc"
hide = true
usage = 'arg "<file>" help="Path used for clang-format language detection"'
run = 'clang-format --assume-filename="$usage_file"'
run_windows = '''
if [[ "$MLN_FFI_TARGET_TRIPLE" == "windows-arm64" ]]; then
  cat
else
  clang-format --assume-filename="$usage_file"
fi
'''

[tasks._cmakefmt]
description = "Called by dprint.jsonc"
hide = true
run = "cmakefmt --line-width 80 --tab-size 2 -"
run_windows = '''
if [[ "$MLN_FFI_TARGET_TRIPLE" == "windows-arm64" ]]; then
  cat
else
  cmakefmt --line-width 80 --tab-size 2 -
fi
'''

[tasks._ktfmt]
description = "Called by dprint.jsonc"
hide = true
run = 'java -jar {{ tools["aqua:facebook/ktfmt"].path }}/ktfmt'
# ktfmt on windows doesn't work in git bash for some reason
shell = '{% if os() == "windows" %}cmd /c{% else %}sh -c -o errexit{% endif %}'

[tasks."ci:lint"]
run = [
  # Warm process-plugin cache before hk runs parallel dprint batches.
  "dprint output-resolved-config > /dev/null",
  "hk fix --all",
  "git update-index -q --refresh",
  # Lockfile drift is common across different mise builds
  "git diff --exit-code -- . ':(exclude)mise.lock'",
  "git diff --cached --exit-code -- . ':(exclude)mise.lock'",
]
