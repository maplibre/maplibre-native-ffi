[workspace]
resolver = "3"
members = [
  "bindings/python",
  "bindings/rust/crates/maplibre-native-ffi",
  "bindings/rust/crates/maplibre-native-ffi-core",
  "bindings/rust/crates/maplibre-native-ffi-sys",
  "examples/rust-map",
  "src/platform/rust",
]
exclude = [
  "build/dependencies/rustls-platform-verifier/android-release-support",
  "build/dependencies/rustls-platform-verifier/rustls-platform-verifier",
]

# The release workflow stamps the release version into the published crates,
# here and in their requirements on each other, which ship in lockstep.
[workspace.package]
version = "0.0.0"
edition = "2024"
homepage = "https://maplibre.org/maplibre-native-ffi/"
license = "BSD-2-Clause"
repository = "https://github.com/maplibre/maplibre-native-ffi"

[workspace.dependencies]
maplibre-native-ffi-core = { path = "bindings/rust/crates/maplibre-native-ffi-core", version = "=0.0.0" }
maplibre-native-ffi-platform = { path = "src/platform/rust", version = "=0.0.0" }
maplibre-native-ffi-sys = { path = "bindings/rust/crates/maplibre-native-ffi-sys", version = "=0.0.0" }

[patch.crates-io]
rustls-platform-verifier = { path = "build/dependencies/rustls-platform-verifier/rustls-platform-verifier" }
rustls-platform-verifier-android = { path = "build/dependencies/rustls-platform-verifier/android-release-support" }
