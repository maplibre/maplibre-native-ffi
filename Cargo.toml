[workspace]
resolver = "3"
members = [
  "bindings/java-jni/native",
  "bindings/rust/crates/maplibre-native",
  "bindings/rust/crates/maplibre-native-core",
  "bindings/rust/crates/maplibre-native-sys",
  "examples/rust-map",
]

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/maplibre/maplibre-native-ffi"

[patch.crates-io]
java-bindgen-macro = { path = "bindings/java-jni/native/vendor/java-bindgen-macro" }
