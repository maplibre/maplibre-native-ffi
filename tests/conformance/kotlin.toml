# Maps each case in cases.toml to the kotlin test that covers it:
#   "ID" = "path/to/test_file::test_name"
# or to why it does not apply:
#   "ID" = { na = "reason" }
#
# The commonTest files run on every emitter: FFM on the JVM, JavaCPP in the
# Android device suite, and cinterop on Kotlin/Native. Cases whose code differs
# per emitter name one test here and keep a copy per platform:
# - The ABI check (nativeTest MaplibreNativeTest).
# - The strided event batch with an unknown payload arm, and the checked
#   narrowing of a native count to a list index (RuntimeEventJvmTest,
#   RuntimeEventNativeTest, RuntimeEventAndroidTest). VAL-04's integer half is
#   that narrowing: Kotlin's unsigned types match the C widths exactly, so only
#   native counts narrow, to Int. Its open-enum half also runs on the way out,
#   in the batch test's unknown event and source types.
# - The leak report of an abandoned handle, read from standard output
#   (AbandonedHandleJvmTest in a child JVM, AbandonedHandleAndroidTest). The
#   disposal half runs on every emitter in commonTest AbandonedHandleTest.
# - Unreachable-request reclamation (ResourceRequestHandleAndroidTest).

