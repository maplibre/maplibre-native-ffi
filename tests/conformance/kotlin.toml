# Maps each case in cases.toml to the kotlin test that covers it:
#   "ID" = "path/to/test_file::test_name"
# or to why it does not apply:
#   "ID" = { na = "reason" }
#
# The generated API and its runtime are common code, so the commonTest files
# exercise them over every native-call shim: FFM on the JVM, JNI in the Android
# device suite, cinterop on Kotlin/Native, and the browser module on wasm. The
# threadedTest files run on the first three and hold the cases whose subject is
# a second Kotlin thread or a callback that answers native on a MapLibre thread:
# LIFE-03 and CB-06.
#
# The log handler and the resource provider have a form per target: the
# threaded targets take LogHandler and ResourceProvider, whose callbacks answer
# native, and wasm takes QueuedLogHandler and QueuedResourceProvider. The
# commonTest fixtures install each one through a test helper that each target
# implements in its own form.
#
# The commonTest files also run on the wasm target, on the page of headless
# Chromium, against a WebGL and a WebGPU browser module. There every
# registration names the page's delivery queue, and the page drains each
# callback into its upcall site. On WebGL, REND-01 reads back from a core
# worker over a transferred canvas and REND-02 is serviced from the page. On
# WebGPU the render cases drive a device that the page created, and REND-01's
# readback finishes on a later driver service on the page. REND-02's refusal of
# a second graphics thread needs a second Kotlin thread, so it runs in
# threadedTest CallerDriverThreadTest.
#
# Cases that depend on a platform name one test here and keep a copy per
# platform:
# - The leak report of an abandoned handle, read from standard output
#   (AbandonedHandleJvmTest in a child JVM, AbandonedHandleAndroidTest) or
#   from console.log (AbandonedHandleWasmTest). The disposal half runs on
#   every platform in commonTest AbandonedHandleTest.
# - Unreachable-request reclamation, which each garbage collector drives
#   (ResourceRequestHandleJvmTest, ResourceRequestHandleAndroidTest, and
#   ResourceRequestHandleWasmTest, where a FinalizationRegistry task releases
#   the request).
# CB-04's report goes to the thread's uncaught exception handler on the JVM, to
# the unhandled exception hook on Kotlin/Native, and to the page's reportError
# on wasm, which its commonTest test intercepts. Android writes the report to
# the log, since its default handler ends the process, and a test cannot read
# the log back, so the Android run checks the containment alone.
# The strided event batch with an unknown payload arm needs a batch laid out the
# way the C compiler does, which cinterop provides, so it runs in nativeTest
# RuntimeEventNativeTest. It also covers the checked narrowing of a native count
# to a list index. VAL-04's integer half is that narrowing: Kotlin's unsigned
# types match the C widths exactly, so only native counts narrow, to Int. Its
# open-enum half also runs on the way out, in the batch test's unknown event and
# source types.
# PLAT-02 names the exit with live runtime and map handles. Its render-session
# half runs in the child JVMs of jvmTest RenderSessionExitTest: the shutdown
# hook abandons a live session before exit, and an exit that starts inside a
# render-session completion still ends the process.

