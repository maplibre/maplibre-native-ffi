# Maps each case in cases.toml to the swift test that covers it:
#   "ID" = "path/to/test_file::test_name"
# or to why it does not apply:
#   "ID" = { na = "reason" }

[cases]
"ERR-01" = "bindings/swift/Tests/MaplibreNativeFFITests/ErrorTests.swift::aFailedCallMapsItsStatusAndCarriesItsDiagnostic"
# The test injects another version into the check. Each generated entry point
# without a receiver calls NativeAbi.ensureCompatible() first, which the
# generator's Swift probe checks against a stub that reports another version.
# A value's generated default reads native defaults without the check.
