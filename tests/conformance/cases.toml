# The cases every binding suite covers. Each binding's file in this directory
# maps every case ID to the test that covers it, or to the reason it does not
# apply. tools/lint/check-conformance.py checks both. Native semantics are tested
# once, in tests/native; these cases cover what a binding adds on top.

[cases]
# Status and diagnostics
"ERR-01" = "A failed call maps its status to the language's error, keeps an unknown status code, and carries the call's diagnostic message"
"ERR-02" = "The binding checks the C ABI version on its own before any other call reaches the library, and a library with a different version fails with status unsupported"
"ERR-03" = "A status that the C API declares as absence returns the language's empty form instead of an error"

# Handle lifecycle
"LIFE-01" = "A synchronous close is idempotent, and an asynchronous release reaches native even after close"
"LIFE-02" = "A close the native side refuses leaves the handle usable, and a later close succeeds"
"LIFE-03" = "A borrow in progress on another thread holds off a close until the borrow ends"
"LIFE-04" = "An abandoned handle is disposed off the callback stack, and the leak is reported through the binding's public output"
"LIFE-05" = "A child handle keeps its parent alive"
"LIFE-06" = "A handle's ID equals the source of the events it raises and stays readable after close"

# Completions
"COMP-01" = "A completion delivers exactly once, and a value that fails to convert is reported"
"COMP-02" = "A submission the native side rejects frees the binding's completion state"
"COMP-04" = "A failed or cancelled command fails its wait with the binding's error, carrying its status, diagnostic, and generation"
"COMP-05" = "Waiting on a completion can time out or be cancelled in the language's idiom"
"COMP-06" = "A discarded command applies its change and a later command completion on the same map fences it; a synchronously rejected discarded command raises the binding's error"

# Callbacks
"CB-01" = "A callback registration is rooted while native holds it and released when native releases it, including when the registration is rejected"
"CB-02" = "A registered callback does not keep its receiver alive"
"CB-04" = "An error thrown by a callback is contained and reported through the language's idiom"
"CB-05" = "A resource provider can keep the request handle it receives and answer it later"
"CB-06" = "A scoped response object rejects use after its callback returns and use from another thread"
"CB-07" = "Replacing a process-global callback releases the previous registration"
"CB-08" = "A registration whose accepted_unless output reports rejection is not rooted"
"CB-09" = "A registration nested in a command's input record is rooted until native runs and releases it, and a command that native rejects does not root it"
"CB-10" = "A provider's routes cross to native as a copied array: the provider receives only the requests its routes match, and a route that names only a URL pattern matches every resource kind"
"CB-11" = "A resource transform owns the request handle its callback receives, and another thread answers it after the callback returns"
"CB-12" = "A native registration reaches native with its function pointers and context unchanged, the first call that carries it consumes it, and the binding releases its context when native code does not accept the call"

# Generated value shapes
"VAL-01" = "Host strings cross as explicit-length views; native-lent terminated strings decode, and native rejects embedded NUL where a string reaches a C-string consumer"
"VAL-02" = "Presence fields and masks round-trip optional values"
"VAL-03" = "A strided batch and a union with an unknown arm decode without losing data"
"VAL-04" = "Integer narrowing is checked, open enums keep unknown values, and 64-bit carriers round-trip"
"VAL-05" = "An array input is copied at submission, so changing it afterwards has no effect"
"VAL-07" = "An array completion is read at the result's value_size stride, and a stride narrower than the element is rejected"
"VAL-08" = "A synchronous call fills a caller-sized output array in input order"
"VAL-09" = "A synchronous call returns caller-sized text longer than the binding's first storage for it"

# Views and rendering
"VIEW-01" = "A borrowed view expires with its scope, and its owner refuses to close while it is borrowed"
"REND-01" = "A render session renders a texture frame that the binding reads back as pixels, on each backend the build supports"
"REND-02" = "A caller-driven session is serviced from a thread the language manages (event loop, coroutine, isolate)"

# Platform
"PLAT-01" = "The binding finds and loads the native library as it ships (package, loader, build hook)"
"PLAT-02" = "Process exit, or language runtime shutdown, with live handles and callbacks that the host did not retire first exits cleanly"
"PLAT-03" = "The garbage collector or cycle collector reclaims abandoned handles and callback cycles"
