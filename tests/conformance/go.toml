"LIFE-06" = "bindings/go/maplibre/lifecycle_test.go::TestHandleIdNamesItsEventsAndOutlivesClose"
"COMP-01" = "bindings/go/maplibre/completion_test.go::TestCompletionDeliversExactlyOnce"
