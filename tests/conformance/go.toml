# Maps each case in cases.toml to the go test that covers it:
#   "ID" = "path/to/test_file::test_name"
# or to why it does not apply:
#   "ID" = { na = "reason" }
#
# The render tests, which LIFE-03, VIEW-01, REND-01, and REND-02 name, build
# with the backend tag that `mise run //bindings/go:test` passes for every EGL,
# Metal, and Vulkan preset, including the Android and OpenHarmony emulator
# presets, whose runners push tests/graphics beside the test binaries. WGL
# presets build no render tests, since the Go wrapper of tests/graphics has no
# WGL context.
#
# CB-04: the Go binding contains a callback's panic and logs it through the
# default slog logger. The callback returns its declared failure value to
# native, and the test observes both that value's outcome and the log record.

[cases]
"ERR-01" = "bindings/go/maplibre/errors_test.go::TestNativeStatusMapsToTypedErrors"
"ERR-02" = "bindings/go/maplibre/errors_test.go::TestMismatchedCABIVersionIsRejected"
"ERR-03" = "bindings/go/maplibre/render_test.go::TestDrainBeforeAnyDemandReturnsNoBatch"
