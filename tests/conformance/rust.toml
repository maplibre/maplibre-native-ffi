# The browser build renders on WebGL and WebGPU in tests/suite/browser/mod.rs.
"REND-01" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/render.rs::an_owned_texture_session_renders_a_frame_the_binding_reads_back"
"REND-02" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/render.rs::a_caller_driven_session_is_serviced_from_the_thread_that_claimed_it"
"PLAT-01" = "bindings/rust/crates/maplibre-native-ffi-sys/src/lib.rs::loads_the_native_library"
"PLAT-02" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/lifecycle.rs::a_process_that_exits_with_live_handles_and_callbacks_exits_cleanly"
"PLAT-03" = { na = "Rust has no garbage or cycle collector: dropping the last owner disposes a handle, as LIFE-04 checks, and a callback that holds its owner through a strong Arc keeps both alive until an explicit clear, as the crate documents" }
# `mise run //examples/rust-map:smoke [preset]` renders one frame in each
# render-target mode. rust-map drives OpenGL on Linux and Windows only, so a
# macOS OpenGL preset has no build of it.
"EX-01" = "examples/rust-map/src/main.rs::smoke_test"
