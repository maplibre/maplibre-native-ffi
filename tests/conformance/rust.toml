# Maps each case in cases.toml to the rust test that covers it:
#   "ID" = "path/to/test_file::test_name"
# or to why it does not apply:
#   "ID" = { na = "reason" }

[cases]
"ERR-01" = "bindings/rust/crates/maplibre-native-ffi-core/src/error.rs::a_failed_call_maps_its_status_and_keeps_an_unknown_code"
"ERR-02" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/lifecycle.rs::creation_checks_the_c_abi_version_before_it_reaches_native"
"ERR-03" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/render.rs::a_drain_before_any_demand_returns_no_batch"
