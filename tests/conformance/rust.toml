"LIFE-02" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/lifecycle.rs::a_refused_close_leaves_the_runtime_usable_and_a_later_close_succeeds"
"LIFE-03" = "bindings/rust/crates/maplibre-native-ffi/src/handle.rs::a_read_on_another_thread_holds_off_close_until_it_ends"
"LIFE-04" = "bindings/rust/crates/maplibre-native-ffi/src/handle.rs::a_handle_dropped_in_a_callback_disposes_off_its_stack_and_reports_a_failure"
"LIFE-05" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/lifecycle.rs::a_map_keeps_its_runtime_alive_after_the_runtime_handle_drops"
"COMP-01" = "bindings/rust/crates/maplibre-native-ffi/src/completion.rs::a_panicking_converter_completes_with_an_error_before_native_release"
"COMP-02" = "bindings/rust/crates/maplibre-native-ffi/src/completion.rs::a_rejected_submission_frees_the_bridge_and_reports_the_status"
"COMP-03" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/lifecycle.rs::a_dropped_map_creation_future_retires_the_map"
"COMP-04" = "bindings/rust/crates/maplibre-native-ffi/src/completion.rs::a_command_reports_a_rejection_while_other_operations_fail"
"COMP-05" = "bindings/rust/crates/maplibre-native-ffi/src/completion.rs::a_wait_times_out_and_a_dropped_future_leaves_native_its_bridge"
"CB-01" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/callbacks.rs::a_registration_is_rooted_while_native_holds_it_and_a_rejected_one_is_released"
"CB-02" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/callbacks.rs::a_registered_callback_does_not_keep_its_runtime_alive"
"CB-03" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/callbacks.rs::a_callback_may_answer_its_request_but_not_fence_or_close_its_runtime"
"CB-04" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/callbacks.rs::a_panicking_callback_is_contained_and_its_request_fails"
"CB-05" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/callbacks.rs::a_provider_hands_its_request_to_another_thread_and_answers_later"
"CB-06" = { na = "A transform's response borrows the callback's frame through a lifetime and holds a raw pointer, so it is neither 'static nor Send: the compiler rejects a use after the callback returns or from another thread" }
"CB-07" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/callbacks.rs::replacing_the_log_callback_releases_the_one_it_replaced"
"CB-08" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/callbacks.rs::registering_for_an_already_cancelled_request_reports_it_and_roots_nothing"
"VAL-01" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/values.rs::strings_cross_as_terminated_and_explicit_length_and_embedded_nul_is_rejected"
"VAL-02" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/values.rs::presence_fields_keep_a_present_zero_apart_from_an_absent_value"
"VAL-03" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/values.rs::a_strided_batch_and_an_unknown_union_arm_decode_without_losing_data"
# Generated fields carry the C widths exactly, so the only narrowing is a
# slice length into a native count, which this test cannot allocate.
"VAL-04" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/values.rs::open_enums_keep_unknown_values_and_64_bit_masks_cross_whole"
"VAL-05" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/values.rs::array_inputs_are_copied_when_they_are_submitted"
"VAL-06" = "bindings/rust/crates/maplibre-native-ffi/tests/suite/values.rs::a_record_built_from_its_default_equals_the_native_default"
