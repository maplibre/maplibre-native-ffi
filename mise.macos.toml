[vars]
host_native_preset = "macos-arm64-metal"

[bootstrap.packages]
"brew:docker-buildx" = "latest"
"brew:glslang" = "latest"
"brew:molten-vk" = "latest"
"brew:ninja" = "latest"
"brew:pkgconf" = "latest"
"brew:vulkan-loader" = "latest"

[env]
JDK_JAVA_OPTIONS = "-Djava.library.path=/opt/homebrew/opt/vulkan-loader/lib -Dorg.lwjgl.vulkan.libname=libvulkan.1.dylib"
MLN_FFI_VULKAN_LOADER_DIR = "/opt/homebrew/opt/vulkan-loader/lib"
VK_DRIVER_FILES = "/opt/homebrew/opt/molten-vk/etc/vulkan/icd.d/MoltenVK_icd.json"
