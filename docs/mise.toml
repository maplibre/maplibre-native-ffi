[tools]
"conda:doxygen" = { version = "{{vars.doxygen_version}}", os = ["linux", "macos", "windows/x64"] }
"core:zig" = { version = "{{vars.zig_version}}", os = ["linux", "macos", "windows/x64"] }

[tasks."api:c"]
run = [
  "rm -rf doxygen/gen public/reference/c",
  "mkdir -p doxygen/gen public/reference",
  "doxygen doxygen/Doxyfile",
  "cp -a doxygen/gen/html/. public/reference/c/",
]

[tasks."api:rust"]
depends = ["//:build"]
dir = ".."
run = '''
rm -rf docs/public/reference/rust
mkdir -p docs/public/reference
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/{{vars.host_native_preset}}/install" \
  cargo doc -p maplibre-native --no-deps
cp -a target/doc/. docs/public/reference/rust/
'''

[tasks."api:zig"]
dir = "../bindings/zig"
run = '''
rm -rf ../../docs/public/reference/zig
mkdir -p ../../docs/public/reference
zig build docs -Dinclude-dir=../../include --prefix ../../docs/public/reference/zig
'''

[tasks.api]
run = [
  { task = "api:c" },
  { task = "api:rust" },
  { task = "api:zig" },
]

[tasks.install]
run = "pnpm exec astro sync"

# The guides embed these files verbatim, so a compiler decides whether a
# documented snippet is valid rather than a reader or a review bot. Only the
# public headers are needed, so this runs without building the library.
[tasks."check-snippets"]
description = "Syntax-check the C snippets the guides embed"
dir = ".."
run = '''
for file in docs/snippets/c/*.c; do
  "${CC:-cc}" -fsyntax-only -std=c23 -Wall -Wextra -Iinclude "$file" || exit 1
done
'''

[tasks.dev]
depends = ["api", "install", "generate-support-matrix", "check-snippets"]
run = "pnpm run dev"

[tasks.start]
depends = ["api", "install", "generate-support-matrix", "check-snippets"]
run = "pnpm run start"

[tasks.build]
depends = ["api", "install", "generate-support-matrix", "check-snippets"]
run = "pnpm run build"

[tasks.preview]
depends = ["api", "install", "generate-support-matrix", "check-snippets"]
run = "pnpm run preview"

[tasks.astro]
run = "pnpm exec astro"

[tasks.generate-support-matrix]
run = "pnpm run generate-support-matrix"
