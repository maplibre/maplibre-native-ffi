[tools]
"npm:wrangler" = "{{vars.wrangler_version}}"
"conda:doxygen" = { version = "1.18.0", os = ["linux", "macos", "windows/x64"] }

[tasks.install]
run = "pnpm exec astro sync"

# Everything the site reads besides its own sources.
[tasks.prepare]
hide = true
depends = [
  "generate-api-index",
  "install",
  "generate-support-matrix",
  "generate-versions",
]

[tasks.dev]
depends = ["prepare"]
run = "pnpm exec astro dev"

[tasks.build]
depends = ["prepare"]
run = "pnpm exec astro build"

# The live demo in demo/, which the site serves at /demo/. Its pages load the
# binding's browser modules, so build those first, with the Emscripten SDK:
#
#   mise -E emscripten run //bindings/typescript:build emscripten-wasm32-webgl
#   mise -E emscripten run //bindings/typescript:build emscripten-wasm32-webgpu
#
# Then run demo-dev, or run demo-build before build to put the demo in the
# site.
[tasks.demo-modules]
hide = true
dir = "{{config_root}}/demo"
run = '''
for backend in webgl webgpu; do
  install="$MISE_MONOREPO_ROOT/bindings/typescript/native/build/emscripten-wasm32-$backend/install"
  if [[ ! -f "$install/maplibre_native_ffi.wasm" ]]; then
    echo "error: the $backend browser module isn't built. Build it with:" >&2
    echo "  mise -E emscripten run //bindings/typescript:build emscripten-wasm32-$backend" >&2
    exit 1
  fi
  rm -rf "public/$backend"
  mkdir -p "public/$backend"
  cp -R "$install/maplibre_native_ffi.mjs" "$install/maplibre_native_ffi.wasm" \
    "$install/licenses" "public/$backend/"
done
cp node_modules/coi-serviceworker/coi-serviceworker.min.js public/
'''

[tasks.demo-dev]
description = "Serve the live demo with the binding's browser modules"
depends = ["demo-modules"]
dir = "{{config_root}}/demo"
run = "pnpm exec vp dev"

[tasks.demo-build]
description = "Build the live demo into public/demo, where the site's build picks it up"
depends = ["demo-modules"]
dir = "{{config_root}}/demo"
run = "pnpm exec vp build"

[tasks.package-cloudflare]
description = "Package the built site under its base path for Cloudflare Pages"
dir = ".."
run = '''
test -d docs/dist
rm -rf build/cloudflare-pages
mkdir -p build/cloudflare-pages/maplibre-native-ffi
cp -a docs/dist/. build/cloudflare-pages/maplibre-native-ffi/
cp docs/cloudflare-pages/_redirects build/cloudflare-pages/_redirects
'''

[tasks.deploy-cloudflare]
description = "Deploy the packaged docs preview to a Cloudflare Pages branch"
tools = { "npm:wrangler" = "{{vars.wrangler_version}}" }
usage = 'arg "<branch>"'
dir = ".."
run = '''
output="$(mktemp)"
trap 'rm -f "$output"' EXIT
WRANGLER_OUTPUT_FILE_PATH="$output" wrangler pages deploy build/cloudflare-pages \
  --project-name=maplibre-native-ffi --branch="$usage_branch"
url="$(jq -ers '[.[] | select(.type == "pages-deploy-detailed")][-1] | .alias // .url' "$output")"
url="${url%/}/maplibre-native-ffi/"
echo "Cloudflare Pages: $url"
if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
  echo "url=$url" >> "$GITHUB_OUTPUT"
fi
if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
  echo "Cloudflare Pages: $url" >> "$GITHUB_STEP_SUMMARY"
fi
'''

[tasks.preview]
depends = ["prepare"]
run = "pnpm exec astro preview"

[tasks.generate-support-matrix]
run = "python scripts/generate-support-matrix.py"

[tasks.support-issue]
description = "Print the support tracking issue body from the generated matrix"
depends = ["generate-support-matrix"]
run = "python scripts/render-support-issue.py"

[tasks.generate-api-index]
description = "Write each C declaration's name and reference link in every language"
depends = ["api"]
dir = ".."
run = "uv run --no-sync python docs/scripts/generate-api-index.py"

[tasks.generate-versions]
description = "Write the release versions the pages quote into src/generated"
run = "python scripts/generate-versions.py"
