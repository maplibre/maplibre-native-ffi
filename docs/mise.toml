[tools]
"conda:doxygen" = { version = "{{vars.doxygen_version}}", os = ["linux", "macos", "windows/x64"] }
"core:zig" = { version = "{{vars.zig_version}}", os = ["linux", "macos", "windows/x64"] }

[tasks."api:c"]
run = [
  "rm -rf doxygen/gen public/reference/c",
  "mkdir -p doxygen/gen public/reference",
  "doxygen doxygen/Doxyfile",
  "cp -a doxygen/gen/html/. public/reference/c/",
]

[tasks."api:rust"]
depends = ["//:build"]
dir = ".."
run = '''
rm -rf docs/public/reference/rust
mkdir -p docs/public/reference
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/{{vars.host_native_preset}}/install" \
  cargo doc -p maplibre-native --no-deps
cp -a target/doc/. docs/public/reference/rust/
'''

[tasks."api:zig"]
dir = "../bindings/zig"
run = '''
rm -rf ../../docs/public/reference/zig
mkdir -p ../../docs/public/reference
zig build docs -Dinclude-dir=../../include --prefix ../../docs/public/reference/zig
'''

[tasks."api:kotlin"]
depends = ["//bindings/kotlin:api"]
run = '''
rm -rf public/reference/kotlin
mkdir -p public/reference
cp -a ../bindings/kotlin/build/dokka/html/. public/reference/kotlin/
'''

[tasks."api:dart"]
depends = ["//bindings/dart:api"]
run = '''
rm -rf public/reference/dart
mkdir -p public/reference
cp -a ../bindings/dart/.dart_tool/api-docs/. public/reference/dart/
'''

[tasks."api:python"]
depends = ["//bindings/python:api"]
run = '''
rm -rf public/reference/python
mkdir -p public/reference
cp -a ../bindings/python/build/pdoc/. public/reference/python/
'''

[tasks."api:dotnet"]
depends = ["//bindings/dotnet:api"]
run = '''
rm -rf public/reference/dotnet
mkdir -p public/reference
cp -a ../bindings/dotnet/build/docfx/. public/reference/dotnet/
'''

[tasks."api:swift"]
depends = ["//bindings/swift:api"]
run = '''
rm -rf public/reference/swift
mkdir -p public/reference
cp -a ../bindings/swift/build/docc/. public/reference/swift/
'''

[tasks.api]
run = [
  { task = "api:c" },
  { task = "api:rust" },
  { task = "api:zig" },
  { task = "api:kotlin" },
  { task = "api:dart" },
  { task = "api:python" },
  { task = "api:dotnet" },
  { task = "api:swift" },
]

[tasks.install]
run = "pnpm exec astro sync"

# The guides embed these files verbatim, so a compiler decides whether a
# documented snippet is valid rather than a reader or a review bot. Only the
# public headers are needed, so this runs without building the library.
[tasks."check-snippets"]
description = "Syntax-check the C snippets the guides embed"
dir = ".."
run = '''
compiler="${CC:-cc}"
# GCC named this standard c2x until GCC 14, and CI runners still ship those.
standard=""
for candidate in c23 c2x; do
  if "$compiler" "-std=$candidate" -fsyntax-only -x c /dev/null 2>/dev/null; then
    standard="$candidate"
    break
  fi
done
if [ -z "$standard" ]; then
  echo "$compiler supports neither -std=c23 nor -std=c2x" >&2
  exit 1
fi

for file in docs/snippets/c/*.c; do
  "$compiler" -fsyntax-only "-std=$standard" -Wall -Wextra -Iinclude "$file" ||
    exit 1
done
'''

[tasks.dev]
depends = ["api", "install", "generate-support-matrix", "check-snippets"]
run = "pnpm run dev"

[tasks.start]
depends = ["api", "install", "generate-support-matrix", "check-snippets"]
run = "pnpm run start"

[tasks.build]
depends = ["api", "install", "generate-support-matrix", "check-snippets"]
run = "pnpm run build"

[tasks.preview]
depends = ["api", "install", "generate-support-matrix", "check-snippets"]
run = "pnpm run preview"

[tasks.astro]
run = "pnpm exec astro"

[tasks.generate-support-matrix]
run = "pnpm run generate-support-matrix"
