# Languages that cannot reach a platform until an upstream project changes.
# The reason is Markdown and appears in the matrix and the issue; the link
# points upstream.

[[gap]]
language = "dart"
platform = "emscripten"
status = "blocked"
reason = "dart2wasm forbids user imports of `dart:ffi`, so the browser needs a separate JavaScript backend."
link = "https://github.com/dart-lang/sdk/blob/3.13.5/CHANGELOG.md"

[[gap]]
language = "dart"
platform = "freebsd"
status = "blocked"
reason = "The Dart SDK does not support FreeBSD, and only a community port exists."
link = "https://github.com/dart-lang/sdk/issues/52374"

[[gap]]
language = "dart"
platform = "ios-maccatalyst"
status = "blocked"
reason = "Flutter does not target Mac Catalyst, and Dart's build hooks build iOS code only for the device and simulator."
link = "https://github.com/dart-lang/native/blob/code_assets-v2.1.0/pkgs/code_assets/lib/src/code_assets/ios_sdk.dart"

[[gap]]
language = "dart"
platform = "ohos"
status = "blocked"
reason = "Neither the Dart SDK nor Flutter targets OpenHarmony, and Dart's build hooks have no OpenHarmony OS."
link = "https://github.com/dart-lang/native/blob/code_assets-v2.1.0/pkgs/code_assets/lib/src/code_assets/os.dart"

[[gap]]
language = "dart"
platform = "tvos"
status = "blocked"
reason = "Neither the Dart SDK nor Flutter targets tvOS."
link = "https://github.com/flutter/flutter/issues/47928"

[[gap]]
language = "dart"
platform = "visionos"
status = "blocked"
reason = "Neither Flutter nor Dart's build hooks target visionOS."
link = "https://github.com/flutter/flutter/issues/142933"

[[gap]]
language = "dotnet"
platform = "freebsd"
status = "blocked"
reason = "Microsoft ships no .NET for FreeBSD, and the ports tree carries .NET 9, older than the binding's `net10.0`."
link = "https://github.com/dotnet/runtime/blob/main/docs/workflow/requirements/freebsd-requirements.md"

[[gap]]
language = "dotnet"
platform = "ohos"
status = "blocked"
reason = "The .NET port to OpenHarmony is still landing on the runtime's main branch, so no release supports it, including the binding's `net10.0`."
link = "https://github.com/dotnet/runtime/issues/132866"

[[gap]]
language = "dotnet"
platform = "visionos"
status = "blocked"
reason = ".NET's Apple workloads cover iOS, tvOS, Mac Catalyst, and macOS, but not visionOS."
link = "https://github.com/dotnet/core/blob/main/release-notes/10.0/supported-os.md"

[[gap]]
language = "go"
platform = "emscripten"
status = "blocked"
reason = "Go's `js/wasm` port has no cgo ABI."
link = "https://github.com/golang/go/issues/55351"

[[gap]]
language = "kotlin"
platform = "ios-maccatalyst"
status = "blocked"
reason = "Kotlin/Native has no Mac Catalyst target."
link = "https://youtrack.jetbrains.com/issue/KT-40442"

[[gap]]
language = "kotlin"
platform = "ohos"
status = "blocked"
reason = "Kotlin Multiplatform has no OpenHarmony target."
link = "https://youtrack.jetbrains.com/issue/KT-63976"

[[gap]]
language = "kotlin"
platform = "visionos"
status = "blocked"
reason = "Kotlin/Native has no visionOS target."
link = "https://youtrack.jetbrains.com/issue/KT-59571"

[[gap]]
language = "python"
platform = "emscripten"
status = "blocked"
reason = "PyEmscripten wheels forbid the pthreads that the C library needs."
link = "https://peps.python.org/pep-0783/#the-pyemscripten-platform"

[[gap]]
language = "swift"
platform = "emscripten"
status = "blocked"
reason = "The Swift WebAssembly SDK targets WASI, not Emscripten."

[[gap]]
language = "swift"
platform = "ohos"
status = "blocked"
reason = "Swift has no OpenHarmony target, and Swift.org ships no OpenHarmony SDK. The only port, a community Swift 6.0.3 toolchain, runs on aarch64 devices alone, so it cannot cross-compile from Linux or macOS or reach the x64 emulator that CI uses, and it does not promise SwiftPM."
link = "https://gitcode.com/gcw_hL6s3dcK/swift-toolchain-ohos"

[[gap]]
language = "zig"
platform = "emscripten"
status = "blocked"
reason = "Zig 0.17.0 has no `std.heap.page_allocator` for multithreaded WebAssembly, and every safe build reaches it through the panic handler. Each thread that `std.Thread` spawns also panics, because Emscripten lacks `sigaltstack`. A program can override both from its root module, but every consumer would have to."
link = "https://github.com/ziglang/zig/issues/22807"

[[gap]]
language = "zig"
platform = "ios"
status = "blocked"
reason = "Zig 0.17.0 references process spawning, which these targets lack. Zig's master branch has the fix."
link = "https://codeberg.org/ziglang/zig/pulls/37063"

[[gap]]
language = "zig"
platform = "ohos"
status = "blocked"
reason = "Zig 0.17.0's `compiler_rt` needs `pthread_mutex_t` for emulated TLS on OpenHarmony, but `std.c` defines no layout for the `ohos` ABI."
link = "https://codeberg.org/ziglang/zig/issues/31427"

[[gap]]
language = "zig"
platform = "tvos"
status = "blocked"
reason = "Zig 0.17.0 references process spawning, which these targets lack. Zig's master branch has the fix."
link = "https://codeberg.org/ziglang/zig/pulls/37063"

[[gap]]
language = "zig"
platform = "visionos"
status = "blocked"
reason = "Zig 0.17.0 references process spawning, which these targets lack. Zig's master branch has the fix."
link = "https://codeberg.org/ziglang/zig/pulls/37063"

