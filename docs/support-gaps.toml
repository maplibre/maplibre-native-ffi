reason = "MSYS2's CLANGARM64 environment supplies an ARM64 toolchain. Extend the MSYS2 presets and runtime dependency handling for its UCRT and libc++, select Rust's matching `aarch64-pc-windows-gnullvm` target, and run the C suites on the Windows ARM64 runners."
link = "https://www.msys2.org/docs/environments/"

[[entry]]
bindings = ["go"]
platforms = ["windows-mingw"]
status = "path-known"
reason = "cgo builds with a MinGW Clang or GCC. Link the MinGW DLL and run the suite on the Windows runners."
