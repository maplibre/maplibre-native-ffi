issue = 936

# Targets that CI does not build yet.

[[entry]]
bindings = ["c"]
platforms = ["freebsd"]
archs = ["arm64"]
backends = ["vulkan", "opengl"]
status = "not-investigated"

# Cells that wait on an upstream fix or release.

[[entry]]
bindings = ["c"]
platforms = ["wasi"]
archs = ["wasm32"]
backends = ["webgpu"]
status = "blocked"
reason = "WASI has no graphics API yet. `wasi:webgpu`, which brings WebGPU to WASI, is a Phase 2 proposal."
link = "https://github.com/WebAssembly/wasi-gfx"

[[entry]]
bindings = ["dotnet"]
platforms = ["freebsd"]
status = "blocked"
reason = "Microsoft ships no .NET for FreeBSD, and the ports tree carries .NET 9, older than the binding's `net10.0`."
link = "https://github.com/dotnet/runtime/blob/main/docs/workflow/requirements/freebsd-requirements.md"

[[entry]]
bindings = ["dotnet"]
platforms = ["ohos"]
status = "blocked"
reason = "The .NET port to OpenHarmony is still landing on the runtime's main branch, so no release supports it, including the binding's `net10.0`."
link = "https://github.com/dotnet/runtime/issues/132866"

[[entry]]
bindings = ["python"]
platforms = ["emscripten"]
status = "blocked"
reason = "PyEmscripten wheels forbid the pthreads that the C library needs."
link = "https://peps.python.org/pep-0783/#the-pyemscripten-platform"

[[entry]]
bindings = ["zig"]
platforms = ["emscripten"]
status = "blocked"
reason = "Zig 0.17.0 has no `std.heap.page_allocator` for multithreaded WebAssembly, and every safe build reaches it through the panic handler. Each thread that `std.Thread` spawns also panics, because Emscripten lacks `sigaltstack`. A program can override both from its root module, but every consumer would have to."
link = "https://github.com/ziglang/zig/issues/22807"

[[entry]]
bindings = ["zig"]
platforms = ["ios", "tvos", "visionos"]
status = "blocked"
reason = "Zig 0.17.0 references process spawning, which these targets lack. Zig's master branch has the fix."
link = "https://codeberg.org/ziglang/zig/pulls/37063"

[[entry]]
bindings = ["zig"]
platforms = ["ohos"]
status = "blocked"
reason = "Zig 0.17.0's `compiler_rt` needs `pthread_mutex_t` for emulated TLS on OpenHarmony, but `std.c` defines no layout for the `ohos` ABI."
link = "https://codeberg.org/ziglang/zig/issues/31427"

[[entry]]
bindings = ["swift"]
platforms = ["linux-gnu"]
archs = ["riscv64"]
status = "blocked"
reason = "Swift's build lists RISC-V as a Linux target, but its standard library does not compile for it, and Swift.org ships no RISC-V toolchain."
link = "https://github.com/swiftlang/swift/issues/78349"

[[entry]]
bindings = ["swift"]
platforms = ["freebsd"]
status = "blocked"
reason = "Swift.org provides only a mutable development preview for FreeBSD 14 on x64, with no versioned toolchain release to pin."
link = "https://forums.swift.org/t/swift-on-freebsd-preview/83064"

[[entry]]
bindings = ["dart"]
platforms = ["freebsd"]
status = "blocked"
reason = "The upstream Dart SDK does not target FreeBSD; running the binding requires a community port."
link = "https://github.com/dart-lang/sdk/issues/52374"

[[entry]]
bindings = ["swift"]
platforms = ["ohos"]
status = "blocked"
reason = "The upstream Swift toolchain does not target OpenHarmony. The community port uses Swift 6.0.3, older than the package's required Swift tools 6.2, runs only on arm64 devices, and does not promise SwiftPM."
link = "https://gitcode.com/gcw_hL6s3dcK/swift-toolchain-ohos"

[[entry]]
bindings = ["dart"]
platforms = ["ohos"]
status = "blocked"
reason = "The upstream Dart and Flutter toolchains do not target OpenHarmony; support requires a community Flutter fork and its bundled Dart SDK."
link = "https://gitcode.com/openharmony-sig/flutter_flutter"

[[entry]]
bindings = ["kotlin-native"]
platforms = ["ohos"]
status = "blocked"
reason = "The upstream Kotlin/Native toolchain has no OpenHarmony target; community forks add one for arm64 devices only."
link = "https://github.com/zxystd/Kotlin-OHOS"

[[entry]]
bindings = ["python"]
platforms = ["ohos"]
status = "blocked"
reason = "Running Python on OpenHarmony requires a community CPython port, outside the project's supported toolchains."
link = "https://gitcode.com/ai_model_sig/ohos_python"

[[entry]]
bindings = ["dotnet"]
platforms = ["linux-gnu", "linux-musl"]
archs = ["riscv64"]
status = "blocked"
reason = "Microsoft publishes no .NET SDK for RISC-V; available SDKs are community builds, outside the project's supported toolchains."
link = "https://github.com/filipnavara/dotnet-riscv/releases"

[[entry]]
bindings = ["dotnet"]
platforms = ["linux-gnu", "linux-musl"]
archs = ["loongarch64"]
status = "blocked"
reason = "Microsoft publishes no .NET SDK for LoongArch; available SDKs are community builds, outside the project's supported toolchains."
link = "https://github.com/chenguohui/dotnet-loongarch/releases"

[[entry]]
bindings = ["dart"]
platforms = ["linux-gnu"]
archs = ["loongarch64"]
status = "blocked"
reason = "Dart's maintainers do not plan to support LoongArch; available SDKs come from a community fork, outside the project's supported toolchains."
link = "https://github.com/Flutter-Dart-loong64/flutter-loong64-releases"

# Cells with a known path that no one has started.

[[entry]]
bindings = ["c"]
platforms = ["windows-mingw"]
archs = ["arm64"]
backends = ["vulkan", "opengl"]
status = "path-known"
reason = "A DLL built with Zig's `windows-gnu` target passes the C suites under Wine, after the build changes that the issue lists. A static archive has to hide its bundled C++ runtime without `ld -r`, which lld lacks for COFF, by renaming that runtime's symbols with `llvm-objcopy`."
link = "https://github.com/maplibre/maplibre-native-ffi/issues/1322"

[[entry]]
bindings = ["dotnet"]
platforms = ["android", "ios"]
status = "path-known"
reason = "Add a `net10.0-android` or `net10.0-ios` host, package the native assets, and run a test app on the emulator or simulator. Android also needs its platform services initialized."

[[entry]]
bindings = ["dotnet"]
platforms = ["emscripten"]
