issue = 936

# Every binding is supported unless an entry below declares its gap. CI and
# the support matrix share these selectors; omitting an axis matches all its
# values. `operations` can narrow a gap to build, test, package production,
# or the combined Apple XCFramework (separate from per-target native archives).
# A C gap applies to every binding on that target, including targets
# that do not yet have a CMake preset. `simulators` distinguishes Apple
# devices from simulators; omitting it matches both.

# Upstream bugs, pending support proposals or releases, and registry restrictions.

[[entry]]
bindings = ["dotnet"]
platforms = ["ohos"]
status = "blocked"
reason = "The .NET port to OpenHarmony is still landing on the runtime's main branch, so no release supports it, including the binding's `net10.0`."
link = "https://github.com/dotnet/runtime/issues/132866"

[[entry]]
bindings = ["python"]
platforms = ["emscripten"]
status = "blocked"
reason = "PyEmscripten wheels forbid the pthreads that the C library needs."
link = "https://peps.python.org/pep-0783/#the-pyemscripten-platform"

[[entry]]
bindings = ["zig"]
platforms = ["emscripten"]
status = "blocked"
reason = "Zig 0.17.0 has no `std.heap.page_allocator` for multithreaded WebAssembly, and every safe build reaches it through the panic handler. Each thread that `std.Thread` spawns also panics, because Emscripten lacks `sigaltstack`. A program can override both from its root module, but every consumer would have to."
link = "https://github.com/ziglang/zig/issues/22807"

[[entry]]
bindings = ["zig"]
platforms = ["ios", "tvos", "visionos"]
status = "blocked"
reason = "Zig 0.17.0 references process spawning, which these targets lack. Zig's master branch has the fix."
link = "https://codeberg.org/ziglang/zig/pulls/37063"

[[entry]]
bindings = ["zig"]
platforms = ["ohos"]
status = "blocked"
reason = "Zig 0.17.0's `compiler_rt` needs `pthread_mutex_t` for emulated TLS on OpenHarmony, but `std.c` defines no layout for the `ohos` ABI."
link = "https://codeberg.org/ziglang/zig/issues/31427"

[[entry]]
bindings = ["swift"]
platforms = ["linux-musl"]
archs = ["x64", "arm64"]
status = "blocked"
reason = "Swift's released musl SDK supports only fully static executables, with no dynamic linking or `dlopen`, so it cannot load the C shared library or graphics drivers."
link = "https://github.com/swiftlang/swift/issues/47209"

[[entry]]
bindings = ["swift"]
platforms = ["linux-gnu"]
archs = ["riscv64"]
status = "blocked"
reason = "Swift's build lists RISC-V as a Linux target, but its standard library does not compile for it, and Swift.org ships no RISC-V toolchain."
link = "https://github.com/swiftlang/swift/issues/78349"

[[entry]]
bindings = ["swift"]
platforms = ["freebsd"]
status = "blocked"
reason = "Swift.org provides only a mutable development preview for FreeBSD 14 on x64, with no versioned toolchain release to pin."
link = "https://forums.swift.org/t/swift-on-freebsd-preview/83064"

[[entry]]
bindings = ["dotnet"]
platforms = ["linux-gnu", "linux-musl"]
archs = ["riscv64"]
status = "blocked"
reason = "The upstream .NET RISC-V port is in progress, but Microsoft publishes no released SDK for it."
link = "https://github.com/dotnet/runtime/issues/84834"

[[entry]]
bindings = ["dotnet"]
platforms = ["linux-gnu", "linux-musl"]
archs = ["loongarch64"]
status = "blocked"
reason = "The upstream .NET LoongArch port has landed and runtime work continues, but Microsoft publishes no released SDK for it."
link = "https://github.com/dotnet/runtime/issues/59561"

[[entry]]
bindings = ["dart"]
platforms = ["linux-musl"]
status = "blocked"
reason = "Upstream has accepted musl build work and tracks the remaining build configuration, but publishes no released musl SDK. Alpine SDKs are community builds."
link = "https://github.com/dart-lang/sdk/issues/51983"

[[entry]]
bindings = ["python"]
platforms = ["freebsd"]
status = "blocked"
reason = "PyPI rejects FreeBSD wheel tags, so the package cannot publish its runtime wheel even after the extension builds and tests are wired up in the FreeBSD VM."
link = "https://github.com/pypi/warehouse/blob/main/warehouse/utils/wheel.py"

[[entry]]
bindings = ["python"]
platforms = ["linux-gnu", "linux-musl"]
archs = ["loongarch64"]
status = "blocked"
reason = "Debian and Alpine package Python for LoongArch, but PyPI rejects its wheel tags, so the package cannot publish its runtime wheel."
link = "https://github.com/pypi/warehouse/blob/main/warehouse/utils/wheel.py"

[[entry]]
bindings = ["python"]
platforms = ["ios-maccatalyst"]
status = "blocked"
reason = "Mac Catalyst support is proposed upstream, but CPython has no released target for it; current embedding uses a community port."
link = "https://github.com/python/cpython/issues/98297"

[[entry]]
bindings = ["python"]
platforms = ["tvos", "visionos"]
status = "blocked"
reason = "CPython's tvOS and visionOS support has landed in its 3.16 development branch, but no released runtime supports them, including the project's pinned Python 3.15.1."
link = "https://github.com/python/cpython/pull/159944"

[[entry]]
bindings = ["dart"]
platforms = ["visionos"]
status = "blocked"
reason = "Upstream proposes visionOS support for native assets, but build hooks do not yet accept the visionOS SDK."
link = "https://github.com/dart-lang/native/issues/961"

