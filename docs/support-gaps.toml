[[entry]]
bindings = ["rust"]
platforms = ["windows-mingw"]
status = "path-known"
reason = "Select target-matched MinGW artifacts in the sys crate's build script, starting with the current `x86_64-pc-windows-gnu` preset and its MSVCRT dependencies. GNU LLVM targets need UCRT artifacts instead. Link the runtime dependencies and run the suite on the Windows runners."
link = "https://github.com/rust-lang/rust/blob/1.99.1/src/doc/rustc/src/platform-support/windows-gnullvm.md"

[[entry]]
