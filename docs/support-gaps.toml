issue = 936

# Every binding is supported unless an entry below declares its gap. CI and
# the support matrix share these selectors; omitting an axis matches all its
# values. `operations` can narrow a gap to build, test, package production,
# or the combined Apple XCFramework (separate from per-target native archives).
# A platform's package carries all of its backends, so it builds and packages
# where any backend has no gap; `backends` narrows a test gap to the backends
# whose suites a runner can't run.
# A C gap applies to every binding on that target, including targets
# that do not yet have a CMake preset. `simulators` distinguishes Apple
# devices from simulators; omitting it matches both.

# Upstream bugs, pending support proposals or releases, and registry restrictions.

[[entry]]
bindings = ["dotnet"]
platforms = ["ohos"]
status = "blocked"
reason = "The .NET port to OpenHarmony is still landing on the runtime's main branch, so no release supports it, including the binding's `net10.0`."
link = "https://github.com/dotnet/runtime/issues/132866"

[[entry]]
bindings = ["zig"]
platforms = ["ios", "tvos", "visionos"]
status = "blocked"
reason = "Zig 0.17.1 compiles these targets but cannot link them: the SDK's `libSystem` stub is tagged `arm64e-ios`, which Zig does not accept for `arm64-ios`, so even a hello world leaves every libc symbol undefined. Simulator targets link."
link = "https://codeberg.org/ziglang/zig/issues/37298"

[[entry]]
bindings = ["zig"]
platforms = ["ohos"]
status = "blocked"
reason = "Zig 0.17.1's `compiler_rt` needs `pthread_mutex_t` for emulated TLS on OpenHarmony, but `std.c` defines no layout for the `ohos` ABI."
link = "https://codeberg.org/ziglang/zig/issues/31427"

[[entry]]
bindings = ["swift"]
platforms = ["linux-musl"]
archs = ["x64", "arm64"]
status = "blocked"
reason = "Swift's released musl SDK supports only fully static executables, with no dynamic linking or `dlopen`, so it cannot load the C shared library or graphics drivers."
link = "https://github.com/swiftlang/swift/issues/47209"

[[entry]]
bindings = ["swift"]
platforms = ["linux-gnu"]
archs = ["riscv64"]
status = "blocked"
reason = "Swift's build lists RISC-V as a Linux target, but its standard library does not compile for it, and Swift.org ships no RISC-V toolchain."
link = "https://github.com/swiftlang/swift/issues/78349"

[[entry]]
bindings = ["swift"]
platforms = ["windows-mingw"]
operations = ["package"]
status = "blocked"
reason = "The binding builds and tests against the MinGW DLL, but its package links the C library statically, and Swift's Windows toolchain targets only MSVC, whose runtime a MinGW archive cannot link with."
link = "https://www.swift.org/install/windows/"

[[entry]]
bindings = ["swift"]
platforms = ["freebsd"]
status = "blocked"
reason = "Swift.org provides only a mutable development preview for FreeBSD 14 on x64, with no versioned toolchain release to pin."
link = "https://forums.swift.org/t/swift-on-freebsd-preview/83064"

[[entry]]
bindings = ["dotnet"]
platforms = ["linux-gnu", "linux-musl"]
archs = ["riscv64"]
status = "blocked"
reason = "The upstream .NET RISC-V port is in progress, but Microsoft publishes no released SDK for it."
link = "https://github.com/dotnet/runtime/issues/84834"

[[entry]]
