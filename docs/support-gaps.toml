# Languages that cannot reach a platform until an upstream project changes.
# The reason is Markdown and appears in the matrix and the issue; the link
# points upstream.

[[gap]]
language = "dart"
platform = "emscripten"
status = "blocked"
reason = "dart2wasm forbids user imports of `dart:ffi`, so the browser needs a separate JavaScript backend."
link = "https://github.com/dart-lang/sdk/blob/3.13.5/CHANGELOG.md"

[[gap]]
language = "go"
platform = "emscripten"
status = "blocked"
reason = "Go's `js/wasm` port has no cgo ABI."
link = "https://github.com/golang/go/issues/55351"

[[gap]]
language = "kotlin"
platform = "ios-maccatalyst"
status = "blocked"
reason = "Kotlin/Native has no Mac Catalyst target."
link = "https://youtrack.jetbrains.com/issue/KT-40442"

[[gap]]
language = "kotlin"
platform = "ohos"
status = "blocked"
reason = "Kotlin Multiplatform has no OpenHarmony target."
link = "https://youtrack.jetbrains.com/issue/KT-63976"

[[gap]]
language = "python"
platform = "emscripten"
status = "blocked"
reason = "PyEmscripten wheels forbid the pthreads that the C library needs."
link = "https://peps.python.org/pep-0783/#the-pyemscripten-platform"

[[gap]]
language = "swift"
platform = "emscripten"
status = "blocked"
reason = "The Swift WebAssembly SDK targets WASI, not Emscripten."

[[gap]]
language = "zig"
platform = "ios"
status = "blocked"
reason = "Zig 0.17.0 references process spawning, which these targets lack. The fix is expected in Zig 0.17.1."
link = "https://codeberg.org/ziglang/zig/pulls/37063"

[[gap]]
language = "zig"
platform = "tvos"
status = "blocked"
reason = "Zig 0.17.0 references process spawning, which these targets lack. The fix is expected in Zig 0.17.1."
link = "https://codeberg.org/ziglang/zig/pulls/37063"

