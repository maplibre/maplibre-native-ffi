[tools]
"core:java" = "{{vars.java_version}}"

[tasks.build]
usage = 'arg "[target]" default="{{vars.host_native_target}}"'
depends = [{ task = "//:build", args = ["{{usage.target}}"] }]
dir = "../.."
run = '''
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_target/install" \
  :examples:lwjgl-map:build
'''

[tasks.run]
depends = ["//:build"]
dir = "../.."
usage = '''
arg "[render-target]" default="owned-texture" {
  choices "owned-texture" "borrowed-texture" "native-surface"
}
'''
run = '''
./gradlew \
  -PmaplibreNativeCInstallDir="build/{{vars.host_native_target}}/install" \
  :examples:lwjgl-map:run \
  --args="{{ usage.render_target }}"
'''

[tasks."run:owned-texture"]
run = [{ task = "run", args = ["owned-texture"] }]

[tasks."run:borrowed-texture"]
run = [{ task = "run", args = ["borrowed-texture"] }]

[tasks."run:native-surface"]
run = [{ task = "run", args = ["native-surface"] }]
