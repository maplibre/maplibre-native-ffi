[tools]
"core:java" = "{{vars.java_version}}"

[tasks.build]
extends = "ffi:preset"
dir = "../.."
run = '''
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  :examples:lwjgl-map:build
'''

[tasks.run]
extends = "ffi:example-run"
dir = "../.."
run = '''
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  :examples:lwjgl-map:run \
  --args="$usage_render_target"
'''

[tasks.smoke]
description = "Render one frame of an inline style in each mode in a hidden window, then exit."
extends = "ffi:preset"
dir = "../.."
run = '''
export MLN_EXAMPLE_SMOKE=1
# A hidden Wayland surface can wait indefinitely for a compositor frame callback.
# Linux smoke runs use X11, with a virtual display when the host has none.
runner=()
if [[ "$(uname -s)" == Linux ]]; then
  unset WAYLAND_DISPLAY
  export XDG_SESSION_TYPE=x11 EGL_PLATFORM=x11
  if [[ -z "${DISPLAY:-}" ]]; then
    runner=(xvfb-run -a)
  fi
fi
for mode in owned-texture borrowed-texture native-surface; do
  ${runner[@]+"${runner[@]}"} ./gradlew \
    -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
    :examples:lwjgl-map:run \
    --args="$mode" || exit
done
'''
