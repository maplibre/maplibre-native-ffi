[tools]
"conda:sdl3" = { version = "{{vars.sdl3_version}}", os = ["linux", "macos"] }

[env]
# SDL 3's install prefix, empty where the tool is not installed.
MLN_FFI_SDL3_PREFIX = { value = "{% if tools['conda:sdl3'] is defined %}{{ tools['conda:sdl3'].path }}{% endif %}", tools = true }

[tasks.build]
extends = "ffi:preset"
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PKG_CONFIG_PATH="$MLN_FFI_SDL3_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
# Without a sysroot, clang takes the default SDK, which can be a Command Line
# Tools SDK newer than the selected Xcode's linker reads. The presets pin the
# selected Xcode's SDK the same way.
sysroot=""
if [ "$(uname -s)" = Darwin ]; then sysroot="-DCMAKE_OSX_SYSROOT=macosx"; fi
cmake -S . -B "$MISE_MONOREPO_ROOT/build/$usage_preset/c-map" -G Ninja $sysroot \
  -DMLN_NATIVE_INSTALL_DIR="$native_install_dir" \
  -DMLN_DEPENDENCY_INCLUDE_DIR="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include"
cmake --build "$MISE_MONOREPO_ROOT/build/$usage_preset/c-map"
'''

[tasks.run]
extends = "ffi:example-run"
run = '''
export LD_LIBRARY_PATH="$MISE_MONOREPO_ROOT/build/$usage_preset/install/lib:$MLN_FFI_SDL3_PREFIX/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
"$MISE_MONOREPO_ROOT/build/$usage_preset/c-map/c-map" "$usage_render_target"
'''

[tasks.smoke]
description = "Render one frame in a hidden window and exit."
extends = "ffi:preset"
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
run = '''
LD_LIBRARY_PATH="$MISE_MONOREPO_ROOT/build/$usage_preset/install/lib:$MLN_FFI_SDL3_PREFIX/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
  "$MISE_MONOREPO_ROOT/tools/examples/smoke" "$usage_preset" "$MISE_MONOREPO_ROOT/build/$usage_preset/c-map/c-map"
'''
