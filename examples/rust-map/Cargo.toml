[package]
name = "rust-map"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
glow = "0.16.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
maplibre-native-ffi = { path = "../../bindings/rust/crates/maplibre-native-ffi" }
# A direct dependency, so the build script reads the backend the library has.
maplibre-native-ffi-sys.workspace = true
raw-window-handle = "0.6.2"
winit = { version = "0.30.13", features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSResponder",
  "NSView",
  "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3.2", features = [
  "NSError",
  "NSObject",
  "NSString",
] }
objc2-metal = { version = "0.3.2", features = [
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLDevice",
  "MTLDrawable",
  "MTLLibrary",
  "MTLPixelFormat",
  "MTLRenderCommandEncoder",
  "MTLRenderPass",
  "MTLRenderPipeline",
  "MTLResource",
  "MTLTexture",
] }
objc2-quartz-core = { version = "0.3.2", features = [
  "CALayer",
  "CAMetalLayer",
  "objc2-core-foundation",
  "objc2-metal",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
] }
