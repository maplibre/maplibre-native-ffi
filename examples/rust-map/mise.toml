[tasks.build]
depends = ["//:ensure-native-library"]
run = '''
repo_root=$(git rev-parse --show-toplevel)
bash "$repo_root/bindings/rust/scripts/with-libclang.sh" cargo build --manifest-path "$repo_root/Cargo.toml" -p rust-map
'''

[tasks.run]
depends = ["//:ensure-native-library"]
run = '''
repo_root=$(git rev-parse --show-toplevel)
bash "$repo_root/bindings/rust/scripts/with-libclang.sh" cargo run --manifest-path "$repo_root/Cargo.toml" -p rust-map
'''
