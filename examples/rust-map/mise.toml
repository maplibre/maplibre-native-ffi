[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
set -euo pipefail
native_install_dir="$PWD/build/$usage_preset/install"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
  cargo build -p rust-map
'''

[tasks.check]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
set -euo pipefail
native_install_dir="$PWD/build/$usage_preset/install"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
  cargo clippy -p rust-map --all-targets -- -D warnings
'''

[tasks.run]
depends = ["//:build"]
dir = "../.."
usage = '''
arg "[render-target]" default="owned-texture" {
  choices "owned-texture" "borrowed-texture" "native-surface"
}
'''
run = '''
set -euo pipefail
MAPLIBRE_NATIVE_C_INSTALL_DIR="{{vars.host_native_install_dir}}" \
  cargo run -p rust-map -- "{{ usage.render_target }}"
'''
run_windows = '''
set -euo pipefail
export PATH="{{vars.host_native_install_dir}}/bin${PATH:+:$PATH}"
MAPLIBRE_NATIVE_C_INSTALL_DIR="{{vars.host_native_install_dir}}" \
  cargo run -p rust-map -- "{{ usage.render_target }}"
'''

[tasks."run:owned-texture"]
run = [{ task = "run", args = ["owned-texture"] }]

[tasks."run:borrowed-texture"]
run = [{ task = "run", args = ["borrowed-texture"] }]

[tasks."run:native-surface"]
run = [{ task = "run", args = ["native-surface"] }]
