[tasks.build]
extends = "bash"
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
set -euo pipefail
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  cargo build -p rust-map
'''

[tasks.check]
extends = "bash"
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
set -euo pipefail
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  cargo clippy -p rust-map --all-targets -- -D warnings
'''

[tasks.run]
extends = "bash"
depends = ["//:build"]
dir = "../.."
usage = '''
arg "[render-target]" default="owned-texture" {
  choices "owned-texture" "borrowed-texture" "native-surface"
}
'''
run = '''
set -euo pipefail
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/{{vars.host_native_preset}}/install" \
  cargo run -p rust-map -- "{{ usage.render_target }}"
'''
run_windows = '''
set -euo pipefail
native_install_dir="$MISE_MONOREPO_ROOT/build/{{vars.host_native_preset}}/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
  cargo run -p rust-map -- "{{ usage.render_target }}"
'''

[tasks."run:owned-texture"]
extends = "bash"
run = [{ task = "run", args = ["owned-texture"] }]

[tasks."run:borrowed-texture"]
extends = "bash"
run = [{ task = "run", args = ["borrowed-texture"] }]

[tasks."run:native-surface"]
extends = "bash"
run = [{ task = "run", args = ["native-surface"] }]
