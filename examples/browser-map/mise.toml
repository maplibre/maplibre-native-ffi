[tools]
emsdk = "4.0.10"

[tasks.build]
description = "Build the browser WebGPU map example."
dir = "{{config_root}}/../.."
run = '''
set -euo pipefail

build_dir="$PWD/build/browser-wasm32-webgpu"
output_dir="$build_dir/examples/browser-map"
cmake --workflow --preset browser-wasm32-webgpu
pnpm exec vp build "$PWD/examples/browser-map" \
  --config "$PWD/examples/browser-map/vite.config.ts" \
  --outDir "$output_dir" \
  --emptyOutDir
cp "$build_dir/examples/browser-map-native/browser-map.js" \
  "$output_dir/browser-map.js"
cp "$build_dir/examples/browser-map-native/browser-map.wasm" \
  "$output_dir/browser-map.wasm"
'''

[tasks.run]
description = "Serve the browser WebGPU map example."
run = '''
set -euo pipefail

mise run build
repo_root="$(cd ../.. && pwd)"
export MLN_FFI_BUILD_DIR="$repo_root/build/browser-wasm32-webgpu"
exec pnpm exec vp dev "$repo_root/examples/browser-map" \
  --config "$repo_root/examples/browser-map/vite.config.ts" \
  --host 0.0.0.0 \
  --port 8080 \
  --strictPort
'''
