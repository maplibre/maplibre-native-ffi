[tasks.build]
description = "Build the browser WebGPU map example."
depends = ["//:ensure-native-library"]
dir = "{{env.MLN_FFI_REPO_ROOT}}"
run = '''
set -euo pipefail
if [[ "${MISE_ENV:-}" != "browser-wasm64-webgpu" ]]; then
  echo "browser-map requires the browser WebGPU environment:" >&2
  echo "  mise -E browser-wasm64-webgpu run //examples/browser-map:build" >&2
  exit 1
fi

source "$EMSDK/emsdk_env.sh"
emmake cmake --build "$MLN_FFI_BUILD_DIR" --target browser_map

output_dir="$MLN_FFI_BUILD_DIR/examples/browser-map"
pnpm exec vp build "$MLN_FFI_REPO_ROOT/examples/browser-map" \
  --config "$MLN_FFI_REPO_ROOT/examples/browser-map/vite.config.ts" \
  --outDir "$output_dir" \
  --emptyOutDir
cp "$MLN_FFI_BUILD_DIR/examples/browser-map-native/browser-map.js" \
  "$output_dir/browser-map.js"
cp "$MLN_FFI_BUILD_DIR/examples/browser-map-native/browser-map.wasm" \
  "$output_dir/browser-map.wasm"
'''

[tasks.run]
description = "Serve the browser WebGPU map example."
run = '''
set -euo pipefail

mise run build
exec pnpm exec vp dev "$MLN_FFI_REPO_ROOT/examples/browser-map" \
  --config "$MLN_FFI_REPO_ROOT/examples/browser-map/vite.config.ts" \
  --host 0.0.0.0 \
  --port 8080 \
  --strictPort
'''
