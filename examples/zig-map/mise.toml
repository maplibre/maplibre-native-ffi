[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '''
zig_args=(
  -Dnative-install-dir="../../build/$usage_preset/install"
  -Ddependency-include-dir="{{vars.vulkan_include_dir}}"
)
zig build {{vars.zig_host_args}} "${zig_args[@]}"
'''

[tasks.run]
depends = ["//:build"]
usage = '''
arg "[render-target]" default="owned-texture" {
  choices "owned-texture" "borrowed-texture" "native-surface"
}
'''
run = '''
zig_args=(
  -Dnative-install-dir="{{vars.host_native_install_dir}}"
  -Ddependency-include-dir="{{vars.vulkan_include_dir}}"
)
zig build run {{vars.zig_host_args}} "${zig_args[@]}" -- "{{ usage.render_target }}"
'''
run_windows = '''
export PATH="$(cygpath -u "{{vars.host_native_install_dir}}/bin")${PATH:+:${PATH}}"
zig_args=(
  -Dnative-install-dir="{{vars.host_native_install_dir}}"
  -Ddependency-include-dir="{{vars.vulkan_include_dir}}"
)
zig build run {{vars.zig_host_args}} "${zig_args[@]}" -- "{{ usage.render_target }}"
'''

[tasks."run:owned-texture"]
run = [{ task = "run", args = ["owned-texture"] }]

[tasks."run:borrowed-texture"]
run = [{ task = "run", args = ["borrowed-texture"] }]

[tasks."run:native-surface"]
run = [{ task = "run", args = ["native-surface"] }]
