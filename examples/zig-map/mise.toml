[deps.zig]
auto = true
description = "Fetch Zig package dependencies."
sources = [
  "build.zig",
  "build.zig.zon",
  "../../build.zig",
  "../../build.zig.zon",
]
outputs = ["zig-pkg"]
timeout = "10m"
run = "zig build --fetch=needed"

[tasks.build]
extends = "ffi:preset"
run = '''
zig build \
  -Dlocal-build="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include"
'''

[tasks.smoke]
description = "Render one frame in each render-target mode, then exit."
extends = "ffi:preset"
# MLN_EXAMPLE_SMOKE hides the window, swaps the network style for an inline
# one, and makes each mode exit 0 after its first rendered frame. SDL still
# needs a window surface, so a Linux runner without a display uses Xvfb,
# with Mesa's software renderer where it has no GPU.
run = '''
set -euo pipefail
zig build \
  -Dlocal-build="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include"
# Native-surface mode needs a window surface, including on a headless host.
runner=()
if [[ "$(uname -s)" == Linux && -z "${DISPLAY:-}${WAYLAND_DISPLAY:-}" ]]; then
  runner=(xvfb-run -a env SDL_VIDEO_DRIVER=x11 EGL_PLATFORM=x11)
fi
for mode in owned-texture borrowed-texture native-surface; do
  MLN_EXAMPLE_SMOKE=1 ${runner[@]+"${runner[@]}"} ./zig-out/bin/zig-map "$mode"
done
'''
run_windows = '''
set -euo pipefail
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
zig build \
  -Dlocal-build="$native_install_dir" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include"
for mode in owned-texture borrowed-texture native-surface; do
  MLN_EXAMPLE_SMOKE=1 ./zig-out/bin/zig-map.exe "$mode"
done
'''

[tasks.run]
extends = "ffi:example-run"
run = '''
zig build run \
  -Dlocal-build="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  -- "$usage_render_target"
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
zig build run \
  -Dlocal-build="$native_install_dir" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  -- "$usage_render_target"
'''
