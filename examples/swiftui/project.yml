# The Xcode project for the SwiftUI example. XcodeGen writes
# MaplibreExample.xcodeproj from this file; the mise tasks run it.

name: MaplibreExample
options:
  bundleIdPrefix: org.maplibre.nativeffi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.3"
packages:
  # The Swift package at the repository root.
  MaplibreNativeFFI:
    path: ../..
targets:
  MaplibreExample:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    dependencies:
      - package: MaplibreNativeFFI
      # The C library, from the local builds that the mise tasks combine.
      - framework: build/MaplibreNativeC.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.maplibre.nativeffi.example
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: MapLibre
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]":
          "$(inherited) @executable_path/../Frameworks"
