[tools]
"core:java" = "{{vars.java_version}}"

[tasks.build]
extends = "ffi:preset"
dir = "../.."
run = '''
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  :examples:compose-map:build
'''

[tasks.run]
# The example takes its bridge from the render backend the native library was
# built with, so the preset picks the backend.
extends = "ffi:preset"
dir = "../.."
run = '''
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  :examples:compose-map:run
'''

[tasks.smoke]
description = "Render one frame of an inline style, then exit."
extends = "ffi:preset"
dir = "../.."
run = '''
args=(
  -PmaplibreNativeCInstallDir="build/$usage_preset/install"
  :examples:compose-map:run
  --args="--smoke"
)
if [[ "$(uname -s)" == Linux ]]; then
  # Skiko refuses OpenGL on a renderer named llvmpipe and falls back to a
  # software redrawer the map cannot share a texture with. Mesa's driconf
  # override renames the renderer. Every Mesa driver honors it, so a hardware
  # driver reports the same name during the smoke, which Skiko accepts, and
  # other vendors' drivers ignore it.
  export force_gl_renderer="${force_gl_renderer:-Mesa software rasterizer}"
  # Compose draws only into a window on a display server. A Linux host without
  # one runs the example on a virtual X server, where Mesa renders in software.
  if [[ -z "${DISPLAY:-}" && -z "${WAYLAND_DISPLAY:-}" ]]; then
    exec xvfb-run -a ./gradlew "${args[@]}"
  fi
fi
exec ./gradlew "${args[@]}"
'''
