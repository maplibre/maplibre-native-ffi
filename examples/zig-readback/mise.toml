[tasks.build]
depends = ["//:ensure-native-library"]
run = '''
include_args=(
  -Dinclude-dir="$MLN_FFI_INCLUDE_DIR"
  -Dinclude-dir="$MLN_FFI_DEPENDENCY_INCLUDE_DIR"
  -Dinclude-dir="$MLN_FFI_VULKAN_INCLUDE_DIR"
)
dependency_library_dir="$MLN_FFI_DEPENDENCY_LIBRARY_DIR"

if [[ "${MLN_FFI_OPENGL_CONTEXT_PROVIDER:-}" == "egl" && "$MLN_FFI_TARGET_TRIPLE" == macos-* ]]; then
  include_args+=(-Dinclude-dir="$MLN_FFI_ANGLE_ROOT/include")
  dependency_library_dir="$MLN_FFI_ANGLE_ROOT"
fi

zig build -Dtarget="$MLN_FFI_ZIG_TARGET" -Dcmake-artifact-dir="$MLN_FFI_BUILD_DIR" "${include_args[@]}" -Ddependency-library-dir="$dependency_library_dir" -Drender-backend="$MLN_FFI_RENDER_BACKEND"
'''

[tasks.run]
depends = ["//:ensure-native-library"]
run = '''
mkdir -p zig-out
include_args=(
  -Dinclude-dir="$MLN_FFI_INCLUDE_DIR"
  -Dinclude-dir="$MLN_FFI_DEPENDENCY_INCLUDE_DIR"
  -Dinclude-dir="$MLN_FFI_VULKAN_INCLUDE_DIR"
)
dependency_library_dir="$MLN_FFI_DEPENDENCY_LIBRARY_DIR"

if [[ "${MLN_FFI_OPENGL_CONTEXT_PROVIDER:-}" == "egl" && "$MLN_FFI_TARGET_TRIPLE" == macos-* ]]; then
  include_args+=(-Dinclude-dir="$MLN_FFI_ANGLE_ROOT/include")
  dependency_library_dir="$MLN_FFI_ANGLE_ROOT"
fi

zig build run -Dtarget="$MLN_FFI_ZIG_TARGET" -Dcmake-artifact-dir="$MLN_FFI_BUILD_DIR" "${include_args[@]}" -Ddependency-library-dir="$dependency_library_dir" -Drender-backend="$MLN_FFI_RENDER_BACKEND" -- zig-out/zig-readback.ppm
'''
