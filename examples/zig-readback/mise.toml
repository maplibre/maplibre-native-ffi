[tasks.build]
depends = ["//:ensure-native-library"]
run = '''
zig build -Dcmake-artifact-dir="$MLN_FFI_BUILD_DIR" -Ddependency-library-dir="$MLN_FFI_DEPENDENCY_LIBRARY_DIR" -Drender-backend="$MLN_FFI_RENDER_BACKEND"
'''

[tasks.run]
depends = ["//:ensure-native-library"]
run = '''
mkdir -p zig-out
zig build run -Dcmake-artifact-dir="$MLN_FFI_BUILD_DIR" -Ddependency-library-dir="$MLN_FFI_DEPENDENCY_LIBRARY_DIR" -Drender-backend="$MLN_FFI_RENDER_BACKEND" -- zig-out/zig-readback.ppm
'''
