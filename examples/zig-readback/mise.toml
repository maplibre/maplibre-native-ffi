[tasks.build]
depends = ["//:ensure-native-library"]
run = '''
native_library_dir="$MLN_FFI_BUILD_DIR"
dependency_library_dir="$($MLN_FFI_REPO_ROOT/scripts/pixi-library-dir)"
zig build -Dcmake-artifact-dir="$native_library_dir" -Ddependency-library-dir="$dependency_library_dir" -Drender-backend="$MLN_FFI_RENDER_BACKEND"
'''

[tasks.run]
depends = ["//:ensure-native-library"]
run = '''
mkdir -p zig-out
native_library_dir="$MLN_FFI_BUILD_DIR"
dependency_library_dir="$($MLN_FFI_REPO_ROOT/scripts/pixi-library-dir)"
zig build run -Dcmake-artifact-dir="$native_library_dir" -Ddependency-library-dir="$dependency_library_dir" -Drender-backend="$MLN_FFI_RENDER_BACKEND" -- zig-out/zig-readback.ppm
'''
