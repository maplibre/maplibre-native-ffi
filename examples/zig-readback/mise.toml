[tools]
"core:zig" = { version = "{{vars.zig_version}}", os = [
  "linux",
  "macos",
  "windows/x64",
] }

[deps.zig]
auto = true
description = "Fetch Zig package dependencies."
sources = [
  "build.zig",
  "build.zig.zon",
  "../../build.zig",
  "../../build.zig.zon",
]
outputs = ["zig-pkg"]
timeout = "10m"
run = "zig build --fetch=needed"

[tasks.build]
extends = "ffi:preset"
run = '''
zig build \
  -Dlocal-build="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include"
'''

[tasks.smoke]
description = "Render and read back one still image of an inline style, then exit."
extends = "ffi:preset"
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
run = '"$MISE_MONOREPO_ROOT/tools/examples/smoke" --offscreen "$usage_preset" ./zig-out/bin/zig-readback zig-out/zig-readback-smoke.ppm'

[tasks.run]
extends = "ffi:preset"
run = '''
mkdir -p zig-out
zig build run \
  -Dlocal-build="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  -- zig-out/zig-readback.ppm
'''
run_windows = '''
mkdir -p zig-out
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
zig build run \
  -Dlocal-build="$native_install_dir" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  -- zig-out/zig-readback.ppm
'''
