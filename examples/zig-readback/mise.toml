[tasks.build]
depends = ["//:ensure-native-library"]
run = "zig build {{ env.MLN_FFI_ZIG_BUILD_ARGS }} {{ env.MLN_FFI_ZIG_NATIVE_ARGS }}"

[tasks.run]
depends = ["//:ensure-native-library"]
run = '''
mkdir -p zig-out
zig build run {{ env.MLN_FFI_ZIG_BUILD_ARGS }} {{ env.MLN_FFI_ZIG_NATIVE_ARGS }} -- zig-out/zig-readback.ppm
'''
