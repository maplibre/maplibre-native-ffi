[tasks.build]
depends = ["//:ensure-native-library"]
run = '''
export PKG_CONFIG_PATH="$MLN_FFI_DEPENDENCY_LIBRARY_DIR/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
export CGO_CFLAGS="-I$MLN_FFI_INCLUDE_DIR -I$MLN_FFI_VULKAN_INCLUDE_DIR ${CGO_CFLAGS:-}"
export CGO_LDFLAGS="-L$MLN_FFI_BUILD_DIR -Wl,-rpath,$MLN_FFI_BUILD_DIR -lmaplibre-native-c ${CGO_LDFLAGS:-}"
go build -o "$MLN_FFI_BUILD_DIR/go-map" .
'''

[tasks.check]
depends = [":build"]
run = '''
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then
  printf '%s\n' "$unformatted" >&2
  exit 1
fi
export PKG_CONFIG_PATH="$MLN_FFI_DEPENDENCY_LIBRARY_DIR/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
export CGO_CFLAGS="-I$MLN_FFI_INCLUDE_DIR -I$MLN_FFI_VULKAN_INCLUDE_DIR ${CGO_CFLAGS:-}"
export CGO_LDFLAGS="-L$MLN_FFI_BUILD_DIR -Wl,-rpath,$MLN_FFI_BUILD_DIR -lmaplibre-native-c ${CGO_LDFLAGS:-}"
go vet ./...
'''

[tasks.run]
depends = ["//:ensure-native-library"]
usage = 'arg "render-target"'
run = '''
export PKG_CONFIG_PATH="$MLN_FFI_DEPENDENCY_LIBRARY_DIR/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
export CGO_CFLAGS="-I$MLN_FFI_INCLUDE_DIR -I$MLN_FFI_VULKAN_INCLUDE_DIR ${CGO_CFLAGS:-}"
export CGO_LDFLAGS="-L$MLN_FFI_BUILD_DIR -Wl,-rpath,$MLN_FFI_BUILD_DIR -lmaplibre-native-c ${CGO_LDFLAGS:-}"
export LD_LIBRARY_PATH="$MLN_FFI_BUILD_DIR:$MLN_FFI_DEPENDENCY_LIBRARY_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
go run . "{{ usage.render_target }}"
'''

[tasks."run:owned-texture"]
run = [{ task = "run", args = ["owned-texture"] }]

[tasks."run:borrowed-texture"]
run = [{ task = "run", args = ["borrowed-texture"] }]

[tasks."run:native-surface"]
run = [{ task = "run", args = ["native-surface"] }]
