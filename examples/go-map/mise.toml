[tools]
"core:go" = "{{vars.go_version}}"
"aqua:mvdan/gofumpt" = "{{vars.gofumpt_version}}"
"conda:sdl3" = { version = "{{vars.sdl3_version}}", os = ["linux", "macos"] }

[tasks.build]
extends = "ffi:preset"
run = '''
# The example drives OpenGL directly; other backends are not yet implemented.
if [[ "$usage_preset" != *-egl ]]; then
  echo "go-map supports OpenGL (EGL) presets only, got: $usage_preset" >&2
  exit 2
fi
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
sdl_prefix="$(mise where "conda:sdl3@{{vars.sdl3_version}}")"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig:$sdl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
export CGO_CPPFLAGS="-I$native_install_dir/include -I$MISE_MONOREPO_ROOT/third_party/khronos/include ${CGO_CPPFLAGS:-}"
export CGO_LDFLAGS="-Wl,-rpath,$native_install_dir/lib -Wl,-rpath,$sdl_prefix/lib ${CGO_LDFLAGS:-}"
go build -o "$MISE_MONOREPO_ROOT/build/$usage_preset/go-map" .
'''

[tasks.check]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
run = '''
unformatted="$(gofumpt -l .)"
if [[ -n "$unformatted" ]]; then
  printf '%s\n' "$unformatted" >&2
  exit 1
fi
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
sdl_prefix="$(mise where "conda:sdl3@{{vars.sdl3_version}}")"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig:$sdl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
export CGO_CPPFLAGS="-I$native_install_dir/include -I$MISE_MONOREPO_ROOT/third_party/khronos/include ${CGO_CPPFLAGS:-}"
go vet ./...
'''

[tasks.smoke]
description = "Render one frame of a local style in each mode in a hidden window, then exit."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
sdl_prefix="$(mise where "conda:sdl3@{{vars.sdl3_version}}")"
export LD_LIBRARY_PATH="$native_install_dir/lib:$sdl_prefix/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
# A Linux host without a display server renders through SDL's offscreen
# driver, which creates its EGL surfaces without one.
if [[ "$(uname -s)" == Linux && -z "${DISPLAY:-}${WAYLAND_DISPLAY:-}" ]]; then
  export SDL_VIDEO_DRIVER=offscreen
fi
export MLN_EXAMPLE_SMOKE=1
for mode in owned-texture borrowed-texture native-surface; do
  "$MISE_MONOREPO_ROOT/build/$usage_preset/go-map" "$mode" || exit
done
'''

[tasks.run]
extends = "ffi:example-run"
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
sdl_prefix="$(mise where "conda:sdl3@{{vars.sdl3_version}}")"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig:$sdl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
export CGO_CPPFLAGS="-I$native_install_dir/include -I$MISE_MONOREPO_ROOT/third_party/khronos/include ${CGO_CPPFLAGS:-}"
export LD_LIBRARY_PATH="$native_install_dir/lib:$sdl_prefix/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
go run . "$usage_render_target"
'''
