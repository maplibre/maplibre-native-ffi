[tools]
"core:swift" = { version = "{{vars.swift_version}}", os = ["linux"] }
# Carries the libxml2.so.2 the Swift toolchain links, for distros that ship only
# libxml2.so.16. .mise/bin/swift-libxml2-env.sh puts it on the loader path and
# explains why; the tasks below source it.
"conda:libxml2" = { version = "{{vars.libxml2_version}}", os = ["linux"] }
"github:xtool-org/xtool" = { version = "{{vars.xtool_version}}", os = ["linux"] }

[tasks.build]
extends = "ffi:preset"
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
source "$MISE_MONOREPO_ROOT/.mise/bin/swift-libxml2-env.sh"
swift_args=(--product swift-map --scratch-path ".build/$usage_preset")
swift_args+=(-Xlinker -rpath -Xlinker "$native_install_dir/lib")
swift build "${swift_args[@]}"
'''

[tasks.smoke]
description = "Render one frame headless in each render-target mode, then exit."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
# The smoke path in Sources/SwiftMap/Smoke.swift renders through a Metal layer
# that no window shows, with an inline style, so it needs no display or
# network.
run = '''
for mode in owned-texture borrowed-texture native-surface; do
  ".build/$usage_preset/debug/swift-map" --smoke "$mode" || exit 1
done
'''

[tasks.run]
extends = "ffi:example-run"
run = '''
source "$MISE_MONOREPO_ROOT/.mise/bin/swift-libxml2-env.sh"
exec ".build/$usage_preset/debug/swift-map" "$usage_render_target"
'''

[tasks."build:ios-simulator"]
depends = [{ task = "//:build", args = ["ios-simulator-arm64-metal"] }]
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/ios-simulator-arm64-metal/install"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
source "$MISE_MONOREPO_ROOT/.mise/bin/swift-libxml2-env.sh"
swift build \
  --product swift-map-ios \
  --scratch-path .build/ios-simulator \
  {{ "--swift-sdk arm64-apple-ios-simulator" if os() == "linux" else "--sdk \"$(xcrun --sdk iphonesimulator --show-sdk-path)\"" }} \
  --triple arm64-apple-ios15.5-simulator
'''

[tasks."build:ios"]
depends = [{ task = "//:build", args = ["ios-arm64-metal"] }]
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/ios-arm64-metal/install"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
source "$MISE_MONOREPO_ROOT/.mise/bin/swift-libxml2-env.sh"
{% if os() == "linux" %}
MLN_FFI_XTOOL_BUILD=1 xtool.AppImage dev build
{% elif os() == "macos" %}
swift build \
  --product swift-map-ios \
  --scratch-path .build/ios \
  --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
  --triple arm64-apple-ios15.5
{% endif %}
'''

[tasks."run:ios"]
depends = [{ task = "//:build", args = ["ios-arm64-metal"] }]
run = '''
{% if os() == "linux" %}
native_install_dir="$MISE_MONOREPO_ROOT/build/ios-arm64-metal/install"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
source "$MISE_MONOREPO_ROOT/.mise/bin/swift-libxml2-env.sh"
export MLN_FFI_XTOOL_BUILD=1
exec xtool.AppImage dev run --usb
{% else %}
echo "run:ios is currently implemented by xtool on Linux" >&2
exit 1
{% endif %}
'''
