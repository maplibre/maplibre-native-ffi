[env]
_.path = [
  "{{config_root}}/build/windows-arm64-vulkan",
]
MLN_FFI_VARIANT = "windows-arm64-vulkan"
MLN_FFI_TARGET_TRIPLE = "windows-arm64"
MLN_FFI_RENDER_BACKEND = "vulkan"
MLN_FFI_BUILD_DIR = "{{config_root}}/build/windows-arm64-vulkan"
MLN_FFI_CONAN_OS = "Windows"
MLN_FFI_CONAN_ARCH = "armv8"
MLN_FFI_CONAN_DIR = "{{config_root}}/build/conan/windows-arm64-vulkan"
MLN_FFI_CONAN_GENERATORS_DIR = "{{config_root}}/build/conan/windows-arm64-vulkan/generators"
MLN_FFI_CONAN_TOOLCHAIN_FILE = "{{config_root}}/build/conan/windows-arm64-vulkan/generators/conan_toolchain.cmake"
MLN_FFI_CONAN_RUN_ENV = "{{config_root}}/build/conan/windows-arm64-vulkan/generators/conanrun.sh"
MLN_FFI_ZIG_TARGET = "aarch64-windows-msvc"
MLN_FFI_SYSTEM_ROOT = false
MLN_FFI_ZIG_BUILD_ARGS = "-Dtarget=aarch64-windows-msvc -Dcmake-artifact-dir=\"{{env.MLN_FFI_BUILD_DIR}}\" -Drender-backend=vulkan -Dinclude-dir=\"{{env.MLN_FFI_INCLUDE_DIR}}\" -Dinclude-dir=\"{{env.MLN_FFI_VULKAN_INCLUDE_DIR}}\""
CMAKE_PREFIX_PATH = "{{env.MLN_FFI_CONAN_GENERATORS_DIR}}"
PKG_CONFIG_PATH = "{{env.MLN_FFI_CONAN_GENERATORS_DIR}}"
