[env]
MLN_FFI_VARIANT = "linux-arm64-vulkan"
MLN_FFI_TARGET_TRIPLE = "linux-arm64"
MLN_FFI_RENDER_BACKEND = "vulkan"
MLN_FFI_BUILD_DIR = "{{config_root}}/build/linux-arm64-vulkan"
MLN_FFI_CONAN_OS = "Linux"
MLN_FFI_CONAN_ARCH = "armv8"
MLN_FFI_CONAN_DIR = "{{config_root}}/build/conan/linux-arm64-vulkan"
MLN_FFI_CONAN_GENERATORS_DIR = "{{config_root}}/build/conan/linux-arm64-vulkan/generators"
MLN_FFI_CONAN_TOOLCHAIN_FILE = "{{config_root}}/build/conan/linux-arm64-vulkan/generators/conan_toolchain.cmake"
MLN_FFI_CONAN_RUN_ENV = "{{config_root}}/build/conan/linux-arm64-vulkan/generators/conanrun.sh"
MLN_FFI_ZIG_TARGET = "aarch64-linux-gnu"
MLN_FFI_ZIG_BUILD_ARGS = "-Dtarget=aarch64-linux-gnu -Dcmake-artifact-dir=\"{{env.MLN_FFI_BUILD_DIR}}\" -Drender-backend=vulkan -Dinclude-dir=\"{{env.MLN_FFI_INCLUDE_DIR}}\" -Dinclude-dir=\"{{env.MLN_FFI_VULKAN_INCLUDE_DIR}}\""
BINDGEN_EXTRA_CLANG_ARGS = "{% if os() == \"linux\" %}-isystem{{ exec(command='cc -print-file-name=include', cache_key='host-cc-builtin-include', cache_duration='1d') | trim }}{% endif %}"
CMAKE_PREFIX_PATH = "{{env.MLN_FFI_CONAN_GENERATORS_DIR}}"
PKG_CONFIG_PATH = "{{env.MLN_FFI_CONAN_GENERATORS_DIR}}"
RUSTFLAGS = "-C link-arg=-Wl,-rpath,{{env.MLN_FFI_BUILD_DIR}}"
