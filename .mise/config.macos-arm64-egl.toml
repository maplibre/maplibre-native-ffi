[env]
MLN_FFI_VARIANT = "macos-arm64-egl"
MLN_FFI_TARGET_TRIPLE = "macos-arm64"
MLN_FFI_RENDER_BACKEND = "opengl"
MLN_FFI_OPENGL_CONTEXT_PROVIDER = "egl"
MLN_FFI_DEPENDENCY_ROOT = "{{config_root}}/.pixi/envs/default"
MLN_FFI_DEPENDENCY_INCLUDE_DIR = "{{config_root}}/.pixi/envs/default/include"
MLN_FFI_DEPENDENCY_LIBRARY_DIR = "{{config_root}}/.pixi/envs/default/lib"
MLN_FFI_EGL_ROOT = "{{config_root}}/third_party/angle/chromium-7151_rev1/macos-arm64"
MLN_FFI_NATIVE_INCLUDE_DIRS = "{{config_root}}/include;{{config_root}}/.pixi/envs/default/include;{{config_root}}/third_party/maplibre-native/vendor/Vulkan-Headers/include;{{config_root}}/third_party/angle/chromium-7151_rev1/macos-arm64/include"
MLN_FFI_NATIVE_LIBRARY_DIRS = "{{config_root}}/.pixi/envs/default/lib;{{config_root}}/third_party/angle/chromium-7151_rev1/macos-arm64"
MLN_FFI_BUILD_DIR = "{{config_root}}/build/macos-arm64-egl"
MLN_FFI_ZIG_TARGET = "aarch64-macos"
MLN_FFI_ZIG_BUILD_ARGS = '-Dtarget=aarch64-macos -Dcmake-artifact-dir="{{config_root}}/build/macos-arm64-egl" -Dinclude-dir="{{config_root}}/include" -Dinclude-dir="{{config_root}}/.pixi/envs/default/include" -Dinclude-dir="{{config_root}}/third_party/maplibre-native/vendor/Vulkan-Headers/include" -Dinclude-dir="{{config_root}}/third_party/angle/chromium-7151_rev1/macos-arm64/include" -Ddependency-library-dir="{{config_root}}/.pixi/envs/default/lib" -Ddependency-library-dir="{{config_root}}/third_party/angle/chromium-7151_rev1/macos-arm64" -Drender-backend=opengl'
