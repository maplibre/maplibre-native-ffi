[env]
MLN_FFI_VARIANT = "macos-arm64-egl"
MLN_FFI_TARGET_TRIPLE = "macos-arm64"
MLN_FFI_RENDER_BACKEND = "opengl"
MLN_FFI_OPENGL_CONTEXT_PROVIDER = "egl"
MLN_FFI_EGL_ROOT = "{{config_root}}/third_party/angle/chromium-7151_rev1/macos-arm64"
MLN_FFI_BUILD_DIR = "{{config_root}}/build/macos-arm64-egl"
MLN_FFI_CONAN_OS = "Macos"
MLN_FFI_CONAN_ARCH = "armv8"
MLN_FFI_CONAN_DIR = "{{config_root}}/build/conan/macos-arm64-egl"
MLN_FFI_CONAN_GENERATORS_DIR = "{{config_root}}/build/conan/macos-arm64-egl/generators"
MLN_FFI_CONAN_TOOLCHAIN_FILE = "{{config_root}}/build/conan/macos-arm64-egl/generators/conan_toolchain.cmake"
MLN_FFI_CONAN_RUN_ENV = "{{config_root}}/build/conan/macos-arm64-egl/generators/conanrun.sh"
MLN_FFI_ZIG_TARGET = "aarch64-macos"
MLN_FFI_ZIG_BUILD_ARGS = "-Dtarget=aarch64-macos -Dcmake-artifact-dir=\"{{env.MLN_FFI_BUILD_DIR}}\" -Drender-backend=opengl -Dinclude-dir=\"{{env.MLN_FFI_INCLUDE_DIR}}\" -Dinclude-dir=\"{{env.MLN_FFI_VULKAN_INCLUDE_DIR}}\" -Dinclude-dir=\"{{env.MLN_FFI_EGL_ROOT}}/include\" -Ddependency-library-dir=\"{{env.MLN_FFI_EGL_ROOT}}\""
MLN_FFI_SYSTEM_ROOT = "{% if os() == \"macos\" %}{% if env.SDKROOT is defined and env.SDKROOT != \"\" %}{{ env.SDKROOT }}{% else %}{{ exec(command='xcrun --sdk macosx --show-sdk-path', cache_key='macosx-sdk-path', cache_duration='1d') | trim }}{% endif %}{% endif %}"
CMAKE_PREFIX_PATH = "{{env.MLN_FFI_CONAN_GENERATORS_DIR}}"
PKG_CONFIG_PATH = "{{env.MLN_FFI_CONAN_GENERATORS_DIR}}"
RUSTFLAGS = "-C link-arg=-Wl,-rpath,{{env.MLN_FFI_BUILD_DIR}}"
