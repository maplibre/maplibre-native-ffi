MLN_FFI_TARGET_TRIPLE = "macos-arm64"
MLN_FFI_RENDER_BACKEND = "opengl"
MLN_FFI_OPENGL_CONTEXT_PROVIDER = "egl"
MLN_FFI_ANGLE_ROOT = "{{config_root}}/third_party/angle/chromium-7151_rev1/macos-arm64"
