[env]
MLN_FFI_RENDER_BACKEND = "metal"
MLN_FFI_BUILD_DIR = "{{config_root}}/build/macos-arm64-metal"
MLN_FFI_NATIVE_INSTALL_DIR = "{{config_root}}/build/macos-arm64-metal/install"
MLN_FFI_ZIG_BUILD_ARGS = "-Dtarget=aarch64-macos"
MLN_FFI_ZIG_NATIVE_ARGS = "-Dnative-install-dir={{config_root}}/build/macos-arm64-metal/install -Drender-backend=metal -Ddependency-include-dir={{env.MLN_FFI_DEPENDENCY_INCLUDE_DIR}} -Ddependency-include-dir={{env.MLN_FFI_VULKAN_INCLUDE_DIR}} -Ddependency-library-dir={{env.MLN_FFI_DEPENDENCY_LIBRARY_DIR}}"
MLN_FFI_CMAKE_ARGS = """
-DCMAKE_OSX_ARCHITECTURES=arm64
-DCMAKE_OSX_DEPLOYMENT_TARGET=14.3
"""
MLN_FFI_SYSTEM_ROOT = "{% if os() == \"macos\" %}{% if env.SDKROOT is defined and env.SDKROOT != \"\" %}{{ env.SDKROOT }}{% else %}{{ exec(command='xcrun --sdk macosx --show-sdk-path', cache_key='macosx-sdk-path', cache_duration='1d') | trim }}{% endif %}{% endif %}"
PKG_CONFIG_PATH = "{{env.MLN_FFI_BUILD_DIR}}:{{config_root}}/.pixi/envs/default/lib/pkgconfig"
JDK_JAVA_OPTIONS = "-Djava.library.path={{env.MLN_FFI_NATIVE_INSTALL_DIR}}/lib -Dorg.lwjgl.vulkan.libname=libvulkan.1.dylib"
VK_ICD_FILENAMES = "{{config_root}}/.pixi/envs/default/share/vulkan/icd.d/MoltenVK_icd.json"
