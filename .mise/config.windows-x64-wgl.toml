[env]
_.path = [
  "{{config_root}}/build/windows-x64-wgl",
]
MLN_FFI_VARIANT = "windows-x64-wgl"
MLN_FFI_TARGET_TRIPLE = "windows-x64"
MLN_FFI_RENDER_BACKEND = "opengl"
MLN_FFI_OPENGL_CONTEXT_PROVIDER = "wgl"
MLN_FFI_BUILD_DIR = "{{config_root}}/build/windows-x64-wgl"
MLN_FFI_VCPKG_TARGET_TRIPLET = "x64-windows"
MLN_FFI_VCPKG_INSTALLED_DIR = "{{config_root}}/build/vcpkg/installed/windows-x64-wgl"
MLN_FFI_ZIG_TARGET = "x86_64-windows-msvc"
MLN_FFI_SYSTEM_ROOT = false
MLN_FFI_ZIG_BUILD_ARGS = "-Dtarget=x86_64-windows-msvc -Dcmake-artifact-dir=\"{{env.MLN_FFI_BUILD_DIR}}\" -Drender-backend=opengl -Dinclude-dir=\"{{env.MLN_FFI_INCLUDE_DIR}}\" -Dinclude-dir=\"{{env.MLN_FFI_VULKAN_INCLUDE_DIR}}\""
