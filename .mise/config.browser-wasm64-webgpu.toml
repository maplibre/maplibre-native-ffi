[env]
MLN_FFI_RENDER_BACKEND = "webgpu"
MLN_FFI_BUILD_DIR = "{{config_root}}/build/browser-wasm64-webgpu"
MLN_FFI_ZIG_BUILD_ARGS = "-Dtarget=wasm32-emscripten"
MLN_EMSCRIPTEN_INITIAL_MEMORY = "1024MB"
MLN_EMSCRIPTEN_ALLOW_MEMORY_GROWTH = "ON"
MLN_EMSCRIPTEN_MAXIMUM_MEMORY = "2048MB"
MLN_EMSCRIPTEN_STACK_SIZE = "1MB"
MLN_EMSCRIPTEN_PTHREAD_POOL_SIZE = "16"

[tools]
emsdk = "4.0.10"

[tasks.configure]
depends = ["//:deps"]
run = '''
source "$EMSDK/emsdk_env.sh"
emcmake cmake \
  -S . \
  -B "$MLN_FFI_BUILD_DIR" \
  -G Ninja \
  -DCMAKE_BUILD_TYPE="$MLN_FFI_CMAKE_BUILD_TYPE" \
  -DMLN_FFI_RENDER_BACKEND="$MLN_FFI_RENDER_BACKEND" \
  -DMLN_FFI_OPENGL_CONTEXT_PROVIDER="" \
  -DMLN_EMSCRIPTEN_USE_PTHREADS=ON \
  -DMLN_EMSCRIPTEN_INITIAL_MEMORY="$MLN_EMSCRIPTEN_INITIAL_MEMORY" \
  -DMLN_EMSCRIPTEN_ALLOW_MEMORY_GROWTH="$MLN_EMSCRIPTEN_ALLOW_MEMORY_GROWTH" \
  -DMLN_EMSCRIPTEN_MAXIMUM_MEMORY="$MLN_EMSCRIPTEN_MAXIMUM_MEMORY" \
  -DMLN_EMSCRIPTEN_STACK_SIZE="$MLN_EMSCRIPTEN_STACK_SIZE" \
  -DMLN_EMSCRIPTEN_PTHREAD_POOL_SIZE="$MLN_EMSCRIPTEN_PTHREAD_POOL_SIZE"
'''

[tasks.build]
depends = ["configure"]
run = '''
source "$EMSDK/emsdk_env.sh"
emmake cmake --build "$MLN_FFI_BUILD_DIR" --target maplibre_native_c
'''

[tasks.run]
run = [{ task = "//examples/browser-map:run" }]
