[env]
MLN_FFI_RENDER_BACKEND = "webgpu"
MLN_FFI_BUILD_DIR = "{{config_root}}/build/browser-wasm64-webgpu"
MLN_FFI_ZIG_BUILD_ARGS = "-Dtarget=wasm32-emscripten"
CARGO_BUILD_TARGET = "wasm32-unknown-emscripten"
RUSTFLAGS = "-C panic=abort"

[tools]
emsdk = "4.0.10"

[tasks.configure]
depends = ["//:deps"]
run = '''
source "$EMSDK/emsdk_env.sh"
emcmake cmake \
  -S . \
  -B "$MLN_FFI_BUILD_DIR" \
  -G Ninja \
  -DCMAKE_BUILD_TYPE="$MLN_FFI_CMAKE_BUILD_TYPE" \
  -DMLN_FFI_RENDER_BACKEND="$MLN_FFI_RENDER_BACKEND" \
  -DMLN_FFI_OPENGL_CONTEXT_PROVIDER="" \
  -DMLN_EMSCRIPTEN_USE_PTHREADS=OFF
'''

[tasks.build]
depends = ["configure"]
run = '''
source "$EMSDK/emsdk_env.sh"
emmake cmake --build "$MLN_FFI_BUILD_DIR" --target maplibre_native_c
'''

[tasks.run]
run = [{ task = "//examples/browser-map:run:native-surface" }]
