[env]
_.path = [
  "{% if env.ANDROID_HOME is defined %}{{ env.ANDROID_HOME }}{% elif os() == \"macos\" %}{{ env.HOME }}/Library/Android/sdk{% elif os() == \"linux\" %}{{ env.HOME }}/Android/Sdk{% elif os() == \"windows\" %}{{ env.LOCALAPPDATA }}/Android/Sdk{% endif %}/emulator",
  "{% if env.ANDROID_HOME is defined %}{{ env.ANDROID_HOME }}{% elif os() == \"macos\" %}{{ env.HOME }}/Library/Android/sdk{% elif os() == \"linux\" %}{{ env.HOME }}/Android/Sdk{% elif os() == \"windows\" %}{{ env.LOCALAPPDATA }}/Android/Sdk{% endif %}/platform-tools",
]
ANDROID_HOME = "{% if env.ANDROID_HOME is defined %}{{ env.ANDROID_HOME }}{% elif os() == \"macos\" %}{{ env.HOME }}/Library/Android/sdk{% elif os() == \"linux\" %}{{ env.HOME }}/Android/Sdk{% elif os() == \"windows\" %}{{ env.LOCALAPPDATA }}/Android/Sdk{% endif %}"
ANDROID_NDK_HOME = "{% if env.ANDROID_NDK_HOME is defined %}{{ env.ANDROID_NDK_HOME }}{% elif os() == \"macos\" %}{{ exec(command='find \"$HOME/Library/Android/sdk/ndk\" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1') | trim }}{% elif os() == \"linux\" %}{{ exec(command='find \"$HOME/Android/Sdk/ndk\" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1') | trim }}{% elif os() == \"windows\" %}{{ exec(command='find \"$LOCALAPPDATA/Android/Sdk/ndk\" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1') | trim }}{% endif %}"
