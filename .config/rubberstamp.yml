# Rubberstamp (https://github.com/sargunv/rubberstamp) labels new issues and
# pull requests, and plans which CI units each pull request runs. A label means
# its GitHub description unless its group gives it a meaning, and a group that
# already has a label keeps it.
version: 1
context: >-
  A C API for MapLibre Native, the C++ map renderer, which is vendored as a git
  submodule with carried patches. Bindings for Dart, Go, Kotlin, .NET, Python,
  Rust, Swift, TypeScript, and Zig wrap the C API, and example apps use them.
  Mise defines tools and tasks, CMake builds the native library, and Gradle
  builds the Kotlin packages.

labels:
  context: >-
    Labels record what work is about so maintainers can find related work.
  groups:
    kind:
      min: 1
      max: 1
      labels:
        bug: >-
          Broken behavior: a crash, a wrong result, a failing build or CI job, a
          violated contract, or a regression.
        feature: >-
          A new or changed capability for users of the C API, a binding, an
          example, or the tooling, including new targets and packages.
        perf: >-
          Faster or leaner runtime, smaller binaries, or faster builds and CI,
          without changing behavior.
        chore: >-
          Maintenance that adds nothing and fixes nothing: refactoring, cleanup,
          tests, documentation, routine dependency updates, and process.
        research: >-
          An investigation, design evaluation, or prototype whose outcome is a
          decision rather than shipped code.
    area:
      min: 1
      guidance:
        A patch to MapLibre Native takes the area of the behavior it changes.
      labels:
        "area:*": ~
        area:api: >-
          The interface hosts program against, as the subject: the C
          declarations and their contracts, each binding's API and runtime,
          generated code and the generator, and the example apps. Building,
          packaging, or publishing a binding is tooling, and its reference
          documentation is docs. A capability belongs to core or rendering, and
          also to api only when the interface design or the binding layer is the
          subject.
        area:core: >-
          The library's behavior behind the API, outside rendering: the runtime,
          threads, wakes, and event delivery; maps, the camera, styles, sources,
          layers, and feature state; queries and projection; resource providers,
          cache, and offline; and logging. Render sessions, surfaces, and
          backends are rendering, even where the runtime drives them.
        area:rendering: >-
          Turning a map into pixels: render sessions and drivers, targets,
          surfaces, textures, readback, frame pacing, the OpenGL, Vulkan, Metal,
          and WebGPU backends, and layer plugins. How a binding or the generator
          exposes rendering types is api, not rendering.
        area:platform: >-
          The OS services under `src/platform/` that MapLibre Native runs on:
          the run loop, threads, HTTP and TLS, image decoding, locale and text,
          assets, and log sinks.
        area:tooling: >-
          Building, checking, and shipping: CMake, mise, Gradle, CI and its
          runners, packaging, publishing, releases, formatters, linters, and
          dependency management.
        area:docs: >-
          Documentation as the subject: the docs site, specifications, header
          comments, API reference generation, and repository guidance such as
          AGENTS.md. Updating docs to describe what a change ships doesn't
          count.
    # Each label is asked about alone, so only a question about the whole
    # group can tell work on a few members from work that reaches them all.
    binding:
      labels: ["binding:*"]
      guidance: >-
        Only for work specific to this binding. Work that several bindings pick
        up alike, such as a C API addition that every binding exposes, doesn't
        qualify.
      rules:
        - unless:
            ask:
              threshold: 0.3
              question: >-
                Does this work concern particular bindings rather than the
                bindings in general? It does when it changes, fixes, or reports
                something in one or a few named bindings that the others don't
                share. It doesn't when most or all bindings pick it up alike,
                such as a C API change that every binding exposes, a generator
                change, or a policy that every binding meets.
          then: skip
    platform:
      labels: ["platform:*"]
      guidance: >-
        Only for work specific to this platform, not work several platforms
        share alike. EGL and WGL are renderer subjects, not platform ones.
      rules:
        - unless:
            ask:
              threshold: 0.3
              question: >-
                Does this work concern particular platforms rather than
                platforms in general? It does when it changes, fixes, or reports
                something on one or a few named platforms that the others don't
                share. EGL and WGL are renderer subjects, not platform ones.
          then: skip
    renderer:
      labels: ["renderer:*"]
      guidance: >-
        Only for work specific to this backend, not work several backends share
        alike.
      rules:
        - unless:
            ask:
              threshold: 0.3
              question: >-
                Does this work concern particular render backends rather than
                rendering in general? It does when it changes, fixes, or reports
                something in one or a few named backends that the others don't
                share.
          then: skip
    # Whether the engine causes an issue is a judgment the labeler gets wrong,
    # so only pull requests are labeled, by what they change.
    upstream:
      labels:
        upstream:
          meaning: >-
            The work changes MapLibre Native's own code: a patch under
            `patches/maplibre-native/` or the `third_party/maplibre-native`
            submodule.
          rules:
            - if:
                files:
                  - patches/maplibre-native/**
                  - third_party/maplibre-native
              then: apply
          otherwise: skip
    dependencies:
      labels:
        dependencies: >-
          A third-party dependency's version, addition, or removal is the
          subject. Versioning or pinning this repository's own packages doesn't
          count.

# Each target preset's vendor block in `CMakePresets.json` names the unit that
# runs it, and `tools/ci/plan.py` names the units of the other jobs. A unit's
# rule runs it regardless of the plan when a changed file matches, with globs as
# in GitHub Actions path filters. A rule names only files that no other unit's
# jobs read: Jev judges a shared file from its diff, so one file never forces
# several units. The submodule pin is the exception, since its diff names only a
# commit.
ci:
  workflow: .github/workflows/ci-coverage.yml
  threshold: 0.6
  context: >-
    Each unit installs the mise toolchain, builds the native library for its
    targets with CMake, and runs those targets' binding tests and example
    builds. Linux x64 runs the C tests and every binding's suite, so it covers
    platform-independent changes however large. Another unit matters only when a
    change reaches what it alone builds or runs: platform source directories and
    source sets such as `androidMain`, Objective-C++, platform conditionals,
    `cmake/platform/`, render backends, SDK setup, or packaging. A test change
    matters only to units that run that suite. `tools/ci/` plans each unit's
    jobs from the presets' vendor blocks and runs each target job's suites, so
    changing a unit's vendor block, jobs, or suites puts it at risk. Windows
    runs shared scripts differently, with Git Bash and MSVC, and a tool
    configured for only some operating systems puts those at risk. A public
    header change that adds a macro, an inline function, or a construct new to
    the headers puts MSVC (Windows x64) and Apple Clang and the Swift importer
    (macOS) at risk, since the C tests and several bindings compile the headers
    there. A header change that only edits declarations or docs does not.
    Release workflows don't run on pull requests. Hygiene always runs
    formatting, lint, generated-code checks, and the tests for `ci/`. Main runs
    every unit after merge, so a pull request needs only the coverage a reviewer
    would expect.
  units:
    docs:
      covers: >-
        Builds the Astro docs site, which hygiene only formats, and generates
        each binding's API reference with its own tool (Doxygen, Dokka, DocC,
        DocFX, dart doc, and others) from the C headers and binding sources.
      rules: [{ if: { files: ["docs/**"] }, then: apply }]
    support-matrix:
      covers: >-
        Renders the support tracking issue's body from the CI targets, the
        suites that each target runs, and `docs/support-gaps.toml`, and fails
        when that data contradicts itself. Changes that add, remove, or rename a
        target or a binding suite need it, as do changes to the support data or
        the scripts that render it. Changes to what a suite tests don't.
      rules:
        - if: { files: ["docs/scripts/render-support-issue.py"] }
          then: apply
    linux-x64:
      covers: >-
        Linux x64 glibc with OpenGL (EGL) and Vulkan. Runs the C tests, every
        binding's suite, and the Dart build: the general check for shared native
        code, bindings, and build logic.
      rules:
        - if:
            files:
              - third_party/maplibre-native
          then: apply
    linux-arm64:
      covers: >-
        Linux ARM64 glibc with OpenGL (EGL) and Vulkan, running Linux x64's
        suites on ARM runners about twice as slow as x64. Catches only what
        differs by CPU architecture on Linux: architecture conditionals in code
        or build logic, a tool or dependency fetched per architecture, and the
        ARM runner setup. Linux platform, renderer, and binding changes that
        Linux x64 already builds and tests don't need it.
      rules:
        - if:
            files:
              - third_party/maplibre-native
          then: apply
    linux-musl:
      covers: >-
        Linux musl on x64 and ARM64. Builds the native library, checks its musl
        ABI, and runs the binding tests in Alpine. Catches libc assumptions and
        musl packaging problems. Platform-independent code that Linux x64 tests
        doesn't need it.
      rules:
        - if:
            files:
              - third_party/maplibre-native
          then: apply
    linux-riscv64:
      covers: >-
        Linux RISC-V 64-bit on glibc and musl, with OpenGL (EGL) and Vulkan.
        Cross-compiles the native library on an x64 runner, checks its libc ABI,
        and runs the C tests and the Zig suite under QEMU's user-mode emulator.
        Catches architecture conditionals in the engine and its vendored code,
        and problems in the Zig toolchain's cross builds, the Rust platform
        crate, or the emulated test roots on RISC-V. Code that Linux x64 and
        ARM64 build alike doesn't need it.
      rules:
        - if:
            files:
              - scripts/run-qemu-test.sh
              - tools/deps/sync-linux-sysroot
              - tools/devices/linux-root
              - third_party/maplibre-native
          then: apply
    linux-loongarch64:
      covers: >-
        Linux LoongArch 64-bit on glibc and musl, with OpenGL (EGL) and Vulkan.
        Cross-compiles the native library on an x64 runner, checks its libc ABI,
        and runs the C tests and the Zig suite under QEMU's user-mode emulator.
        Catches architecture conditionals in the engine and its vendored code,
        and problems in the Zig toolchain's cross builds, the Rust platform
        crate, or the emulated test roots on LoongArch. Code that Linux x64 and
        ARM64 build alike doesn't need it.
      rules:
        - if:
            files:
              - scripts/run-qemu-test.sh
              - tools/deps/sync-linux-sysroot
              - tools/devices/linux-root
              - third_party/maplibre-native
          then: apply
    freebsd:
      covers: >-
        FreeBSD x64 with OpenGL (EGL) and Vulkan. Cross-compiles the native
        library and the binding tests on Linux and runs them in a FreeBSD
        virtual machine. Catches assumptions that only Linux holds, in platform
        conditionals, the Zig toolchain, the Rust platform crate, and the
        bindings' cross-compilation. Platform-independent code that Linux x64
        tests doesn't need it.
      rules:
        - if:
            files:
              - scripts/run-freebsd-test.sh
              - tools/devices/freebsd-host
              - third_party/maplibre-native
          then: apply
    macos:
      covers: >-
        macOS ARM64 with Metal, Vulkan (MoltenVK), and OpenGL (ANGLE), and macOS
        x64 with Metal under Rosetta. Runs the C tests and the desktop binding
        suites, including Swift, and on x64 the C, Rust, Zig, and Go suites.
        Catches Apple Clang, Apple SDK, Metal, and macOS packaging problems.
        Platform-independent code that Linux x64 tests doesn't need it.
      rules:
        - if:
            files:
              - bindings/kotlin/src/macosTest/**
              - third_party/maplibre-native
          then: apply
    ios:
      covers: >-
        iOS and Mac Catalyst with Metal, on device and simulator. Builds the
        native library and the supported Kotlin, Swift, Rust, Dart, and Zig
        bindings, and runs simulator and Mac Catalyst tests. Catches mobile SDK
        and cross-compilation problems, and stands in for tvOS and visionOS on
        what every Apple mobile platform shares. Platform-independent code that
        Linux x64 tests doesn't need it.
      rules:
        - if:
            files:
              - bindings/kotlin/src/iosTest/**
              - third_party/maplibre-native
          then: apply
    tvos:
      covers: >-
        tvOS with Metal, on device and simulator. Builds the native library and
        the Kotlin, Swift, and Rust bindings, and runs simulator tests. Only
        what tvOS alone builds or runs needs it: tvOS conditionals, SDK setup,
        presets, and suites. Changes that every Apple mobile platform shares
        need only iOS.
      rules:
        - if:
            files:
              - bindings/kotlin/src/tvosTest/**
              - third_party/maplibre-native
          then: apply
    visionos:
      covers: >-
        visionOS with Metal, on device and simulator. Builds the native library
        and the Swift and Rust bindings, and runs simulator tests. Only what
        visionOS alone builds or runs needs it: visionOS conditionals, SDK
        setup, presets, and suites. Changes that every Apple mobile platform
        shares need only iOS.
      rules:
        - if:
            files:
              - third_party/maplibre-native
          then: apply
    windows-x64:
      covers: >-
        Windows x64 with OpenGL (WGL) and Vulkan, built with MSVC. Runs the C
        tests and the desktop binding suites. Catches MSVC, Windows API, path,
        shell, and toolchain installation problems. Platform-independent code
        that Linux x64 tests doesn't need it.
      rules:
        - if:
            files:
              - src/platform/windows/**
              - src/render/opengl/wgl_*
              - third_party/maplibre-native
          then: apply
    mingw:
      covers: >-
        Windows x64 with OpenGL (WGL) and Vulkan, built with Clang in MSYS2's
        MINGW64 environment. Runs the C, C#, Dart, and Rust suites and verifies
        shared and static C package consumers. Catches MinGW headers, libstdc++,
        GNU archive and import library handling, and MSYS2 toolchain setup.
      rules:
        - if:
            files:
              - cmake/toolchains/msys2.cmake
              - .config/mise.msys2.*
              - third_party/maplibre-native
          then: apply
    windows-arm64:
      covers: >-
        Windows ARM64 with OpenGL (WGL) and Vulkan, running Windows x64's suites
        on ARM runners. Catches only what differs by CPU architecture on
        Windows: architecture conditionals in code or build logic, a tool or
        dependency fetched per architecture, and the ARM runner setup. Windows
        platform, renderer, and binding changes that Windows x64 already builds
        and tests don't need it.
      rules:
        - if:
            files:
              - third_party/maplibre-native
          then: apply
    android:
      covers: >-
        Android on ARM, ARM64, and x64 with OpenGL ES and Vulkan, built with the
        NDK. The x64 jobs run the C, Kotlin, Go, Rust, Swift, Zig, and Python
        tests in the emulator; the ARM jobs only build. Also builds Dart and
        verifies multi-ABI packaging. Catches NDK, Android API, JNI, emulator,
        and AAR problems. Platform-independent code that Linux x64 tests doesn't
        need it.
      rules:
        - if:
            files:
              - src/platform/android/**
              - cmake/platform/android.cmake
              - .config/mise.android.*
              - bindings/kotlin/src/android*/**
              - .mise/tasks/kotlin/check-android-api-floor
              - .mise/tasks/kotlin/verify-android-multi-abi
              - tools/devices/android-serial
              - tools/env/swift-android-env.sh
              - third_party/maplibre-native
          then: apply
    ohos:
      covers: >-
        OpenHarmony on ARM64 and x64 with OpenGL ES and Vulkan. The x64 jobs run
        the C, Rust, Go, and TypeScript (ArkTS) tests in the Oniro emulator; the
        ARM64 jobs only build. Catches OpenHarmony SDK and platform problems.
        Platform-independent code that Linux x64 tests doesn't need it. Nor does
        a C API change that only regenerates the TypeScript binding; a change to
        its handwritten runtime, native addon, or ArkTS harness does.
      rules:
        - if:
            files:
              - cmake/platform/ohos.cmake
              - .config/mise.ohos.*
              - src/platform/ohos/**
              - tests/native/abi/platform/transport.c
              - bindings/typescript/scripts/build-hap.sh
              - bindings/typescript/scripts/test-arkts.sh
              - bindings/typescript/scripts/verify-ohpm.sh
              - bindings/typescript/src/arkts.ts
              - bindings/typescript/test/arkts/**
              - bindings/typescript/test/ohpm/**
              - tools/devices/ohos-key
              - third_party/maplibre-native
          then: apply
    web:
      covers: >-
        The browser, built with Emscripten for WebGL and WebGPU. Runs the C,
        Rust, and Kotlin/Wasm tests in a browser. Catches Emscripten, wasm32,
        and browser rendering problems. Platform-independent code that Linux x64
        tests doesn't need it.
      rules:
        - if:
            files:
              - src/platform/emscripten/**
              - src/render/webgpu/**
              - cmake/platform/emscripten.cmake
              - cmake/toolchains/emscripten.cmake
              - cmake/mln_ffi_emscripten.cmake
              - .config/mise.emscripten.*
              - bindings/kotlin/src/wasmJs*/**
              - bindings/kotlin/wasm/**
              - bindings/kotlin/karma.config.d/**
              - third_party/maplibre-native
          then: apply
    maven:
      covers: >-
        Assembles and verifies the Kotlin Maven repository from every target's
        artifacts, so it runs every target. Only changes to what that repository
        contains or how it is staged and verified need it: the module set, POM
        metadata, and artifact contents. Ordinary Kotlin changes and one
        platform's native packaging don't.
      rules:
        - if:
            files:
              - .mise/tasks/kotlin/publish
              - .mise/tasks/kotlin/verify-staging
              - tests/distribution/kotlin/**
              - tests/distribution/kotlin-wasm/**
          then: apply
    nuget:
      covers: >-
        Packs the .NET NuGet packages from the native artifacts of every Linux,
        macOS, Windows, and Android target, so it runs those targets. Only
        changes to what the packages contain or how they are packed need it: the
        package projects and their metadata, and the packing script. Ordinary
        .NET binding changes and one platform's native packaging don't.
      rules:
        - if:
            files:
              - .mise/tasks/ci/pack-dotnet
              - bindings/dotnet/src/Maplibre.NativeFfi.Runtime/**
          then: apply
    pypi:
      covers: >-
        Packs the Python API and runtime wheels from the wheels that the
        Android, Linux, macOS, and Windows targets built, so it runs those
        targets. Only changes to what the wheels contain or how they are
        versioned and built need it: the distributions' metadata, the runtime
        build, and the release stamping. Ordinary Python binding changes and one
        platform's native packaging don't.
      rules:
        - if:
            files:
              - tools/release/python_release.py
          then: apply
    npm:
      covers: >-
        Packs the TypeScript npm packages from the addons that the Linux, macOS,
        and browser targets built and tested, so it runs those targets. Only
        changes to what the packages contain or how they are packed need it: the
        package manifests, the facade bundle, and the packing script. Ordinary
        TypeScript binding changes and one platform's addon don't.
    ohpm:
      covers: >-
        Packs the ArkTS OHPM packages from the addons that the OpenHarmony
        targets built, so it runs those targets. Only changes to what the
        packages contain or how they are packed need it: the OHPM manifest and
        package files, and the packing script. Ordinary TypeScript or ArkTS
        changes and one ABI's addon don't.
    swiftpm:
      covers: >-
        Assembles the XCFramework from every Apple Metal target's slice, so it
        runs those targets, and writes the Swift package that a release pushes
        to the distribution repository with it. Then builds and runs a Swift
        consumer against the package on macOS and builds it for iOS. Only
        changes to what the XCFramework or the package contains or how it is
        assembled need it: XCFramework packaging, the release's distribution
        tool, the root manifest's platforms and binding target, and the C module
        shims. Ordinary Swift binding changes and one Apple target's native
        packaging don't.
      rules:
        - if:
            files:
              - .mise/tasks/package-xcframework
              - tools/release/swift_package.py
              - bindings/swift/.mise/tasks/test/package
              - tests/release/swift-package/**
          then: apply
    vcpkg:
      covers: >-
        Installs the distribution repository's vcpkg port through a Git registry
        and builds a CMake consumer against this run's Linux x64 OpenGL archive.
        Changes to the registry generator, distribution publishing, or consumer
        check need it.
      rules:
        - if:
            files:
              - tools/release/vcpkg_registry.py
              - tools/release/test_vcpkg.py
          then: apply
    conan:
      covers: >-
        Resolves the distribution repository's local Conan recipe index and
        builds a CMakeDeps consumer of the Linux x64 Vulkan archive, so it runs
        that target. Changes to the recipe, its release generator or consumer
        check need it.
      rules:
        - if:
            files:
              - tools/release/conan_package.py
              - tools/release/conan/**
              - tools/release/check_conan.py
              - tests/distribution/conan/**
          then: apply
    xmake:
      covers: >-
        Writes the xmake repository that a release pushes to the distribution
        repository, then installs the Linux x64 OpenGL archive through it and
        builds and runs a C consumer. Only changes to the repository generator
        or consumer check need it.
      rules:
        - if:
            files:
              - tools/release/xmake_package.*
              - tools/release/test_xmake_package.py
          then: apply
