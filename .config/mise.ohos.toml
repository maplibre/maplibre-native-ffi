# The OpenHarmony SDK and the emulator image its test suite boots, for
# `MISE_ENV=ohos`. See the development overview.

[tools]
# mise has no registry entry for the OpenHarmony SDK, so this resolves through the
# plugin that the hook below registers. Its unpacking step needs a POSIX shell,
# which is why Windows is left out.
ohos-sdk = { version = "{{vars.ohos_sdk_version}}", os = ["linux", "macos"] }
# Oniro publishes its emulator image against the corresponding OpenHarmony
# release. Keep both tools on the same version so their system ABI stays aligned.
"http:oniro-emulator" = { version = "{{vars.ohos_sdk_version}}", url = "https://github.com/eclipse-oniro4openharmony/device_board_oniro/releases/download/v{{ version }}/oniro_emulator.zip", checksum = "sha256:a30e01f1b161e0fdcd91263f30f29cc92bfa49c1776d5ee2c46caefef055b2da", size = "1449068188", bin_path = ".", os = [
  "linux",
  "macos",
] }
# hypium, the OpenHarmony test runner, which the TypeScript binding's ArkTS
# suite bundles. The suite parses the report it prints, so it is pinned.
"http:hypium" = { version = "1.0.29", url = "https://ohpm.openharmony.cn/ohpm/@ohos/hypium/-/hypium-{{ version }}.har", format = "tar.gz", checksum = "sha256:c81d27c4098d9d3beafffa9602e5f45388bf8107a766bdbca1c8494e67074798", bin_path = ".", os = [
  "linux",
  "macos",
] }

[hooks]
# Register the plugin before the first SDK installation resolves it. The root
# postinstall hook refreshes the same symlink for ordinary installs.
preinstall = ["mise plugins link --force ohos-sdk .mise/plugins/ohos-sdk"]
