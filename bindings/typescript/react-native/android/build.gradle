apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def appExt(name, fallback) {
  rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

def architectures = (findProperty("reactNativeArchitectures") ?: "arm64-v8a")
  .split(",").collect { it.trim() }

android {
  namespace "org.maplibre.nativeffi.reactnative"
  compileSdk appExt("compileSdkVersion", 36)
  ndkVersion appExt("ndkVersion", null)

  defaultConfig {
    minSdk appExt("minSdkVersion", 24)
    ndk { abiFilters(*architectures) }
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      // Any CMake from 3.22, the SDK's default, builds the module. Mise names
      // the version that it installs in the SDK.
      def cmakeVersion = System.getenv("MLN_FFI_ANDROID_CMAKE_VERSION")
      if (cmakeVersion) {
        version cmakeVersion
      }
    }
  }

  buildFeatures {
    prefab true
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}
