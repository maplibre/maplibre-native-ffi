[tools]
# Node, Bun, and Deno run the same addon and the same suite. Bun and Deno are
# declared here because only this binding uses them.
"core:bun" = "1.4.4"
"core:deno" = "2.9.8"

[tasks.api]
description = "Generate the TypeScript API reference HTML with TypeDoc."
run = '''
rm -rf build/typedoc
pnpm exec typedoc --entryPoints src/index.ts src/browser.ts src/hermes.ts --excludeInternal --out build/typedoc \
  --name @maplibre/native-ffi --readme none
'''

[tasks.pack]
description = "Pack the facade, a desktop or Emscripten preset's backend package, and its addon package into npm tarballs."
usage = '''
arg "[preset]" default="{{vars.host_native_preset}}"
flag "--version <version>" default="0.0.0" help="The version of every package"
'''
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
run = '''
rm -rf build/npm
node scripts/pack.ts --version "$usage_version" build/npm "$usage_preset"
'''

[tasks.pack-ohpm]
description = "Pack an OpenHarmony preset's OHPM package, with its ArkTS entry and addon, into a HAR."
usage = '''
arg "<preset>"
flag "--version <version>" default="0.0.0" help="The version of the package"
'''
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
run = '''
rm -rf build/ohpm
scripts/pack-ohpm.sh --version "$usage_version" build/ohpm "$usage_preset"
'''

# The test task builds the addon first.
[tasks._test-arkts]
hide = true
usage = 'arg "<preset>"'
# The OpenHarmony SDK packs and signs a HAP with Java tools.
tools = { "core:java" = "{{vars.java_version}}" }
run = '''
cmake --build "native/build/$usage_preset" --target maplibre_native_ffi_test_graphics
scripts/test-arkts.sh "$usage_preset"
'''

[tasks."build:hermes"]
description = "Build the shared TypeScript suite and lifecycle probe with official Hermes."
usage = '''
arg "<preset>" {
  choices "android-arm-egl" "android-arm-vulkan" "android-arm64-egl" "android-arm64-vulkan" "android-x86-egl" "android-x86-vulkan" "android-x64-egl" "android-x64-vulkan" "ios-arm64-metal" "ios-simulator-arm64-metal" "ios-maccatalyst-arm64-metal" "tvos-arm64-metal" "tvos-simulator-arm64-metal" "visionos-arm64-metal" "visionos-simulator-arm64-metal"
}
'''
tools = { "core:java" = "{{vars.java_version}}" }
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = 'python scripts/hermes.py build "$usage_preset"'

[tasks."test:hermes"]
description = "Run the Hermes TypeScript suite, graphics readback, and runtime teardown."
usage = '''
arg "<preset>" {
  choices "android-x64-egl" "android-x64-vulkan" "android-arm64-egl" "android-arm64-vulkan" "ios-simulator-arm64-metal" "ios-maccatalyst-arm64-metal" "tvos-simulator-arm64-metal" "visionos-simulator-arm64-metal"
}
'''
depends = [{ task = ":build:hermes", args = ["{{usage.preset}}"] }]
run = 'python scripts/hermes.py test "$usage_preset"'
