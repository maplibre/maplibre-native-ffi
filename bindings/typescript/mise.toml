[tools]
"core:node" = "{{vars.node_version}}"
# Bun and Deno run the same addon and the same conformance suite. They are
# declared here rather than at the repository root because only this binding
# uses them.
"core:bun" = "{{vars.bun_version}}"
"core:deno" = "{{vars.deno_version}}"

[tasks.generate]
description = "Regenerate the raw layer and the normalized C dispatch from the public headers."
dir = "../.."
sources = [
  "include/maplibre_native_c.h",
  "include/maplibre_native_c/**/*.h",
  "bindings/typescript/codegen/src/**/*.rs",
  "bindings/typescript/codegen/Cargo.toml",
  # The support contract is part of the schema the fingerprint covers, so a
  # change to it has to regenerate just as a header change does.
  "bindings/typescript/host-support/include/mln_abi.h",
]
outputs = [
  "bindings/typescript/api/src/raw/*.ts",
  "bindings/typescript/host-support/generated/*",
]
# dprint owns formatting for every file in the repository, generated or not, so
# the generator's output is formatted here. Otherwise the checked-in files and a
# fresh generation differ by whitespace and the CI regeneration check fails.
run = '''
cargo run --quiet -p mln-ts-codegen -- include bindings/typescript
dprint fmt --allow-no-files \
  "bindings/typescript/api/src/raw/**/*" \
  "bindings/typescript/host-support/generated/**/*"
'''

[tasks.build]
description = "Build the Node-API addon and the TypeScript packages."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }, "generate"]
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
cargo build -p mln-ts-addon
bindings/typescript/scripts/stage-runtime.sh "$usage_preset"
# One TypeScript source, published as both module formats.
pnpm --filter @maplibre/native-ffi run build
'''

[tasks."test:wasm"]
description = "Run the conformance suite over the WebAssembly transport."
usage = 'arg "[preset]" default="emscripten-wasm32-webgl"'
depends = [{ task = "build-wasm", args = ["{{usage.preset}}"] }, "build"]
dir = "../.."
run = 'cd bindings/typescript/api && pnpm exec vitest run --config vitest.wasm.config.ts'

[tasks.build-wasm]
description = "Link the WebAssembly runtime payload."
usage = 'arg "[preset]" default="emscripten-wasm32-webgl"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }, "generate"]
dir = "../.."
# The Emscripten SDK is a multi-gigabyte tool an environment may leave out, so
# this task names it rather than the binding declaring it for every task.
tools = { emsdk = "{{vars.emsdk_version}}" }
run = 'bindings/typescript/scripts/build-wasm-runtime.sh "$usage_preset"'

[tasks."build:arkts"]
description = "Cross-build the Node-API addon for OpenHarmony and stage the ArkTS payload."
usage = 'arg "[preset]" default="ohos-arm64-vulkan"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }, "generate"]
dir = "../.."
run = 'bindings/typescript/scripts/build-arkts-runtime.sh "$usage_preset"'

[tasks."test:ohos-emulator"]
description = "Run the normalized ABI check on the OpenHarmony emulator."
usage = 'arg "[preset]" default="ohos-x64-egl"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }, "generate"]
dir = "../.."
run = 'bindings/typescript/scripts/run-ohos-abi-check.sh "$usage_preset"'

[tasks.test]
description = "Run the TypeScript binding tests under every installed runtime."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
export LD_LIBRARY_PATH="$native_install_dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
export DYLD_LIBRARY_PATH="$native_install_dir/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
cargo clippy -p mln-ts-addon -p mln-ts-codegen --all-targets -- -D warnings
pnpm --filter @maplibre/native-ffi exec vitest run

# Bun and Deno load the same compiled addon and register the same conformance
# suite, so a case that passes under one and fails under another is a
# difference between the runtimes rather than between two suites.
cd bindings/typescript/api
bun test runners/bun.test.ts 2>&1 | tee /tmp/mln-bun.log
grep -qE "^ *0 fail" /tmp/mln-bun.log
# Deno needs the FFI permission to load a Node-API addon at all, and a local
# node_modules directory to resolve the runtime payload package.
deno test \
  --allow-read \
  --allow-write \
  --allow-ffi \
  --allow-env \
  --allow-net \
  --node-modules-dir=manual \
  runners/deno.test.ts
'''

[tasks."test:arkts"]
description = "Run the conformance suite on an OpenHarmony device."
usage = 'arg "[preset]" default="ohos-x64-egl"'
depends = [{ task = "build:arkts", args = ["{{usage.preset}}"] }]
dir = "../.."
run = 'bindings/typescript/scripts/build-arkts-test.sh "$usage_preset"'

[tasks."pack"]
description = "Pack the runtime payload package for a target."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = 'bindings/typescript/scripts/pack-runtime.sh "$usage_preset"'

[tasks."pack:arkts"]
description = "Pack the OpenHarmony runtime payload package."
usage = 'arg "[preset]" default="ohos-arm64-vulkan"'
depends = [{ task = "build:arkts", args = ["{{usage.preset}}"] }]
dir = "../.."
run = 'bindings/typescript/scripts/pack-runtime.sh "$usage_preset"'
