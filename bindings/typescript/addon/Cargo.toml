[package]
name = "mln-ts-addon"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The sys crate owns native artifact acquisition and linking for every Rust
# consumer in this repository, so the addon takes the prefix it resolved rather
# than resolving a second one.
maplibre-native-ffi-sys = { path = "../../rust/crates/maplibre-native-ffi-sys" }
napi = { version = "3.12.0", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3.6.2"

[build-dependencies]
cc = "1.2.53"
napi-build = "2.2.5"
sha2 = "0.10.9"
