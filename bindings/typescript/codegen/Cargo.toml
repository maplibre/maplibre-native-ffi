[package]
name = "mln-ts-codegen"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

# The generator reads the public headers through libclang, which is already a
# build requirement for the Rust binding's bindgen step, and asks it for sizes,
# alignments, and field offsets once per ABI class rather than deriving them.
[dependencies]
clang = { version = "2.1.0", features = ["runtime", "clang_10_0"] }
sha2 = "0.10.9"
