apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

if (project.findProperty('newArchEnabled') != 'true') {
    throw new GradleException('MapLibre Native FFI requires the New Architecture')
}

def manifest = new groovy.json.JsonSlurper().parse(file('../package.json'))
def runtimeAar = project.findProperty('maplibreNativeFfiRuntimeAar')
def backend = project.findProperty('maplibre.android.backend') ?: 'opengl'

react {
    root = file('..')
    jsRootDir = file('../src/specs')
    libraryName = 'MaplibreNativeFfiSpec'
    codegenJavaPackageName = 'org.maplibre.nativeffi'
}

android {
    namespace 'org.maplibre.nativeffi'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    buildFeatures { prefab true }
    defaultConfig {
        minSdkVersion 24
        ndk { abiFilters (*((project.findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(','))) }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild {
        cmake { path 'CMakeLists.txt' }
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    if (runtimeAar) {
        implementation files(runtimeAar)
    } else {
        // This adapter uses the native library, not the AAR's Kotlin marker.
        implementation("org.maplibre.nativeffi:maplibre-native-ffi-runtime-${backend}-android:${manifest.version}") {
            transitive = false
        }
    }
}
