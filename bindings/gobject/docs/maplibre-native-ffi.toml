# gi-docgen's configuration for the GObject library's API reference.

[library]
description = "GObject bindings for MapLibre Native"
authors = "MapLibre contributors"
license = "BSD-2-Clause"
website_url = "https://maplibre.org/maplibre-native-ffi/"
browse_url = "https://github.com/maplibre/maplibre-native-ffi/"
repository_url = "https://github.com/maplibre/maplibre-native-ffi.git"
docs_url = "https://maplibre.org/maplibre-native-ffi/reference/gobject/"
dependencies = ["GObject-2.0", "Gio-2.0"]
devhelp = false
search_index = true

[dependencies."GObject-2.0"]
name = "GObject"
description = "The base type system library"
docs_url = "https://docs.gtk.org/gobject/"

[dependencies."Gio-2.0"]
name = "Gio"
description = "GObject interfaces and objects"
docs_url = "https://docs.gtk.org/gio/"

[theme]
name = "basic"
show_index_summary = true
show_class_hierarchy = true

[source-location]
base_url = "https://github.com/maplibre/maplibre-native-ffi/blob/main/bindings/gobject/"
