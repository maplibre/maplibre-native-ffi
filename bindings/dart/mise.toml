[tools]
# The root installs this Dart too. Naming it here keeps it ahead of the older
# Dart that Flutter bundles.
"core:dart" = "{{vars.dart_version}}"
"core:flutter" = { version = "3.47.9", os = [
  "linux/x64",
  "macos/arm64",
  "windows/x64",
] }

# The built-in provider runs `dart pub get` and tracks pubspec.yaml/pubspec.lock
# against .dart_tool/package_config.json. Use `dart pub upgrade` to move the
# lockfile deliberately.
[deps.dart]
auto = true

[tasks.api]
description = "Generate Dart API reference HTML with dart doc."
run = '''
rm -rf .dart_tool/api-docs
mkdir -p .dart_tool
dart doc -o .dart_tool/api-docs
'''

[tasks.format]
run = "dart format lib test tool"

[tasks.analyze]
run = "dart analyze"

[tasks.prepare-release]
description = "Pin a release's native archives in the package and stamp its version, before publishing."
usage = 'arg "<tag>" help="The release tag, such as v0.202610.2"'
run = 'python3 "$MISE_MONOREPO_ROOT/tools/release/dart_release.py" . "$usage_tag"'

[tasks.build]
depends = [":analyze"]

[tasks."test:android"]
description = "Run portable Dart binding suites in a Flutter Android host."
usage = '''
arg "<preset>" {
  choices "android-arm64-egl" "android-arm64-vulkan" "android-x64-egl" "android-x64-vulkan"
}
'''
depends = [
  { task = "//:build", args = [
    "{{usage.preset}}",
  ] },
  { task = ":_native-prefix", args = [
    "{{usage.preset}}",
  ] },
]
run = '''
exec "$MISE_MONOREPO_ROOT/scripts/test-dart-android-device.sh" "$usage_preset"
'''

# pubspec.yaml and the Flutter smoke host name this link as their local build.
# Git Bash on Windows copies the prefix in place of linking it.
[tasks._native-prefix]
description = "Point the Dart build hook at a locally built native library."
hide = true
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = '''
mkdir -p .dart_tool
rm -rf .dart_tool/native
ln -s "$MISE_MONOREPO_ROOT/build/$usage_preset/install" .dart_tool/native
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [
  { task = "//:build", args = [
    "{{usage.preset}}",
  ] },
  { task = ":_native-prefix", args = [
    "{{usage.preset}}",
  ] },
  ":analyze",
  ":check-publish",
]
run = '''
if [[ "$usage_preset" == macos-x64-* ]]; then
  exec mise run :_test-macos-x64
fi
if [[ "$usage_preset" == linux-gnu-riscv64-* ]]; then
  # Build hooks strip QEMU's loader environment, so run inside the target OS.
  exec docker run --rm --platform linux/riscv64 \
    --volume "$MISE_MONOREPO_ROOT:$MISE_MONOREPO_ROOT" \
    --volume "${PUB_CACHE:-$HOME/.pub-cache}:${PUB_CACHE:-$HOME/.pub-cache}:ro" \
    --env PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}" \
    --workdir "$PWD" \
    "dart:{{vars.dart_version}}" sh -euc '
      # LLVM 19 lavapipe fails to JIT RISC-V shaders; match the QEMU roots.
      sed -i s/trixie/forky/g /etc/apt/sources.list.d/debian.sources
      apt-get update -qq
      apt-get install --yes --quiet --no-install-recommends \
        libegl1 libgles2 libvulkan1 mesa-vulkan-drivers
      export LIBGL_ALWAYS_SOFTWARE=true MLN_TEST_TIMEOUT_SCALE=5
      exec dart test
    '
fi
exec dart test
'''
run_windows = '''
# The DLL loads its own dependencies from the prefix it was installed into.
export PATH="$(cygpath -u "$MISE_MONOREPO_ROOT/build/$usage_preset/install/bin")${PATH:+:${PATH}}"
dart test
'''

# A separate tool name keeps the Intel SDK apart from the HTTP backend's host install.
[tasks._test-macos-x64]
hide = true
tools = { "http:dart-x64" = { version = "{{vars.dart_version}}", url = "https://storage.googleapis.com/dart-archive/channels/stable/release/{{vars.dart_version}}/sdk/dartsdk-macos-x64-release.zip", checksum_url = "https://storage.googleapis.com/dart-archive/channels/stable/release/{{vars.dart_version}}/sdk/dartsdk-macos-x64-release.zip.sha256sum" } }
run = "dart test"
