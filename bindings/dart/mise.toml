[tools]
"core:dart" = "{{vars.dart_version}}"
"core:flutter" = { version = "{{vars.flutter_version}}", os = [
  "linux/x64",
  "macos/arm64",
  "windows/x64",
] }

# The built-in provider runs `dart pub get` and tracks pubspec.yaml/pubspec.lock
# against .dart_tool/package_config.json. Use `dart pub upgrade` to move the
# lockfile deliberately.
[deps.dart]
auto = true

# `dart format` takes only files and directories, so it cannot join dprint's
# stdin/stdout exec plugin like the other language formatters. hk calls these
# path-taking tasks directly instead.
[tasks._format-check]
description = "Check Dart formatting."
hide = true
raw_args = true
dir = "../.."
run = "dart format --output=none --set-exit-if-changed"

[tasks._format-fix]
description = "Format Dart files."
hide = true
raw_args = true
dir = "../.."
run = "dart format"

[tasks.api]
description = "Generate Dart API reference HTML with dart doc."
run = '''
rm -rf .dart_tool/api-docs
mkdir -p .dart_tool
dart doc -o .dart_tool/api-docs
'''

[tasks.format]
run = "dart format lib test tool"

[tasks.analyze]
run = "dart analyze"

[tasks.prepare-release]
description = "Pin a release's native archives in the package and stamp its version, before publishing."
usage = 'arg "<tag>" help="The release tag, such as v0.202610.2"'
run = 'python3 "$MISE_MONOREPO_ROOT/ci/dart_release.py" . "$usage_tag"'

[tasks.check-publish]
description = "Check that pub would publish the package as a release prepares it."
# A copy outside Git stands in for the release checkout, whose prepared files
# pub would otherwise report as modified.
run = '''
copy="$(mktemp -d)"
trap 'rm -rf "$copy"' EXIT
package="$copy/maplibre_native_ffi"
mkdir "$package"
# -h copies the file that the LICENSE link names.
git ls-files -z --cached --others --exclude-standard | tar -c -h --null -T - | tar -x -C "$package"
printf '%s  %s\n' "$(printf '0%.0s' {1..64})" maplibre-native-c-linux-gnu-x64-vulkan.tar.gz >"$copy/SHA256SUMS"
python3 "$MISE_MONOREPO_ROOT/ci/dart_release.py" "$package" v0.202601.0 --checksums "$copy/SHA256SUMS"
cd "$package"
dart pub publish --dry-run
'''

[tasks.build]
depends = [":analyze"]

[tasks."build:mobile"]
description = "Build the Dart binding in a Flutter mobile application."
usage = '''
arg "[preset]" {
  choices \
    "android-arm-egl" \
    "android-arm-vulkan" \
    "android-arm64-egl" \
    "android-arm64-vulkan" \
    "android-x64-egl" \
    "android-x64-vulkan" \
    "ios-arm64-metal" \
    "ios-simulator-arm64-metal"
}
'''
depends = [
  { task = "//:build", args = [
    "{{usage.preset}}",
  ] },
  { task = ":_native-prefix", args = [
    "{{usage.preset}}",
  ] },
]
run = '''
app=.dart_tool/flutter_smoke
flutter create \
  --empty \
  --no-pub \
  --org org.maplibre.native_ffi \
  --platforms android,ios \
  --project-name maplibre_native_ffi_smoke \
  "$app"
cp tool/flutter_smoke/pubspec.yaml "$app/pubspec.yaml"
cp tool/flutter_smoke/lib/main.dart "$app/lib/main.dart"
cd "$app"
flutter pub get

case "$usage_preset" in
  android-arm-*)
    flutter build apk --release --target-platform android-arm
    ;;
  android-arm64-*)
    flutter build apk --release --target-platform android-arm64
    ;;
  android-x64-*)
    flutter build apk --release --target-platform android-x64
    ;;
  ios-arm64-*)
    flutter build ios --release --no-codesign
    ;;
  ios-simulator-arm64-*)
    # Flutter prepares native assets for every standard simulator architecture
    # before Xcode narrows a debug build to the active architecture.
    printf '\nARCHS = arm64\n' >>ios/Flutter/Debug.xcconfig
    flutter build ios --debug --simulator --no-codesign
    ;;
esac
'''

[tasks."test:android"]
description = "Run portable Dart binding suites in a Flutter Android host."
usage = '''
arg "<preset>" {
  choices "android-arm64-egl" "android-arm64-vulkan" "android-x64-egl" "android-x64-vulkan"
}
'''
depends = [
  { task = "//:build", args = [
    "{{usage.preset}}",
  ] },
  { task = ":_native-prefix", args = [
    "{{usage.preset}}",
  ] },
]
run = '''
exec "$MISE_MONOREPO_ROOT/scripts/test-dart-android-device.sh" "$usage_preset"
'''

# pubspec.yaml and the Flutter smoke host name this link as their local build.
# Git Bash on Windows copies the prefix in place of linking it.
[tasks._native-prefix]
description = "Point the Dart build hook at a locally built native library."
hide = true
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = '''
mkdir -p .dart_tool
rm -rf .dart_tool/native
ln -s "$MISE_MONOREPO_ROOT/build/$usage_preset/install" .dart_tool/native
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [
  { task = "//:build", args = [
    "{{usage.preset}}",
  ] },
  { task = ":_native-prefix", args = [
    "{{usage.preset}}",
  ] },
  ":analyze",
  ":check-publish",
]
run = "dart test"
run_windows = '''
# The DLL loads its own dependencies from the prefix it was installed into.
export PATH="$(cygpath -u "$MISE_MONOREPO_ROOT/build/$usage_preset/install/bin")${PATH:+:${PATH}}"
dart test
'''

[tasks."test:ios"]
description = "Run portable Dart binding suites in a Flutter iOS simulator host."
usage = 'arg "[preset]" default="ios-simulator-arm64-metal" { choices "ios-simulator-arm64-metal" }'
depends = [
  { task = "//:build", args = [
    "{{usage.preset}}",
  ] },
  { task = ":_native-prefix", args = [
    "{{usage.preset}}",
  ] },
]
run = '''
mise run //:ios-simulator:boot
device=$("$MISE_MONOREPO_ROOT/scripts/apple-simulator.sh" find-booted iOS)
app=.dart_tool/flutter_ios_test
flutter create --empty --no-pub --org org.maplibre.native_ffi \
  --platforms ios --project-name maplibre_native_ffi_ios_test "$app"
cp tool/flutter_ios_test/pubspec.yaml "$app/pubspec.yaml"
mkdir -p "$app/integration_test" "$app/hook"
cp tool/flutter_ios_test/hook/build.dart "$app/hook/build.dart"
cp tool/flutter_ios_test/integration_test/binding_test.dart "$app/integration_test/binding_test.dart"
cd "$app"
if ! grep -q '^ARCHS = arm64$' ios/Flutter/Debug.xcconfig; then
  printf '\nARCHS = arm64\n' >>ios/Flutter/Debug.xcconfig
fi
flutter pub get
flutter test integration_test/binding_test.dart --device-id "$device" --timeout 10m
'''
