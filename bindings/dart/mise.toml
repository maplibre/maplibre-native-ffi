[tools]
# The root installs this Dart too. Naming it here keeps it ahead of the older
# Dart that Flutter bundles.
"core:dart" = "{{vars.dart_version}}"
"core:flutter" = { version = "3.47.7", os = [
  "linux/x64",
  "macos/arm64",
  "windows/x64",
] }

# The built-in provider runs `dart pub get` and tracks pubspec.yaml/pubspec.lock
# against .dart_tool/package_config.json. Use `dart pub upgrade` to move the
# lockfile deliberately.
[deps.dart]
auto = true

[tasks.api]
description = "Generate Dart API reference HTML with dart doc."
run = '''
rm -rf .dart_tool/api-docs
mkdir -p .dart_tool
dart doc -o .dart_tool/api-docs
'''

[tasks.format]
run = "dart format lib test tool"

[tasks.analyze]
run = "dart analyze"

[tasks.prepare-release]
description = "Pin a release's native archives in the package and stamp its version, before publishing."
usage = 'arg "<tag>" help="The release tag, such as v0.202610.2"'
run = 'python3 "$MISE_MONOREPO_ROOT/ci/dart_release.py" . "$usage_tag"'

[tasks.build]
depends = [":analyze"]

[tasks."test:android"]
description = "Run portable Dart binding suites in a Flutter Android host."
usage = '''
arg "<preset>" {
  choices "android-arm64-egl" "android-arm64-vulkan" "android-x64-egl" "android-x64-vulkan"
}
'''
depends = [
  { task = "//:build", args = [
    "{{usage.preset}}",
  ] },
  { task = ":_native-prefix", args = [
    "{{usage.preset}}",
  ] },
]
run = '''
exec "$MISE_MONOREPO_ROOT/scripts/test-dart-android-device.sh" "$usage_preset"
'''

# pubspec.yaml and the Flutter smoke host name this link as their local build.
# Git Bash on Windows copies the prefix in place of linking it.
[tasks._native-prefix]
description = "Point the Dart build hook at a locally built native library."
hide = true
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = '''
mkdir -p .dart_tool
rm -rf .dart_tool/native
ln -s "$MISE_MONOREPO_ROOT/build/$usage_preset/install" .dart_tool/native
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [
  { task = "//:build", args = [
    "{{usage.preset}}",
  ] },
  { task = ":_native-prefix", args = [
    "{{usage.preset}}",
  ] },
  ":analyze",
  ":check-publish",
]
run = "dart test"
run_windows = '''
# The DLL loads its own dependencies from the prefix it was installed into.
export PATH="$(cygpath -u "$MISE_MONOREPO_ROOT/build/$usage_preset/install/bin")${PATH:+:${PATH}}"
dart test
'''
