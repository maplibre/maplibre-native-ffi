[tools]
"core:dart" = "{{vars.dart_version}}"

[tasks.pub-get]
run = "dart pub get"

[tasks.ffigen]
depends = [":pub-get"]
run = '''
clang_resource_dir="$(clang -print-resource-dir)"
dart run ffigen \
  --config ffigen.yaml \
  --compiler-opts "-isystem $clang_resource_dir/include"
'''
sources = [
  "ffigen.yaml",
  "pubspec.yaml",
  "pubspec.lock",
  "../../include/maplibre_native_c.h",
  "../../include/maplibre_native_c/**/*.h",
  "../../src/c_api/dart_shim.h",
]
outputs = ["lib/src/internal/c/maplibre_native_c.g.dart"]

[tasks.ffigen-check]
depends = [":ffigen"]
run = """
mkdir -p .dart_tool
python3 - <<'PY'
from pathlib import Path
config = Path('ffigen.yaml').read_text()
config = config.replace(
    'output: lib/src/internal/c/maplibre_native_c.g.dart',
    'output: .dart_tool/maplibre_native_c.check.g.dart',
)
Path('ffigen.check.yaml').write_text(config)
PY
trap 'rm -f ffigen.check.yaml .dart_tool/maplibre_native_c.check.g.dart' EXIT
clang_resource_dir="$(clang -print-resource-dir)"
dart run ffigen \
  --config ffigen.check.yaml \
  --compiler-opts "-isystem $clang_resource_dir/include"
cmp --silent .dart_tool/maplibre_native_c.check.g.dart lib/src/internal/c/maplibre_native_c.g.dart
"""

[tasks.format]
run = "dart format lib test"

[tasks.analyze]
depends = [":ffigen"]
run = "dart analyze"

[tasks.build]
depends = [":analyze"]

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [
  { task = "//:build", args = ["{{usage.preset}}"] },
  ":analyze",
]
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
if [[ "$(uname -s)" == "Darwin" ]]; then
  native_library="$native_install_dir/lib/libmaplibre-native-c.dylib"
else
  native_library="$native_install_dir/lib/libmaplibre-native-c.so"
fi
MLN_FFI_NATIVE_LIBRARY="$native_library" dart test
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
MLN_FFI_NATIVE_LIBRARY="$native_install_dir/bin/maplibre-native-c.dll" dart test
'''
