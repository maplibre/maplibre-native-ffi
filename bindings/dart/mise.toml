[tools]
"core:dart" = "{{vars.dart_version}}"
"core:flutter" = { version = "{{vars.flutter_version}}", os = ["linux/x64", "macos/arm64", "windows/x64"] }

# The built-in provider runs `dart pub get` and tracks pubspec.yaml/pubspec.lock
# against .dart_tool/package_config.json. Use `dart pub upgrade` to move the
# lockfile deliberately.
[deps.dart]
auto = true

# `dart format` takes only files and directories, so it cannot join dprint's
# stdin/stdout exec plugin like the other language formatters. hk calls these
# path-taking tasks directly instead.
[tasks._format-check]
description = "Check Dart formatting."
hide = true
raw_args = true
dir = "../.."
run = "dart format --output=none --set-exit-if-changed"

[tasks._format-fix]
description = "Format Dart files."
hide = true
raw_args = true
dir = "../.."
run = "dart format"

[tasks.ffigen]
run = "dart --packages=.dart_tool/package_config.json tool/ffigen.dart"
sources = [
  "tool/ffigen.dart",
  "hook/build.dart",
  "lib/src/internal/c/native_asset.dart",
  "pubspec.yaml",
  "pubspec.lock",
  "../../include/maplibre_native_c.h",
  "../../include/maplibre_native_c/**/*.h",
]
outputs = ["lib/src/internal/c/maplibre_native_c.g.dart"]

[tasks.api]
description = "Generate Dart API reference HTML with dart doc."
run = '''
rm -rf .dart_tool/api-docs
mkdir -p .dart_tool
dart doc -o .dart_tool/api-docs
'''

[tasks.format]
run = "dart format lib test tool"

[tasks.analyze]
run = "dart analyze"

[tasks.build]
depends = [":analyze"]

[tasks."build:mobile"]
description = "Build the Dart binding in a Flutter mobile application."
usage = '''
arg "[preset]" {
  choices \
    "android-arm-egl" \
    "android-arm-vulkan" \
    "android-arm64-egl" \
    "android-arm64-vulkan" \
    "android-x64-egl" \
    "android-x64-vulkan" \
    "ios-arm64-metal" \
    "ios-simulator-arm64-metal"
}
'''
depends = [
  { task = "//:build", args = ["{{usage.preset}}"] },
  { task = ":_native-prefix", args = ["{{usage.preset}}"] },
]
run = '''
app=.dart_tool/flutter_smoke
flutter create \
  --empty \
  --no-pub \
  --org org.maplibre.native_ffi \
  --platforms android,ios \
  --project-name maplibre_native_ffi_smoke \
  "$app"
cp tool/flutter_smoke/pubspec.yaml "$app/pubspec.yaml"
cp tool/flutter_smoke/lib/main.dart "$app/lib/main.dart"
cd "$app"
flutter pub get

case "$usage_preset" in
  android-arm-*)
    flutter build apk --release --target-platform android-arm
    ;;
  android-arm64-*)
    flutter build apk --release --target-platform android-arm64
    ;;
  android-x64-*)
    flutter build apk --release --target-platform android-x64
    ;;
  ios-arm64-*)
    flutter build ios --release --no-codesign
    ;;
  ios-simulator-arm64-*)
    # Flutter prepares native assets for every standard simulator architecture
    # before Xcode narrows a debug build to the active architecture.
    printf '\nARCHS = arm64\n' >>ios/Flutter/Debug.xcconfig
    flutter build ios --debug --simulator --no-codesign
    ;;
esac
'''

# Build hooks run with a stripped environment, so hook/build.dart takes the
# install prefix from a file rather than from MLN_FFI_NATIVE_LIBRARY.
[tasks._native-prefix]
description = "Point the Dart build hook at a locally built native library."
hide = true
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
run = '''
mkdir -p .dart_tool
printf '%s\n' "$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  >.dart_tool/maplibre_native_install_dir
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [
  { task = "//:build", args = ["{{usage.preset}}"] },
  { task = ":_native-prefix", args = ["{{usage.preset}}"] },
  ":analyze",
]
run = "dart test"
run_windows = '''
# The DLL loads its own dependencies from the prefix it was installed into.
export PATH="$(cygpath -u "$MISE_MONOREPO_ROOT/build/$usage_preset/install/bin")${PATH:+:${PATH}}"
dart test
'''

[tasks."test:download"]
description = "Test the build hook against a downloaded native snapshot archive."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
# Runs one file rather than the suite, because what this task checks is the
# acquisition path rather than binding behavior. Removing the pointer forces the
# download; it goes back afterwards so a local prefix survives this task.
run = '''
pointer=.dart_tool/maplibre_native_install_dir
saved="$(mktemp)"
trap 'if [[ -s "$saved" ]]; then mv "$saved" "$pointer"; else rm -f "$saved"; fi' EXIT
if [[ -f "$pointer" ]]; then
  mv "$pointer" "$saved"
fi
python3 "$MISE_MONOREPO_ROOT/ci/native_download_fixture.py" \
  --dart-pointer .dart_tool/maplibre_native_test_snapshot_base_url \
  "$MISE_MONOREPO_ROOT/build/packages/native/dist/maplibre-native-c-$usage_preset.tar.gz" \
  -- dart test test/native_library_test.dart
'''
