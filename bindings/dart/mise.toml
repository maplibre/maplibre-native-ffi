[tools]
"core:dart" = "{{vars.dart_version}}"

[tasks.pub-get]
run = "dart pub get"

[tasks.ffigen]
depends = [":pub-get"]
run = "dart run tool/ffigen.dart"
sources = [
  "tool/ffigen.dart",
  "pubspec.yaml",
  "pubspec.lock",
  "../../include/maplibre_native_c.h",
  "../../include/maplibre_native_c/**/*.h",
  "../../src/c_api/dart_shim.h",
]
outputs = ["lib/src/internal/c/maplibre_native_c.g.dart"]

[tasks.ffigen-check]
depends = [":pub-get"]
run = """
mkdir -p .dart_tool
trap 'rm -f .dart_tool/maplibre_native_c.check.g.dart' EXIT
dart run tool/ffigen.dart --output .dart_tool/maplibre_native_c.check.g.dart
cmp --silent .dart_tool/maplibre_native_c.check.g.dart lib/src/internal/c/maplibre_native_c.g.dart
"""

[tasks.format]
run = "dart format lib test tool"

[tasks.analyze]
depends = [":ffigen-check"]
run = "dart analyze"

[tasks.build]
depends = [":analyze"]

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [
  { task = "//:build", args = ["{{usage.preset}}"] },
  ":analyze",
]
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
if [[ "$(uname -s)" == "Darwin" ]]; then
  native_library="$native_install_dir/lib/libmaplibre-native-c.dylib"
else
  native_library="$native_install_dir/lib/libmaplibre-native-c.so"
fi
MLN_FFI_NATIVE_LIBRARY="$native_library" dart test
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
MLN_FFI_NATIVE_LIBRARY="$native_install_dir/bin/maplibre-native-c.dll" dart test
'''
