name: maplibre_native_ffi_smoke
description: Build-only Flutter host for the MapLibre Native Dart binding.
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  maplibre_native_ffi:
    path: ../..

# The mise task creates this host in .dart_tool/flutter_smoke, beside the link
# to the selected preset's install prefix.
hooks:
  user_defines:
    maplibre_native_ffi:
      local_build: ../native

flutter:
  uses-material-design: false
