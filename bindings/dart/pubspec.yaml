name: maplibre_native_ffi
description:
  Low-level, memory-safe Dart bindings for the MapLibre Native C API and render
  backend integration surfaces.
version: 0.0.0
repository: https://github.com/maplibre/maplibre-native-ffi
homepage: https://maplibre.org/maplibre-native-ffi/
publish_to: none

# Applies only where this package is the root, as in its own tests. The mise
# test task links the selected preset's install prefix here.
hooks:
  user_defines:
    maplibre_native_ffi:
      local_build: .dart_tool/native

environment:
  sdk: ^3.11.0

dependencies:
  archive: ^4.5.2
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.1.4
  hooks: ^2.2.0

dev_dependencies:
  frontend_server_client: ^4.0.0
  lints: ^6.0.0
  test: ^1.33.0
