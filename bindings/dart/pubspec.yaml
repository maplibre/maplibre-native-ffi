name: maplibre_native_ffi
description: Low-level, memory-safe Dart bindings for the MapLibre Native C API and render backend integration surfaces.
version: 0.0.0
repository: https://github.com/maplibre/maplibre-native-ffi
homepage: https://maplibre.org/maplibre-native-ffi/
publish_to: none

hooks:
  user_defines:
    maplibre_native_ffi:
      test_snapshot_base_url_file: .dart_tool/maplibre_native_test_snapshot_base_url

environment:
  sdk: ^3.11.0

dependencies:
  archive: ^4.2.0
  code_assets: ^1.2.1
  crypto: ^3.0.7
  ffi: ^2.1.4
  hooks: ^2.2.0

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.0.0
  test: ^1.26.3
