[package]
name = "maplibre-native-ffi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bitflags = "2.10.0"
maplibre-native-ffi-core = { path = "../maplibre-native-ffi-core" }
maplibre-native-ffi-sys = { path = "../maplibre-native-ffi-sys" }

# Re-exported so the render backend is selectable by crates that depend on this
# crate alone. Enable at most one.
[features]
metal = ["maplibre-native-ffi-sys/metal"]
opengl = ["maplibre-native-ffi-sys/opengl"]
vulkan = ["maplibre-native-ffi-sys/vulkan"]
webgpu = ["maplibre-native-ffi-sys/webgpu"]

# Binds the browser fixtures' WebGPU header.
[build-dependencies]
bindgen = "0.72.1"

[dev-dependencies]
static_assertions = "1.1.0"

# Loads the GPU fixtures from tests/graphics.
[target.'cfg(not(target_os = "emscripten"))'.dev-dependencies]
libloading = "0.8.9"
