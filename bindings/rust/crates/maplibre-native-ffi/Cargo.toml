[package]
name = "maplibre-native-ffi"
description = "Low-level, memory-safe Rust bindings for the MapLibre Native map renderer's C API."
version.workspace = true
categories = ["api-bindings", "graphics", "rendering"]
documentation = "https://maplibre.org/maplibre-native-ffi/reference/rust/maplibre_native_ffi/"
edition.workspace = true
homepage.workspace = true
include = ["/build.rs", "/emscripten/", "/src/", "/LICENSE", "/README.md"]
keywords = ["maplibre", "map", "ffi", "gis"]
license.workspace = true
repository.workspace = true

[dependencies]
bitflags = "2.10.0"
maplibre-native-ffi-core.workspace = true
maplibre-native-ffi-sys.workspace = true

# Re-exported so the render backend is selectable by crates that depend on this
# crate alone. Enable at most one, and only in the final binary.
[features]
metal = ["maplibre-native-ffi-sys/metal"]
opengl = ["maplibre-native-ffi-sys/opengl"]
vulkan = ["maplibre-native-ffi-sys/vulkan"]
webgpu = ["maplibre-native-ffi-sys/webgpu"]
# Binds the browser fixtures' WebGPU header for the browser test suite, which
# scripts/test-rust-browser.sh runs. Nothing else needs it.
browser-fixtures = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }

[dev-dependencies]
static_assertions = "1.1.0"

# Loads the GPU fixtures from tests/graphics.
[target.'cfg(not(target_os = "emscripten"))'.dev-dependencies]
libloading = "0.8.9"
