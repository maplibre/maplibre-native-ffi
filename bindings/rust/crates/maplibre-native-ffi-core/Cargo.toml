[package]
name = "maplibre-native-ffi-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[dependencies]
bitflags = "2.10.0"
maplibre-native-ffi-sys = { path = "../maplibre-native-ffi-sys" }

[features]
# Lets a test make the C ABI check on its thread see another version. The
# binding's own tests enable it; nothing else should.
abi-version-override = []
