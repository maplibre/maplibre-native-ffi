[package]
name = "maplibre-native-ffi-sys"
description = "Raw declarations for the MapLibre Native C API, and the native library they link."
version.workspace = true
build = "build.rs"
categories = ["external-ffi-bindings", "graphics", "rendering"]
edition.workspace = true
homepage.workspace = true
include = [
  "/build.rs",
  "/src/",
  "/LICENSE",
  "/README.md",
  "/native_release.json",
]
keywords = ["maplibre", "map", "ffi", "sys"]
license.workspace = true
links = "maplibre-native-c"
repository.workspace = true

# MapLibre Native compiles exactly one renderer per build. Enable at most one;
# the build script picks a platform default when none is set. Only the final
# binary enables one, so a library that depends on this crate leaves them off.
[features]
metal = []
opengl = []
vulkan = []
webgpu = []

# The C library calls into a Rust platform layer on these targets. Its static
# library carries a second Rust standard library, which collides with the host's
# unless both are the same build, so Cargo builds the layer instead. The build
# script names the same targets.
[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "windows", target_os = "emscripten", target_os = "android"))'.dependencies]
maplibre-native-ffi-platform.workspace = true

[build-dependencies]
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
