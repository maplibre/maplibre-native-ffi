[package]
name = "maplibre-native-ffi-sys"
version = "0.0.0"
build = "build.rs"
edition.workspace = true
license.workspace = true
links = "maplibre-native-c"
repository.workspace = true

# MapLibre Native compiles exactly one renderer per build. Enable at most one;
# the build script picks a platform default when none is set.
[features]
metal = []
opengl = []
vulkan = []
webgpu = []

[build-dependencies]
bindgen = "0.72.1"
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
# Use rustls with bundled roots to stay out of the rustls-platform-verifier
# patch the workspace applies for the runtime HTTP stack.
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
