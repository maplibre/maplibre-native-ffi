[package]
name = "maplibre-native-ffi-sys"
description = "Raw declarations for the MapLibre Native C API, and the native library they link."
version.workspace = true
build = "build.rs"
categories = ["external-ffi-bindings", "graphics", "rendering"]
edition.workspace = true
homepage.workspace = true
include = [
  "/build.rs",
  "/src/",
  "/LICENSE",
  "/README.md",
  "/native_release.json",
]
keywords = ["maplibre", "map", "ffi", "sys"]
license.workspace = true
links = "maplibre-native-c"
repository.workspace = true

# Each native artifact names the render backend that its preset tests, and this
# picks which artifact links. Enable at most one; the build script picks the
# platform default when none is set. Only the final binary enables one, so a
# library that depends on this crate leaves them off.
[features]
metal = []
opengl = []
vulkan = []
webgpu = []

[build-dependencies]
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
tar = "0.4.44"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
