[package]
name = "maplibre-native-ffi-sys"
description = "Raw declarations for the MapLibre Native C API, and the native library they link."
version.workspace = true
build = "build.rs"
categories = ["external-ffi-bindings", "graphics", "rendering"]
edition.workspace = true
homepage.workspace = true
include = [
  "/build.rs",
  "/src/",
  "/LICENSE",
  "/README.md",
  "/native_release.json",
]
keywords = ["maplibre", "map", "ffi", "sys"]
license.workspace = true
links = "maplibre-native-c"
repository.workspace = true

# MapLibre Native compiles exactly one renderer per build. Enable at most one;
# the build script picks a platform default when none is set. Only the final
# binary enables one, so a library that depends on this crate leaves them off.
[features]
metal = []
opengl = []
vulkan = []
webgpu = []

# The release workflow drops this table, because the platform crate is not
# published and the published crates do not support Emscripten.
[target.'cfg(target_os = "emscripten")'.dependencies]
mln-ffi-platform = { path = "../../../../src/platform/rust" }

[build-dependencies]
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
# Use rustls with bundled roots to stay out of the rustls-platform-verifier
# patch the workspace applies for the runtime HTTP stack.
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
