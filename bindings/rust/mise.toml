[tasks.build]
depends = ["//:ensure-native-library"]
dir = "{{env.MLN_FFI_REPO_ROOT}}"
run = "cargo build -p maplibre-native-sys -p maplibre-native-core -p maplibre-native"

[tasks.test]
depends = ["//:ensure-native-library"]
dir = "{{env.MLN_FFI_REPO_ROOT}}"
run = '''
extra_args=()
# EGL surfaceless (Mesa llvmpipe) doesn't handle concurrent context
# initialization across threads reliably; run tests single-threaded
# for the OpenGL backend.
if [[ "${MLN_FFI_RENDER_BACKEND:-}" == "opengl" ]]; then
  extra_args=(-- --test-threads 1)
fi
cargo test -p maplibre-native-sys -p maplibre-native-core -p maplibre-native "${extra_args[@]}"
'''

[tasks.ci]
depends = [":test"]
dir = "{{env.MLN_FFI_REPO_ROOT}}"
run = "cargo clippy -p maplibre-native-sys -p maplibre-native-core -p maplibre-native --all-targets -- -D warnings"
