native_install_dir="$MISE_MONOREPO_ROOT/build/ohos-x64-egl/install"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
cargo_target=x86_64-unknown-linux-ohos
compiler_target=x86_64-linux-ohos
sysroot="$OHOS_SDK_NATIVE/sysroot"
target_flags="--target=$compiler_target --sysroot=$sysroot"
target_env=x86_64_unknown_linux_ohos
target_env_upper=X86_64_UNKNOWN_LINUX_OHOS
export "BINDGEN_EXTRA_CLANG_ARGS_$target_env=$target_flags -I$sysroot/usr/include/$compiler_target"
export "CC_$target_env=$OHOS_SDK_NATIVE/llvm/bin/clang $target_flags"
export "CXX_$target_env=$OHOS_SDK_NATIVE/llvm/bin/clang++ $target_flags"
export "CARGO_TARGET_${target_env_upper}_LINKER=$OHOS_SDK_NATIVE/llvm/bin/clang"
export RUSTFLAGS="-C link-arg=--target=$compiler_target -C link-arg=--sysroot=$sysroot -C link-arg=-fuse-ld=lld"

test_manifest=$(mktemp)
trap 'find "$test_manifest" -delete' EXIT
cargo test --no-run \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target "$cargo_target" \
  --message-format=json |
  python3 -c '
import json
import sys

for line in sys.stdin:
    message = json.loads(line)
    if (
        message.get("reason") == "compiler-artifact"
        and message.get("profile", {}).get("test")
        and message.get("executable") is not None
    ):
        print(message["executable"])
' \
    > "$test_manifest"
cargo clippy \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target "$cargo_target" \
  --all-targets -- -D warnings

mise run //:ohos-emulator:boot
found_test=false
while IFS= read -r test_binary; do
  [[ -n "$test_binary" ]] || continue
  found_test=true
  bash "$MISE_MONOREPO_ROOT/scripts/run-ohos-emulator-test.sh" \
    "$test_binary" \
    "$native_install_dir/lib/libmaplibre-native-c.so" \
    "$OHOS_SDK_NATIVE/llvm/lib/x86_64-linux-ohos/libc++_shared.so" \
    180 \
    --test-threads=1
done < "$test_manifest"
if [[ "$found_test" != true ]]; then
  echo "The Rust build produced no OpenHarmony test executables." >&2
  exit 1
fi
'''

[tasks."test:download"]
description = "Test the sys crate against a downloaded native snapshot archive."
dir = "../.."
# Stops at maplibre-native-ffi-sys on purpose. Only the build script's acquisition
# path is under test, and the crates above it track the C API at this commit
# while the snapshot release publishes on its own schedule, so they stop
# compiling whenever it lags a header change.
run = 'env -u MAPLIBRE_NATIVE_C_INSTALL_DIR cargo test -p maplibre-native-ffi-sys'
