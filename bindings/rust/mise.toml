[tasks.build]
depends = ["//:ensure-native-library"]
dir = "{{env.MLN_FFI_REPO_ROOT}}"
run = "cargo build -p maplibre-native-sys -p maplibre-native-core -p maplibre-native"

[tasks.test]
depends = ["//:ensure-native-library"]
dir = "{{env.MLN_FFI_REPO_ROOT}}"
run = '''
env LD_LIBRARY_PATH="$MLN_FFI_NATIVE_INSTALL_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" DYLD_LIBRARY_PATH="$MLN_FFI_NATIVE_INSTALL_DIR/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" cargo test -p maplibre-native-sys -p maplibre-native-core -p maplibre-native -- --test-threads=1
cargo clippy -p maplibre-native-sys -p maplibre-native-core -p maplibre-native --all-targets -- -D warnings
'''
