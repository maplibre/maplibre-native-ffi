[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"

# A host build lets cargo pick its own target and toolchain. Cross builds name
# the target and point every tool that compiles or links at the platform SDK.
if [[ "$usage_preset" == android-* ]]; then
  case "$usage_preset" in
    android-arm64-*)
      cargo_target=aarch64-linux-android
      compiler_prefix=aarch64-linux-android
      ;;
    android-x64-*)
      cargo_target=x86_64-linux-android
      compiler_prefix=x86_64-linux-android
      ;;
  esac
  target_env="${cargo_target//-/_}"
  target_env_upper="${target_env^^}"
  ndk_bin="$ANDROID_HOME/ndk/$MLN_FFI_ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
  sysroot="$ANDROID_HOME/ndk/$MLN_FFI_ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
  export "BINDGEN_EXTRA_CLANG_ARGS_$target_env=--target=$compiler_prefix --sysroot=$sysroot"
  export "CC_$target_env=$ndk_bin/${compiler_prefix}24-clang"
  export "CXX_$target_env=$ndk_bin/${compiler_prefix}24-clang++"
  export "CARGO_TARGET_${target_env_upper}_LINKER=$ndk_bin/${compiler_prefix}24-clang"
  exec cargo build \
    -p maplibre-native-ffi-sys \
    -p maplibre-native-ffi-core \
    -p maplibre-native-ffi \
    --target "$cargo_target"
fi

if [[ "$usage_preset" == ohos-* ]]; then
  case "$usage_preset" in
    ohos-arm64-*)
      cargo_target=aarch64-unknown-linux-ohos
      compiler_target=aarch64-linux-ohos
      ;;
    ohos-x64-*)
      cargo_target=x86_64-unknown-linux-ohos
      compiler_target=x86_64-linux-ohos
      ;;
  esac
  sysroot="$OHOS_SDK_NATIVE/sysroot"
  target_flags="--target=$compiler_target --sysroot=$sysroot"
  target_env="${cargo_target//-/_}"
  target_env_upper=$(printf '%s' "$target_env" | tr '[:lower:]' '[:upper:]')
  export "BINDGEN_EXTRA_CLANG_ARGS_$target_env=$target_flags -I$sysroot/usr/include/$compiler_target"
  export "CC_$target_env=$OHOS_SDK_NATIVE/llvm/bin/clang $target_flags"
  export "CXX_$target_env=$OHOS_SDK_NATIVE/llvm/bin/clang++ $target_flags"
  export "CARGO_TARGET_${target_env_upper}_LINKER=$OHOS_SDK_NATIVE/llvm/bin/clang"
  export RUSTFLAGS="-C link-arg=--target=$compiler_target -C link-arg=--sysroot=$sysroot -C link-arg=-fuse-ld=lld"
  exec cargo build \
    -p maplibre-native-ffi-sys \
    -p maplibre-native-ffi-core \
    -p maplibre-native-ffi \
    --target "$cargo_target"
fi

cargo build \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
  cargo build \
    -p maplibre-native-ffi-sys \
    -p maplibre-native-ffi-core \
    -p maplibre-native-ffi
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
# The sys crate emits its own rpath, but cargo:rustc-link-arg only covers that
# crate's link targets, so the core and umbrella test binaries need the library
# located at run time. Resolving it here instead of through RUSTFLAGS keeps the
# preset out of the compiler command line, which is what sccache keys on: every
# preset would otherwise get its own copy of every dependency crate.
lib_dirs="$native_install_dir/lib"
if [[ -n "${MLN_FFI_VULKAN_LOADER_DIR:-}" ]]; then
  lib_dirs="$lib_dirs:$MLN_FFI_VULKAN_LOADER_DIR"
fi
export LD_LIBRARY_PATH="$lib_dirs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
export DYLD_LIBRARY_PATH="$lib_dirs${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
cargo test \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  -- --test-threads=1
cargo clippy \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --all-targets -- -D warnings
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
cargo test \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  -- --test-threads=1
cargo clippy \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --all-targets -- -D warnings
'''

[tasks."test:browser"]
description = "Run the Rust binding tests as a page in headless Chromium."
usage = 'arg "[preset]" default="emscripten-wasm32-webgl"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
set -euo pipefail
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"

# emcc links the module, so every option CMake linked the browser build with has
# to be repeated here. The build publishes them rather than this task knowing
# them; see cmake/mln_ffi_install.cmake.
link_flags_file="$native_install_dir/share/maplibre-native-c/emscripten-link-flags.txt"
if [[ ! -f "$link_flags_file" ]]; then
  echo "missing $link_flags_file; run 'mise run build $usage_preset' first" >&2
  exit 1
fi

# libtest is synchronous, so the suite's main never returns to an event loop.
# Emscripten needs the thread hosting the module to keep servicing JavaScript --
# it is what starts pthread workers, recycles finished ones, and lets the browser
# HTTP transport start -- so main is proxied onto a pthread of its own, where
# blocking is legal. rustc emits no entry point under the name that option's crt
# calls; bindings/rust/emscripten_proxy_main.c bridges the two.
proxy_main_object="$MISE_MONOREPO_ROOT/build/$usage_preset/rust-emscripten-proxy-main.o"
mkdir -p "$(dirname "$proxy_main_object")"
emcc -pthread -fwasm-exceptions -c \
  "$MISE_MONOREPO_ROOT/bindings/rust/emscripten_proxy_main.c" \
  -o "$proxy_main_object"

# Options the test harness needs on top of the build's. The suite runs as a page,
# so the module has to exit for its status to be reported, the fixtures create a
# WebGL context on a private OffscreenCanvas, and the runner passes the fixture
# server's origin through the environment.
harness_flags=(
  -sEXIT_RUNTIME=1
  -sENVIRONMENT=web,worker
  -sOFFSCREENCANVAS_SUPPORT=1
  -sEXPORTED_RUNTIME_METHODS=ENV,GL
  -sPROXY_TO_PTHREAD
  # Proxying transfers the canvas named by this setting to the thread it starts,
  # and pthread_create fails with EINVAL when the name resolves to nothing. A
  # module hosted in a worker has no page canvas to transfer, and needs none:
  # every fixture creates a private OffscreenCanvas on the thread that asked for
  # it. The two quote characters have to reach emcc, which rejects a bare `=`.
  "-sOFFSCREENCANVASES_TO_PTHREAD=''"
  "$proxy_main_object"
)

# These reach every crate in the graph, which cargo:rustc-link-arg cannot: it
# stops at the package whose build script emitted it, so the crates above the sys
# crate would link without them. The encoded form separates arguments with \x1f,
# which keeps a port path containing spaces intact, and cargo fingerprints it, so
# changing a flag relinks instead of reusing a stale binary.
unit_separator=$'\x1f'
rustflags=("-C" "target-feature=+atomics,+bulk-memory")
while IFS= read -r flag; do
  [[ -n "$flag" ]] || continue
  rustflags+=("-C" "link-arg=$flag")
done < "$link_flags_file"
for flag in "${harness_flags[@]}"; do
  rustflags+=("-C" "link-arg=$flag")
done
encoded=""
for flag in "${rustflags[@]}"; do
  encoded+="${encoded:+$unit_separator}$flag"
done
export CARGO_ENCODED_RUSTFLAGS="$encoded"

# rustup ships no wasm32-unknown-emscripten std built with atomics, and an
# Emscripten module linked under shared memory needs every object to carry them,
# so std is rebuilt from source. -Zbuild-std is nightly-only; RUSTC_BOOTSTRAP
# unlocks it on the pinned stable toolchain, the same way cmake/mln_ffi_rust.cmake
# does for the platform library.
export RUSTC_BOOTSTRAP=1
export CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER="$MISE_MONOREPO_ROOT/scripts/run-browser-cargo-test.sh"
cargo test \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target wasm32-unknown-emscripten \
  -Zbuild-std=std,panic_abort \
  -- --test-threads=1
cargo clippy \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target wasm32-unknown-emscripten \
  -Zbuild-std=std,panic_abort \
  --all-targets -- -D warnings
'''

[tasks."test:ohos-emulator"]
description = "Run the Rust binding tests in the OpenHarmony emulator."
depends = [{ task = "//:build", args = ["ohos-x64-egl"] }]
dir = "../.."
run = '''
set -euo pipefail
native_install_dir="$MISE_MONOREPO_ROOT/build/ohos-x64-egl/install"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
cargo_target=x86_64-unknown-linux-ohos
compiler_target=x86_64-linux-ohos
sysroot="$OHOS_SDK_NATIVE/sysroot"
target_flags="--target=$compiler_target --sysroot=$sysroot"
target_env=x86_64_unknown_linux_ohos
target_env_upper=X86_64_UNKNOWN_LINUX_OHOS
export "BINDGEN_EXTRA_CLANG_ARGS_$target_env=$target_flags -I$sysroot/usr/include/$compiler_target"
export "CC_$target_env=$OHOS_SDK_NATIVE/llvm/bin/clang $target_flags"
export "CXX_$target_env=$OHOS_SDK_NATIVE/llvm/bin/clang++ $target_flags"
export "CARGO_TARGET_${target_env_upper}_LINKER=$OHOS_SDK_NATIVE/llvm/bin/clang"
export RUSTFLAGS="-C link-arg=--target=$compiler_target -C link-arg=--sysroot=$sysroot -C link-arg=-fuse-ld=lld"

test_manifest=$(mktemp)
trap 'find "$test_manifest" -delete' EXIT
cargo test --no-run \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target "$cargo_target" \
  --message-format=json |
  python3 -c '
import json
import sys

for line in sys.stdin:
    message = json.loads(line)
    if (
        message.get("reason") == "compiler-artifact"
        and message.get("profile", {}).get("test")
        and message.get("executable") is not None
    ):
        print(message["executable"])
' \
    > "$test_manifest"
cargo clippy \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target "$cargo_target" \
  --all-targets -- -D warnings

mise run //:ohos-emulator:boot
found_test=false
while IFS= read -r test_binary; do
  [[ -n "$test_binary" ]] || continue
  found_test=true
  bash "$MISE_MONOREPO_ROOT/scripts/run-ohos-emulator-test.sh" \
    "$test_binary" \
    "$native_install_dir/lib/libmaplibre-native-c.so" \
    "$OHOS_SDK_NATIVE/llvm/lib/x86_64-linux-ohos/libc++_shared.so" \
    180 \
    --test-threads=1
done < "$test_manifest"
if [[ "$found_test" != true ]]; then
  echo "The Rust build produced no OpenHarmony test executables." >&2
  exit 1
fi
'''

[tasks."test:download"]
description = "Test the sys crate against a downloaded native snapshot archive."
dir = "../.."
# Stops at maplibre-native-ffi-sys on purpose. Only the build script's acquisition
# path is under test, and the crates above it track the C API at this commit
# while the snapshot release publishes on its own schedule, so they stop
# compiling whenever it lags a header change.
run = 'env -u MAPLIBRE_NATIVE_C_INSTALL_DIR cargo test -p maplibre-native-ffi-sys'
