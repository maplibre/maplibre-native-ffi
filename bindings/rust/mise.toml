[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
  cargo build \
    -p maplibre-native-sys \
    -p maplibre-native-core \
    -p maplibre-native
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
  cargo build \
    -p maplibre-native-sys \
    -p maplibre-native-core \
    -p maplibre-native
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
# The sys crate emits its own rpath, but cargo:rustc-link-arg only covers that
# crate's link targets, so the core and umbrella test binaries need the library
# located at run time. Resolving it here instead of through RUSTFLAGS keeps the
# preset out of the compiler command line, which is what sccache keys on: every
# preset would otherwise get its own copy of every dependency crate.
lib_dirs="$native_install_dir/lib"
if [[ -n "${MLN_FFI_VULKAN_LOADER_DIR:-}" ]]; then
  lib_dirs="$lib_dirs:$MLN_FFI_VULKAN_LOADER_DIR"
fi
export LD_LIBRARY_PATH="$lib_dirs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
export DYLD_LIBRARY_PATH="$lib_dirs${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
cargo test \
  -p maplibre-native-sys \
  -p maplibre-native-core \
  -p maplibre-native \
  -- --test-threads=1
cargo clippy \
  -p maplibre-native-sys \
  -p maplibre-native-core \
  -p maplibre-native \
  --all-targets -- -D warnings
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
cargo test \
  -p maplibre-native-sys \
  -p maplibre-native-core \
  -p maplibre-native \
  -- --test-threads=1
cargo clippy \
  -p maplibre-native-sys \
  -p maplibre-native-core \
  -p maplibre-native \
  --all-targets -- -D warnings
'''

[tasks."test:download"]
description = "Test the sys crate against a downloaded native snapshot archive."
dir = "../.."
# Stops at maplibre-native-sys on purpose. Only the build script's acquisition
# path is under test, and the crates above it track the C API at this commit
# while the snapshot release publishes on its own schedule, so they stop
# compiling whenever it lags a header change.
run = 'env -u MAPLIBRE_NATIVE_C_INSTALL_DIR cargo test -p maplibre-native-sys'

[tasks."build:ohos"]
usage = '''
arg "<preset>" {
  choices "ohos-arm64-egl" "ohos-arm64-vulkan"
}
'''
depends = [
  { task = "//:build", args = ["{{usage.preset}}"] },
]
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
sysroot="$OHOS_SDK_NATIVE/sysroot"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_ohos="--target=aarch64-linux-ohos --sysroot=$sysroot -I$sysroot/usr/include/aarch64-linux-ohos" \
CC_aarch64_unknown_linux_ohos="$OHOS_SDK_NATIVE/llvm/bin/clang --target=aarch64-linux-ohos --sysroot=$sysroot" \
CXX_aarch64_unknown_linux_ohos="$OHOS_SDK_NATIVE/llvm/bin/clang++ --target=aarch64-linux-ohos --sysroot=$sysroot" \
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER="$OHOS_SDK_NATIVE/llvm/bin/clang" \
RUSTFLAGS="-C link-arg=--target=aarch64-linux-ohos -C link-arg=--sysroot=$sysroot -C link-arg=-fuse-ld=lld" \
cargo build \
  -p maplibre-native-sys \
  -p maplibre-native-core \
  -p maplibre-native \
  --target aarch64-unknown-linux-ohos
'''
