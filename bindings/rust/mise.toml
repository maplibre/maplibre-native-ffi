[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"

# A host build lets cargo pick its own target and toolchain. Cross builds name
# the target and point every tool that compiles or links at the platform SDK.
source "$MISE_MONOREPO_ROOT/scripts/rust-cross-env.sh" "$usage_preset"
if [[ -n "$cargo_target" ]]; then
  exec cargo build \
    -p maplibre-native-ffi-sys \
    -p maplibre-native-ffi-core \
    -p maplibre-native-ffi \
    --target "$cargo_target"
fi
exec cargo build \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
# The sys crate's rpath covers only its own link targets, so the core and
# umbrella test binaries need the library located at run time. Resolving it here
# rather than through RUSTFLAGS keeps the preset out of the compiler command
# line, which sccache keys on.
lib_dirs="$native_install_dir/lib"
if [[ -n "${MLN_FFI_VULKAN_LOADER_DIR:-}" ]]; then
  lib_dirs="$lib_dirs:$MLN_FFI_VULKAN_LOADER_DIR"
fi
export LD_LIBRARY_PATH="$lib_dirs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
export DYLD_LIBRARY_PATH="$lib_dirs${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
cargo test \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  -- --test-threads=1
cargo clippy \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --all-targets -- -D warnings
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
cargo test \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  -- --test-threads=1
cargo clippy \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --all-targets -- -D warnings
'''

[tasks."test:browser"]
description = "Run the Rust binding tests as a page in headless Chromium."
usage = 'arg "[preset]" default="emscripten-wasm32-webgl"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '"$MISE_MONOREPO_ROOT/scripts/test-rust-browser.sh" "$usage_preset"'

[tasks."test:android-emulator"]
description = "Run the Rust binding tests in the Android emulator."
usage = '''
arg "[preset]" default="android-x64-egl" {
  choices "android-x64-egl" "android-x64-vulkan"
}
'''
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
set -euo pipefail
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
source "$MISE_MONOREPO_ROOT/scripts/rust-cross-env.sh" "$usage_preset"

test_manifest=$(mktemp)
trap 'find "$test_manifest" -delete' EXIT
cargo test --no-run \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target "$cargo_target" \
  --message-format=json |
  "$MISE_MONOREPO_ROOT/scripts/cargo-test-executables.py" \
    > "$test_manifest"
cargo clippy \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target "$cargo_target" \
  --all-targets -- -D warnings

mapfile -t test_binaries < <(grep . "$test_manifest" || true)
"$MISE_MONOREPO_ROOT/scripts/run-android-emulator-test.sh" \
  180 \
  "$native_install_dir/lib/libmaplibre-native-c.so" \
  --test-threads=1 -- ${test_binaries[@]+"${test_binaries[@]}"}
'''

[tasks."test:ohos-emulator"]
description = "Run the Rust binding tests in the OpenHarmony emulator."
depends = [{ task = "//:build", args = ["ohos-x64-egl"] }]
dir = "../.."
run = '''
set -euo pipefail
native_install_dir="$MISE_MONOREPO_ROOT/build/ohos-x64-egl/install"
export MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir"
source "$MISE_MONOREPO_ROOT/scripts/rust-cross-env.sh" ohos-x64-egl

test_manifest=$(mktemp)
trap 'find "$test_manifest" -delete' EXIT
cargo test --no-run \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target "$cargo_target" \
  --message-format=json |
  "$MISE_MONOREPO_ROOT/scripts/cargo-test-executables.py" \
    > "$test_manifest"
cargo clippy \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi \
  --target "$cargo_target" \
  --all-targets -- -D warnings

mapfile -t test_binaries < <(grep . "$test_manifest" || true)
"$MISE_MONOREPO_ROOT/scripts/run-ohos-emulator-test.sh" \
  180 \
  "$native_install_dir/lib/libmaplibre-native-c.so" \
  "$OHOS_SDK_NATIVE/llvm/lib/x86_64-linux-ohos/libc++_shared.so" \
  --test-threads=1 -- ${test_binaries[@]+"${test_binaries[@]}"}
'''

[tasks."test:download"]
description = "Test the sys crate against a downloaded native snapshot archive."
dir = "../.."
# Stops at maplibre-native-ffi-sys: only the build script's acquisition path is
# under test, and the crates above it stop compiling whenever the snapshot
# release lags a header change in this commit.
run = 'env -u MAPLIBRE_NATIVE_C_INSTALL_DIR cargo test -p maplibre-native-ffi-sys'
