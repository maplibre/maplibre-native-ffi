[tasks."test:download"]
description = "Test the sys crate against a downloaded native snapshot archive."
dir = "../.."
# Stops at maplibre-native-ffi-sys: only the build script's acquisition path is
# under test, and the crates above it stop compiling whenever the snapshot
# release lags a header change in this commit.
run = 'env -u MAPLIBRE_NATIVE_C_INSTALL_DIR cargo test -p maplibre-native-ffi-sys'
