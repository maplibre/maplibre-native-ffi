[tasks.build]
extends = "ffi:preset"
dir = "../.."
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export MAPLIBRE_NATIVE_FFI_LOCAL_BUILD="$native_install_dir"

# A host build lets cargo pick its own target and toolchain. Cross builds name
# the target and point every tool that compiles or links at the platform SDK.
source "$MISE_MONOREPO_ROOT/scripts/rust-cross-env.sh" "$usage_preset"
if [[ -n "$cargo_target" ]]; then
  cargo build \
    -p maplibre-native-ffi-sys \
    -p maplibre-native-ffi-core \
    -p maplibre-native-ffi \
    --target "$cargo_target"
  exit 0
fi
exec cargo build \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi
'''

[tasks.test]
usage = '''
arg "[preset]" default="{{vars.host_native_preset}}"
arg "[profile]" default="dev" {
  choices "dev" "release"
}
'''
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
# The preset selects the runner: Android presets and OpenHarmony x64 presets
# push to an emulator, Emscripten presets run as a page in headless Chromium,
# and host presets run in process.
run = '''
case "$usage_preset" in
  android-* | ohos-*)
    exec "$MISE_MONOREPO_ROOT/scripts/test-rust-device.sh" "$usage_preset"
    ;;
  emscripten-*)
    exec "$MISE_MONOREPO_ROOT/scripts/test-rust-browser.sh" "$usage_preset"
    ;;
  ios-*)
    echo "The Rust binding has no iOS target; test a host, Android, OpenHarmony x64, or Emscripten preset." >&2
    exit 2
    ;;
esac

native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export MAPLIBRE_NATIVE_FFI_LOCAL_BUILD="$native_install_dir"
if [[ "$usage_preset" == linux-musl-* ]]; then
  # Rendering loads Alpine's graphics implementation, so the test process uses
  # musl's dynamic loader while the packaged native archive remains static.
  export MLN_FFI_RUST_MUSL_DYNAMIC=1
fi
source "$MISE_MONOREPO_ROOT/scripts/rust-cross-env.sh" "$usage_preset"
cargo_args=()
if [[ -n "$cargo_target" ]]; then
  cargo_args+=(--target "$cargo_target")
fi
if [[ "$usage_profile" == "release" ]]; then
  cargo_args+=(--release)
fi
# The sys crate's rpath covers only its own link targets, so the core and
# umbrella test binaries need the library located at run time. Resolving it here
# rather than through RUSTFLAGS keeps the preset out of the compiler command
# line, which sccache keys on.
lib_dirs="$native_install_dir/lib"
if [[ -n "${MLN_FFI_VULKAN_LOADER_DIR:-}" ]]; then
  lib_dirs="$lib_dirs:$MLN_FFI_VULKAN_LOADER_DIR"
fi
export LD_LIBRARY_PATH="$lib_dirs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
export DYLD_LIBRARY_PATH="$lib_dirs${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
# Tests run in parallel: the ones that change process-global state serialize
# on a lock of their own.
cargo test "${cargo_args[@]}" \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi
# Clippy is profile-independent. Every other host preset runs it against the
# dev graph, so the release variant avoids compiling that graph a second time.
if [[ "$usage_profile" == "dev" ]]; then
  clippy_args=()
  if [[ -n "$cargo_target" ]]; then
    clippy_args+=(--target "$cargo_target")
  fi
  cargo clippy \
    -p maplibre-native-ffi-sys \
    -p maplibre-native-ffi-core \
    -p maplibre-native-ffi \
    "${clippy_args[@]}" --all-targets -- -D warnings
fi
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
export MAPLIBRE_NATIVE_FFI_LOCAL_BUILD="$native_install_dir"
cargo_args=()
if [[ "$usage_profile" == "release" ]]; then
  cargo_args+=(--release)
fi
cargo test "${cargo_args[@]}" \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi
if [[ "$usage_profile" == "dev" ]]; then
  cargo clippy \
    -p maplibre-native-ffi-sys \
    -p maplibre-native-ffi-core \
    -p maplibre-native-ffi \
    --all-targets -- -D warnings
fi
'''

[tasks.prepare-release]
description = "Pin a release's native archives in the sys crate and stamp the crate versions, before publishing."
usage = 'arg "<tag>" help="The release tag, such as v0.202610.2"'
dir = "../.."
run = 'python3 ci/rust_release.py . "$usage_tag"'

[tasks."test:package"]
description = "Package the crates as a release prepares them, and test the sys crate against this build's native archive."
dir = "../.."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
# Tests the packaged sys crate alone: the crates above it add nothing to how the
# native library arrives.
run = '''
set -euo pipefail
archive="$MISE_MONOREPO_ROOT/build/packages/native/dist/maplibre-native-c-$usage_preset.tar.gz"
tag=v0.202601.0
scratch="$(mktemp -d)"
trap 'rm -rf "$scratch"' EXIT

# A copy of the workspace stands in for the release checkout, which the release
# prepares in place. The workspace patches crates.io from build/dependencies.
workspace="$scratch/workspace"
mkdir -p "$workspace/build"
git ls-files -z --cached --others --exclude-standard -- \
  Cargo.toml Cargo.lock LICENSE bindings/python bindings/rust examples/rust-map src/platform/rust |
  tar -c --null -T - | tar -x -C "$workspace"
ln -s "$MISE_MONOREPO_ROOT/build/dependencies" "$workspace/build/dependencies"
printf '%s  %s\n' "$(shasum -a 256 "$archive" | cut -d ' ' -f 1)" "$(basename "$archive")" \
  >"$scratch/SHA256SUMS"
python3 ci/rust_release.py "$workspace" "$tag" --checksums "$scratch/SHA256SUMS"
cargo package --manifest-path "$workspace/Cargo.toml" --no-verify \
  --target-dir "$scratch/target" \
  -p maplibre-native-ffi-sys \
  -p maplibre-native-ffi-core \
  -p maplibre-native-ffi

package="$scratch/maplibre-native-ffi-sys"
mkdir "$package"
tar -xzf "$scratch/target/package/maplibre-native-ffi-sys-${tag#v}.crate" -C "$package" --strip-components 1
# An empty cache makes the build script download the archive.
python3 ci/native_download_fixture.py "$archive" "$tag" -- \
  env -u MAPLIBRE_NATIVE_FFI_LOCAL_BUILD XDG_CACHE_HOME="$scratch/cache" \
  cargo test --locked --manifest-path "$package/Cargo.toml" --target-dir "$MISE_MONOREPO_ROOT/target"
'''
