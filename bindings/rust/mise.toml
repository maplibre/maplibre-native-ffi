[env]
MLN_FFI_REPO_ROOT = "{{config_root}}/../.."
MLN_FFI_CARGO_MANIFEST = "{{env.MLN_FFI_REPO_ROOT}}/Cargo.toml"

[tasks.build]
depends = ["//:ensure-native-library"]
run = "bash scripts/with-libclang.sh cargo build --manifest-path \"$MLN_FFI_CARGO_MANIFEST\" -p maplibre-native-sys -p maplibre-native-core -p maplibre-native"

[tasks.test]
depends = ["//:ensure-native-library"]
run = '''
extra_args=()
# EGL surfaceless (Mesa llvmpipe) doesn't handle concurrent contexts across
# threads reliably; run tests single-threaded for the OpenGL backend.
if [[ "${MLN_FFI_RENDER_BACKEND:-}" == "opengl" ]]; then
  extra_args=(-- --test-threads 1)
fi
bash scripts/with-libclang.sh cargo test --manifest-path "$MLN_FFI_CARGO_MANIFEST" -p maplibre-native-sys -p maplibre-native-core -p maplibre-native "${extra_args[@]}"
'''

[tasks.ci]
depends = [":test"]
run = "bash scripts/with-libclang.sh cargo clippy --manifest-path \"$MLN_FFI_CARGO_MANIFEST\" -p maplibre-native-sys -p maplibre-native-core -p maplibre-native --all-targets -- -D warnings"
