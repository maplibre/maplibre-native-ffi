[package]
name = "maplibre-native-ffi-python"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py314"]

[dependencies]
maplibre-native-ffi-core.workspace = true
maplibre-native-ffi-sys.workspace = true
pyo3 = { version = "0.29.0", features = ["multiple-pymethods"] }
