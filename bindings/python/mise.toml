[tasks.build-api]
description = "Build the API wheel, which holds the Python modules, into dist/."
run = '''
cp "$MISE_MONOREPO_ROOT/LICENSE" LICENSE
uv build --wheel --out-dir dist .
uv run --no-project --with wheel==0.47.0 python "$MISE_MONOREPO_ROOT/tools/release/python_release.py" embed-api dist
'''

[tasks.prepare-release]
description = "Version the API distribution and the runtime wheels built by CI."
usage = '''
arg "<version>" help="The release version, or a snapshot's <next release>.devSTAMP"
arg "<wheels>" help="Directory containing the runtime wheels from CI"
'''
run = 'uv run --no-project --with wheel==0.47.0 python "$MISE_MONOREPO_ROOT/tools/release/python_release.py" pack . "$usage_version" "$usage_wheels"'

[tasks._test-android]
hide = true
usage = 'arg "<preset>"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
tools = { "core:java" = "temurin-21.0.11+10.0.LTS" }
run = '"$MISE_MONOREPO_ROOT/scripts/build-python-android-wheel.sh" "$usage_preset" --test'
