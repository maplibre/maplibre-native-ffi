# Produces the distributable wheel, so it optimizes and vendors: `--release`
# because the native library it wraps is built Release too, and an explicit
# `--auditwheel repair` because maturin only defaults to repairing on Linux,
# which would leave a macOS wheel pointing at the build machine's install tree.
[tasks.build]
extends = "ffi:preset"
run = '''
# Wheel repair rewrites the extension's dependency names in place. Recompile it
# so a previous wheel cannot feed those private names into the next repair.
cargo clean --package maplibre-native-ffi-python
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  uv run --project . --no-sync maturin build --release --auditwheel repair
'''

[tasks._install-extension]
description = "Build and install the Python extension for local tests."
hide = true
extends = "ffi:preset"
run = '''
# See `build`: repaired extension artifacts are outputs, never compiler inputs.
cargo clean --package maplibre-native-ffi-python
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  uv run --project . --no-sync maturin build --out dist
uv pip install --python "$MISE_MONOREPO_ROOT/.venv" --reinstall --no-index --find-links dist \
  "maplibre-native-ffi==0.0.0"
'''

[tasks.api]
description = "Generate pdoc HTML API reference for the Python binding."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = ":_install-extension", args = ["{{usage.preset}}"] }]
# Pass public submodules explicitly: package __all__ is a reexport list, so
# pdoc's walker would otherwise omit camera/geo/style/offline/etc. pages.
run = '''
rm -rf build/pdoc
mkdir -p build/pdoc
modules="$(
  MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
    uv run --project . --group docs --no-sync python -c '
import maplibre_native_ffi
import pkgutil

names = ["maplibre_native_ffi"]
for module in pkgutil.iter_modules(maplibre_native_ffi.__path__):
  if not module.name.startswith("_"):
    names.append(f"maplibre_native_ffi.{module.name}")
print(" ".join(names))
'
)"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  uv run --project . --group docs --no-sync \
  pdoc $modules -o build/pdoc
'''
run_windows = '''
rm -rf build/pdoc
mkdir -p build/pdoc
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
modules="$(
  MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
    uv run --project . --group docs --no-sync python -c '
import maplibre_native_ffi
import pkgutil

names = ["maplibre_native_ffi"]
for module in pkgutil.iter_modules(maplibre_native_ffi.__path__):
  if not module.name.startswith("_"):
    names.append(f"maplibre_native_ffi.{module.name}")
print(" ".join(names))
'
)"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
  uv run --project . --group docs --no-sync \
  pdoc $modules -o build/pdoc
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = ":_install-extension", args = ["{{usage.preset}}"] }]
run = '''
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  uv run --project . --no-sync python -m pytest
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
  uv run --project . --no-sync python -m pytest
'''
