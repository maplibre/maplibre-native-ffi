[tasks.build]
usage = 'arg "[target]" default="{{vars.host_native_target}}"'
depends = [{ task = "//:build", args = ["{{usage.target}}"] }]
run = '''
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_target/install" \
  uv run --project . --no-sync maturin build --auditwheel skip
'''

[tasks._install-extension]
description = "Build and install the Python extension for local tests."
hide = true
usage = 'arg "[target]" default="{{vars.host_native_target}}"'
depends = [{ task = "//:build", args = ["{{usage.target}}"] }]
run = '''
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_target/install" \
  uv run --project . --no-sync maturin build --out dist --auditwheel skip
uv pip install --python "$MISE_MONOREPO_ROOT/.venv" --reinstall --no-index --find-links dist \
  "maplibre-native==0.0.0"
'''

[tasks.test]
usage = 'arg "[target]" default="{{vars.host_native_target}}"'
depends = [{ task = ":_install-extension", args = ["{{usage.target}}"] }]
run = '''
MAPLIBRE_NATIVE_C_INSTALL_DIR="$MISE_MONOREPO_ROOT/build/$usage_target/install" \
  uv run --project . --no-sync python -m pytest
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_target/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
MAPLIBRE_NATIVE_C_INSTALL_DIR="$native_install_dir" \
  uv run --project . --no-sync python -m pytest
'''
