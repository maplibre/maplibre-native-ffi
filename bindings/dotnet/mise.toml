[tools]
"core:dotnet" = "{{vars.dotnet_version}}"

[deps.dotnet-tools]
auto = true
dir = "../.."
sources = [
  ".config/dotnet-tools.json",
  "bindings/dotnet/.config/dotnet-tools.json",
]
# Dependency providers run through the platform shell, so both manifests restore
# from one `&&` line that `sh` and `cmd` each understand.
run = "dotnet tool restore --tool-manifest .config/dotnet-tools.json --verbosity quiet && dotnet tool restore --tool-manifest bindings/dotnet/.config/dotnet-tools.json --verbosity quiet"

[tasks.generate]
run = "scripts/generate-clangsharp.sh"

[tasks.generate-check]
run = "scripts/generate-clangsharp.sh --check"

[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [
  { task = "//:build", args = ["{{usage.preset}}"] },
  { task = "generate-check" },
]
# Visual Studio exports Platform=x64 on Windows; the .NET solution uses Any CPU.
dir = "../.."
run = '''
MaplibreNativeCInstallDir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  dotnet build \
    Maplibre.Native.slnx \
    -p:Platform="Any CPU"
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
MaplibreNativeCInstallDir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  dotnet test \
    bindings/dotnet/tests/Maplibre.Native.Tests/Maplibre.Native.Tests.csproj \
    -p:Platform="Any CPU"
'''
