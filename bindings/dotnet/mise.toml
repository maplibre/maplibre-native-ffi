[tools]
"core:dotnet" = "{{vars.dotnet_version}}"

[deps.dotnet-tools]
auto = true
dir = "../.."
sources = ["dotnet-tools.json", "bindings/dotnet/dotnet-tools.json"]
# Dependency providers run through the platform shell, so both manifests restore
# from one `&&` line that `sh` and `cmd` each understand.
run = "dotnet tool restore --tool-manifest dotnet-tools.json --verbosity quiet && dotnet tool restore --tool-manifest bindings/dotnet/dotnet-tools.json --verbosity quiet"

[tasks.generate]
run = "scripts/generate-clangsharp.sh"

[tasks.build]
usage = 'arg "[target]" default="{{vars.host_native_target}}"'
depends = [{ task = "//:build", args = ["{{usage.target}}"] }]
# Visual Studio exports Platform=x64 on Windows; the .NET solution uses Any CPU.
dir = "../.."
run = '''
MaplibreNativeCInstallDir="$MISE_MONOREPO_ROOT/build/$usage_target/install" \
  dotnet build \
    Maplibre.Native.slnx \
    -p:Platform="Any CPU"
'''

[tasks.test]
usage = 'arg "[target]" default="{{vars.host_native_target}}"'
depends = [{ task = "//:build", args = ["{{usage.target}}"] }]
dir = "../.."
run = '''
MaplibreNativeCInstallDir="$MISE_MONOREPO_ROOT/build/$usage_target/install" \
  dotnet test \
    bindings/dotnet/tests/Maplibre.Native.Tests/Maplibre.Native.Tests.csproj \
    -p:Platform="Any CPU"
'''
