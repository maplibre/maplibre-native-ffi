[tasks.generate]
run = "scripts/generate-clangsharp.sh"

[tasks.build]
# Visual Studio exports Platform=x64 on Windows; the .NET solution uses Any CPU.
run = 'dotnet build Maplibre.Native.slnx -p:Platform="Any CPU"'

[tasks.test]
depends = ["//:ensure-native-library"]
run = 'dotnet test Maplibre.Native.slnx -p:Platform="Any CPU"'

[tasks.format]
run = 'Platform="Any CPU" dotnet format Maplibre.Native.slnx --verify-no-changes --verbosity minimal'

[tasks.ci]
depends = [":format", ":test"]
