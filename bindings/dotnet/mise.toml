[tools]
"core:dotnet" = "{{vars.dotnet_version}}"

[tasks.api]
description = "Generate DocFX HTML API reference for the .NET binding."
run = '''
rm -rf build/docfx build/docfx-api
mkdir -p build
(
  cd docfx
  dotnet tool restore --verbosity quiet
  dotnet tool run docfx docfx.json
)
'''

[tasks.build]
extends = "ffi:preset"
# Visual Studio exports Platform=x64 on Windows; the .NET solution uses Any CPU.
# Release exercises the JIT lifetime rules that shipped applications use. The
# Debug JIT keeps locals alive for the debugger and can hide a missing
# GC.KeepAlive around a native call.
dir = "../.."
run = '''
case "$usage_preset" in
  ios-* | tvos-*)
    echo "The .NET binding has no iOS or tvOS target." >&2
    exit 2
    ;;
esac
MaplibreNativeCInstallDir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  dotnet build \
    Maplibre.NativeFfi.slnx \
    -c Release \
    -p:Platform="Any CPU" \
    -p:BaseOutputPath="$MISE_MONOREPO_ROOT/build/dotnet/$usage_preset/"
'''

[tasks.test]
extends = "ffi:preset"
dir = "../.."
run = '''
case "$usage_preset" in
  ios-* | tvos-*)
    echo "The .NET binding has no iOS or tvOS target." >&2
    exit 2
    ;;
esac
if [[ "$usage_preset" == linux-musl-* ]]; then
  exec python3 ci/dotnet_release.py smoke-musl "$usage_preset"
fi

MaplibreNativeCInstallDir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  dotnet test \
    --project bindings/dotnet/tests/Maplibre.NativeFfi.Tests/Maplibre.NativeFfi.Tests.csproj \
    -c Release \
    -p:Platform="Any CPU" \
    -p:BaseOutputPath="$MISE_MONOREPO_ROOT/build/dotnet/$usage_preset/"
'''
