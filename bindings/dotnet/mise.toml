[tools]
"core:dotnet" = "{{vars.dotnet_version}}"

[deps.dotnet-tools]
auto = true
dir = "../.."
sources = [
  ".config/dotnet-tools.json",
  "bindings/dotnet/.config/dotnet-tools.json",
]
# Dependency providers run through the platform shell, so both manifests restore
# from one `&&` line that `sh` and `cmd` each understand.
run = "dotnet tool restore --tool-manifest .config/dotnet-tools.json --verbosity quiet && dotnet tool restore --tool-manifest bindings/dotnet/.config/dotnet-tools.json --verbosity quiet"

[tasks.generate]
run = "python scripts/generate-clangsharp.py"

[tasks.api]
description = "Generate DocFX HTML API reference for the .NET binding."
# DocFX lives in a separate tool manifest from ClangSharp: restoring both in one
# manifest hits a .NET SDK bug that reports DocFX's commands as ClangSharp's.
run = '''
rm -rf build/docfx build/docfx-api
mkdir -p build
(
  cd docfx
  dotnet tool restore --verbosity quiet
  dotnet tool run docfx docfx.json
)
'''

[tasks.build]
extends = "ffi:preset"
# Visual Studio exports Platform=x64 on Windows; the .NET solution uses Any CPU.
# Release exercises the JIT lifetime rules that shipped applications use. The
# Debug JIT keeps locals alive for the debugger and can hide a missing
# GC.KeepAlive around a native call.
dir = "../.."
run = '''
MaplibreNativeCInstallDir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  dotnet build \
    Maplibre.NativeFfi.slnx \
    -c Release \
    -p:Platform="Any CPU"
'''

[tasks.test]
extends = "ffi:preset"
dir = "../.."
run = '''
if [[ "$usage_preset" == linux-musl-* ]]; then
  version=0.0.0-musl-ci
  case "$usage_preset" in
    linux-musl-x64-*) rid=linux-musl-x64 ;;
    linux-musl-arm64-*) rid=linux-musl-arm64 ;;
  esac
  case "$usage_preset" in
    *-egl) backend=OpenGL ;;
    *-vulkan) backend=Vulkan ;;
  esac

  work_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/dotnet-musl-test"
  packages_dir="$work_dir/packages"
  assets_dir="$work_dir/assets/$rid/native"
  publish_dir="$work_dir/publish"
  rm -rf "$work_dir"
  mkdir -p "$packages_dir" "$assets_dir"
  cp "$MISE_MONOREPO_ROOT/build/$usage_preset/install/lib/"*.so* "$assets_dir/"
  cp -R "$MISE_MONOREPO_ROOT/build/$usage_preset/install/share/maplibre-native-c/licenses" "$assets_dir/"

  dotnet pack \
    bindings/dotnet/src/Maplibre.NativeFfi/Maplibre.NativeFfi.csproj \
    -c Release \
    -o "$packages_dir" \
    -p:PackageVersion="$version"
  dotnet pack \
    bindings/dotnet/src/Maplibre.NativeFfi.Runtime/Maplibre.NativeFfi.Runtime.csproj \
    -c Release \
    -o "$packages_dir" \
    -p:PackageVersion="$version" \
    -p:RenderBackend="$backend" \
    -p:NativeAssetsDir="$work_dir/assets"
  dotnet publish \
    bindings/dotnet/tests/Maplibre.NativeFfi.PackageSmoke/Maplibre.NativeFfi.PackageSmoke.csproj \
    -c Release \
    -r "$rid" \
    --no-self-contained \
    -o "$publish_dir" \
    --source "$packages_dir" \
    --source https://api.nuget.org/v3/index.json \
    -p:MaplibreNativeFfiPackageVersion="$version" \
    -p:MaplibreNativeFfiRenderBackend="$backend"
  MLN_FFI_MUSL_TEST_IMAGE=mcr.microsoft.com/dotnet/runtime:10.0-alpine3.22 \
    exec "$MISE_MONOREPO_ROOT/scripts/run-musl-test.sh" \
    "$usage_preset" \
    dotnet \
    "$publish_dir/Maplibre.NativeFfi.PackageSmoke.dll"
fi

MaplibreNativeCInstallDir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  dotnet test \
    --project bindings/dotnet/tests/Maplibre.NativeFfi.Tests/Maplibre.NativeFfi.Tests.csproj \
    -c Release \
    -p:Platform="Any CPU"
'''
