[tools]
"core:swift" = { version = "6.4.1", os = ["linux/x64", "linux/arm64"] }
# Carries the libxml2.so.2 the Swift toolchain links, for distros that ship only
# libxml2.so.16. .mise/bin/swift-libxml2-env.sh puts it on the loader path and
# explains why; the tasks below source it.
"conda:libxml2" = { version = "2.13.9", os = ["linux/x64", "linux/arm64"] }

# The manifest adds the DocC plugin only under this variable, so consumers
# don't resolve it. Every task here sets it, so the repository's
# Package.resolved keeps the plugin's pins.
[env]
MLN_FFI_SWIFT_DOCC = "1"

# The manifest lives at the repository root, so SwiftPM runs from there.
[tasks.api]
description = "Generate DocC HTML API reference for the Swift binding."
dir = "../.."
extends = "ffi:preset"
run = '''
source "$MISE_MONOREPO_ROOT/scripts/native-env.sh" "$usage_preset"
source "$MISE_MONOREPO_ROOT/.mise/bin/swift-libxml2-env.sh"
rm -rf build/docc
mkdir -p build
swift_args=(--scratch-path ".build/$usage_preset")
# Swift Build, SwiftPM's default build system since 6.4, intermittently
# segfaults on Linux while planning a build. Drop this once
# https://github.com/swiftlang/swift-build/issues/1786 is fixed.
case "$usage_preset" in linux-*) swift_args+=(--build-system native) ;; esac
swift package "${swift_args[@]}" \
  --allow-writing-to-directory build/docc \
  generate-documentation \
  --target MaplibreNativeFFI \
  --output-path build/docc \
  --transform-for-static-hosting \
  --hosting-base-path maplibre-native-ffi/reference/swift
'''

[tasks.build]
dir = "../.."
extends = "ffi:preset"
run = '''
source "$MISE_MONOREPO_ROOT/scripts/native-env.sh" "$usage_preset"
source "$MISE_MONOREPO_ROOT/.mise/bin/swift-libxml2-env.sh"
case "$usage_preset" in
  ios-arm64-metal)
    exec swift build \
      --product MaplibreNativeFFI \
      --scratch-path .build/ios \
      --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
      --triple arm64-apple-ios15.0
    ;;
  tvos-arm64-metal)
    exec swift build \
      --product MaplibreNativeFFI \
      --scratch-path .build/tvos \
      --sdk "$(xcrun --sdk appletvos --show-sdk-path)" \
      --triple arm64-apple-tvos15.0
    ;;
  visionos-arm64-metal)
    # SwiftPM's native build system does not recognize visionOS triples.
    exec xcodebuild -quiet \
      -scheme MaplibreNativeFFI \
      -sdk xros -destination 'generic/platform=visionOS' \
      -derivedDataPath .build/visionos -configuration Debug \
      ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
      "HEADER_SEARCH_PATHS=\$(inherited) \"$native_install_dir/include\"" \
      "LIBRARY_SEARCH_PATHS=\$(inherited) \"$native_install_dir/lib\"" \
      'OTHER_LDFLAGS=$(inherited) -lmaplibre-native-c' build
    ;;
  ios-maccatalyst-*)
    # A product build also compiles the DocC plugin's dependencies, whose
    # manifests leave SwiftPM a Catalyst floor the compiler rejects.
    exec swift build \
      --target MaplibreNativeFFI \
      --scratch-path ".build/$usage_preset" \
      --sdk "$(xcrun --sdk macosx --show-sdk-path)" \
      --triple arm64-apple-ios15.0-macabi
    ;;
  ios-*)
    echo "The Swift binding builds for an iOS device with ios-arm64-metal; simulator coverage comes from //bindings/swift:test." >&2
    exit 2
    ;;
  tvos-*)
    echo "The Swift binding builds for a tvOS device with tvos-arm64-metal; simulator coverage comes from //bindings/swift:test." >&2
    exit 2
    ;;
  visionos-*)
    echo "The Swift binding builds for a visionOS device with visionos-arm64-metal; simulator coverage comes from //bindings/swift:test." >&2
    exit 2
    ;;
esac
swift_args=(--scratch-path ".build/$usage_preset")
swift_args+=(-Xlinker -rpath -Xlinker "$native_install_dir/lib")
# Swift Build crashes on Linux; see the api task.
case "$usage_preset" in linux-*) swift_args+=(--build-system native) ;; esac
swift build --target MaplibreNativeFFI "${swift_args[@]}"
'''

[tasks.resolve]
description = "Fetch the Swift package dependencies into the shared SwiftPM cache."
dir = "../.."
# Each build and test task resolves into its own scratch path. After this task,
# those resolutions copy from the shared cache without reaching the network, so
# CI can tell a fetch failure from a build or test failure.
run = '''
source "$MISE_MONOREPO_ROOT/.mise/bin/swift-libxml2-env.sh"
swift package resolve
'''

[tasks.test]
dir = "../.."
usage = '''
arg "[preset]" default="{{vars.host_native_preset}}"
arg "[configuration]" default="debug" {
  choices "debug" "release"
}
'''
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
# The preset selects the runner: an iOS or tvOS simulator preset builds the test
# bundle and spawns it on a simulator, a Mac Catalyst preset builds the same
# executable and runs it on the host, and host presets run in process.
run = '''
source "$MISE_MONOREPO_ROOT/scripts/native-env.sh" "$usage_preset"
source "$MISE_MONOREPO_ROOT/.mise/bin/swift-libxml2-env.sh"
case "$usage_preset" in
  ios-simulator-*)
    if [[ "$usage_configuration" != "debug" ]]; then
      echo "Swift release tests currently run on host presets only." >&2
      exit 2
    fi
    swift build \
      --product MaplibreNativeFFIIOSSimulatorTests \
      --scratch-path .build/ios-simulator \
      --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
      --triple arm64-apple-ios15.0-simulator \
      -Xswiftc -enable-testing \
      -Xlinker -rpath \
      -Xlinker "$native_install_dir/lib" \
      -Xlinker -rpath \
      -Xlinker "$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer/Library/Frameworks"
    mise run //:ios-simulator:boot
    exec "$MISE_MONOREPO_ROOT/scripts/run-ios-simulator-test.sh" \
      .build/ios-simulator/arm64-apple-ios-simulator/debug/MaplibreNativeFFIIOSSimulatorTests \
      120
    ;;
  tvos-simulator-*)
    if [[ "$usage_configuration" != "debug" ]]; then
      echo "Swift release tests currently run on host presets only." >&2
      exit 2
    fi
    swift build \
      --product MaplibreNativeFFIIOSSimulatorTests \
      --scratch-path .build/tvos-simulator \
      --sdk "$(xcrun --sdk appletvsimulator --show-sdk-path)" \
      --triple arm64-apple-tvos15.0-simulator \
      -Xswiftc -enable-testing \
      -Xlinker -rpath \
      -Xlinker "$native_install_dir/lib" \
      -Xlinker -rpath \
      -Xlinker "$(xcode-select -p)/Platforms/AppleTVSimulator.platform/Developer/Library/Frameworks"
    mise run //:tvos-simulator:boot
    export MLN_FFI_SIMULATOR_RUNTIME=tvOS
    exec "$MISE_MONOREPO_ROOT/scripts/run-ios-simulator-test.sh" \
      .build/tvos-simulator/arm64-apple-tvos-simulator/debug/MaplibreNativeFFIIOSSimulatorTests \
      120
    ;;
  visionos-simulator-*)
    if [[ "$usage_configuration" != "debug" ]]; then
      echo "Swift release tests currently run on host presets only." >&2
      exit 2
    fi
    # Xcode recognizes visionOS and supplies its Swift Testing framework.
    xcodebuild -quiet \
      -scheme MaplibreNativeFFIIOSSimulatorTests \
      -sdk xrsimulator -destination 'generic/platform=visionOS Simulator' \
      -derivedDataPath .build/visionos-simulator -configuration Debug \
      ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
      "HEADER_SEARCH_PATHS=\$(inherited) \"$native_install_dir/include\"" \
      "LIBRARY_SEARCH_PATHS=\$(inherited) \"$native_install_dir/lib\"" \
      'OTHER_LDFLAGS=$(inherited) -lmaplibre-native-c' \
      "LD_RUNPATH_SEARCH_PATHS=\$(inherited) \"$native_install_dir/lib\" \"$(xcode-select -p)/Platforms/XRSimulator.platform/Developer/Library/Frameworks\"" \
      build
    mise run //:visionos-simulator:boot
    export MLN_FFI_SIMULATOR_RUNTIME=visionOS
    exec "$MISE_MONOREPO_ROOT/scripts/run-ios-simulator-test.sh" \
      .build/visionos-simulator/Build/Products/Debug-xrsimulator/MaplibreNativeFFIIOSSimulatorTests \
      120
    ;;
  ios-maccatalyst-*)
    # swift test loads the bundle into a macOS helper, which rejects a
    # Catalyst image.
    swift build \
      --product MaplibreNativeFFIIOSSimulatorTests \
      --scratch-path ".build/$usage_preset" \
      -c "$usage_configuration" \
      --sdk "$(xcrun --sdk macosx --show-sdk-path)" \
      --triple arm64-apple-ios15.0-macabi \
      -Xswiftc -enable-testing \
      -Xlinker -rpath \
      -Xlinker "$native_install_dir/lib" \
      -Xlinker -rpath \
      -Xlinker "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/Library/Frameworks"
    exec ".build/$usage_preset/arm64-apple-ios-macabi/$usage_configuration/MaplibreNativeFFIIOSSimulatorTests"
    ;;
  ios-* | tvos-* | visionos-*)
    echo "The Swift binding tests need a runnable target; test an ios-simulator, tvos-simulator, visionos-simulator, or ios-maccatalyst preset instead of $usage_preset." >&2
    exit 2
    ;;
esac
swift_args=(--scratch-path ".build/$usage_preset" -c "$usage_configuration")
swift_args+=(-Xlinker -rpath -Xlinker "$native_install_dir/lib")
# Swift Build crashes on Linux; see the api task.
case "$usage_preset" in linux-*) swift_args+=(--build-system native) ;; esac
if [[ "$usage_configuration" == "release" ]]; then
  # The suite uses @testable import. Keep testing enabled while leaving the
  # optimizer on so ARC lifetime behavior matches a release consumer.
  swift_args+=(-Xswiftc -enable-testing)
fi
# A crashing test process otherwise reports only its signal, and swift-testing
# prints out of order, so nothing names the test or frame that crashed.
export SWIFT_BACKTRACE="${SWIFT_BACKTRACE:-enable=yes,interactive=no}"
swift test "${swift_args[@]}"
swift package describe --type json >/dev/null
'''
