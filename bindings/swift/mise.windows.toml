# core:swift resolves Windows releases but cannot install the executable yet.
# Run the official installer into mise's own prefix instead.
[tools."http:swift-windows"]
version = "{{vars.swift_version}}"
bin = "swift-installer.exe"
bin_path = "Toolchains/{{ version }}+Asserts/usr/bin"
postinstall = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{{config_root}}/../../tools/deps/install-swift-windows.ps1"'

[tools."http:swift-windows".platforms]
windows-x64 = { url = "https://download.swift.org/swift-{{ version }}-release/windows10/swift-{{ version }}-RELEASE/swift-{{ version }}-RELEASE-windows10.exe", checksum = "sha256:8fe5d31ca1153dfe6be3a76de0b93347fd42a27599671e9f9ade23a3648e7184" }
windows-arm64 = { url = "https://download.swift.org/swift-{{ version }}-release/windows10-arm64/swift-{{ version }}-RELEASE/swift-{{ version }}-RELEASE-windows10-arm64.exe", checksum = "sha256:e4e5fdb6ca88b18ac430fbce3de35dd80e2249a84a484a02272d82d89f2c7969" }

[env]
SDKROOT = { value = "{% if 'http:swift-windows' in tools %}{{tools['http:swift-windows'].path}}/Platforms/{{vars.swift_version}}/Windows.platform/Developer/SDKs/Windows.sdk{% endif %}", tools = true }
_.path = { path = "{% if 'http:swift-windows' in tools %}{{tools['http:swift-windows'].path}}/Runtimes/{{vars.swift_version}}/usr/bin{% endif %}", tools = true }
