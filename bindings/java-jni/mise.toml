[tasks.build]
depends = ["//bindings/java-jni:native:build"]
run = "../../gradlew :bindings:java-jni:build --rerun-tasks -Dorg.maplibre.nativejni.tests.requireNative=true"

[tasks."native:build"]
depends = ["//:ensure-native-library"]
run = "../../gradlew :bindings:java-jni:copyJavaCppNative --rerun-tasks"

[tasks."test:native"]
description = "Run Java JNI tests with the JavaCPP bridge generated from the C ABI."
depends = ["//bindings/java-jni:native:build"]
run = "../../gradlew :bindings:java-jni:test --rerun-tasks -Dorg.maplibre.nativejni.tests.requireNative=true"

[tasks.check]
description = "Run Java JNI branch-readiness checks."
run = [
  { task = "native:build" },
  "cargo check -p maplibre-native-jni",
  "cargo test -p maplibre-native-jni",
  { task = "test:native" },
  "../../gradlew :bindings:java-jni:javadoc",
]
