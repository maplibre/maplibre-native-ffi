# The runtime carries no Kotlin API over its cinterop, so its shared native
# source sets never need commonized bindings. Commonizing them would run
# cinterop for every native target, so publishing the root module would need a
# native install for each one, not just for the targets being published.
kotlin.mpp.enableCInteropCommonization=false
kotlin.mpp.enableCInteropCommonization.nowarn=true
