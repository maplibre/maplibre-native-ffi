[tools]
"core:java" = "{{vars.java_version}}"
"aqua:facebook/ktfmt" = "{{vars.ktfmt_version}}"
"aqua:google/google-java-format" = "{{vars.google_java_format_version}}"

[tasks.generate]
description = "Regenerate the committed JVM FFM declarations with jextract."
dir = "../.."
run = "./gradlew :bindings:kotlin:generateJvmJextractBindings --rerun-tasks"

[tasks.api]
description = "Generate Dokka HTML API reference for the Kotlin binding."
dir = "../.."
run = '''
# Dokka configures every KMP target, including Android, so the SDK must exist.
compile_sdk="$(
  sed -n 's/^android-compileSdk = "\([0-9][0-9]*\)"/\1/p' gradle/libs.versions.toml | head -n1
)"
if [[ -z "$compile_sdk" ]]; then
  echo "Could not read android-compileSdk from gradle/libs.versions.toml" >&2
  exit 1
fi
if [[ -z "${ANDROID_HOME:-}" ]]; then
  echo "ANDROID_HOME is unset; point it at an Android SDK install." >&2
  exit 1
fi
platform_dir="$ANDROID_HOME/platforms/android-$compile_sdk"
if [[ ! -d "$platform_dir" ]]; then
  echo "Android SDK platform android-$compile_sdk is missing under $ANDROID_HOME." >&2
  echo "Install it (sdkmanager \"platforms;android-$compile_sdk\") and rerun." >&2
  exit 1
fi
./gradlew :bindings:kotlin:dokkaGeneratePublicationHtml
'''

[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
runtime_backend=
case "$usage_preset" in
  linux-x64-egl) kotlin_target=linuxX64; runtime_backend=opengl ;;
  linux-x64-vulkan) kotlin_target=linuxX64; runtime_backend=vulkan ;;
  macos-arm64-*) kotlin_target=macosArm64 ;;
  linux-arm64-*|windows-*) kotlin_target= ;;
  *)
    echo "Unsupported Kotlin build preset: $usage_preset" >&2
    exit 2
    ;;
esac
gradle_args=(-PmaplibreNativeCInstallDir="build/$usage_preset/install")
tasks=(:bindings:kotlin:jvmJar)
if [[ -n "$kotlin_target" ]]; then
  tasks+=(":bindings:kotlin:${kotlin_target}Klib")
fi
# The runtime KLIB embeds the backend-specific static archive, so it only
# builds for a preset whose backend has a matching runtime publication.
if [[ -n "$runtime_backend" ]]; then
  tasks+=(":bindings:kotlin-runtime-${runtime_backend}:${kotlin_target}Klib")
  gradle_args+=(
    "-Pmaplibre.runtime.${runtime_backend}.${kotlin_target}.installDir=build/$usage_preset/install"
  )
fi
./gradlew "${gradle_args[@]}" "${tasks[@]}"
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
case "$usage_preset" in
  linux-x64-*) kotlin_target=linuxX64 ;;
  macos-arm64-*) kotlin_target=macosArm64 ;;
  linux-arm64-*|windows-*) kotlin_target= ;;
  *)
    echo "Unsupported Kotlin test preset: $usage_preset" >&2
    exit 2
    ;;
esac
tasks=(:bindings:kotlin:jvmTest)
if [[ -n "$kotlin_target" ]]; then
  tasks+=(":bindings:kotlin:${kotlin_target}Test")
fi
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  "${tasks[@]}"
'''

[tasks."jvm-test"]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  :bindings:kotlin:jvmTest
'''

[tasks."native-test"]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
case "$usage_preset" in
  linux-x64-*) kotlin_target=linuxX64 ;;
  macos-arm64-*) kotlin_target=macosArm64 ;;
  linux-arm64-*|windows-*)
    echo "The Kotlin binding declares Kotlin/Native targets for Apple platforms and Linux x64, so preset $usage_preset has no Kotlin/Native tests to run. Use //bindings/kotlin:jvm-test here, and run this task on a Linux x64 or macOS host to cover nativeMain." >&2
    exit 2
    ;;
  *)
    echo "Unsupported Kotlin/Native test preset: $usage_preset" >&2
    exit 2
    ;;
esac
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  ":bindings:kotlin:${kotlin_target}Test"
'''

[tasks."ios-build"]
description = "Build the Kotlin binding and embedded Metal runtime for an iOS target."
usage = '''
arg "<preset>" {
  choices "ios-arm64-metal" "ios-simulator-arm64-metal"
}
'''
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
case "$usage_preset" in
  ios-arm64-metal) kotlin_target=iosArm64 ;;
  ios-simulator-arm64-metal) kotlin_target=iosSimulatorArm64 ;;
esac
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  -Pmaplibre.runtime.metal.$kotlin_target.installDir="build/$usage_preset/install" \
  ":bindings:kotlin:${kotlin_target}Klib" \
  ":bindings:kotlin-runtime-metal:${kotlin_target}Klib"
'''

[tasks."android-build"]
description = "Build the Kotlin Android binding."
usage = '''
arg "[backend]" default="opengl" {
  choices "opengl" "vulkan"
}
arg "[abis]" default="arm64-v8a,x86_64" {
  choices "arm64-v8a" "x86_64" "arm64-v8a,x86_64"
}
flag "--prebuilt" help="Use native packages installed under build/"
'''
dir = "../.."
run = '''
gradle_args=(
  -Pmaplibre.android.backend="$usage_backend"
  -Pmaplibre.android.abis="$usage_abis"
)
if [[ "$usage_prebuilt" == "true" ]]; then
  gradle_args+=(-Pmaplibre.android.prebuiltBuildRoot=build)
fi
./gradlew "${gradle_args[@]}" :bindings:kotlin:androidBuild
'''

[tasks."compile-android"]
description = "Type-check the Android binding without a native cross-compile."
dir = "../.."
run = "./gradlew :bindings:kotlin:compileAndroidMain"

[tasks.check-android-api-floor]
description = "Verify the Android binding stays on the android-minSdk floor."
dir = "../.."
run = "./gradlew :bindings:kotlin:checkAndroidApiFloor"
