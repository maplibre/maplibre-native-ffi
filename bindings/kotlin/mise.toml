[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '../../gradlew -PmaplibreNativeCInstallDir="../../build/$usage_preset/install" :bindings:kotlin:assemble'

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '../../gradlew -PmaplibreNativeCInstallDir="../../build/$usage_preset/install" :bindings:kotlin:check'

[tasks.jvmTest]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '../../gradlew -PmaplibreNativeCInstallDir="../../build/$usage_preset/install" :bindings:kotlin:jvmTest'

[tasks.nativeTest]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '../../gradlew -PmaplibreNativeCInstallDir="../../build/$usage_preset/install" :bindings:kotlin:nativeTest'

[tasks.androidBuild]
run = "../../gradlew :bindings:kotlin:androidBuild"
