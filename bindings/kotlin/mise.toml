[tools]
"core:java" = "{{vars.java_version}}"

[tasks.api]
description = "Generate Dokka HTML API reference for the Kotlin binding."
dir = "../.."
run = '''
# Dokka configures every KMP target, including Android, so the SDK must exist.
compile_sdk="$(
  sed -n 's/^android-compileSdk = "\([0-9][0-9]*\)"/\1/p' gradle/libs.versions.toml | head -n1
)"
if [[ -z "$compile_sdk" ]]; then
  echo "Could not read android-compileSdk from gradle/libs.versions.toml" >&2
  exit 1
fi
if [[ -z "${ANDROID_HOME:-}" ]]; then
  echo "ANDROID_HOME is unset; point it at an Android SDK install." >&2
  exit 1
fi
platform_dir="$ANDROID_HOME/platforms/android-$compile_sdk"
if [[ ! -d "$platform_dir" ]]; then
  echo "Android SDK platform android-$compile_sdk is missing under $ANDROID_HOME." >&2
  echo "Install it (sdkmanager \"platforms;android-$compile_sdk\") and rerun." >&2
  exit 1
fi
./gradlew :bindings:kotlin:dokkaGeneratePublicationHtml
'''

[tasks.build]
extends = "ffi:preset"
dir = "../.."
run = '''
runtime_backend=
tasks=()
case "$usage_preset" in
  android-arm-egl) kotlin_target=androidNativeArm32; runtime_backend=opengl ;;
  android-arm-vulkan) kotlin_target=androidNativeArm32; runtime_backend=vulkan ;;
  android-arm64-egl) kotlin_target=androidNativeArm64; runtime_backend=opengl ;;
  android-arm64-vulkan) kotlin_target=androidNativeArm64; runtime_backend=vulkan ;;
  android-x64-egl) kotlin_target=androidNativeX64; runtime_backend=opengl ;;
  android-x64-vulkan) kotlin_target=androidNativeX64; runtime_backend=vulkan ;;
  linux-gnu-x64-egl) kotlin_target=linuxX64; runtime_backend=opengl; tasks+=(:bindings:kotlin:jvmJar) ;;
  linux-gnu-x64-vulkan) kotlin_target=linuxX64; runtime_backend=vulkan; tasks+=(:bindings:kotlin:jvmJar) ;;
  linux-gnu-arm64-egl) kotlin_target=linuxArm64; runtime_backend=opengl; tasks+=(:bindings:kotlin:jvmJar) ;;
  linux-gnu-arm64-vulkan) kotlin_target=linuxArm64; runtime_backend=vulkan; tasks+=(:bindings:kotlin:jvmJar) ;;
  macos-arm64-*) kotlin_target=macosArm64; tasks+=(:bindings:kotlin:jvmJar) ;;
  windows-*) kotlin_target=; tasks+=(:bindings:kotlin:jvmJar) ;;
  *)
    echo "Unsupported Kotlin build preset: $usage_preset" >&2
    exit 2
    ;;
esac
gradle_args=(-PmaplibreNativeCInstallDir="build/$usage_preset/install")
# Kotlin/Native has no Linux arm64 host toolchain, so this target only builds
# through KLIB cross-compilation from a Linux x64 host.
if [[ "$kotlin_target" == "linuxArm64" ]]; then
  if [[ "$(uname -s)" != Linux || "$(uname -m)" != x86_64 ]]; then
    echo "Linux ARM64 Kotlin/Native KLIBs cross-compile from a Linux x64 host only." >&2
    exit 2
  fi
  gradle_args+=(-Pkotlin.native.enableKlibsCrossCompilation=true)
fi
if [[ -n "$kotlin_target" ]]; then
  tasks+=(":bindings:kotlin:${kotlin_target}Klib")
fi
# The runtime KLIB embeds the backend-specific static archive, so it only
# builds for a preset whose backend has a matching runtime publication.
if [[ -n "$runtime_backend" ]]; then
  tasks+=(":bindings:kotlin:runtimes:${runtime_backend}:${kotlin_target}Klib")
  gradle_args+=(
    "-Pmaplibre.runtime.${runtime_backend}.${kotlin_target}.installDir=build/$usage_preset/install"
  )
fi
./gradlew "${gradle_args[@]}" "${tasks[@]}"
'''

[tasks.test]
extends = "ffi:preset"
dir = "../.."
run = '''
case "$usage_preset" in
  linux-gnu-x64-* | macos-arm64-*) runtimes=(jvm native) ;;
  linux-gnu-arm64-* | windows-*) runtimes=(jvm) ;;
  android-*)
    exec "$MISE_MONOREPO_ROOT/scripts/test-kotlin-android-device.sh" "$usage_preset"
    ;;
  ios-simulator-arm64-metal) runtimes=(native) ;;
  tvos-simulator-arm64-metal) runtimes=(native) ;;
  ios-arm64-metal)
    echo "The Kotlin iOS tests need a runnable target; test ios-simulator-arm64-metal instead of $usage_preset." >&2
    exit 2
    ;;
  tvos-arm64-metal)
    echo "The Kotlin tvOS tests need a runnable target; test tvos-simulator-arm64-metal instead of $usage_preset." >&2
    exit 2
    ;;
  emscripten-wasm32-*) runtimes=(wasm) ;;
  *)
    echo "Unsupported Kotlin test preset: $usage_preset" >&2
    exit 2
    ;;
esac
for runtime in "${runtimes[@]}"; do
  mise run "//bindings/kotlin:test:$runtime" "$usage_preset"
done
'''

[tasks."test:jvm"]
extends = "ffi:preset"
dir = "../.."
run = '''
case "$usage_preset" in
  linux-* | macos-* | windows-*) ;;
  *)
    echo "The Kotlin/JVM suite tests host presets only, got: $usage_preset" >&2
    exit 2
    ;;
esac
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  :bindings:kotlin:jvmTest
'''

[tasks."test:native"]
extends = "ffi:preset"
dir = "../.."
run = '''
gradle_args=()
gradle_tasks=()
case "$usage_preset" in
  linux-gnu-x64-*) kotlin_target=linuxX64 ;;
  macos-arm64-*) kotlin_target=macosArm64 ;;
  android-*)
    echo "The Kotlin/Native Android targets are build-only; use //bindings/kotlin:build with $usage_preset." >&2
    exit 2
    ;;
  ios-simulator-arm64-metal)
    kotlin_target=iosSimulatorArm64
    gradle_args+=(
      "-Pmaplibre.runtime.metal.$kotlin_target.installDir=build/$usage_preset/install"
    )
    gradle_tasks+=(":bindings:kotlin:runtimes:metal:${kotlin_target}Klib")
    mise run //:ios-simulator:boot
    export MLN_FFI_IOS_SIMULATOR_DEVICE_ID=$(
      "$MISE_MONOREPO_ROOT/scripts/apple-simulator.sh" find-booted iOS
    )
    if [[ -z "$MLN_FFI_IOS_SIMULATOR_DEVICE_ID" ]]; then
      echo "No booted iOS simulator device found." >&2
      exit 2
    fi
    ;;
  tvos-simulator-arm64-metal)
    kotlin_target=tvosSimulatorArm64
    gradle_args+=(
      "-Pmaplibre.runtime.metal.$kotlin_target.installDir=build/$usage_preset/install"
    )
    gradle_tasks+=(":bindings:kotlin:runtimes:metal:${kotlin_target}Klib")
    mise run //:tvos-simulator:boot
    export MLN_FFI_IOS_SIMULATOR_DEVICE_ID=$(
      "$MISE_MONOREPO_ROOT/scripts/apple-simulator.sh" find-booted tvOS
    )
    if [[ -z "$MLN_FFI_IOS_SIMULATOR_DEVICE_ID" ]]; then
      echo "No booted tvOS simulator device found." >&2
      exit 2
    fi
    ;;
  ios-arm64-metal)
    echo "The Kotlin iOS tests need a runnable target; test ios-simulator-arm64-metal instead of $usage_preset." >&2
    exit 2
    ;;
  tvos-arm64-metal)
    echo "The Kotlin tvOS tests need a runnable target; test tvos-simulator-arm64-metal instead of $usage_preset." >&2
    exit 2
    ;;
  *)
    echo "The Kotlin binding has no runnable Kotlin/Native tests for preset $usage_preset." >&2
    exit 2
    ;;
esac
gradle_args+=("-PmaplibreNativeCInstallDir=build/$usage_preset/install")
gradle_tasks+=(":bindings:kotlin:${kotlin_target}Test")
./gradlew \
  "${gradle_args[@]}" \
  "${gradle_tasks[@]}"
'''

[tasks.wasm-module]
description = "Link the Kotlin/Wasm browser module against an Emscripten preset's archive."
extends = "ffi:preset"
dir = "wasm"
run = '''
case "$usage_preset" in
  emscripten-*) ;;
  *)
    echo "The Kotlin/Wasm module links an Emscripten preset, got: $usage_preset" >&2
    exit 2
    ;;
esac
cmake --workflow --preset "$usage_preset"
'''

[tasks."test:wasm"]
description = "Run the Kotlin/Wasm suite in headless Chromium against an Emscripten preset's module."
usage = '''
arg "<preset>"
flag "--filter <filter>" help="Run only the tests that match this Gradle test filter"
'''
dir = "../.."
# The preset is checked before the module links, so a refusal names its reason
# even where that preset has no native build.
run = '''
case "$usage_preset" in
  emscripten-wasm32-webgl) render_backend=webgl ;;
  emscripten-wasm32-webgpu) render_backend=webgpu ;;
  *)
    echo "The Kotlin/Wasm suite tests the emscripten-wasm32 presets, got: $usage_preset" >&2
    exit 2
    ;;
esac
mise run //bindings/kotlin:wasm-module "$usage_preset"
gradle_args=(
  -Pmaplibre.wasm.moduleDir="bindings/kotlin/wasm/build/$usage_preset/install"
  -Pmaplibre.wasm.renderBackend="$render_backend"
  -Pmaplibre.wasm.chromium="$(node scripts/find-chromium.mjs)"
)
test_args=()
if [[ -n "${usage_filter:-}" ]]; then
  test_args+=(--tests "$usage_filter")
fi
./gradlew "${gradle_args[@]}" :bindings:kotlin:wasmJsBrowserTest "${test_args[@]}"
# A WebGPU canvas loses every WebGPU device of its page in headless Chromium,
# so the WebGPU run gives the canvas surface test a page of its own.
if [[ "$render_backend" == webgpu ]]; then
  ./gradlew "${gradle_args[@]}" -Pmaplibre.wasm.canvasRun=true \
    :bindings:kotlin:wasmJsBrowserTest "${test_args[@]}"
fi
'''

[tasks."test:wasm-canary"]
description = "Check that the Kotlin/Wasm runner fails a run whose test fails after asynchronous work."
usage = 'arg "<preset>"'
depends = [{ task = ":wasm-module", args = ["{{usage.preset}}"] }]
dir = "../.."
# HarnessCanaryTest fails on purpose, so this passes only when the run fails
# and its report names that one failure.
run = '''
results=bindings/kotlin/build/test-results/wasmJsBrowserTest
rm -rf "$results"
render_backend="${usage_preset#emscripten-wasm32-}"
if ./gradlew \
  -Pmaplibre.wasm.moduleDir="bindings/kotlin/wasm/build/$usage_preset/install" \
  -Pmaplibre.wasm.renderBackend="$render_backend" \
  -Pmaplibre.wasm.chromium="$(node scripts/find-chromium.mjs)" \
  -Pmaplibre.wasm.canary=true \
  :bindings:kotlin:wasmJsBrowserTest --rerun; then
  echo "error: the canary run passed, so the wasm runner passes a failing test" >&2
  exit 1
fi
python3 -I - "$results" <<'EOF'
import pathlib
import sys
import xml.etree.ElementTree as ElementTree

cases = [
    case
    for report in pathlib.Path(sys.argv[1]).glob("TEST-*.xml")
    for case in ElementTree.parse(report).iter("testcase")
]
failed = [case for case in cases if case.find("failure") is not None]
if len(cases) != 1 or len(failed) != 1:
    sys.exit(
        "error: the canary run failed without failing HarnessCanaryTest alone: "
        f"{len(cases)} tests ran and {len(failed)} failed"
    )
if "fails on purpose" not in (failed[0].find("failure").get("message") or ""):
    sys.exit("error: HarnessCanaryTest failed for another reason than its own")
print("The wasm runner failed the run that HarnessCanaryTest failed.")
EOF
'''

[tasks."ios-build"]
description = "Build the Kotlin binding and embedded Metal runtime for an iOS or tvOS target."
usage = '''
arg "<preset>" {
  choices "ios-arm64-metal" "ios-simulator-arm64-metal" "tvos-arm64-metal" "tvos-simulator-arm64-metal"
}
'''
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
dir = "../.."
run = '''
case "$usage_preset" in
  ios-arm64-metal) kotlin_target=iosArm64 ;;
  ios-simulator-arm64-metal) kotlin_target=iosSimulatorArm64 ;;
  tvos-arm64-metal) kotlin_target=tvosArm64 ;;
  tvos-simulator-arm64-metal) kotlin_target=tvosSimulatorArm64 ;;
esac
./gradlew \
  -PmaplibreNativeCInstallDir="build/$usage_preset/install" \
  -Pmaplibre.runtime.metal.$kotlin_target.installDir="build/$usage_preset/install" \
  ":bindings:kotlin:${kotlin_target}Klib" \
  ":bindings:kotlin:runtimes:metal:${kotlin_target}Klib"
'''

[tasks."android-build"]
description = "Build the Kotlin Android binding."
usage = '''
arg "[backend]" default="opengl" {
  choices "opengl" "vulkan"
}
arg "[abis]" default="auto" {
  choices "auto" "armeabi-v7a" "arm64-v8a" "x86_64" "arm64-v8a,x86_64" "armeabi-v7a,arm64-v8a,x86_64"
}
flag "--prebuilt" help="Use native packages installed under build/"
'''
dir = "../.."
run = '''
abis="$usage_abis"
if [[ "$abis" == auto ]]; then
  abis=arm64-v8a,x86_64
  if [[ "$usage_backend" == opengl ]]; then
    abis=armeabi-v7a,arm64-v8a,x86_64
  fi
fi
gradle_args=(
  -Pmaplibre.android.backend="$usage_backend"
  -Pmaplibre.android.abis="$abis"
)
if [[ "$usage_prebuilt" == "true" ]]; then
  gradle_args+=(-Pmaplibre.android.prebuiltBuildRoot=build)
fi
./gradlew "${gradle_args[@]}" :bindings:kotlin:androidBuild
'''

[tasks."compile-android"]
description = "Type-check the Android binding without a native cross-compile."
dir = "../.."
run = "./gradlew :bindings:kotlin:compileAndroidMain"

[tasks.check-android-api-floor]
description = "Verify the Android binding stays on the android-minSdk floor."
dir = "../.."
run = "./gradlew :bindings:kotlin:checkAndroidApiFloor"
