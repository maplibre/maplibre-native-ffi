[tasks.generate-vapi]
description = "Generate the private raw VAPI from checked annotated metadata"
run = "python3 scripts/generate-raw-vapi.py"

[tasks.check-vapi]
description = "Verify that the raw VAPI is reproducible and covers the public C function surface"
run = '''
set -euo pipefail
generated="$(mktemp)"
trap 'rm -f "$generated"' EXIT
python3 scripts/generate-raw-vapi.py --output "$generated"
diff -u vapi/maplibre-native-c.vapi "$generated"
'''

[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [
  { task = "//:build", args = ["{{usage.preset}}"] },
  { task = ":check-vapi" },
]
run = '''
set -euo pipefail
if [[ -n "${MLN_FFI_VALA_MSYS2_ROOT:-}" ]]; then
  vala_msys2_root="$(cygpath -u "$MLN_FFI_VALA_MSYS2_ROOT")"
  export PATH="$vala_msys2_root/ucrt64/bin:$PATH"
fi
mkdir -p build/vapi build/include build/c
valac \
  --vapidir vapi \
  --pkg maplibre-native-c \
  --pkg glib-2.0 \
  --pkg gmodule-2.0 \
  --library maplibre-native \
  --vapi ../vapi/maplibre-native.vapi \
  -H build/include/maplibre-native-vala.h \
  -C \
  -d build/c \
  src/*.vala
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
run = '''
set -euo pipefail
mkdir -p build

native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
if [[ -n "${MLN_FFI_VALA_MSYS2_ROOT:-}" ]]; then
  vala_msys2_root="$(cygpath -u "$MLN_FFI_VALA_MSYS2_ROOT")"
  export PATH="$vala_msys2_root/ucrt64/bin:$native_install_dir/bin:$PATH"
fi
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
export LD_LIBRARY_PATH="$native_install_dir/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
export DYLD_LIBRARY_PATH="$native_install_dir/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"

binding_cc="${CC:-cc}"
valac_cc_args=()
if [[ "$usage_preset" == windows-*-wgl ]]; then
  binding_cc="${vala_msys2_root:?}/ucrt64/bin/gcc.exe"
  valac_cc_args=(--cc "$binding_cc")
fi

metal_support_object="build/metal_support.o"
metal_framework_args=()
if [[ "$(uname -s)" == "Darwin" ]]; then
  clang -fobjc-exceptions -c tests/compile/metal_support_macos.m -o "$metal_support_object"
  metal_framework_args=(
    -X -framework
    -X AppKit
    -X -framework
    -X Metal
    -X -framework
    -X QuartzCore
  )
else
  cat > build/metal_support_stub.c <<'STUB'
#include <stdbool.h>
#include <stdint.h>
typedef struct MlnValaMetalWindowLayer { void* window; void* layer; } MlnValaMetalWindowLayer;
bool mln_vala_metal_test_window_layer_create(uint32_t width, uint32_t height, MlnValaMetalWindowLayer* out_layer) { (void)width; (void)height; if (out_layer != 0) { out_layer->window = 0; out_layer->layer = 0; } return false; }
void mln_vala_metal_test_window_layer_destroy(MlnValaMetalWindowLayer* window_layer) { (void)window_layer; }
void* mln_vala_metal_test_texture_create(void* device, uint32_t width, uint32_t height) { (void)device; (void)width; (void)height; return 0; }
void mln_vala_metal_test_object_release(void* object) { (void)object; }
STUB
  "$binding_cc" -c build/metal_support_stub.c -o "$metal_support_object"
fi

native_packages=()
if [[ "$usage_preset" == windows-*-wgl ]]; then
  native_packages=()
else
  native_packages+=(maplibre-native-c vulkan)
fi
if [[ "$(uname -s)" == "Linux" ]]; then
  native_packages+=(egl)
fi
native_args=()
if [[ "$usage_preset" != windows-*-wgl ]]; then
  read -r -a native_args <<< "$(pkg-config --cflags --libs "${native_packages[@]}")"
fi
compiler_args=()
for argument in "${native_args[@]}"; do
  compiler_args+=(-X "$argument")
done
if [[ "$(uname -s)" == "Linux" ]]; then
  compiler_args+=(-X -lstdc++ -X -lX11)
fi
if [[ "$usage_preset" == *-egl ]]; then
  compiler_args+=(-X -DMLN_VALA_TEST_EGL=1)
fi
if [[ "$(uname -s)" == "Darwin" && "$usage_preset" == *-egl ]]; then
  compiler_args+=(
    -X "-I$native_install_dir/include"
    -X "-L$native_install_dir/lib"
    -X -lEGL
    -X -lGLESv2
    -X "-Wl,-rpath,$native_install_dir/lib"
  )
elif [[ "$usage_preset" == windows-*-wgl ]]; then
  compiler_args+=(
    -X -DMLN_VALA_TEST_NO_VULKAN=1
    -X -DMLN_VALA_TEST_WGL=1
    -X "-I$native_install_dir/include"
    -X "$native_install_dir/lib/maplibre-native-c.lib"
    -X -lopengl32
    -X -lgdi32
    -X -luser32
  )
fi

valac \
  "${valac_cc_args[@]}" \
  --vapidir vapi \
  --pkg maplibre-native-c \
  --pkg glib-2.0 \
  --pkg gmodule-2.0 \
  -X -Wno-unused-value \
  "${compiler_args[@]}" \
  "${metal_framework_args[@]}" \
  -X "$metal_support_object" \
  src/*.vala \
  tests/compile/minimal.vala \
  tests/compile/opengl_support.c \
  tests/compile/vulkan_support.c \
  -o build/minimal

run_minimal() {
  if [[ "$(uname -s)" == "Linux" && "$usage_preset" == *-vulkan ]]; then
    xvfb-run -a "$@"
  else
    "$@"
  fi
}

run_minimal ./build/minimal
run_minimal env \
  MLN_VALA_RUN_OFFLINE_REGION_SMOKE=1 \
  MLN_VALA_RUN_STYLE_URL_SMOKE=1 \
  MLN_VALA_RUN_DEM_LAYER_SMOKE=1 \
  MLN_VALA_RUN_STYLE_LIGHT_SMOKE=1 \
  MLN_VALA_RUN_LOCATION_INDICATOR_PROPERTY_SMOKE=1 \
  MLN_VALA_RUN_TEXTURE_BACKEND_COMPILE_SMOKE=1 \
  MLN_VALA_RUN_FEATURE_EXTENSION_SMOKE=1 \
  ./build/minimal
'''
