[tools]
# Zig 0.16.0 is unusable on Windows ARM64: the native aarch64 build exits
# non-zero with no diagnostic while loading build.zig, and the x64 build under
# emulation hangs until the job timeout.
"core:zig" = { version = "{{vars.zig_version}}", os = ["linux", "macos", "windows/x64"] }

# Commands name the root manifest with `--build-file` rather than setting `dir`:
# mise resolves tools against the directory a task runs in, and the `core:zig`
# widened above must apply. A `cd` covers the tasks but not this dependency
# provider, which runs in the platform shell.
[deps.zig]
auto = true
description = "Fetch Zig package dependencies."
sources = ["../../build.zig", "../../build.zig.zon"]
outputs = ["../../zig-pkg"]
timeout = "10m"
run = "zig build --build-file ../../build.zig --fetch=needed"

[tasks.build]
extends = "ffi:preset"
run = '''
source "$MISE_MONOREPO_ROOT/scripts/zig-cross-env.sh" "$usage_preset"
zig build --build-file ../../build.zig \
  -Dnative-install-dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  ${zig_cross_args[@]+"${zig_cross_args[@]}"}
'''

[tasks.test]
extends = "ffi:preset"
# The preset selects the runner: Android presets use their matching emulator,
# an iOS or tvOS simulator preset spawns the suite on a simulator, and host
# presets run in process. Each test gets 30 seconds times MLN_TEST_TIMEOUT_SCALE,
# which defaults to 3 on emulators and simulators and to 1 on the host; the
# fixture scales its waits by the same value.
run = '''
case "$usage_preset" in
  android-* | ios-simulator-* | tvos-simulator-*)
    export MLN_TEST_TIMEOUT_SCALE="${MLN_TEST_TIMEOUT_SCALE:-3}"
    ;;
  *)
    export MLN_TEST_TIMEOUT_SCALE="${MLN_TEST_TIMEOUT_SCALE:-1}"
    ;;
esac
test_timeout="$((30 * MLN_TEST_TIMEOUT_SCALE))s"
case "$usage_preset" in
  android-arm64-* | android-x64-*)
    source "$MISE_MONOREPO_ROOT/scripts/zig-cross-env.sh" "$usage_preset"
    exec zig build test --build-file ../../build.zig \
      -Doptimize=ReleaseSafe \
      -Dnative-install-dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
      -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
      ${zig_cross_args[@]+"${zig_cross_args[@]}"} \
      --test-timeout "$test_timeout" --summary all --verbose
    ;;
  android-*)
    echo "The Android emulator runs arm64 and x64 guests; check $usage_preset with //bindings/zig:build and test an android-arm64 or android-x64 preset instead." >&2
    exit 2
    ;;
  ios-simulator-*)
    source "$MISE_MONOREPO_ROOT/scripts/zig-cross-env.sh" "$usage_preset"
    mise run //:ios-simulator:boot
    exec zig build test --build-file ../../build.zig \
      -Doptimize=ReleaseSafe \
      -Dnative-install-dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
      -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
      ${zig_cross_args[@]+"${zig_cross_args[@]}"} \
      --test-timeout "$test_timeout" --summary all --verbose
    ;;
  tvos-simulator-*)
    source "$MISE_MONOREPO_ROOT/scripts/zig-cross-env.sh" "$usage_preset"
    mise run //:tvos-simulator:boot
    exec zig build test --build-file ../../build.zig \
      -Doptimize=ReleaseSafe \
      -Dnative-install-dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
      -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
      ${zig_cross_args[@]+"${zig_cross_args[@]}"} \
      --test-timeout "$test_timeout" --summary all --verbose
    ;;
  ios-* | tvos-*)
    echo "The Zig binding tests need a runnable target; test an ios-simulator or tvos-simulator preset instead of $usage_preset." >&2
    exit 2
    ;;
esac
zig build test --build-file ../../build.zig \
  -Doptimize=ReleaseSafe \
  -Dnative-install-dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  --test-timeout "$test_timeout" \
  --summary all \
  --verbose
'''
run_windows = '''
export MLN_TEST_TIMEOUT_SCALE="${MLN_TEST_TIMEOUT_SCALE:-1}"
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
zig build test --build-file ../../build.zig \
  -Doptimize=ReleaseSafe \
  -Dnative-install-dir="$native_install_dir" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  --test-timeout "$((30 * MLN_TEST_TIMEOUT_SCALE))s" \
  --summary all \
  --verbose
'''
