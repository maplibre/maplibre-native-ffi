[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '''
zig_args=(
  -Dnative-install-dir="../../build/$usage_preset/install"
  -Ddependency-include-dir="{{vars.vulkan_include_dir}}"
)
zig build {{vars.zig_host_args}} "${zig_args[@]}"
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = ":build", args = ["{{usage.preset}}"] }]
run = '''
native_install_dir="../../build/$usage_preset/install"
zig_args=(
  -Dnative-install-dir="$native_install_dir"
  -Ddependency-include-dir="{{vars.vulkan_include_dir}}"
)
zig build test {{vars.zig_host_args}} "${zig_args[@]}" --test-timeout 30s --summary all --verbose
'''
run_windows = '''
native_install_dir="../../build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
zig_args=(
  -Dnative-install-dir="$native_install_dir"
  -Ddependency-include-dir="{{vars.vulkan_include_dir}}"
)
zig build test {{vars.zig_host_args}} "${zig_args[@]}" --test-timeout 30s --summary all --verbose
'''

[tasks."test:ios-simulator"]
depends = [{ task = "//:build", args = ["ios-simulator-arm64-metal"] }]
run = '''
native_install_dir="../../build/ios-simulator-arm64-metal/install"
zig build test \
  -Dtarget=aarch64-ios-simulator \
  -Dnative-install-dir="$native_install_dir" \
  -Ddependency-include-dir="../../third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  -Dsystem-root="$(xcrun --sdk iphonesimulator --show-sdk-path)" \
  --libc "$native_install_dir/share/maplibre-native-c/zig-libc" \
  --test-timeout 120s --summary all --verbose
'''
