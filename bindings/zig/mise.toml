[tasks.build]
depends = ["//:ensure-native-library"]
run = "zig build {{ env.MLN_FFI_ZIG_BUILD_ARGS }} {{ env.MLN_FFI_ZIG_NATIVE_ARGS }}"

[tasks.test]
depends = [":build"]
run = "zig build test {{ env.MLN_FFI_ZIG_BUILD_ARGS }} {{ env.MLN_FFI_ZIG_NATIVE_ARGS }} --test-timeout \"$MLN_FFI_TEST_TIMEOUT\" --summary all --verbose"
