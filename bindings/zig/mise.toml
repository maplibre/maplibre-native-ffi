# Commands name the root manifest with `--build-file` rather than changing
# directory: a `cd` covers the tasks but not this dependency provider, which
# runs in the platform shell.
[deps.zig]
auto = true
description = "Fetch Zig package dependencies."
sources = ["../../build.zig", "../../build.zig.zon"]
outputs = ["../../zig-pkg"]
timeout = "10m"
run = "zig build --build-file ../../build.zig --fetch=needed"

[tasks.build]
description = "Build the Zig binding against a native preset's install."
extends = "ffi:preset"
run = '''
source "$MISE_MONOREPO_ROOT/scripts/zig-cross-env.sh" "$usage_preset"
zig build --build-file ../../build.zig \
  -Dlocal-build="$MISE_MONOREPO_ROOT/build/$usage_preset/install" \
  -Ddependency-include-dir="$MISE_MONOREPO_ROOT/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  ${zig_cross_args[@]+"${zig_cross_args[@]}"}
'''
