[tools]
"core:go" = "{{vars.go_version}}"
"github:abhinav/doc2go" = "{{vars.doc2go_version}}"

[tasks.api]
description = "Generate doc2go HTML API reference for the Go binding."
extends = "ffi:preset"
run = '''
source "$MISE_MONOREPO_ROOT/scripts/go-native-env.sh" "$usage_preset"
export GOCACHE="$MISE_MONOREPO_ROOT/build/$usage_preset/go-cache"
rm -rf build/doc2go
mkdir -p build
# Document the public maplibre package only; omit ./... so internal/
# packages are not published under the docs site.
doc2go \
  -out build/doc2go \
  -home github.com/maplibre/maplibre-native-ffi/bindings/go/maplibre \
  -pagefind=false \
  ./maplibre
'''

[tasks.build]
extends = "ffi:preset"
run = '''
source "$MISE_MONOREPO_ROOT/scripts/go-native-env.sh" "$usage_preset"
export GOCACHE="$MISE_MONOREPO_ROOT/build/$usage_preset/go-cache"
source "$MISE_MONOREPO_ROOT/bindings/go/test-tags.sh" "$usage_preset"

# A host build runs the suite; a cross build proves the package and its tests
# compile and link for the target.
source "$MISE_MONOREPO_ROOT/scripts/go-cross-env.sh" "$usage_preset"
if [[ -n "$goos" ]]; then
  exec go test -c -tags "$go_test_tags" -o /dev/null ./maplibre
fi
# Go's test cache cannot see the native library, so always rerun the suite.
exec go test -count=1 -tags "$go_test_tags" ./...
'''

[tasks.test]
extends = "ffi:preset"
# The preset selects the runner: Android presets and OpenHarmony x64 presets
# push to an emulator, and host presets run in process.
run = '''
case "$usage_preset" in
  android-* | ohos-*)
    exec "$MISE_MONOREPO_ROOT/scripts/test-go-device.sh" "$usage_preset"
    ;;
esac

source "$MISE_MONOREPO_ROOT/scripts/go-native-env.sh" "$usage_preset"
export GOCACHE="$MISE_MONOREPO_ROOT/build/$usage_preset/go-cache"
source "$MISE_MONOREPO_ROOT/bindings/go/test-tags.sh" "$usage_preset"
# Go's test cache cannot see the native library, so always rerun the suite.
go test -count=1 -tags "$go_test_tags" ./...
go vet -tags "$go_test_tags" ./...
'''
