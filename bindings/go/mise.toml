[tasks.build]
depends = ["//:ensure-native-library"]
run = '''
source "$MLN_FFI_REPO_ROOT/.mise/bin/native-runtime-env.sh"
mln_export_cgo_maplibre_native_flags
go test ./...
'''

[tasks.test]
depends = ["//:ensure-native-library"]
run = '''
source "$MLN_FFI_REPO_ROOT/.mise/bin/native-runtime-env.sh"
mln_export_cgo_maplibre_native_flags
go test ./...
'''

[tasks.ci]
depends = ["//:ensure-native-library"]
run = '''
source "$MLN_FFI_REPO_ROOT/.mise/bin/native-runtime-env.sh"
mln_export_cgo_maplibre_native_flags
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then
  echo "$unformatted" >&2
  exit 1
fi
go test ./...
go vet ./...
'''
