[tools]
"core:go" = "{{vars.go_version}}"
"aqua:mvdan/gofumpt" = "{{vars.gofumpt_version}}"
"github:abhinav/doc2go" = "{{vars.doc2go_version}}"

[tasks._gofumpt-check]
description = "List Go files that require gofumpt."
hide = true
raw_args = true
dir = "../.."
run = "gofumpt -l"

[tasks._gofumpt-fix]
description = "Format Go files with gofumpt."
hide = true
raw_args = true
dir = "../.."
run = "gofumpt -w"

[tasks.api]
description = "Generate doc2go HTML API reference for the Go binding."
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '''
rm -rf build/doc2go
mkdir -p build
# Document the public maplibre package only; omit ./... so internal/
# packages are not published under the docs site.
PKG_CONFIG_PATH="$MISE_MONOREPO_ROOT/build/$usage_preset/install/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" \
  doc2go \
    -out build/doc2go \
    -home github.com/maplibre/maplibre-native-ffi/bindings/go \
    -pagefind=false \
    .
'''
run_windows = '''
rm -rf build/doc2go
mkdir -p build
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" \
  doc2go \
    -out build/doc2go \
    -home github.com/maplibre/maplibre-native-ffi/bindings/go \
    -pagefind=false \
    .
'''

[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"

case "$usage_preset" in
  android-arm64-*)
    goos=android
    goarch=arm64
    compiler_prefix=aarch64-linux-android
    ;;
  android-x64-*)
    goos=android
    goarch=amd64
    compiler_prefix=x86_64-linux-android
    ;;
  ohos-arm64-*)
    export GOOS=linux GOARCH=arm64 CGO_ENABLED=1
    sysroot="$OHOS_SDK_NATIVE/sysroot"
    target_flags="--target=aarch64-linux-ohos --sysroot=$sysroot"
    export CC="$OHOS_SDK_NATIVE/llvm/bin/clang $target_flags"
    export CXX="$OHOS_SDK_NATIVE/llvm/bin/clang++ $target_flags"
    exec go test -c -o /dev/null .
    ;;
  ohos-x64-*)
    export GOOS=linux GOARCH=amd64 CGO_ENABLED=1
    sysroot="$OHOS_SDK_NATIVE/sysroot"
    target_flags="--target=x86_64-linux-ohos --sysroot=$sysroot"
    export CC="$OHOS_SDK_NATIVE/llvm/bin/clang $target_flags"
    export CXX="$OHOS_SDK_NATIVE/llvm/bin/clang++ $target_flags"
    exec go test -c -o /dev/null .
    ;;
  *) exec go test ./... ;;
esac

ndk_bin="$ANDROID_HOME/ndk/$MLN_FFI_ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
export GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=1
export CC="$ndk_bin/${compiler_prefix}24-clang"
export CXX="$ndk_bin/${compiler_prefix}24-clang++"
exec go test -c -o /dev/null .
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" \
  go test ./...
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
go test ./...
go vet ./...
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
go test ./...
go vet ./...
'''

[tasks."test:android-emulator"]
description = "Run the Go binding tests in the Android emulator."
usage = '''
arg "[preset]" default="android-x64-egl" {
  choices "android-x64-egl" "android-x64-vulkan"
}
'''
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '''
set -euo pipefail
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
test_dir="$MISE_MONOREPO_ROOT/build/android-emulator/$usage_preset/go"
mkdir -p "$test_dir"
find "$test_dir" -maxdepth 1 -type f -name '*.test' -delete

export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
ndk_bin="$ANDROID_HOME/ndk/$MLN_FFI_ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
export GOOS=android GOARCH=amd64 CGO_ENABLED=1
export CC="$ndk_bin/x86_64-linux-android24-clang"
export CXX="$ndk_bin/x86_64-linux-android24-clang++"
go test -c -o "$test_dir/" ./...
go vet ./...

mise run //:android-emulator:boot
shopt -s nullglob
found_test=false
for test_binary in "$test_dir"/*.test; do
  found_test=true
  bash "$MISE_MONOREPO_ROOT/scripts/run-android-emulator-test.sh" \
    "$test_binary" \
    "$native_install_dir/lib/libmaplibre-native-c.so" \
    180 \
    -test.v
done
if [[ "$found_test" != true ]]; then
  echo "The Go build produced no Android test executables." >&2
  exit 1
fi
'''

[tasks."test:ohos-emulator"]
description = "Run the Go binding tests in the OpenHarmony emulator."
depends = [{ task = "//:build", args = ["ohos-x64-egl"] }]
run = '''
set -euo pipefail
native_install_dir="$MISE_MONOREPO_ROOT/build/ohos-x64-egl/install"
test_dir="$MISE_MONOREPO_ROOT/build/ohos-emulator/go"
mkdir -p "$test_dir"
find "$test_dir" -maxdepth 1 -type f -name '*.test' -delete

export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
export GOOS=linux GOARCH=amd64 CGO_ENABLED=1
sysroot="$OHOS_SDK_NATIVE/sysroot"
target_flags="--target=x86_64-linux-ohos --sysroot=$sysroot"
export CC="$OHOS_SDK_NATIVE/llvm/bin/clang $target_flags"
export CXX="$OHOS_SDK_NATIVE/llvm/bin/clang++ $target_flags"
go test -c -o "$test_dir/" ./...
go vet ./...

mise run //:ohos-emulator:boot
shopt -s nullglob
found_test=false
for test_binary in "$test_dir"/*.test; do
  found_test=true
  bash "$MISE_MONOREPO_ROOT/scripts/run-ohos-emulator-test.sh" \
    "$test_binary" \
    "$native_install_dir/lib/libmaplibre-native-c.so" \
    "$OHOS_SDK_NATIVE/llvm/lib/x86_64-linux-ohos/libc++_shared.so" \
    180 \
    -test.v
done
if [[ "$found_test" != true ]]; then
  echo "The Go build produced no OpenHarmony test executables." >&2
  exit 1
fi
'''
