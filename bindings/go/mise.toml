[tasks.build]
depends = ["//:ensure-native-library"]
run = '''
export PKG_CONFIG_PATH="$MLN_FFI_NATIVE_INSTALL_DIR/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
export CGO_CFLAGS="$(pkg-config --cflags maplibre-native-c) ${CGO_CFLAGS:-}"
export CGO_LDFLAGS="$(pkg-config --libs maplibre-native-c) ${CGO_LDFLAGS:-}"
go test ./...
'''

[tasks.test]
depends = ["//:ensure-native-library"]
run = '''
export PKG_CONFIG_PATH="$MLN_FFI_NATIVE_INSTALL_DIR/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
export CGO_CFLAGS="$(pkg-config --cflags maplibre-native-c) ${CGO_CFLAGS:-}"
export CGO_LDFLAGS="$(pkg-config --libs maplibre-native-c) ${CGO_LDFLAGS:-}"
go test ./...
'''

[tasks.ci]
depends = ["//:ensure-native-library"]
run = '''
export PKG_CONFIG_PATH="$MLN_FFI_NATIVE_INSTALL_DIR/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
export CGO_CFLAGS="$(pkg-config --cflags maplibre-native-c) ${CGO_CFLAGS:-}"
export CGO_LDFLAGS="$(pkg-config --libs maplibre-native-c) ${CGO_LDFLAGS:-}"
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then
  echo "$unformatted" >&2
  exit 1
fi
go test ./...
go vet ./...
'''
