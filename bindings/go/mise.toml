[tools]
"core:go" = "{{vars.go_version}}"
"github:abhinav/doc2go" = "{{vars.doc2go_version}}"

[tasks.api]
description = "Generate doc2go HTML API reference for the Go binding."
extends = "ffi:preset"
run = '''
rm -rf build/doc2go
mkdir -p build
# Document the public maplibre package only; omit ./... so internal/
# packages are not published under the docs site.
PKG_CONFIG_PATH="$MISE_MONOREPO_ROOT/build/$usage_preset/install/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" \
  doc2go \
    -out build/doc2go \
    -home github.com/maplibre/maplibre-native-ffi/bindings/go \
    -pagefind=false \
    .
'''
run_windows = '''
rm -rf build/doc2go
mkdir -p build
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" \
  doc2go \
    -out build/doc2go \
    -home github.com/maplibre/maplibre-native-ffi/bindings/go \
    -pagefind=false \
    .
'''

[tasks.build]
extends = "ffi:preset"
run = '''
source "$MISE_MONOREPO_ROOT/scripts/go-native-env.sh" "$usage_preset"

# A host build runs the suite; a cross build proves the package compiles and
# links for the target.
source "$MISE_MONOREPO_ROOT/scripts/go-cross-env.sh" "$usage_preset"
if [[ -n "$goos" ]]; then
  exec go test -c -o /dev/null .
fi
# Go's test cache cannot see the native library, so always rerun the suite.
exec go test -count=1 ./...
'''
run_windows = '''
source "$MISE_MONOREPO_ROOT/scripts/go-native-env.sh" "$usage_preset"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
# Go's test cache cannot see the native library, so always rerun the suite.
go test -count=1 ./...
'''

[tasks.test]
extends = "ffi:preset"
# The preset selects the runner: Android and OpenHarmony x64 presets push to an
# emulator, and host presets run in process.
run = '''
case "$usage_preset" in
  android-* | ohos-*)
    exec "$MISE_MONOREPO_ROOT/scripts/test-go-device.sh" "$usage_preset"
    ;;
esac

source "$MISE_MONOREPO_ROOT/scripts/go-native-env.sh" "$usage_preset"
# Go's test cache cannot see the native library, so always rerun the suite.
go test -count=1 ./...
go vet ./...
'''
run_windows = '''
source "$MISE_MONOREPO_ROOT/scripts/go-native-env.sh" "$usage_preset"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
# Go's test cache cannot see the native library, so always rerun the suite.
go test -count=1 ./...
go vet ./...
'''
