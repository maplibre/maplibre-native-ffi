[tasks.build]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" go test ./...
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" go test ./...
'''

[tasks.test]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" go test ./...
'''
run_windows = '''
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" go test ./...
'''

[tasks.ci]
usage = 'arg "[preset]" default="{{vars.host_native_preset}}"'
depends = [{ task = "//:build", args = ["{{usage.preset}}"] }]
run = '''
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then
  echo "$unformatted" >&2
  exit 1
fi
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
go test ./...
go vet ./...
'''
run_windows = '''
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then
  echo "$unformatted" >&2
  exit 1
fi
native_install_dir="$MISE_MONOREPO_ROOT/build/$usage_preset/install"
export PATH="$(cygpath -u "$native_install_dir/bin")${PATH:+:${PATH}}"
export PKG_CONFIG_PATH="$native_install_dir/share/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
go test ./...
go vet ./...
'''
