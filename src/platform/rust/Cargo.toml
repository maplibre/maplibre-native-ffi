[package]
name = "maplibre-native-ffi-platform"
description = "Platform services that the MapLibre Native FFI C library calls. Depend on maplibre-native-ffi instead."
version.workspace = true
categories = ["external-ffi-bindings"]
edition.workspace = true
homepage.workspace = true
include = ["/src/", "/LICENSE", "/README.md"]
keywords = ["maplibre", "map", "ffi"]
license.workspace = true
repository.workspace = true

# A Rust host builds this crate against its own standard library. Other hosts
# link the static library that CMake builds from it, which keeps this name.
[lib]
name = "mln_ffi_platform"

[dependencies]
# Image decoding is shared by every platform, so a raster tile decodes to the
# same pixels everywhere.
image = { version = "0.25.8", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }

# Linux and FreeBSD have no portable locale services, so their locale-sensitive
# style expressions use ICU4X with compiled CLDR data. Currency patterns come
# from the experimental crate, which needs the matching ICU4X release.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
icu_collator = "2.4.0"
icu_decimal = "2.4.0"
icu_experimental = "=0.7.0"
icu_locale = "2.4.0"
icu_locale_core = "2.4.0"
icu_provider = "2.4.0"
writeable = "0.6"

# The browser gets its HTTP from emscripten_fetch and Android from
# HttpURLConnection, so neither needs the transport stack: no sockets, no TLS,
# no worker pool.
[target.'cfg(not(any(target_os = "emscripten", target_os = "android")))'.dependencies]
http = "1.4"
threadpool = "1.8.1"

[target.'cfg(target_os = "windows")'.dependencies]
ureq = { version = "3", default-features = false, features = [
  "native-tls",
  "gzip",
  "socks-proxy",
] }

[target.'cfg(not(any(target_os = "emscripten", target_os = "android", target_os = "windows")))'.dependencies]
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "gzip",
  "platform-verifier",
  "socks-proxy",
] }
