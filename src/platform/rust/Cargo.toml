[package]
name = "mln-ffi-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Image decoding is shared by every platform, so a raster tile decodes to the
# same pixels everywhere.
image = { version = "0.25.8", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }

# Linux and FreeBSD have no portable locale services, so their locale-sensitive
# style expressions use ICU4X with compiled CLDR data. Currency patterns come
# from the experimental crate, which needs the matching ICU4X release.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
icu_collator = "2.4.0"
icu_decimal = "2.4.0"
icu_experimental = "=0.7.0"
icu_locale = "2.4.0"
icu_locale_core = "2.4.0"
icu_provider = "2.4.0"
writeable = "0.6"

# The browser gets its HTTP from emscripten_fetch instead, so it needs none of
# the transport stack: no sockets, no TLS, no worker pool.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
http = "1.4"
threadpool = "1.8.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }
rustls-platform-verifier = "0.6.2"

[target.'cfg(all(not(target_os = "emscripten"), target_os = "windows"))'.dependencies]
ureq = { version = "3", default-features = false, features = [
  "native-tls",
  "gzip",
  "socks-proxy",
] }

[target.'cfg(all(not(target_os = "emscripten"), not(target_os = "windows")))'.dependencies]
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "gzip",
  "platform-verifier",
  "socks-proxy",
] }
