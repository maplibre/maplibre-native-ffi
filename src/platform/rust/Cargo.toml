[package]
name = "mln-ffi-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The CMake build links the staticlib. A browser build is linked by the host
# rather than by CMake, and a host building with cargo takes the rlib instead:
# its module would otherwise carry this library's copy of `std` alongside its
# own. See bindings/rust/crates/maplibre-native-ffi-sys/src/lib.rs.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Image decoding is shared by every platform, so a raster tile decodes to the
# same pixels everywhere.
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }

# The browser gets its HTTP from emscripten_fetch instead, so it needs none of
# the transport stack: no sockets, no TLS, no worker pool.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
http = "1.4"
threadpool = "1.8.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }
rustls-platform-verifier = "0.6.2"

[target.'cfg(all(not(target_os = "emscripten"), target_os = "windows"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "socks-proxy"] }

[target.'cfg(all(not(target_os = "emscripten"), not(target_os = "windows")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier", "socks-proxy"] }
