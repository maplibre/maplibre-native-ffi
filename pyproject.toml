[project]
name = "maplibre-native-ffi-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["bindings/python"]

[dependency-groups]
dev = [
  # The GObject binding builds with meson and documents with gi-docgen.
  "gi-docgen==2026.1",
  "libclang==18.1.1",
  "meson==1.12.1",
  "ruamel-yaml==0.19.1",
  "ruff==0.17.4",
  "ty==0.0.99",
  "wheel==0.48.0",
]

# CI's hygiene job doesn't build the Python binding, so ty reads the package's
# source instead of an installed copy.
[tool.ty.environment]
extra-paths = ["bindings/python/python"]
