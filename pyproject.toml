[project]
name = "maplibre-native-ffi-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["bindings/python"]

[dependency-groups]
dev = [
  "libclang==18.1.1",
  "lief==1.0.0; sys_platform == 'darwin'",
  "ruamel-yaml==0.19.1",
  "ruff==0.17.2",
  "ty==0.0.92",
  "wheel==0.47.0",
]

# CI's hygiene job doesn't build the Python binding, so ty reads the package's
# source instead of an installed copy.
[tool.ty.environment]
extra-paths = ["bindings/python/python"]
